# SC-NeuroCore — Complete installation consumer coverage

[run]
branch = True
concurrency = thread
source_dirs =
    src/sc_neurocore/studio/desktop
    studio/desktop/tests
patch =
    subprocess
    _exit
parallel = True
relative_files = True

[report]
include =
    src/sc_neurocore/studio/desktop/bundle.py
    src/sc_neurocore/studio/desktop/installation.py
    src/sc_neurocore/studio/desktop/installation_registration.py
    src/sc_neurocore/studio/desktop/install.py
exclude_lines =
fail_under = 100
show_missing = True
