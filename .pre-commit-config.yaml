repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.rpt$'
      - id: end-of-file-fixer
        exclude: '\.rpt$'
      - id: check-yaml
        args: [--unsafe]
        exclude: "^conda/"
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 22f0422809455ec89ffdcf5a00170ba816e42ddb  # v0.15.16
    hooks:
      - id: ruff
        exclude: '^data/'
      - id: ruff-format
        exclude: '^data/'

  - repo: https://github.com/crate-ci/typos
    rev: d11834eeac776f87614aef80119b38800a9a2bac  # v1.29.5
    hooks:
      - id: typos
        args: ['--config', '.typos.toml']
        types_or: [python, rust]
        files: '^(src|tests|engine|bridge|hdl|tools)/'
        # Auto-generated Rust stubs whose `// ...` docs are Python pseudocode
        # truncated mid-word at ~80 cols — not spell-checkable.
        exclude: '^src/sc_neurocore/accel/rust/safety/'
