# SC-NeuroCore — Source/config provenance header

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.rpt$'
      - id: end-of-file-fixer
        exclude: '\.rpt$'
      - id: check-yaml
        args: [--unsafe]
        exclude: "^conda/"
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd  # v0.16.9
    hooks:
      - id: ruff
        exclude: '^data/'
      - id: ruff-format
        # Preserve the existing Python, stub, and notebook formatting scope.
        types_or: [python, pyi, jupyter]
        exclude: '^data/'

  - repo: https://github.com/crate-ci/typos
    rev: d11834eeac776f87614aef80119b38800a9a2bac  # v1.29.5
    hooks:
      - id: typos
        args: ['--config', '.typos.toml']
        types_or: [python, rust]
        files: '^(src|tests|engine|bridge|hdl|tools)/'
        # Auto-generated Rust stubs whose `// ...` docs are Python pseudocode
        # truncated mid-word at ~80 cols — not spell-checkable.
        exclude: '^src/sc_neurocore/accel/rust/safety/'

  - repo: local
    hooks:
      - id: capability-manifest-drift
        name: capability manifest drift
        entry: python tools/capability_manifest.py --check
        language: system
        pass_filenames: false
        files: '^(\.pre-commit-config\.yaml|README\.md|pyproject\.toml|src/|tests/|docs/|\.github/workflows/|tools/(capability_manifest\.py|capability_manifest\.toml|architecture_map\.toml))'
      - id: engine-monolith-no-growth
        name: engine monolith no-growth guard
        entry: python tools/engine_monolith_guard.py --check
        language: system
        pass_filenames: false
        files: '^(\.pre-commit-config\.yaml|engine/src/.*\.rs|tools/(engine_monolith_guard\.py|engine_monolith_ceiling\.toml))$'
      - id: runtime-state-transport-ratchet
        name: runtime state transport ratchet
        entry: python tools/runtime_state_conformance.py --check-ceiling
        language: system
        pass_filenames: false
        files: '^(\.pre-commit-config\.yaml|src/sc_neurocore/(neurons|studio)/.*\.py|tools/(runtime_state_conformance\.py|runtime_state_ceiling\.toml))$'
      - id: go-doc-ratchet
        name: Go documentation debt ratchet
        entry: python -m tools.go_doc_ratchet
        language: system
        pass_filenames: false
        files: '^(\.pre-commit-config\.yaml|.*\.go|tools/(go_doc_ratchet\.py|doc_debt_ceiling\.py|go_doc_ceiling\.json|godoc_coverage/.*))$'
      - id: api-reference-drift
        name: API reference drift
        entry: python scripts/generate_docs.py --check
        language: system
        pass_filenames: false
        files: '^(\.pre-commit-config\.yaml|src/.*\.py|scripts/generate_docs\.py|docs/API_REFERENCE\.md)$'
