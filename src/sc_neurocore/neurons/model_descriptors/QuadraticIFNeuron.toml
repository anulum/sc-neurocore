golden_citation = "src/sc_neurocore/neurons/reference_receipts/quadratic_if_latham_2000.json"

[documentation]
slug = "models/quadratic_if"
notes = "QuadraticIFNeuron.latham_2000() is source-counted. QuadraticIFNeuron() and SCSymmetricQuadraticIFNeuron preserve the old -1/+1/.01 SC profile."

