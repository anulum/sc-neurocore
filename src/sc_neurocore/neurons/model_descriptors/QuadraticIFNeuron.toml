[metadata]
schema_version = 2
name = "Quadratic IF"
class_name = "QuadraticIFNeuron"
module = "quadratic_if"
display_name = "Latham 2000 quadratic integrate-and-fire"
summary = "Source-aligned isolated scalar QIF with Latham's normalized numerical apex, repolarization, and timestep; the historical symmetric SC recurrence is preserved separately."
family = "Integrate-and-Fire"
category = "integrate-and-fire"
biophysical_detail = "point"
maturity = "validated"
intended_use = [
    "source-equation reference",
    "Type-I excitability experiments",
]
hardware_fit = [
    "fixed-point quadratic accumulator and reset core",
]
behavior_tags = [
    "excitable",
    "rate-coded",
    "tonic",
]

[provenance]
authors = [
    "Latham, P.E. et al.",
]
year = 2000
doi = "10.1152/jn.2000.83.2.808"
paper_title = "Intrinsic Dynamics in Neuronal Networks. I. Theory"
source_scope = "Equations (1), (2), and (5a), isolated from AHP/synaptic terms, with Table 1 numerical boundaries."

[state.v]
init = -1.0

[parameters.v_reset]
default = -3.0
unit = "1"
meaning = "dimensionless value v is reset to after reaching the peak"
range = [
    -10.0,
    0.0,
]

[parameters.v_peak]
default = 10.333333333333334
unit = "1"
meaning = "dimensionless peak at which a spike is registered and reset applied"
range = [
    1.0,
    20.0,
]

[integration]
dt = 0.05
method = "exact_held_current_riccati_flow"

[dynamics]
v = "v**2 + I"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "exact"

[backends.julia]
status = "implemented"
parity = "approximate"

[backends.go]
status = "implemented"
parity = "approximate"

[backends.mojo]
status = "implemented"
parity = "approximate"

[reproducibility]
