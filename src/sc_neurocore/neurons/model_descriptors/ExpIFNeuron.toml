[metadata]
schema_version = 2
name = "ExpIFNeuron"
class_name = "ExpIFNeuron"
module = "expif"
display_name = ""
summary = "Exponential IF (no adaptation). Fourcaud-Trocmé et al. 2003."
family = "Integrate-and-Fire"
category = "integrate-and-fire"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "excitable",
    "rate-coded",
    "tonic",
]

[provenance]
authors = [
    "Fourcaud-Trocme, N., Hansel, D., van Vreeswijk, C. & Brunel, N.",
]
year = 2003
doi = "10.1523/JNEUROSCI.23-37-11628.2003"

[state.v]
init = -65.0

[state.refractory_remaining]
init = 0.0
unit = "ms"
meaning = "remaining post-spike reset hold; zero for the deterministic schema-to-RTL contract"

[parameters.v_rest]
default = -65.0
unit = "mV"
meaning = "resting / leak reversal potential"
range = [
    -90.0,
    -40.0,
]

[parameters.v_reset]
default = -68.0
unit = "mV"
meaning = "membrane potential reset to after a spike"
range = [
    -90.0,
    -40.0,
]

[parameters.v_threshold]
default = 30.0
unit = "mV"
meaning = "finite numerical spike cutoff; distinct from the soft exponential threshold"
range = [
    0.0,
    100.0,
]

[parameters.v_rh]
default = -59.9
unit = "mV"
meaning = "soft threshold of the exponential spike-initiation current"
range = [
    -80.0,
    -40.0,
]

[parameters.delta_t]
default = 3.48
unit = "mV"
meaning = "slope factor (sharpness) of the exponential spike initiation"
range = [
    0.25,
    10.0,
]

[parameters.tau]
default = 10.0
unit = "ms"
meaning = "membrane time constant C divided by leak conductance"
range = [
    1.0,
    100.0,
]

[parameters.refractory_period]
default = 0.0
unit = "ms"
meaning = "post-spike reset hold; 1.7 ms reproduces the paper's fitted comparison protocol"
range = [
    0.0,
    10.0,
]

[integration]
dt = 0.02
method = "rk4"

[dynamics]
v = "candidate-first RK4 of (-(min(v,v_threshold)-v_rest)+delta_t*exp((min(v,v_threshold)-v_rh)/delta_t)+I)/tau; level-detect candidate>=v_threshold then reset"
refractory_remaining = "hold v at v_reset while positive; decrement by dt; load refractory_period on a spike"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "ulp-bounded"

[backends.julia]
status = "implemented"
parity = "ulp-bounded"

[backends.go]
status = "implemented"
parity = "ulp-bounded"

[backends.mojo]
status = "implemented"
parity = "approximate"

[reproducibility]
reference_config = "{\"n_steps\":1000,\"current\":20.0,\"backend\":\"python\",\"parameters\":\"defaults\"}"
golden_trace_sha256 = "cd3fc0cd092a9924e7477426c3d8622510ea01c37ed51b83188b38f7e026a1c6"

[documentation]
slug = "models/expif"
notes = ""

[validation]
dynamics_faithful = true
metric = "parity"
operating_point = "Fourcaud-Trocme deterministic EIF; 1000 RK4 steps; currents 0,5,10,20,50,100; Q32.32 RTL"
tolerance = "hand/TOML/JSON spike counts exact and float envelope <=2e-10; Q32.32 spike counts exact"
evidence = "tests/test_cosim_exp_if.py::test_expif_q3232_spike_parity"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosim_exp_if.py::test_expif_q3232_spike_parity"
target_tier = "H1"
terminal_reason = "Q32.32 point-neuron schema-to-RTL spike parity is enrolled; higher silicon rungs require synthesis, timing, and hardware programmes."
