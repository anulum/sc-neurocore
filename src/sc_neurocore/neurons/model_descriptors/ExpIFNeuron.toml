# SC-NeuroCore — Source/config provenance header

[metadata]
schema_version = 2
name = "ExpIFNeuron"
class_name = "ExpIFNeuron"
module = "expif"
display_name = "Exponential integrate-and-fire"
summary = "Source-aligned Fourcaud-Trocme EIF fit and deterministic simulation profile with the historical SC RK4/Q32.32 recurrence preserved explicitly."
family = "Integrate-and-Fire"
category = "integrate-and-fire"
biophysical_detail = "point"
maturity = "experimental"
intended_use = [
    "source-equation reference",
    "exponential spike-initiation simulation",
]
hardware_fit = [
    "separate SC Q32.32 exponential-LUT compatibility lane",
]
behavior_tags = [
    "excitable",
    "rate-coded",
    "tonic",
]

[provenance]
authors = [
    "Fourcaud-Trocme, N., Hansel, D., van Vreeswijk, C. & Brunel, N.",
]
year = 2003
doi = "10.1523/JNEUROSCI.23-37-11628.2003"

[state.v]
init = -65.0

[state.refractory_remaining]
init = 0.0
unit = "ms"
meaning = "remaining post-spike reset hold; source profile starts at zero and loads 1.7 ms"

[parameters.v_rest]
default = -65.0
unit = "mV"
meaning = "resting / leak reversal potential"
range = [
    -90.0,
    -40.0,
]

[parameters.v_reset]
default = -68.0
unit = "mV"
meaning = "membrane potential reset to after a spike"
range = [
    -90.0,
    -40.0,
]

[parameters.v_threshold]
default = 30.0
unit = "mV"
meaning = "SC default numerical event surface; source factory uses the paper's -30 mV handoff"
range = [
    -40.0,
    100.0,
]

[parameters.v_rh]
default = -59.9
unit = "mV"
meaning = "soft threshold of the exponential spike-initiation current"
range = [
    -80.0,
    -40.0,
]

[parameters.delta_t]
default = 3.48
unit = "mV"
meaning = "slope factor (sharpness) of the exponential spike initiation"
range = [
    0.25,
    10.0,
]

[parameters.tau]
default = 10.0
unit = "ms"
meaning = "membrane time constant C divided by leak conductance"
range = [
    1.0,
    100.0,
]

[parameters.refractory_period]
default = 0.0
unit = "ms"
meaning = "SC default reset hold; source factory uses the paper's fitted 1.7 ms protocol"
range = [
    0.0,
    10.0,
]

[integration]
dt = 0.02
method = "rk4"

[dynamics]
v = "source profile: source-aligned zero-noise Heun RK2 below -30 mV with the analytical exponential-only tail duration exposed separately; SC compatibility profile: candidate-first stage-clipped RK4 to +30 mV"
refractory_remaining = "hold v at v_reset while positive; decrement by dt; load refractory_period on a spike"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "exact"

[backends.julia]
status = "implemented"
parity = "ulp-bounded"

[backends.go]
status = "implemented"
parity = "ulp-bounded"

[backends.mojo]
status = "implemented"
parity = "ulp-bounded"

[reproducibility]
reference_config = "src/sc_neurocore/neurons/reference_receipts/expif_fourcaud_trocme_2003.json"
golden_trace_sha256 = "c2b266d66139bd35c3c1bc7badf8ad0a08442684f8ce61c1382be8f3cffdde37"
golden_citation = "src/sc_neurocore/neurons/reference_receipts/expif_fourcaud_trocme_2003.json"

[documentation]
slug = "models/expif"
notes = "ExpIFNeuron.fourcaud_trocme_2003() is the source profile. ExpIFNeuron() and ExpIFNeuron.sc_rk4_compatibility() preserve the historical +30 mV RK4/Q32.32 contract without attributing it to the paper."

[validation]
dynamics_faithful = true
metric = "parity"
operating_point = "source profile: 20000-step five-segment protocol and 0.01/0.005 ms convergence; SC compatibility: 1000 RK4 steps at currents 0,5,10,20,50,100 and Q32.32 RTL"
tolerance = "source receipt digests and events exact; five native packets exact/5e-8 bounded; paired SC schemas <=2e-10; Q32.32 aggregate counts match SC float and the distinct bit-level event/state packet is digest-exact"
evidence = "tests/test_reference_expif_source_receipt.py; tests/test_model_expif_source_contract.py; tests/test_expif_backends_batch_atomicity.py; tests/test_expif_engine_binding.py; tests/test_cosim_exp_if.py"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosim_exp_if.py::test_expif_q3232_spike_parity"
synthesised = true
synth_report = "hdl/reports/yosys_expif_q3232_2026-08-30.json"
target_device = "generic RTL (Yosys coarse synthesis)"
target_tier = "H2"
terminal_reason = "The SC Q32.32 compatibility core preserves enrolled aggregate events plus a digest-bound complete event/state packet, synthesizes to 484938 Yosys coarse cells, and passes bounded reset/event safety; timing, PPA, target-device, board, physical-silicon, and universal-equivalence evidence remain open."
