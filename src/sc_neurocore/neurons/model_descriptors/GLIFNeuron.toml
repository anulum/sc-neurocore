[metadata]
schema_version = 2
name = "GLIF"
class_name = "GLIFNeuron"
module = "glif"
display_name = ""
summary = "Allen Institute GLIF5 — Generalized LIF with threshold adaptation and after-spike currents"
family = "Integrate-and-Fire"
category = "integrate-and-fire"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "adapting",
    "excitable",
    "rate-coded",
]

[provenance]
authors = [
    "Teeter, C. et al.",
]
year = 2018
doi = "10.1038/s41467-017-02717-4"

[state.v]
init = -70.0

[state.theta]
init = -50.0

[state.i_asc1]
init = 0.0

[state.i_asc2]
init = 0.0

[parameters.theta_inf]
default = -50.0
unit = "mV"
meaning = "steady-state value of the adaptive threshold"
range = [
    -70.0,
    -20.0,
]

[parameters.v_rest]
default = -70.0
unit = "mV"
meaning = "resting membrane potential"
range = [
    -90.0,
    -40.0,
]

[parameters.v_reset]
default = -70.0
unit = "mV"
meaning = "membrane potential reset to after a spike"
range = [
    -90.0,
    -40.0,
]

[parameters.tau_m]
default = 10.0
unit = "ms"
meaning = "membrane time constant"
range = [
    1.0,
    100.0,
]

[parameters.tau_theta]
default = 100.0
unit = "ms"
meaning = "threshold adaptation time constant"
range = [
    5.0,
    1000.0,
]

[parameters.tau_asc1]
default = 10.0
unit = "ms"
meaning = "decay time constant of the first after-spike current"
range = [
    1.0,
    100.0,
]

[parameters.tau_asc2]
default = 200.0
unit = "ms"
meaning = "decay time constant of the second after-spike current"
range = [
    10.0,
    1000.0,
]

[parameters.a_theta]
default = 0.01
unit = "1"
meaning = "voltage coupling of the adaptive threshold to the membrane potential"
range = [
    0.0,
    1.0,
]

[parameters.delta_theta]
default = 2.0
unit = "mV"
meaning = "threshold increment added at each spike"
range = [
    0.0,
    20.0,
]

[parameters.r_asc1]
default = 1.0
unit = "mV"
meaning = "voltage-equivalent amplitude added to the first after-spike current at each spike"
range = [
    -50.0,
    50.0,
]

[parameters.r_asc2]
default = 0.5
unit = "mV"
meaning = "voltage-equivalent amplitude added to the second after-spike current at each spike"
range = [
    -50.0,
    50.0,
]

[parameters.resistance]
default = 1.0
unit = "1"
meaning = "normalised membrane resistance mapping injected current to a voltage offset (R=1 in the project's normalised-current convention, see docs/validation/lif_fi_curve.md)"
range = [
    0.0,
    100.0,
]

[integration]
dt = 1.0
method = "rk4"

[dynamics]
v = "(-(v - v_rest) + resistance * I + i_asc1 + i_asc2) / tau_m"
theta = "(theta_inf - theta + a_theta * (v - v_rest)) / tau_theta"
i_asc1 = "-i_asc1 / tau_asc1"
i_asc2 = "-i_asc2 / tau_asc2"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "exact"

[backends.julia]
status = "implemented"
parity = "exact"

[backends.go]
status = "implemented"
parity = "exact"

[backends.mojo]
status = "implemented"
parity = "exact"

[reproducibility]
reference_config = "{\"n_steps\":1000,\"current\":30.0,\"backend\":\"python\",\"parameters\":\"defaults\"}"
golden_trace_sha256 = "2212123f19a04efde6a67b012b08157c97d1d9d811e2468928da8e71830b8b77"

[documentation]
slug = "models/glif"
notes = ""

[validation]
dynamics_faithful = true
metric = "parity"
operating_point = "schema-DSL GLIF four-state RK4 at I=0,15,22,30,45,50 over 1000 steps"
tolerance = "exact hand/TOML/JSON state and event parity; exact hand/schema/Q16.16 spike counts at every operating point"
evidence = "tests/test_cosimulation.py::TestQ1616Precision::test_glif_q1616_parity"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosimulation.py::TestQ1616Precision::test_glif_q1616_parity"
target_tier = "H1"
terminal_reason = "Point-neuron schema→RTL path; higher silicon rungs need synthesis, timing, and equivalence programmes."
