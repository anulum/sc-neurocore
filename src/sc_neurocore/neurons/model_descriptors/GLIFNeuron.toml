[metadata]
schema_version = 2
name = "GLIF5"
class_name = "GLIFNeuron"
module = "glif"
display_name = "Teeter GLIF5 point neuron"
summary = "Five-state GLIF5 membrane, threshold, after-spike currents, refractory cut, and affine reset"
family = "Integrate-and-Fire"
category = "integrate-and-fire"
biophysical_detail = "point"
maturity = "validated"
intended_use = [
    "source-faithful GLIF5 simulation",
    "cross-runtime and fixed-point validation",
]
hardware_fit = [
    "bounded signed fixed-point co-simulation",
]
behavior_tags = [
    "adapting",
    "excitable",
    "rate-coded",
    "tonic",
]

[provenance]
authors = [
    "Teeter, C. et al.",
]
year = 2018
doi = "10.1038/s41467-017-02717-4"
paper_title = "Generalized leaky integrate-and-fire models classify multiple neuron types"
derivation_note = "Equations 1-8 with all GLIF5 state variables; fixed-grid exact dynamics matches the official AllenSDK old-current update order."

[state.v]
init = -70.0

[state.theta_spike]
init = 0.0

[state.i_asc1]
init = 0.0

[state.i_asc2]
init = 0.0

[state.theta_voltage]
init = 0.0

[state.refractory_remaining]
init = 0.0

[parameters.e_l]
default = -70.0
unit = "mV"
meaning = "leak reversal potential"

[parameters.capacitance]
default = 10.0
unit = "pF"
meaning = "membrane capacitance C"

[parameters.resistance]
default = 1.0
unit = "MOhm"
meaning = "membrane resistance R"

[parameters.theta_inf]
default = -50.0
unit = "mV"
meaning = "instantaneous threshold at rest"

[parameters.b_spike]
default = 0.01
unit = "1/ms"
meaning = "spike-threshold decay rate"

[parameters.b_voltage]
default = 0.01
unit = "1/ms"
meaning = "voltage-threshold decay rate"

[parameters.a_voltage]
default = 0.0001
unit = "1/ms"
meaning = "voltage-threshold coupling coefficient"

[parameters.k_asc1]
default = 0.1
unit = "1/ms"
meaning = "first after-spike-current decay rate"

[parameters.k_asc2]
default = 0.005
unit = "1/ms"
meaning = "second after-spike-current decay rate"

[parameters.f_v]
default = 0.0
unit = "1"
meaning = "affine voltage reset slope"

[parameters.delta_v]
default = 0.0
unit = "mV"
meaning = "affine voltage reset offset"

[parameters.delta_theta_spike]
default = 2.0
unit = "mV"
meaning = "spike-threshold reset increment"

[parameters.f_asc1]
default = 1.0
unit = "1"
meaning = "first after-spike-current reset fraction"

[parameters.f_asc2]
default = 1.0
unit = "1"
meaning = "second after-spike-current reset fraction"

[parameters.delta_i_asc1]
default = 1.0
unit = "pA"
meaning = "first after-spike-current reset increment"

[parameters.delta_i_asc2]
default = 0.5
unit = "pA"
meaning = "second after-spike-current reset increment"

[parameters.refractory_period]
default = 2.0
unit = "ms"
meaning = "absolute refractory cut duration"

[integration]
dt = 1.0
method = "map"

[dynamics]
v = "v if refractory_remaining > 0 else e_l + resistance * (I + i_asc1 + i_asc2) + ((v - e_l) - resistance * (I + i_asc1 + i_asc2)) * exp(-dt / (resistance * capacitance))"
theta_spike = "theta_spike if refractory_remaining > 0 else theta_spike * exp(-b_spike * dt)"
i_asc1 = "i_asc1 if refractory_remaining > 0 else i_asc1 * exp(-k_asc1 * dt)"
i_asc2 = "i_asc2 if refractory_remaining > 0 else i_asc2 * exp(-k_asc2 * dt)"
theta_voltage = "theta_voltage if refractory_remaining > 0 else theta_voltage * exp(-b_voltage * dt) + a_voltage * (resistance * (I + i_asc1 + i_asc2) * (1 - exp(-b_voltage * dt)) / b_voltage + ((v - e_l) - resistance * (I + i_asc1 + i_asc2)) * (dt * exp(-b_voltage * dt) if abs(b_voltage - 1 / (resistance * capacitance)) <= 1e-12 * max(1, abs(b_voltage), abs(1 / (resistance * capacitance))) else (exp(-dt / (resistance * capacitance)) - exp(-b_voltage * dt)) / (b_voltage - 1 / (resistance * capacitance))))"
refractory_remaining = "max(0, refractory_remaining - dt) if refractory_remaining > 0 else 0"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "exact"

[backends.julia]
status = "implemented"
parity = "ulp-bounded"

[backends.go]
status = "implemented"
parity = "ulp-bounded"

[backends.mojo]
status = "implemented"
parity = "ulp-bounded"

[reproducibility]
golden_trace_sha256 = "1b9bff8da7b7bffbfcd193c9634740897688c5a41833318b87456cdf472fc654"
reference_config = "src/sc_neurocore/neurons/reference_receipts/glif5_teeter_2018.json"

[documentation]
slug = "models/glif"
notes = "Strict V > Theta_inf + Theta_s + Theta_v events and source affine reset maps. The former four-state recurrence remains count-neutral as SCFourStateGLIFNeuron."

[validation]
dynamics_faithful = true
metric = "trajectory"
operating_point = "five-state mixed-drive receipt plus constant-current regimes"
tolerance = "complete state/event parity across five runtimes; Q32.32 integer exactness, exact events, and five-state error below 2e-7"
evidence = "tests/test_model_glif.py; tests/test_glif_backends.py; tests/test_reference_glif.py; tests/test_cosim_glif_q3232.py"

[silicon]
compiles = true
cosim_validated = true
synthesised = true
cosim_evidence = "tests/test_cosim_glif_q3232.py"
target_device = "Xilinx 7-series (Yosys synth_xilinx)"
target_tier = "H2"
terminal_reason = "Default-profile Q32.32 co-simulation, coarse Xilinx synthesis, and bounded formal safety only; timing, PPA, board, device, and silicon evidence remain open."
