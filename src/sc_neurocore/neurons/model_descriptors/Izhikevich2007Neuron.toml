# SC-NeuroCore — Source/config provenance header

[metadata]
schema_version = 2
name = "Izhikevich2007"
class_name = "Izhikevich2007Neuron"
module = "izhikevich2007"
display_name = ""
summary = "Izhikevich 2007 biophysical quadratic integrate-and-fire neuron."
family = "Resonate-and-Fire"
category = "resonate-and-fire"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "excitable",
    "phasic",
    "rate-coded",
    "tonic",
]

[provenance]
authors = [
    "Izhikevich, E.M.",
]
year = 2007
doi = "10.7551/mitpress/2526.001.0001"

[state.v]
init = -60.0

[state.u]
init = 0.0

[parameters.C]
default = 100.0
unit = "pF"
meaning = "membrane capacitance"
range = [
    1.0,
    500.0,
]

[parameters.k]
default = 0.7
unit = "pA/mV^2"
meaning = "quadratic scaling of the spike-generating current"
range = [
    0.0,
    5.0,
]

[parameters.vr]
default = -60.0
unit = "mV"
meaning = "resting membrane potential"
range = [
    -90.0,
    -40.0,
]

[parameters.vt]
default = -40.0
unit = "mV"
meaning = "instantaneous threshold potential"
range = [
    -60.0,
    -20.0,
]

[parameters.vpeak]
default = 35.0
unit = "mV"
meaning = "spike cutoff (peak) potential"
range = [
    0.0,
    60.0,
]

[parameters.a]
default = 0.03
unit = "1/ms"
meaning = "recovery time-scale (rate of the recovery variable)"
range = [
    0.001,
    1.0,
]

[parameters.b]
default = -2.0
unit = "nS"
meaning = "sensitivity of the recovery variable to subthreshold voltage"
range = [
    -20.0,
    20.0,
]

[parameters.c]
default = -50.0
unit = "mV"
meaning = "voltage reset value after a spike"
range = [
    -90.0,
    -40.0,
]

[parameters.d]
default = 100.0
unit = "pA"
meaning = "recovery-variable increment after a spike"
range = [
    -50.0,
    500.0,
]

[integration]
dt = 0.1
method = "euler"

[dynamics]
v = "(k * (v - vr) * (v - vt) - u + I) / C"
u = "a * (b * (v - vr) - u)"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "exact"

[backends.julia]
status = "implemented"
parity = "exact"

[backends.go]
status = "implemented"
parity = "exact"

[backends.mojo]
status = "implemented"
parity = "ulp-bounded"

[reproducibility]
reference_config = "{\"n_steps\":300,\"current\":1000.0,\"integrator\":\"rk4\",\"parameters\":\"defaults\"}"
golden_trace_sha256 = "9f5efda50694f217a032b02094017eef351e14d5d4a28d5d373873c73f48b9fd"
golden_citation = "src/sc_neurocore/neurons/reference_receipts/izhikevich_2007_rk4.json"

[documentation]
slug = "models/izhikevich2007"
notes = "The source identity is the continuous 2007 biophysical quadratic model with the NeuroML regular-spiking parameter profile. The schema/RTL lane uses simultaneous forward Euler at dt=0.1; the public runtime defaults to maintained coupled RK4 at the same dt. Both integrate the same source equations and keep separate executable evidence."

[validation]
dynamics_faithful = true
metric = "parity"
operating_point = "schema-DSL izhikevich2007; Euler; hand/schema/RTL"
tolerance = "exact Q16.16 spike parity per enrolment"
