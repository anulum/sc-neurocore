[metadata]
schema_version = 2
name = "AlphaNeuron"
class_name = "AlphaNeuron"
module = "alpha"
display_name = "Dual excitatory/inhibitory alpha-synapse leaky integrate-and-fire neuron"
summary = "Exact constant-input flow for the dual alpha-synapse LIF: exact filter cascade and alpha-current convolution; somatic spike resets only v."
family = "Integrate-and-Fire"
category = "integrate-and-fire"
biophysical_detail = "point"
maturity = "validated"
intended_use = [
    "alpha-synapse excitability studies",
    "dual excitatory/inhibitory current filtering",
    "cross-runtime exact-flow validation",
]
hardware_fit = [
    "generated fixed-point co-simulation reference",
]
behavior_tags = [
    "excitable",
    "rate-coded",
    "tonic",
]

[provenance]
authors = [
    "Rall, W.",
    "Gerstner, W. & Kistler, W.M.",
]
year = 1967
doi = "10.1017/CBO9780511815706"
secondary_doi = ""
paper_title = "Spiking Neuron Models"
url = "https://doi.org/10.1017/CBO9780511815706"
reduction_boundary = "The alpha kernel is Rall 1967 (J. Neurophysiol. 30:1138-1168); the LIF-with-filtered-currents framing is Gerstner-Kistler 2002 §4.1. The maintained exact piecewise-constant-input timestep is a derived exact flow, not itself a biological publication claim. An earlier public-docs line citing Rall 1962 (Ann. N.Y. Acad. Sci. 96) was a misattribution for this artefact and is corrected. Defaults (tau_v=20, tau_exc=5, tau_inh=10, dimensionless scale) are catalogue/model-family choices, not source-derived."

[state.v]
init = 0.0
unit = "1"
meaning = "membrane potential; the only state reset at a spike"

[state.i_exc]
init = 0.0
unit = "1"
meaning = "excitatory synaptic current"

[state.i_inh]
init = 0.0
unit = "1"
meaning = "inhibitory synaptic current"

[state.a_exc]
init = 0.0
unit = "1"
meaning = "excitatory alpha-rise state"

[state.a_inh]
init = 0.0
unit = "1"
meaning = "inhibitory alpha-rise state"

[parameters.v_rest]
default = 0.0
unit = "1"
meaning = "leak reversal potential; also the somatic spike reset"
range = [
    -90.0,
    0.0,
]

[parameters.v_threshold]
default = 1.0
unit = "1"
meaning = "spike threshold; must exceed v_rest"
range = [
    0.0,
    20.0,
]

[parameters.tau_v]
default = 20.0
unit = "1"
meaning = "membrane time constant"
range = [
    1.0,
    100.0,
]

[parameters.tau_exc]
default = 5.0
unit = "1"
meaning = "excitatory alpha time constant"
range = [
    0.1,
    100.0,
]

[parameters.tau_inh]
default = 10.0
unit = "1"
meaning = "inhibitory alpha time constant"
range = [
    0.1,
    200.0,
]

[integration]
dt = 1.0
method = "map"

[dynamics]
a_exc = "alpha-rise cascade state, exact filter relaxation"
i_exc = "excitatory current, exact alpha-filter relaxation"
a_inh = "inhibitory alpha-rise cascade state, exact filter relaxation"
i_inh = "inhibitory current, exact alpha-filter relaxation"
v = "tau_v*dV/dt=-(V-v_rest)+i_exc-i_inh; exact piecewise-constant-input relaxation plus exact alpha-current convolution (general form; equal-tau limit is production-only)"
event = "spike on candidate crossing next_v >= v_threshold; only v resets to v_rest; cascade states preserved"
scope = "real piecewise-constant excitatory/inhibitory drives; equal-time-constant configurations are schema-excluded (documented boundary)"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "ulp-bounded"

[backends.julia]
status = "implemented"
parity = "ulp-bounded"

[backends.go]
status = "implemented"
parity = "ulp-bounded"

[backends.mojo]
