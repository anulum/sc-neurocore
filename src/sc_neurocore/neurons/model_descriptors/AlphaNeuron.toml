[documentation]
slug = "models/alpha"
notes = "Dual alpha-synapse LIF with exact constant-input flow. The alpha kernel is Rall 1967; the LIF framing is Gerstner-Kistler 2002 §4.1. The exact timestep is an engineering contract (derived exact flow), not a biological publication claim. Defaults are catalogue/model-family choices. The equal-time-constant convolution limit is implemented in all production lanes; schemas carry the general form with the documented boundary."

