[metadata]
schema_version = 2
name = "Morris-Lecar"
class_name = "MorrisLecarNeuron"
module = "morris_lecar"
display_name = ""
summary = "Calcium-potassium oscillator — 2D conductance-based model with sigmoidal activation"
family = "Oscillator"
category = "oscillator"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "excitable",
    "phasic",
    "tonic",
]

[provenance]
authors = [
    "Morris, C. & Lecar, H.",
]
year = 1981
doi = "10.1016/S0006-3495(81)84782-0"

[state.v]
init = -60.0

[state.w]
init = 0.0

[parameters.c_m]
default = 20.0
unit = "uF/cm^2"
meaning = "membrane capacitance"
range = [
    1.0,
    50.0,
]

[parameters.g_ca]
default = 4.0
unit = "mS/cm^2"
meaning = "maximal calcium conductance"
range = [
    0.0,
    20.0,
]

[parameters.g_k]
default = 8.0
unit = "mS/cm^2"
meaning = "maximal potassium conductance"
range = [
    0.0,
    40.0,
]

[parameters.g_l]
default = 2.0
unit = "mS/cm^2"
meaning = "leak conductance"
range = [
    0.0,
    10.0,
]

[parameters.e_ca]
default = 120.0
unit = "mV"
meaning = "calcium reversal potential"
range = [
    80.0,
    150.0,
]

[parameters.e_k]
default = -84.0
unit = "mV"
meaning = "potassium reversal potential"
range = [
    -100.0,
    -60.0,
]

[parameters.e_l]
default = -60.0
unit = "mV"
meaning = "leak reversal potential"
range = [
    -80.0,
    -40.0,
]

[parameters.v1]
default = -1.2
unit = "mV"
meaning = "midpoint voltage of the calcium activation function"
range = [
    -20.0,
    20.0,
]

[parameters.v2]
default = 18.0
unit = "mV"
meaning = "slope voltage of the calcium activation function"
range = [
    5.0,
    40.0,
]

[parameters.v3]
default = 12.0
unit = "mV"
meaning = "midpoint voltage of the potassium activation function"
range = [
    -20.0,
    30.0,
]

[parameters.v4]
default = 17.4
unit = "mV"
meaning = "slope voltage of the potassium activation function"
range = [
    5.0,
    40.0,
]

[parameters.phi]
default = 0.06666666666666667
unit = "1/ms"
meaning = "potassium activation rate scaling"
range = [
    0.01,
    0.5,
]

[parameters.v_threshold]
default = 0.0
unit = "mV"
meaning = "voltage at which a spike is registered"
range = [
    -20.0,
    20.0,
]

[integration]
dt = 0.1
method = "rk4"

[dynamics]
v = "(-g_ca * 0.5 * (1 + tanh((v - v1) / v2)) * (v - e_ca) - g_k * w * (v - e_k) - g_l * (v - e_l) + I) / c_m"
w = "phi * cosh((v - v3) / (2 * v4)) * (0.5 * (1 + tanh((v - v3) / v4)) - w)"

[backends.python]
status = "implemented"

[reproducibility]

[documentation]
slug = "models/morris_lecar"
notes = ""

[validation]
dynamics_faithful = true
metric = "parity"
operating_point = "schema-DSL Morris-Lecar conductance; rk4/crossing"
tolerance = "spike-count parity; not full state trajectory"
evidence = "tests/test_cosimulation.py::TestQ1616Precision::test_morris_lecar_q1616_parity"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosimulation.py::TestQ1616Precision::test_morris_lecar_q1616_parity"
target_tier = "H1"
terminal_reason = "Point-neuron schema→RTL path; higher silicon rungs need synth/timing/formal programmes."
