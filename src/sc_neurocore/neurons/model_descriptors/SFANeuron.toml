[metadata]
schema_version = 2
name = "SFANeuron"
class_name = "SFANeuron"
module = "sfa"
display_name = ""
summary = "Benda-Herz spike-frequency adaptation IF with RK4 candidates."
family = "Integrate-and-Fire"
category = "integrate-and-fire"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "adapting",
    "bursting",
    "excitable",
    "rate-coded",
]

[provenance]
authors = [
    "Benda, J. & Herz, A.V.M.",
]
year = 2003
doi = "10.1162/089976603322385063"

[state.v]
init = -70.0

[state.g_sfa]
init = 0.0

[parameters.v_rest]
default = -70.0
unit = "mV"
meaning = "resting / leak reversal potential"
range = [
    -90.0,
    -40.0,
]

[parameters.v_reset]
default = -70.0
unit = "mV"
meaning = "membrane potential reset to after a spike"
range = [
    -90.0,
    -40.0,
]

[parameters.v_threshold]
default = -50.0
unit = "mV"
meaning = "voltage at which a spike is registered"
range = [
    -60.0,
    -20.0,
]

[parameters.tau_m]
default = 10.0
unit = "ms"
meaning = "membrane time constant"
range = [
    1.0,
    100.0,
]

[parameters.tau_sfa]
default = 200.0
unit = "ms"
meaning = "adaptation time constant of the spike-frequency-adaptation conductance"
range = [
    10.0,
    2000.0,
]

[parameters.delta_g]
default = 0.5
unit = "1"
meaning = "normalised adaptation-conductance increment added at each spike"
range = [
    0.0,
    5.0,
]

[parameters.e_k]
default = -80.0
unit = "mV"
meaning = "potassium (adaptation) reversal potential"
range = [
    -100.0,
    -60.0,
]

[parameters.resistance]
default = 1.0
unit = "1"
meaning = "normalised membrane resistance (R=1 in the project's normalised-current convention)"
range = [
    0.0,
    100.0,
]

[integration]
dt = 1.0
method = "euler"

[dynamics]

[backends.python]
status = "implemented"

[reproducibility]

[documentation]
slug = "models/sfa"
notes = ""
