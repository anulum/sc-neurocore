[metadata]
schema_version = 2
name = "Hindmarsh-Rose"
class_name = "HindmarshRoseNeuron"
module = "hindmarsh_rose"
display_name = ""
summary = "3D chaotic bursting model with slow adaptation variable"
family = "Bursting"
category = "bursting"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "excitable",
    "phasic",
    "tonic",
]

[provenance]
authors = [
    "Hindmarsh, J.L. & Rose, R.M.",
]
year = 1984
doi = "10.1098/rspb.1984.0024"

[state.x]
init = -1.6

[state.y]
init = -10.0

[state.z]
init = 2.0

[parameters.b]
default = 3.0
unit = "1"
meaning = "fast-subsystem nonlinearity controlling spiking vs bursting"
range = [
    2.0,
    4.0,
]

[parameters.r]
default = 0.001
unit = "1"
meaning = "slow adaptation timescale; small values give slow bursting"
range = [
    0.0001,
    0.01,
]

[parameters.s]
default = 4.0
unit = "1"
meaning = "adaptation coupling strength"
range = [
    1.0,
    6.0,
]

[parameters.x_rest]
default = -1.6
unit = "1"
meaning = "resting value of x setting the adaptation drive"
range = [
    -2.0,
    -1.0,
]

[parameters.x_threshold]
default = 1.0
unit = "1"
meaning = "level on x at which a spike is registered"
range = [
    0.0,
    2.0,
]

[integration]
dt = 0.1
method = "rk4"

[dynamics]
x = "y - x**3 + b * x**2 - z + I"
y = "1 - 5 * x**2 - y"
z = "r * (s * (x - x_rest) - z)"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "exact"

[backends.julia]
status = "implemented"
parity = "exact"

[backends.go]
status = "implemented"
parity = "exact"

[backends.mojo]
status = "implemented"
parity = "ulp-bounded"

[reproducibility]
reference_config = "{\"n_steps\":1000,\"current\":2.0,\"backend\":\"python\",\"parameters\":\"defaults\"}"
golden_trace_sha256 = "38321340107629a994d0c18b9ea553adcd3f7d4dff6afeebf8a98fa184d84991"

[documentation]
slug = "models/hindmarsh_rose"
notes = "The DOI supplies the three coupled ODEs. The x_threshold crossing is a maintained observation convention, and the oscillator has no reset."

[validation]
dynamics_faithful = true
metric = "parity"
operating_point = "Hindmarsh-Rose three-state RK4 flow at I=0,2,3,4,5 over 2000 steps"
tolerance = "exact hand/TOML/JSON/Q16.16 upward-crossing counts 0/0/26/40/52 over 2000 steps; declared +1 Q16.16 boundary over 5000 steps at I=2 through I=5"
evidence = "tests/test_cosim_hindmarsh_rose.py::TestQ1616Precision::test_hindmarsh_rose_q1616_parity"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosim_hindmarsh_rose.py::TestQ1616Precision::test_hindmarsh_rose_q1616_parity"
target_tier = "H1"
terminal_reason = "Q16.16 RK4 co-simulation preserves the enrolled upward-crossing counts; higher tiers require synthesis and timing evidence."
