[metadata]
schema_version = 2
name = "Lapicque"
class_name = "LapicqueNeuron"
module = "lapicque"
display_name = ""
summary = "Classical RC integrate-and-fire — the original neuron model (1907)"
family = "Integrate-and-Fire"
category = "integrate-and-fire"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "excitable",
    "rate-coded",
    "tonic",
]

[provenance]
authors = [
    "Lapicque, L.",
]
year = 1907
paper_title = "Recherches quantitatives sur l'excitation electrique des nerfs traitee comme une polarisation"

[state.v]
init = 0.0

[parameters.v_rest]
default = 0.0
unit = "1"
meaning = "resting potential (normalised, R=1)"
range = [
    -1.0,
    1.0,
]

[parameters.v_reset]
default = 0.0
unit = "1"
meaning = "post-spike reset potential (normalised)"
range = [
    -1.0,
    1.0,
]

[parameters.v_threshold]
default = 1.0
unit = "1"
meaning = "firing threshold (normalised)"
range = [
    0.0,
    5.0,
]

[parameters.tau]
default = 20.0
unit = "ms"
meaning = "membrane (RC) time constant"
range = [
    1.0,
    100.0,
]

[parameters.resistance]
default = 1.0
unit = "1"
meaning = "membrane resistance (normalised, R=1)"
range = [
    0.1,
    10.0,
]

[integration]
dt = 1.0
method = "euler"

[dynamics]
v = "(-(v - v_rest) + resistance * I) / tau"

[backends.python]
status = "implemented"

[reproducibility]

[documentation]
slug = "models/lapicque"
notes = ""

[validation]
dynamics_faithful = true
metric = "parity"
operating_point = "schema-DSL lapicque (sibling schema 'lif' shares the same class descriptor until a dedicated StochasticLIF descriptor exists)"
tolerance = "suite parity gate"
evidence = "tests/test_cosimulation.py::_COSIM_MODELS cosim suite (lapicque)"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosimulation.py::_COSIM_MODELS cosim suite (lapicque)"
target_tier = "H1"
terminal_reason = "Point-neuron schema→RTL path; higher silicon rungs need synth/timing/formal programmes."
