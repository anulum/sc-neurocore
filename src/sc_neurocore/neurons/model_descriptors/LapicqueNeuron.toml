[metadata]
schema_version = 2
name = "Lapicque"
class_name = "LapicqueNeuron"
module = "lapicque"
display_name = ""
summary = "Classical RC integrate-and-fire — the original neuron model (1907)"
family = "Integrate-and-Fire"
category = "integrate-and-fire"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "excitable",
    "rate-coded",
    "tonic",
]

[provenance]
authors = [
    "Lapicque, L.",
]
year = 1907
doi = "10.1007/s00422-007-0189-6"
doi_is_translation = true
paper_title = "Recherches quantitatives sur l'excitation electrique des nerfs traitee comme une polarisation"

[state.v]
init = 0.0

[parameters.v_rest]
default = 0.0
unit = "1"
meaning = "resting potential (normalised, R=1)"
range = [
    -1.0,
    1.0,
]

[parameters.v_reset]
default = 0.0
unit = "1"
meaning = "post-spike reset potential (normalised)"
range = [
    -1.0,
    1.0,
]

[parameters.v_threshold]
default = 1.0
unit = "1"
meaning = "firing threshold (normalised)"
range = [
    0.0,
    5.0,
]

[parameters.tau]
default = 20.0
unit = "ms"
meaning = "membrane (RC) time constant"
range = [
    1.0,
    100.0,
]

[parameters.resistance]
default = 1.0
unit = "1"
meaning = "membrane resistance (normalised, R=1)"
range = [
    0.1,
    10.0,
]

[integration]
dt = 1.0
method = "exp_euler"

[dynamics]
v = "(-(v - v_rest) + resistance * I) / tau"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "exact"

[backends.julia]
status = "implemented"
parity = "ulp-bounded"

[backends.go]
status = "implemented"
parity = "ulp-bounded"

[backends.mojo]
status = "implemented"
parity = "ulp-bounded"

[reproducibility]
