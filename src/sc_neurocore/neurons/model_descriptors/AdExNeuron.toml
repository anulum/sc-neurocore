# SC-NeuroCore — Source/config provenance header

[metadata]
schema_version = 2
name = "AdEx"
class_name = "AdExNeuron"
module = "adex"
display_name = "Adaptive exponential integrate-and-fire"
summary = "Source-identified Brette–Gerstner AdEx equations with a separately exposed published regular-spiking fit."
family = "Integrate-and-Fire"
category = "integrate-and-fire"
biophysical_detail = "point"
maturity = "experimental"
intended_use = [
    "source-equation reference",
    "adaptive point-neuron simulation",
]
hardware_fit = [
    "fixed-point exponential-LUT co-simulation",
]
behavior_tags = [
    "excitable",
    "rate-coded",
    "tonic",
]

[provenance]
authors = [
    "Brette, R. & Gerstner, W.",
]
year = 2005
doi = "10.1152/jn.00686.2005"

[state.v]
init = -65.0

[state.w]
init = 0.0

[parameters.v_rest]
default = -65.0
unit = "mV"
meaning = "resting / leak reversal potential"
range = [
    -90.0,
    -40.0,
]
biological_range = [
    -80.0,
    -55.0,
]

[parameters.v_reset]
default = -68.0
unit = "mV"
meaning = "membrane potential the model is reset to after a spike"
range = [
    -90.0,
    -40.0,
]
biological_range = [
    -80.0,
    -50.0,
]

[parameters.v_threshold]
default = -50.0
unit = "mV"
meaning = "voltage cutoff at which a spike is registered and reset applied"
range = [
    -60.0,
    50.0,
]

[parameters.v_rh]
default = -55.0
unit = "mV"
meaning = "rheobase threshold of the exponential spike-initiation term"
range = [
    -65.0,
    -40.0,
]

[parameters.delta_t]
default = 2.0
unit = "mV"
meaning = "slope factor (sharpness) of the exponential spike initiation"
range = [
    0.25,
    5.0,
]

[parameters.tau]
default = 20.0
unit = "ms"
meaning = "membrane time constant (C / g_leak)"
range = [
    1.0,
    100.0,
]
biological_range = [
    5.0,
    50.0,
]

[parameters.tau_w]
default = 100.0
unit = "ms"
meaning = "adaptation time constant"
range = [
    5.0,
    600.0,
]

[parameters.a]
default = 0.5
unit = "nS"
meaning = "subthreshold adaptation conductance coupling voltage to the adaptation current"
range = [
    0.0,
    10.0,
]

[parameters.b]
default = 7.0
unit = "pA"
meaning = "spike-triggered adaptation current increment added to w at each spike"
range = [
    0.0,
    200.0,
]

[parameters.c_m]
default = 200.0
unit = "pF"
meaning = "membrane capacitance"
range = [
    20.0,
    500.0,
]
biological_range = [
    50.0,
    300.0,
]

[integration]
dt = 0.1
method = "euler"

[dynamics]
v = "(-(v - v_rest) + delta_T * exp((v - v_rh) / delta_T)) / tau + (-w + I) / C"
w = "(a * (v - v_rest) - w) / tau_w"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "exact"

[backends.julia]
status = "implemented"
parity = "ulp-bounded"

[backends.go]
status = "implemented"
parity = "ulp-bounded"

[backends.mojo]
status = "implemented"
parity = "ulp-bounded"

[reproducibility]
reference_config = "src/sc_neurocore/neurons/reference_receipts/adex_brette_gerstner_2005.json"
golden_trace_sha256 = "9965fe9bfc0ff2c67f894e39ae7f88ae3fa9b7aa11517e783a51178d0e6ca219"
golden_citation = "src/sc_neurocore/neurons/reference_receipts/adex_brette_gerstner_2005.json"

[documentation]
slug = "models/adex"
notes = "Maintained defaults remain backwards-compatible. AdExNeuron.brette_gerstner_2005() exposes the paper's regular-spiking fit without relabelling those defaults as source-fitted."

[validation]
dynamics_faithful = true
metric = "parity"
operating_point = "published regular-spiking fit at I=800 pA for 1000 steps; maintained defaults at I=0/200/500 pA; Q16.16 RTL event envelope"
tolerance = "source-normalised complete state below 2e-12; compiled state below 5e-12 with exact events; Q16.16 event-count gap at most two percent"
evidence = "tests/test_reference_adex.py; tests/test_model_adex_source_contract.py; tests/test_adex_backends_backend_parity.py; tests/test_cosim_adex.py"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosim_adex.py::TestQ1616Precision::test_adex_q1616_parity"
synthesised = true
synth_report = "hdl/reports/yosys_adex_q1616_2026-08-30.json"
target_device = "generic RTL (Yosys coarse synthesis)"
target_tier = "H2"
terminal_reason = "Q16.16 co-simulation, coarse synthesis, and bounded reset/event formal safety are complete; timing, PPA, board, device, physical silicon, and universal formal equivalence remain open."
