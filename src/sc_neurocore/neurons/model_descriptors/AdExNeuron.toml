[metadata]
schema_version = 2
name = "AdEx"
class_name = "AdExNeuron"
module = "adex"
display_name = ""
summary = "Adaptive Exponential Integrate-and-Fire — exponential spike initiation with subthreshold adaptation"
family = "Integrate-and-Fire"
category = "integrate-and-fire"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "excitable",
    "rate-coded",
    "tonic",
]

[provenance]
authors = [
    "Brette, R. & Gerstner, W.",
]
year = 2005
doi = "10.1152/jn.00686.2005"

[state.v]
init = -65.0

[state.w]
init = 0.0

[parameters.v_rest]
default = -65.0
unit = "mV"
meaning = "resting / leak reversal potential"
range = [
    -90.0,
    -40.0,
]
biological_range = [
    -80.0,
    -55.0,
]

[parameters.v_reset]
default = -68.0
unit = "mV"
meaning = "membrane potential the model is reset to after a spike"
range = [
    -90.0,
    -40.0,
]
biological_range = [
    -80.0,
    -50.0,
]

[parameters.v_threshold]
default = -50.0
unit = "mV"
meaning = "voltage cutoff at which a spike is registered and reset applied"
range = [
    -60.0,
    -20.0,
]

[parameters.v_rh]
default = -55.0
unit = "mV"
meaning = "rheobase threshold of the exponential spike-initiation term"
range = [
    -65.0,
    -40.0,
]

[parameters.delta_t]
default = 2.0
unit = "mV"
meaning = "slope factor (sharpness) of the exponential spike initiation"
range = [
    0.25,
    5.0,
]

[parameters.tau]
default = 20.0
unit = "ms"
meaning = "membrane time constant (C / g_leak)"
range = [
    1.0,
    100.0,
]
biological_range = [
    5.0,
    50.0,
]

[parameters.tau_w]
default = 100.0
unit = "ms"
meaning = "adaptation time constant"
range = [
    5.0,
    600.0,
]

[parameters.a]
default = 0.5
unit = "nS"
meaning = "subthreshold adaptation conductance coupling voltage to the adaptation current"
range = [
    0.0,
    10.0,
]

[parameters.b]
default = 7.0
unit = "pA"
meaning = "spike-triggered adaptation current increment added to w at each spike"
range = [
    0.0,
    200.0,
]

[parameters.c_m]
default = 200.0
unit = "pF"
meaning = "membrane capacitance"
range = [
    20.0,
    500.0,
]
biological_range = [
    50.0,
    300.0,
]

[integration]
dt = 0.1
method = "euler"

[dynamics]
v = "(-(v - v_rest) + delta_T * exp((v - v_rh) / delta_T)) / tau + (-w + I) / C"
w = "(a * (v - v_rest) - w) / tau_w"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "exact"

[reproducibility]
reference_config = "{\"n_steps\":1000,\"current\":250.0,\"backend\":\"python\",\"parameters\":\"defaults\"}"
golden_trace_sha256 = "5413312b873921d2ef9aa6d50d8087d8962cf431ac0f6db2899cb5579ee46dfb"

[documentation]
slug = "models/adex"
notes = ""

[validation]
dynamics_faithful = true
metric = "parity"
operating_point = "schema-DSL adex; Q16.16 RTL vs Python spike count"
tolerance = "class-correct Q16.16 gap bound in test"
evidence = "tests/test_cosimulation.py::TestQ1616Precision::test_adex_q1616_parity"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosimulation.py::TestQ1616Precision::test_adex_q1616_parity"
target_tier = "H1"
terminal_reason = "Point-neuron schema→RTL path; higher silicon rungs need synth/timing/formal programmes."
