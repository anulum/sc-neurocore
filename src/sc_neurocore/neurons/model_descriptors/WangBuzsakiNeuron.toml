# SC-NeuroCore — Source/config provenance header

[metadata]
schema_version = 2
name = "Wang-Buzsáki"
class_name = "WangBuzsakiNeuron"
module = "wang_buzsaki"
display_name = "Wang-Buzsaki fast-spiking interneuron"
summary = "Modified HH for hippocampal interneurons — fast-spiking GABAergic basket cells"
family = "Conductance-based"
category = "conductance-based"
biophysical_detail = "point"
maturity = "validated"
intended_use = [
    "fast-spiking hippocampal interneuron dynamics",
    "ING and PING network studies",
    "source-equation and cross-runtime regression",
]
hardware_fit = [
    "bounded Q16.16 Gauss-Seidel co-simulation",
]
behavior_tags = [
    "excitable",
    "phasic",
    "tonic",
]

[provenance]
authors = [
    "Wang, X.-J. & Buzsáki, G.",
]
year = 1996
doi = "10.1523/JNEUROSCI.16-20-06402.1996"

[state.v]
init = -65.0

[state.h]
init = 0.8

[state.n]
init = 0.1

[parameters.g_na]
default = 35.0
unit = "mS/cm^2"
meaning = "maximal sodium conductance"
range = [
    0.0,
    100.0,
]

[parameters.g_k]
default = 9.0
unit = "mS/cm^2"
meaning = "maximal potassium conductance"
range = [
    0.0,
    50.0,
]

[parameters.g_l]
default = 0.1
unit = "mS/cm^2"
meaning = "leak conductance"
range = [
    0.0,
    2.0,
]

[parameters.e_na]
default = 55.0
unit = "mV"
meaning = "sodium reversal potential"
range = [
    30.0,
    70.0,
]

[parameters.e_k]
default = -90.0
unit = "mV"
meaning = "potassium reversal potential"
range = [
    -100.0,
    -70.0,
]

[parameters.e_l]
default = -65.0
unit = "mV"
meaning = "leak reversal potential"
range = [
    -80.0,
    -50.0,
]

[parameters.c_m]
default = 1.0
unit = "uF/cm^2"
meaning = "membrane capacitance"
range = [
    0.5,
    2.0,
]

[parameters.phi]
default = 5.0
unit = "1"
meaning = "temperature scaling factor of the gating kinetics"
range = [
    1.0,
    10.0,
]

[parameters.v_threshold]
default = -20.0
unit = "mV"
meaning = "voltage at which a spike is registered"
range = [
    -40.0,
    0.0,
]

[integration]
dt = 0.01
method = "gauss_seidel"

[dynamics]
h = "phi * (0.07 * exp(-(v + 58) / 20) * (1 - h) - 1 / (1 + exp(-(v + 28) / 10)) * h)"
n = "phi * (0.1 / exprel(-(v + 34) / 10) * (1 - n) - 0.125 * exp(-(v + 44) / 80) * n)"
v = "(-g_Na * ((1 / exprel(-(v + 35) / 10)) / (1 / exprel(-(v + 35) / 10) + 4 * exp(-(v + 60) / 18)))**3 * h * (v - E_Na) - g_K * n**4 * (v - E_K) - g_L * (v - E_L) + I) / C"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "approximate"

[backends.go]
status = "implemented"
parity = "approximate"

[backends.julia]
status = "implemented"
parity = "approximate"

[backends.mojo]
status = "implemented"
parity = "approximate"

[reproducibility]
reference_config = "src/sc_neurocore/neurons/reference_receipts/wang_buzsaki_1996.json"
golden_trace_sha256 = "4a53c138c52518b13f6277dd1176190e952abb5094a14abaa0b12c9cc154013d"
golden_citation = "Wang and Buzsaki 1996, DOI 10.1523/JNEUROSCI.16-20-06402.1996"

[documentation]
slug = "models/wang_buzsaki"
notes = "The committed RTL is a bounded Q16.16 compiler lowering, not a universal real-number or device claim."

[validation]
dynamics_faithful = true
metric = "trajectory"
operating_point = "30 macro steps at I=10 with 50 Gauss-Seidel substeps per macro step"
tolerance = "float64 reference 1e-9 absolute; five-runtime final state 1e-9; Q16.16 event count within one spike"
evidence = "tests/test_reference_wang_buzsaki.py; tests/test_bench_wang_buzsaki.py; tests/test_cosim_wang_buzsaki_catalogue.py"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosim_wang_buzsaki_catalogue.py"
synthesised = true
synth_report = "tests/test_cosim_wang_buzsaki_catalogue.py::test_yosys_synthesises_committed_rtl"
target_tier = "H2"
terminal_reason = "The bounded Q16.16 compiler lowering has event-count co-simulation, synthesis, and port-safety BMC; timing, PPA, device evidence, and universal real-number equivalence remain open."
