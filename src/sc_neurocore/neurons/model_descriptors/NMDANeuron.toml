notes = "Composite of the Wang-Buzsáki 1996 spiking base with the Jahr-Stevens 1990 voltage-dependent Mg block; the threshold-reset event and the input-driven s_NMDA drive are repository-specific specialisations, not publication-exact claims. Mojo and silicon lanes are not implemented."

