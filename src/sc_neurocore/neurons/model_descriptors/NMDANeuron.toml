default = -20.0
unit = "mV"
meaning = "voltage at which a spike is registered"
range = [
    -20.0,
    20.0,
]

[parameters.gain]
default = 1.0
unit = "1"
meaning = "gain applied to the injected input current"
range = [
    0.0,
    10.0,
]

[integration]
dt = 0.5
method = "euler"

[dynamics]
alpha_m = "0.1 * (v + 35) / (1 - exp(-(v + 35) / 10))"
beta_m = "4 * exp(-(v + 60) / 18)"
m_inf = "alpha_m / (alpha_m + beta_m)"
dh_dt = "phi * (0.07 * exp(-(v + 58) / 20) * (1 - h) - h / (1 + exp(-(v + 28) / 10)))"
dn_dt = "phi * (0.01 * (v + 34) / (1 - exp(-(v + 34) / 10)) * (1 - n) - 0.125 * exp(-(v + 44) / 80) * n)"
mg_block = "1 / (1 + (mg_conc / 3.57) * exp(-0.062 * v))"
s_drive = "gain * I / (gain * I + 5) if gain * I > 0 else 0"
ds = "dt * (s_drive - s_nmda) / (tau_rise if s_drive > s_nmda else tau_decay); s_nmda clamped to [0, 1] once per step before sub-stepping"
dv_dt = "(-g_na * m_inf^3 * h * (v - e_na) - g_k * n^4 * (v - e_k) - g_nmda * s_nmda * mg_block * (v - e_nmda) - g_l * (v - e_l) + gain * I) / c_m"
event = "v_next >= v_threshold; reset v to -65 while preserving h, n, and s_nmda"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "ulp-bounded"

[backends.go]
