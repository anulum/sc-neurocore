[metadata]
schema_version = 2
name = "Cazelles Map"
class_name = "CazellesMapNeuron"
module = "cazelles_map"
display_name = "Cazelles four-branch bursting map"
summary = "Cazelles et al. 2001 scalar piecewise-linear fast/slow chaotic map"
family = "Map-based"
category = "map-based"
biophysical_detail = "point"
maturity = "validated"
intended_use = [
    "burst-cycle dynamics",
    "coupled-map studies",
]
hardware_fit = [
    "piecewise-affine fixed-point datapath",
]
behavior_tags = [
    "excitable",
    "irregular",
]

[provenance]
authors = [
    "Cazelles, B., Courbage, M. & Rabinovich, M.",
]
year = 2001
doi = "10.1209/epl/i2001-00548-y"
derivation_note = "Equation and Figure-1 parameters from the primary paper. Exact breakpoints use the disclosed right-continuous convention because the source lists strict open intervals."

[state.x]
init = 0.1

[parameters.alpha]
default = 0.0
unit = "1"
meaning = "source self-feedback coefficient"
range = [
    0.0,
    0.999999999999,
]

[parameters.exponent]
default = 2.0
unit = "1"
meaning = "source exponent m, restricted to 1 or 2"
range = [
    1.0,
    2.0,
]

[parameters.x0]
default = 0.0
unit = "1"
meaning = "lower map-domain boundary"
range = [
    -1000000.0,
    1000000.0,
]

[parameters.x1]
default = 0.4
unit = "1"
meaning = "first branch breakpoint and slow-regime boundary"
range = [
    -1000000.0,
    1000000.0,
]

[parameters.x2]
default = 0.6
unit = "1"
meaning = "second branch breakpoint"
range = [
    -1000000.0,
    1000000.0,
]

[parameters.x3]
default = 0.7
unit = "1"
meaning = "third branch breakpoint"
range = [
    -1000000.0,
    1000000.0,
]

[parameters.x4]
default = 1.0
unit = "1"
meaning = "upper map-domain boundary"
range = [
    -1000000.0,
    1000000.0,
]

[parameters.a1]
default = 0.0
unit = "1"
meaning = "branch-1 intercept"
range = [
    -1000000.0,
    1000000.0,
]

[parameters.a2]
default = 1.5
unit = "1"
meaning = "branch-2 intercept"
range = [
    -1000000.0,
    1000000.0,
]

[parameters.a3]
default = -0.9
unit = "1"
meaning = "branch-3 intercept"
range = [
    -1000000.0,
    1000000.0,
]

[parameters.a4]
default = 1.4
unit = "1"
meaning = "branch-4 intercept"
range = [
    -1000000.0,
    1000000.0,
]

[parameters.b1]
default = 1.05
unit = "1"
meaning = "branch-1 slope"
range = [
    -1000000.0,
    1000000.0,
]

[parameters.b2]
default = -1.25
unit = "1"
meaning = "branch-2 slope"
range = [
    -1000000.0,
    1000000.0,
]

[parameters.b3]
default = 1.5
unit = "1"
meaning = "branch-3 slope"
range = [
    -1000000.0,
    1000000.0,
]

[parameters.b4]
default = -1.0
unit = "1"
meaning = "branch-4 slope"
range = [
    -1000000.0,
    1000000.0,
]

[integration]
dt = 1.0
method = "map"

[dynamics]
x = "f_branch(x) + alpha * x^m + I"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "exact"

[backends.julia]
status = "implemented"
parity = "exact"

[backends.go]
status = "implemented"
parity = "exact"

[backends.mojo]
status = "implemented"
parity = "exact"

[reproducibility]
reference_config = "{\"n_steps\":1000,\"current\":0.0,\"backend\":\"python\",\"parameters\":\"Figure 1 defaults\"}"
golden_trace_sha256 = "4b796bfdfe67be814057bcaa30d2c3d035e8d701f11c4d1aeaabb260b971ce7f"

[documentation]
slug = "models/cazelles_map"
notes = "Slow-regime entry is the maintained burst-cycle event; current is an additive extension and exact breakpoints are right-continuous."

[validation]
dynamics_faithful = true
metric = "trajectory"
operating_point = "Figure-1 source orbit at alpha=0 and bounded alpha/current probes"
tolerance = "binary64 exact for all five maintained runtimes; Q16.16 event-exact through the first discontinuous return with state error at most 0.0062; longer fixed-point chaotic trajectories are excluded"
evidence = "tests/test_reference_cazelles_map.py; tests/test_cazelles_map_backends.py; tests/test_cosim_cazelles_map.py"

[silicon]
compiles = true
cosim_validated = true
synthesised = true
cosim_evidence = "tests/test_cosim_cazelles_map.py"
synth_report = "hdl/reports/yosys_cazelles_map_q88_2026-08-28.json"
target_device = "generic RTL (Yosys coarse synthesis)"
target_tier = "H2"
terminal_reason = "Generated fixed-point co-simulation, coarse synthesis, and bounded formal safety only; timing, PPA, board, device, and silicon evidence remain open."
