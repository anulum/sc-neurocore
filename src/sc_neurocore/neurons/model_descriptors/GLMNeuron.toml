[metadata]
schema_version = 2
name = "GLMNeuron"
class_name = "GLMNeuron"
module = "glm_neuron"
display_name = ""
summary = "Pillow et al. 2008 — generalized linear model (point-process GLM)."
family = "Statistical"
category = "statistical"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "excitable",
    "stochastic",
]

[provenance]
authors = [
    "Pillow, J.W. et al.",
]
year = 2008
doi = "10.1038/nature07140"

[state]

[parameters.n_k]
default = 10.0
unit = "1"
meaning = "number of stimulus filter taps"
range = [
    1.0,
    200.0,
]

[parameters.n_h]
default = 20.0
unit = "1"
meaning = "number of post-spike history filter taps"
range = [
    1.0,
    200.0,
]

[parameters.mu]
default = -3.0
unit = "1"
meaning = "baseline log-firing-rate offset"
range = [
    -10.0,
    10.0,
]

[parameters.dt_ms]
default = 1.0
unit = "ms"
meaning = "timestep"
range = [
    0.01,
    10.0,
]

[integration]
dt = 1.0
method = "map"

[dynamics]
log_rate = "clip(k . stim_history + h . spike_history + mu, -20, 20)"
lambda = "exp(log_rate)"
p_spike = "min(lambda * dt_ms / 1000, 1)"
spike = "Bernoulli(p_spike); sampled from the generator, or from the explicit uniform argument when supplied"
history = "shift-register update: stim_history[0] = stimulus, spike_history[0] = spike, both after the draw"
k_default = "0.5 * exp(-i / 3), i = 0..n_k-1"
h_default = "-5 * exp(-t / 2) + 0.5 * exp(-t / 10), t = 0..n_h-1"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "ulp-bounded"

[backends.go]
status = "implemented"
parity = "ulp-bounded"

[backends.julia]
status = "implemented"
parity = "ulp-bounded"

[reproducibility]
reference_config = "{\"n_steps\":1000,\"current\":5.0,\"seed\":42,\"parameters\":\"defaults\"}"
golden_trace_sha256 = "21818fdf06ba04df17e66995fa29ac5565044f55c5ec5186f45c6763cba6709c"
event_count = 144
final_state = "{\"stim_buf0\":5.0,\"spike_buf0\":0.0,\"stim_sum\":50.0,\"spike_sum\":4.0}"

[documentation]
slug = "models/glm_neuron"
notes = "Discrete-time Bernoulli specialisation of the Pillow 2008 point-process GLM with an exponential nonlinearity and a log-rate clip to [-20, 20]. Stochastic: cross-backend parity is exact under the explicit-uniform sample contract; free-running sampling uses each surface's own generator (numpy PCG64 in Python, seeded Xoshiro256++ in the engine). Mojo and silicon lanes are not implemented."

[validation]
dynamics_faithful = true
metric = "trajectory"
operating_point = "64 varied drives under the explicit-uniform contract plus 1000 seeded steps at I=5"
