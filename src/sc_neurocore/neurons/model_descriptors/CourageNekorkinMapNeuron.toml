[metadata]
schema_version = 2
name = "Courbage-Nekorkin Map"
class_name = "CourageNekorkinMapNeuron"
module = "courage_nekorkin_map"
display_name = ""
summary = "Courbage-Nekorkin-Vdovin 2007 discontinuous 2D spiking-bursting map."
family = "Map-based"
category = "map-based"
biophysical_detail = "point"
maturity = "validated"
intended_use = [
    "source-profile spiking-bursting studies",
    "cross-runtime regression",
]
hardware_fit = [
    "bounded fixed-point co-simulation",
]
behavior_tags = [
    "chaotic",
    "excitable",
]

[provenance]
authors = [
    "Courbage, M., Nekorkin, V.I. & Vdovin, L.V.",
]
year = 2007
doi = "10.1063/1.2795435"

[state.x]
init = 0.0

[state.y]
init = 0.0

[parameters.m0]
default = 0.4
unit = "1"
meaning = "slope of the resting branch of the piecewise fast map"
range = [
    0.0,
    5.0,
]

[parameters.m1]
default = 0.65
unit = "1"
meaning = "slope of the spike-generating branch of the piecewise fast map"
range = [
    0.0,
    5.0,
]

[parameters.a]
default = 0.2
unit = "1"
meaning = "breakpoint location of the piecewise fast map"
range = [
    0.0,
    1.0,
]

[parameters.d]
default = 0.3
unit = "1"
meaning = "threshold of the slow regenerative (bursting) term"
range = [
    0.0,
    1.0,
]

[parameters.j]
default = 0.13
unit = "1"
meaning = "set-point of the fast variable in the slow-variable update"
range = [
    -1.0,
    1.0,
]

[parameters.beta]
default = 0.25
unit = "1"
meaning = "strength of the slow regenerative (bursting) reinjection"
range = [
    0.0,
    1.0,
]

[parameters.eps]
default = 0.002
unit = "1"
meaning = "slow-variable timescale; small values give slow bursting"
range = [
    0.0001,
    0.5,
]

[parameters.x_threshold]
default = 0.3
unit = "1"
meaning = "level on x at which a spike is registered"
range = [
    -2.0,
    2.0,
]

[integration]
dt = 1.0
method = "map"

[dynamics]
x = "x + ((-m0 * x) if x <= (a * m1 / (m0 + m1)) else (m1 * (x - a) if x < ((m0 + a * m1) / (m0 + m1)) else -m0 * (x - 1.0))) - y - beta * (1.0 if x >= d else 0.0) + I"
y = "y + eps * (x - j)"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "exact"

[backends.julia]
status = "implemented"
parity = "exact"

[backends.go]
status = "implemented"
parity = "exact"

[backends.mojo]
status = "implemented"
parity = "exact"

[reproducibility]
reference_config = "{\"n_steps\":2000,\"current\":0.0,\"backend\":\"python\",\"parameters\":\"Figure 4 defaults\"}"
golden_trace_sha256 = "fee02b5a56b095ce3f60b474a7cdc5d912f73f5d2049beb81a7ee7ac9b2e714f"

[documentation]
slug = "models/courage_nekorkin_map"
notes = "Historical class spelling retained for compatibility; defaults reproduce the complete source Figure-4 profile."

[validation]
dynamics_faithful = true
metric = "trajectory"
operating_point = "Courbage-Nekorkin-Vdovin Figure-4 profile from x=y=0 under autonomous drive"
tolerance = "binary64 exact for all five maintained runtimes; bounded fixed-point event-vector and state envelope"
evidence = "tests/test_reference_courage_nekorkin_map.py; tests/test_cosim_courage_nekorkin_map.py"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosim_courage_nekorkin_map.py"
synthesised = true
synth_report = "hdl/reports/yosys_courbage_nekorkin_map_q3232_2026-08-28.json"
target_device = "generic RTL (Yosys coarse synthesis)"
target_tier = "H2"
terminal_reason = "Generated fixed-point co-simulation, coarse synthesis, and bounded formal safety only; timing, PPA, board, device, and silicon evidence remain open."
