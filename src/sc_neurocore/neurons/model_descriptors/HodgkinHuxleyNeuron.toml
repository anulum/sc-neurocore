# SC-NeuroCore — Source/config provenance header

[metadata]
schema_version = 2
name = "Hodgkin-Huxley"
class_name = "HodgkinHuxleyNeuron"
module = "hodgkin_huxley"
display_name = ""
summary = "4D conductance-based model — Nobel Prize 1963 — the gold standard of biophysical neuron modelling"
family = "Conductance-based"
category = "conductance-based"
biophysical_detail = "point"
maturity = "validated"
intended_use = [
    "four-state squid-axon conductance simulation",
    "cross-runtime and bounded fixed-point fidelity studies",
]
hardware_fit = [
    "bounded compiler-generated Q16.16 event-count accelerator for the RK4 schema profile",
]
behavior_tags = [
    "excitable",
    "irregular",
    "phasic",
]

[provenance]
authors = [
    "Hodgkin, A.L. & Huxley, A.F.",
]
year = 1952
doi = "10.1113/jphysiol.1952.sp004764"

[state.v]
init = -65.0

[state.m]
init = 0.05

[state.h]
init = 0.6

[state.n]
init = 0.32

[parameters.c_m]
default = 1.0
unit = "uF/cm^2"
meaning = "membrane capacitance"
range = [
    0.5,
    2.0,
]
biological_range = [
    0.8,
    1.2,
]

[parameters.g_na]
default = 120.0
unit = "mS/cm^2"
meaning = "maximal sodium conductance"
range = [
    0.0,
    200.0,
]

[parameters.g_k]
default = 36.0
unit = "mS/cm^2"
meaning = "maximal potassium conductance"
range = [
    0.0,
    100.0,
]

[parameters.g_l]
default = 0.3
unit = "mS/cm^2"
meaning = "leak conductance"
range = [
    0.0,
    5.0,
]

[parameters.e_na]
default = 50.0
unit = "mV"
meaning = "sodium reversal potential"
range = [
    30.0,
    70.0,
]

[parameters.e_k]
default = -77.0
unit = "mV"
meaning = "potassium reversal potential"
range = [
    -100.0,
    -60.0,
]

[parameters.e_l]
default = -54.4
unit = "mV"
meaning = "leak reversal potential"
range = [
    -70.0,
    -40.0,
]

[parameters.v_threshold]
default = 0.0
unit = "mV"
meaning = "voltage at which a spike is registered"
range = [
    -20.0,
    20.0,
]

[integration]
dt = 0.01
method = "baseline_euler"

[dynamics]
v = "(-g_Na * m**3 * h * (v - E_Na) - g_K * n**4 * (v - E_K) - g_L * (v - E_L) + I) / C"
m = "0.1 * (v + 40) / (1 - exp(-(v + 40) / 10)) * (1 - m) - 4 * exp(-(v + 65) / 18) * m"
h = "0.07 * exp(-(v + 65) / 20) * (1 - h) - 1 / (1 + exp(-(v + 35) / 10)) * h"
n = "0.01 * (v + 55) / (1 - exp(-(v + 55) / 10)) * (1 - n) - 0.125 * exp(-(v + 65) / 80) * n"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust_engine]
status = "implemented"
parity = "ulp-bounded"

[backends.rust_safety]
status = "implemented"
parity = "ulp-bounded"

[backends.go]
status = "implemented"
parity = "ulp-bounded"

[backends.julia]
status = "implemented"
parity = "ulp-bounded"

[backends.mojo]
status = "implemented"
parity = "approximate"

[reproducibility]
