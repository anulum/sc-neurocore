notes = "The original 1952 rest-relative voltage is shifted into the maintained modern absolute-voltage coordinate. The default production profile is gate-first explicit Euler; paired schemas and compiler RTL intentionally represent the separate simultaneous-RK4 profile. Both use 100 dt=0.01 substeps per sampled one-millisecond macro step."

