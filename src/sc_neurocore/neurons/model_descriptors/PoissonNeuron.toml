[metadata]
schema_version = 2
name = "Poisson"
class_name = "PoissonNeuron"
module = "poisson"
display_name = ""
summary = "Poisson spike generator — stochastic input layer at rate lambda"
family = "Statistical"
category = "statistical"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "excitable",
    "stochastic",
]

[provenance]
authors = [
    "Gerstner, W. et al.",
]
year = 2014
doi = "10.1017/CBO9781107447615"

[state]

[parameters.rate_hz]
default = 100.0
unit = "Hz"
meaning = "mean firing rate of the Poisson spike process"
range = [
    0.0,
    1000.0,
]

[parameters.dt_ms]
default = 1.0
unit = "ms"
meaning = "timestep used to convert the rate to a per-step spike probability"
range = [
    0.01,
    10.0,
]

[integration]
dt = 0.1
method = "euler"

[dynamics]
phase = "rate_hz * dt_ms / 1000.0"

[backends.python]
status = "implemented"

[reproducibility]

[documentation]
slug = "models/poisson"
notes = ""
