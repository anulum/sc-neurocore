[metadata]
schema_version = 2
name = "ChayKeizerNeuron"
class_name = "ChayKeizerNeuron"
module = "chay_keizer"
display_name = "Chay-Keizer pancreatic beta-cell"
summary = "Five-state Chay-Keizer 1983 pancreatic beta-cell square-wave burster: a Hodgkin-Huxley calcium and potassium membrane with a calcium-activated potassium conductance whose slow cytosolic calcium variable packages spikes into bursts."
family = "Bursting"
category = "bursting"
biophysical_detail = "conductance"
maturity = "validated"
intended_use = [
    "education",
    "single-cell-dynamics",
]
hardware_fit = []
behavior_tags = [
    "excitable",
    "phasic",
    "tonic",
]

[provenance]
doi = "10.1016/S0006-3495(83)84384-7"
authors = [
    "Chay, T.R.",
    "Keizer, J.",
]
year = 1983
paper_title = "Minimal model for membrane oscillations in the pancreatic beta-cell"

[state.v]
init = -54.774
unit = "mV"
meaning = "membrane potential"

[state.m]
init = 0.029725
unit = "1"
meaning = "calcium-current activation gate"

[state.h]
init = 0.747865
unit = "1"
meaning = "calcium-current inactivation gate"

[state.n]
init = 0.061079
unit = "1"
meaning = "delayed-rectifier potassium activation gate"

[state.ca]
init = 0.8
unit = "uM"
meaning = "free cytosolic calcium concentration"

[parameters.g_ca]
default = 6.5
unit = "mS/cm^2"
meaning = "maximal calcium conductance"
range = [
    0.0,
    50.0,
]

[parameters.g_k]
