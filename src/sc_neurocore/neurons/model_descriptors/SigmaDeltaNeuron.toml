[metadata]
schema_version = 2
name = "SigmaDeltaNeuron"
class_name = "SigmaDeltaNeuron"
module = "sigma_delta"
display_name = "Yoon sampled asynchronous pulse sigma-delta encoder"
summary = "Clocked APSDM specialization with integrating prefilter, unipolar upper-threshold events, and exponential reconstruction feedback."
family = "Hardware / neuromorphic"
category = "hardware-neuromorphic"
biophysical_detail = "point"
maturity = "validated"
intended_use = ["source-equation signal encoding", "cross-runtime state validation"]
hardware_fit = ["bounded one-encoder fixed-point co-simulation"]
behavior_tags = ["event-driven", "unipolar", "rate-coded"]

[provenance]
authors = ["Yoon, Y. C."]
year = 2017
doi = "10.1109/TNNLS.2016.2526029"
paper_title = "LIF and simplified SRM neurons encode signals into spikes via a form of asynchronous pulse sigma-delta modulation"
url = "https://doi.org/10.1109/TNNLS.2016.2526029"
derivation_note = "Sampled specialization of WO2016022241A1 equations 20-27 and 40; paragraph 102 permits discrete-time versions. No exact continuous-time event timing is claimed."

[state.sigma]
init = 0.0
unit = "signal*time"
meaning = "integrating-prefilter output"
[state.reconstruction]
init = 0.0
unit = "signal*time"
meaning = "local exponentially decaying reconstruction"
[parameters.delta]
default = 1.0
unit = "signal*time"
meaning = "reconstruction quantum; upper threshold is delta/2"
range = [0.000001, 1000000.0]
[parameters.tau_reconstruction]
default = 10.0
unit = "sample-time"
meaning = "exponential reconstruction time constant"
range = [0.000001, 1000000.0]
[parameters.dt]
default = 0.1
unit = "sample-time"
meaning = "clocked specialization timestep"
range = [0.000001, 1000.0]

[integration]
dt = 0.1
method = "map"
[dynamics]
sigma = "sigma + dt * I"
reconstruction = "reconstruction * exp(-dt / tau_reconstruction) + (delta if sigma + dt * I - reconstruction * exp(-dt / tau_reconstruction) >= delta / 2 else 0)"
spike_flag = "1 if sigma + dt * I - reconstruction * exp(-dt / tau_reconstruction) >= delta / 2 else 0"

[backends.python]
status = "implemented"
parity = "exact"
[backends.rust]
status = "implemented"
parity = "ulp-bounded"
[backends.julia]
status = "implemented"
parity = "ulp-bounded"
[backends.go]
status = "implemented"
parity = "ulp-bounded"
[backends.mojo]
status = "implemented"
parity = "ulp-bounded"
[reproducibility]
reference_config = "src/sc_neurocore/neurons/reference_trace_data/sigma_delta_apsdm.json"
golden_trace_sha256 = "4c22a86d4fe810dad3d5a039717798c5183ff03e9f00d8317e5568a5ad5b8d99"
golden_citation = "doi:10.1109/TNNLS.2016.2526029; WO2016022241A1 equations 20-27, 40"
[documentation]
slug = "models/sigma_delta"
notes = "SCSigmaDeltaAccumulatorNeuron separately retains the historical bipolar project recurrence."
[validation]
dynamics_faithful = true
metric = "trajectory"
operating_point = "512-step independent equation receipt plus five-runtime parity"
tolerance = "events exact; complete floating-point state within absolute 2e-12"
evidence = "tests/test_model_sigma_delta_source_fidelity.py; tests/test_reference_sigma_delta.py; tests/test_sigma_delta_backend_dispatch.py"
[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosim_sigma_delta.py::test_sampled_apsdm_q3232_matches_integer_oracle"
target_tier = "H1"
terminal_reason = "Signed Q32.32 matches the bounded integer oracle, synthesizes in Yosys, and passes depth-12 CVC5 bounded safety. Timing, PPA, device evidence, and universal binary64 equivalence remain open."
