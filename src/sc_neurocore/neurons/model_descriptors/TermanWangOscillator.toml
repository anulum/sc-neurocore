[metadata]
schema_version = 2
name = "Terman-Wang"
class_name = "TermanWangOscillator"
module = "terman_wang"
display_name = ""
summary = "Terman & Wang 1995 relaxation oscillator for LEGION networks."
family = "Oscillator"
category = "oscillator"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "excitable",
    "phasic",
]

[provenance]
authors = [
    "Terman, D. & Wang, D.L.",
]
year = 1995
doi = "10.1016/0167-2789(94)00205-5"

[state.v]
init = -1.5

[state.w]
init = -0.5

[parameters.alpha]
default = 3.0
unit = "1"
meaning = "amplitude of the sigmoidal recovery nullcline"
range = [
    0.0,
    10.0,
]

[parameters.beta]
default = 0.2
unit = "1"
meaning = "voltage scale (steepness) of the tanh recovery activation"
range = [
    0.01,
    2.0,
]

[parameters.epsilon]
default = 0.02
unit = "1"
meaning = "timescale separation; small values give slow recovery"
range = [
    0.001,
    0.5,
]

[parameters.rho]
default = 0.0
unit = "1"
meaning = "constant baseline drive added to the fast variable"
range = [
    -5.0,
    5.0,
]

[parameters.v_peak]
default = 1.5
unit = "1"
meaning = "level on v at which a spike is registered"
range = [
    -5.0,
    5.0,
]

[integration]
dt = 0.05
method = "rk4"

[dynamics]
v = "3.0 * v - v * v * v + 2.0 - w + I + rho"
w = "epsilon * (alpha * (1.0 + tanh(v / beta)) - w)"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "exact"

[backends.julia]
status = "implemented"
parity = "ulp-bounded"

[backends.go]
status = "implemented"
parity = "ulp-bounded"

[backends.mojo]
status = "implemented"
parity = "ulp-bounded"

[reproducibility]
reference_config = "{\"n_steps\":1000,\"current\":2.0,\"backend\":\"python\",\"parameters\":\"defaults\"}"
golden_trace_sha256 = "7d0b5c40be78da5cb1b68d379c986a33897219e94d8789ed349154b2bb20f387"

[documentation]
slug = "models/terman_wang"
notes = ""

[validation]
dynamics_faithful = true
metric = "parity"
operating_point = "schema-DSL Terman-Wang two-state RK4 relaxation oscillator"
tolerance = "exact three-way spike-count parity at I=-1.0, 0.0, and 0.5 over 8000 steps"
evidence = "tests/test_cosimulation.py::TestQ1616Precision::test_terman_wang_q1616_parity"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosimulation.py::TestQ1616Precision::test_terman_wang_q1616_parity"
target_tier = "H1"
terminal_reason = "Point-neuron schema→RTL path; higher silicon rungs need synthesis, timing, and equivalence programmes."
