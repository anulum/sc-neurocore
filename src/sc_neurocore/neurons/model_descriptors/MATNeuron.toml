[metadata]
schema_version = 2
name = "MATNeuron"
class_name = "MATNeuron"
module = "mat"
display_name = ""
summary = "Kobayashi 2009 — Multi-timescale Adaptive Threshold."
family = "Integrate-and-Fire"
category = "integrate-and-fire"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = []

[provenance]
authors = [
    "Kobayashi, R., Tsubo, Y. & Shinomoto, S.",
]
year = 2009
doi = "10.3389/neuro.10.009.2009"

[state.v]
init = -70.0

[state.theta1]
init = 0.0

[state.theta2]
init = 0.0

[parameters.v_rest]
default = -70.0
unit = "mV"
meaning = "resting / leak reversal potential"
range = [
    -90.0,
    -40.0,
]

[parameters.v_reset]
default = -70.0
unit = "mV"
meaning = "membrane potential reset to after a spike"
range = [
    -90.0,
    -40.0,
]

[parameters.v_threshold_base]
default = -50.0
unit = "mV"
meaning = "baseline (resting) value of the adaptive threshold"
range = [
    -60.0,
    -20.0,
]

[parameters.tau_m]
default = 10.0
unit = "ms"
meaning = "membrane time constant"
range = [
    1.0,
    100.0,
]

[parameters.tau_1]
default = 10.0
unit = "ms"
meaning = "fast threshold-kernel time constant"
range = [
    1.0,
    100.0,
]

[parameters.tau_2]
default = 200.0
unit = "ms"
meaning = "slow threshold-kernel time constant"
range = [
    10.0,
    1000.0,
]

[parameters.h1]
default = 5.0
unit = "mV"
meaning = "amplitude added to the fast threshold component at each spike"
range = [
    0.0,
    50.0,
]

[parameters.h2]
default = 3.0
unit = "mV"
meaning = "amplitude added to the slow threshold component at each spike"
range = [
    0.0,
    50.0,
]

[parameters.resistance]
default = 1.0
unit = "1"
meaning = "normalised membrane resistance (R=1 in the project's normalised-current convention)"
range = [
    0.0,
    100.0,
]

[integration]
dt = 1.0
method = "euler"

[dynamics]

[backends.python]
status = "implemented"

[reproducibility]

[documentation]
slug = "models/mat"
notes = ""
