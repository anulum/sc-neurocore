[documentation]
slug = "models/ttype_ca_neuron"
notes = "Composite of the Wang-Buzsáki 1996 spiking base with a low-voltage-activated T-type calcium current per the Huguenard 1996 review and the Destexhe-Bal-McCormick-Sejnowski 1996 thalamic modelling lineage; the threshold-reset event and the spike-triggered inactivation collapse (s *= 0.3) are repository-specific specialisations, not a publication-exact recurrence. Mojo and silicon lanes are not implemented."

[validation]
dynamics_faithful = true
metric = "trajectory"
operating_point = "64 deterministic non-constant drives plus 1000 steps at I=5"
