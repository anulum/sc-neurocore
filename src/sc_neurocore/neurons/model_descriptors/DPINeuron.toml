[metadata]
schema_version = 2
name = "DPINeuron"
class_name = "DPINeuron"
module = "dpi_neuron"
display_name = "Indiveri-Stefanini-Chicca 2010 DPI circuit"
summary = "Source-aligned current-mode adaptive integrate-and-fire circuit with coupled membrane, positive-feedback, and after-hyperpolarisation DPIs."
family = "Hardware / neuromorphic"
category = "hardware-neuromorphic"
biophysical_detail = "point"
maturity = "validated"
intended_use = [
    "normalised current-mode neuromorphic dynamics",
    "source-equation, backend-parity, and fixed-point studies",
]
hardware_fit = [
    "Q16.16 equation-compiler core with a disclosed operating envelope",
]
behavior_tags = [
    "adapting",
    "excitable",
    "rate-coded",
    "tonic",
]

[provenance]
authors = [
    "Indiveri, G., Stefanini, F. & Chicca, E.",
]
year = 2010
doi = "10.1109/ISCAS.2010.5536980"
paper_title = "Spike-based learning with a generalized integrate and fire silicon neuron"
source_scope = "Equations (2)-(3), plus the described threshold feedback, reset, refractory pulse, and spike-driven adaptation. Normalised defaults and the discrete recurrence are maintained choices."

[state.i_mem]
init = 0.01
unit = "normalised current"
meaning = "membrane DPI output current"

[state.i_ahp]
init = 0.01
unit = "normalised current"
meaning = "after-hyperpolarisation adaptation DPI current"

[state.refractory_time]
init = 0.0
unit = "normalised time"
meaning = "remaining spike/refractory pulse duration"

[parameters.i_threshold]
default = 1.0
unit = "normalised current"
meaning = "post-Euler membrane-current event threshold"
range = [
    0.001,
    100.0,
]

[parameters.i_reset]
default = 0.01
unit = "normalised current"
meaning = "membrane current held during the refractory pulse"
range = [
    1e-06,
    10.0,
]

[parameters.i_rest]
default = 0.1
unit = "normalised current"
meaning = "constant resting input current added to injected drive"
range = [
    0.0,
    100.0,
]

[parameters.i_tau]
default = 1.0
unit = "normalised current"
meaning = "membrane DPI leakage current"
range = [
    1e-06,
    100.0,
]

[parameters.i_g]
default = 1.0
unit = "normalised current"
meaning = "membrane input saturation current"
range = [
    1e-06,
    100.0,
]

[parameters.i_tau_ahp]
default = 0.1
unit = "normalised current"
meaning = "adaptation DPI leakage current"
range = [
    1e-06,
    100.0,
]

[parameters.i_ga]
default = 1.0
unit = "normalised current"
meaning = "adaptation input saturation current"
range = [
    1e-06,
    100.0,
]

[parameters.i_spike]
default = 5.0
unit = "normalised current"
meaning = "current injected into the adaptation DPI while the spike pulse is active"
range = [
    1e-06,
    1000.0,
]

[parameters.i_0]
default = 0.01
unit = "normalised current"
meaning = "subthreshold transistor reference current in the positive-feedback term"
range = [
    1e-06,
    100.0,
]

[parameters.kappa]
default = 0.7
unit = "1"
meaning = "subthreshold slope factor"
range = [
    0.01,
    1.0,
]

[parameters.alpha]
default = 10.0
unit = "1 / normalised current"
meaning = "inverter transition steepness in the positive-feedback gate"
range = [
    0.01,
    1000.0,
]

[parameters.tau]
default = 20.0
unit = "normalised time"
meaning = "membrane DPI time constant"
range = [
    0.001,
    10000.0,
]

[parameters.tau_ahp]
default = 100.0
unit = "normalised time"
meaning = "adaptation DPI time constant"
range = [
    0.001,
    100000.0,
]

[parameters.refractory_period]
default = 2.0
unit = "normalised time"
meaning = "spike pulse duration that drives adaptation and holds the membrane reset"
range = [
    0.001,
    1000.0,
]

[integration]
dt = 0.1
method = "euler"

[dynamics]
i_mem = "Eq. (3): i_mem/(tau*i_tau) * ((i_rest+I)/(1+i_mem/i_g) - i_tau + i_fb - i_ahp), with i_fb from Eq. (2); held at i_reset during the pulse"
i_ahp = "Eq. (3): i_ahp/(tau_ahp*i_tau_ahp) * (i_spike*r(t)/(1+i_ahp/i_ga) - i_tau_ahp)"
refractory_time = "decrement by dt to zero; load refractory_period on a post-Euler threshold event"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "ulp-bounded"

[backends.julia]
status = "implemented"
parity = "ulp-bounded"

[backends.go]
status = "implemented"
parity = "ulp-bounded"

[backends.mojo]
status = "implemented"
parity = "ulp-bounded"

[reproducibility]
reference_config = "src/sc_neurocore/neurons/reference_receipts/dpi_indiveri_stefanini_chicca_2010.json"
golden_trace_sha256 = "ceb66bc27829b1271a94aafa20efdb30a6e5e4b063790a556e17a3e37a3cd28d"
golden_citation = "src/sc_neurocore/neurons/reference_receipts/dpi_indiveri_stefanini_chicca_2010.json"

[documentation]
slug = "models/dpi_neuron"
notes = "The maintained normalised current-domain model implements the full coupled right-hand sides of Indiveri, Stefanini, and Chicca (2010), Eqs. (2)-(3), including nonlinear positive feedback, spike-triggered adaptation, and the refractory pulse. It is not a transistor-layout, mismatch, timing, power, or bit-true fabricated-chip model. Generated Q16.16 RTL preserves the equations with fixed-point division and compiler LUT approximations whose measured envelope is reported explicitly."

[validation]
dynamics_faithful = true
metric = "parity"
operating_point = "PDF-bound complete-state receipt at I=5 for 5000 steps; float backends at I=-0.1/0/1/2/3/5/10/20/50 for 1000 steps plus a full 18-field configured trace; paired schemas and generated Q16.16 RTL at I=5 for 5000 steps"
tolerance = "receipt input/state/event digests exact; compiled event vectors exact and all float states <=5e-13 absolute; hand/schema states <=1e-13; Q16.16 events exact over 5000 steps, first event within 3 steps, and pre-event i_mem/i_ahp envelopes <=0.0032/0.0006"
evidence = "tests/test_reference_dpi_neuron.py::test_dpi_source_receipt_matches_independent_complete_orbit; tests/test_dpi_neuron_backends_backend_parity.py::test_complete_configured_contract_matches_python"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosim_dpi_neuron.py::test_q1616_rtl_preserves_events_and_measured_state_envelope"
synthesised = true
synth_report = "hdl/reports/yosys_dpi_neuron_q1616_2026-08-30.json"
target_device = "generic RTL (Yosys coarse synthesis)"
target_tier = "H2"
terminal_reason = "The nonlinear Q16.16 core, event/state co-simulation, 112953-cell Yosys coarse synthesis, and depth-8 fixed-drive spike/reset/refractory safety close H2; timing, PPA, board, physical silicon, transistor mismatch, and universal formal equivalence remain open."
