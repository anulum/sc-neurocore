[metadata]
schema_version = 2
name = "SKNeuron"
class_name = "SKNeuron"
module = "sk_neuron"
display_name = ""
summary = "SK (Small Conductance Ca²⁺-Activated K⁺) channel neuron."
family = "Ion-channel"
category = "ion-channel"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "bursting",
    "chaotic",
    "excitable",
    "phasic",
    "rate-coded",
    "tonic",
]

[provenance]
authors = [
    "Stocker, M.",
]
year = 2004
doi = "10.1038/nrn1516"

[state.v]
init = -65.0

[state.h]
init = 0.6

[state.n]
init = 0.32

[state.ca]
init = 0.0

[parameters.g_na]
default = 35.0
unit = "mS/cm^2"
meaning = "maximal sodium conductance"
range = [
    0.0,
    200.0,
]

[parameters.g_k]
default = 9.0
unit = "mS/cm^2"
meaning = "maximal delayed-rectifier potassium conductance"
range = [
    0.0,
    100.0,
]

[parameters.g_sk]
default = 2.0
unit = "mS/cm^2"
meaning = "maximal small-conductance calcium-activated potassium (SK) conductance"
range = [
    0.0,
    50.0,
]

[parameters.g_l]
default = 0.1
unit = "mS/cm^2"
meaning = "leak conductance"
range = [
    0.0,
    5.0,
]

[parameters.e_na]
default = 55.0
unit = "mV"
meaning = "sodium reversal potential"
range = [
    30.0,
    70.0,
]

[parameters.e_k]
default = -90.0
unit = "mV"
meaning = "potassium reversal potential"
range = [
    -100.0,
    -70.0,
]

[parameters.e_l]
default = -65.0
unit = "mV"
meaning = "leak reversal potential"
range = [
    -80.0,
    -40.0,
]

[parameters.c_m]
default = 1.0
unit = "uF/cm^2"
meaning = "membrane capacitance"
range = [
    0.5,
    2.0,
]

[parameters.phi]
default = 5.0
unit = "1"
meaning = "temperature scaling factor of the gating kinetics"
range = [
    0.5,
    10.0,
]

[parameters.tau_ca]
default = 150.0
unit = "ms"
meaning = "calcium removal time constant"
range = [
    10.0,
    2000.0,
]

[parameters.v_threshold]
default = -20.0
unit = "mV"
meaning = "voltage at which a spike is registered"
range = [
    -20.0,
    20.0,
]

[parameters.gain]
default = 1.0
unit = "1"
meaning = "gain applied to the injected input current"
range = [
    0.0,
    10.0,
]

[integration]
dt = 0.5
method = "euler"

[dynamics]
alpha_m = "0.1 * (v + 35) / (1 - exp(-(v + 35) / 10))"
beta_m = "4 * exp(-(v + 60) / 18)"
m_inf = "alpha_m / (alpha_m + beta_m)"
dh_dt = "phi * (0.07 * exp(-(v + 58) / 20) * (1 - h) - h / (1 + exp(-(v + 28) / 10)))"
dn_dt = "phi * (0.01 * (v + 34) / (1 - exp(-(v + 34) / 10)) * (1 - n) - 0.125 * exp(-(v + 44) / 80) * n)"
sk_inf = "ca^2 / (ca^2 + 0.25); evaluated from the pre-decay ca of the same sub-step"
dca_dt = "-ca / tau_ca; plus a +0.2 increment immediately after each threshold reset"
dv_dt = "(-g_na * m_inf^3 * h * (v - e_na) - g_k * n^4 * (v - e_k) - g_sk * sk_inf * (v - e_k) - g_l * (v - e_l) + gain * I) / c_m"
event = "v_next >= v_threshold; reset v to -65, then ca += 0.2, preserving h and n"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "ulp-bounded"

[backends.go]
status = "implemented"
parity = "ulp-bounded"

[backends.julia]
status = "implemented"
parity = "ulp-bounded"

[reproducibility]
reference_config = "{\"n_steps\":1000,\"current\":5.0,\"parameters\":\"defaults\"}"
golden_trace_sha256 = "a4a7a51ceebfb55d8f183ccbf7ea637944b94f821c6d45e7b249bc0f5ea3b137"
event_count = 5
final_state = "{\"v\":-78.54410136446847,\"h\":0.9688809026046244,\"n\":0.02633986417448006,\"ca\":0.30688701422932596}"

[documentation]
slug = "models/sk_neuron"
notes = "Composite of the Wang-Buzsáki 1996 spiking base with a calcium-only SK (KCa2.x) Hill activation grounded in the Stocker 2004 review; the threshold-reset event, the spike-triggered ca increment, and the Hill constants are repository-specific specialisations, not a publication-exact recurrence. The ca state is bounded below at zero with no artificial upper bound. Mojo and silicon lanes are not implemented."

[validation]
dynamics_faithful = true
metric = "trajectory"
operating_point = "64 deterministic non-constant drives plus 1000 steps at I=5"
