[metadata]
schema_version = 2
name = "Ermentrout-Kopell Theta Euler Map"
class_name = "ErmentroutKopellMapNeuron"
module = "ermentrout_kopell_map_neuron"
display_name = ""
summary = "Forward-Euler implementation of the Ermentrout-Kopell 1986 canonical Type-I theta neuron on a circular phase domain."
family = "Phase model"
category = "map-based"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "chaotic",
    "excitable",
    "tonic",
]

[provenance]
authors = [
    "Ermentrout, G.B. & Kopell, N.",
]
year = 1986
doi = "10.1137/0146017"

[state.theta]
init = 0.0

[parameters.gain]
default = 1.0
unit = "1"
meaning = "input gain applied to the phase advance"
range = [
    0.0,
    10.0,
]

[parameters.theta_threshold]
default = 3.141592653589793
unit = "1"
meaning = "phase value at which a spike is registered"
range = [
    0.0,
    6.2832,
]

[integration]
dt = 0.1
method = "map"

[dynamics]
theta = "(theta + 0.1 * ((1.0 - cos(theta)) + (1.0 + cos(theta)) * gain * I)) % 6.283185307179586"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "exact"

[backends.julia]
status = "implemented"
parity = "ulp-bounded"

[backends.go]
status = "implemented"
parity = "ulp-bounded"

[backends.mojo]
status = "implemented"
parity = "ulp-bounded"

[reproducibility]
