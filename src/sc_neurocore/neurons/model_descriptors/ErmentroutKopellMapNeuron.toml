[metadata]
schema_version = 2
name = "Ermentrout-Kopell Theta Euler Map"
class_name = "ErmentroutKopellMapNeuron"
module = "ermentrout_kopell_map_neuron"
display_name = ""
summary = "Forward-Euler implementation of the Ermentrout-Kopell 1986 canonical Type-I theta neuron on a circular phase domain."
family = "Phase model"
category = "map-based"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "chaotic",
    "excitable",
    "tonic",
]

[provenance]
authors = [
    "Ermentrout, G.B. & Kopell, N.",
]
year = 1986
doi = "10.1137/0146017"

[state.theta]
init = 0.0

[parameters.gain]
default = 1.0
unit = "1"
meaning = "input gain applied to the phase advance"
range = [
    0.0,
    10.0,
]

[parameters.theta_threshold]
default = 3.141592653589793
unit = "1"
meaning = "phase value at which a spike is registered"
range = [
    0.0,
    6.2832,
]

[integration]
dt = 0.1
method = "map"

[dynamics]
theta = "(theta + 0.1 * ((1.0 - cos(theta)) + (1.0 + cos(theta)) * gain * I)) % 6.283185307179586"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "exact"

[backends.julia]
status = "implemented"
parity = "ulp-bounded"

[backends.go]
status = "implemented"
parity = "ulp-bounded"

[backends.mojo]
status = "implemented"
parity = "ulp-bounded"

[reproducibility]
reference_config = "{\"n_steps\":1000,\"current\":2.0,\"backend\":\"python\",\"parameters\":\"defaults\"}"
golden_trace_sha256 = "a1a8eb94a2a3318964722901c46b7006533780e790ae7c666df43961b1a8a113"

[documentation]
slug = "models/ermentrout_kopell_map"
notes = "The sourced 1986 object is the continuous theta equation. dt=0.1, gain, forward Euler, modulo 2*pi, and the pi event convention are maintained implementation choices, so the schema lowers the complete recurrence with method=map rather than presenting it as a paper-discrete map. The 'chaotic' behaviour tag is a controlled-vocabulary label for the measured pattern under extreme drive only (reproducible high-ISI-variability at I=256 and I=1024 in the coarse forward-Euler sweep); it does NOT assert Lyapunov chaos. The canonical theta flow remains non-chaotic in the bounded regime; at I=1/4/16/64 the measured behaviour is tonic."

[validation]
dynamics_faithful = true
metric = "parity"
operating_point = "Maintained theta-Euler recurrence over 2000 steps: independent I=0.5 reference; hand/TOML/JSON varied drive; Q16.16 at I=-0.5,0.5,1.0"
tolerance = "hand/TOML/JSON states and events exact; Q16.16 spike counts 0/45/64 exact with maximum circular phase error below 0.081/0.089/0.025 rad; event timing and full fixed-point trajectories not claimed exact"
evidence = "tests/test_cosim_ermentrout_kopell_map_neuron.py::test_q1616_class_correct_spike_count_and_circular_phase_bound; tests/test_reference_ermentrout_kopell_map_neuron.py"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosim_ermentrout_kopell_map_neuron.py::test_q1616_class_correct_spike_count_and_circular_phase_bound; tests/test_bit_true_cosim.py"
target_tier = "H1"
terminal_reason = "The point-phase recurrence has bounded Q16.16 class-metric co-simulation; higher rungs require synthesis, timing, and equivalence programmes."
