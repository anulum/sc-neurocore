golden_trace_sha256 = "c1b69af1044da32f42874cc6129bfed5548bdfe5fbab5771f2224b223e3de3db"
golden_citation = "src/sc_neurocore/neurons/reference_receipts/ermentrout_kopell_1986.json"

[documentation]
slug = "models/ermentrout_kopell_map"
notes = "The sourced 1986 object is the continuous theta equation. dt=0.1, gain, forward Euler, modulo 2*pi, and the pi event convention are maintained implementation choices, so the schema lowers the complete recurrence with method=map rather than presenting it as a paper-discrete map. The canonical one-dimensional theta flow is non-chaotic; coarse-Euler instability under extreme out-of-regime drive is numerical behaviour and is not advertised as a source-model property."

[validation]
dynamics_faithful = true
metric = "parity"
operating_point = "Maintained theta-Euler recurrence over 2000 steps: independent I=0.5 reference; hand/TOML/JSON varied drive; Q16.16 at I=-0.5,0.5,1.0"
tolerance = "hand/TOML/JSON states and events exact; Q16.16 spike counts 0/45/64 exact with maximum circular phase error below 0.081/0.089/0.025 rad; event timing and full fixed-point trajectories not claimed exact"
evidence = "tests/test_cosim_ermentrout_kopell_map_neuron.py::test_q1616_class_correct_spike_count_and_circular_phase_bound; tests/test_reference_ermentrout_kopell_map_neuron.py"

