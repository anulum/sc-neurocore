# SC-NeuroCore — source-faithful Brunel-Wang 2001 pyramidal-cell descriptor

[metadata]
schema_version = 2
name = "BrunelWangNeuron"
class_name = "BrunelWangNeuron"
module = "brunel_wang"
display_name = "Brunel-Wang pyramidal cell"
summary = "Conductance-based pyramidal LIF cell with external/recurrent AMPA, voltage-dependent NMDA, GABA, and midpoint-RK2 integration."
family = "Rate / mean-field"
category = "rate-mean-field"
biophysical_detail = "point"
maturity = "validated"
intended_use = ["single-cell conductance response", "pre-aggregated cortical channel replay", "cross-runtime trajectory validation"]
hardware_fit = ["one-cell Q16.16 co-simulation with four aggregate gates"]
behavior_tags = ["excitable", "spiking", "tonic"]

[provenance]
authors = ["Brunel, N. & Wang, X.-J."]
year = 2001
doi = "10.1023/A:1011204814320"
paper_title = "Effects of Neuromodulation in a Cortical Network Model of Object Working Memory Dominated by Recurrent Inhibition"
url = "https://doi.org/10.1023/A:1011204814320"
derivation_note = "Methods 2.2--2.3 excitatory pyramidal-cell specialization. Four external aggregate gates are held fixed over one 0.1 ms midpoint-RK2 step; presynaptic channel kinetics and network connectivity remain outside this object."

[state.v]
init = -70.0
unit = "mV"
meaning = "membrane voltage"

[state.ref_remaining]
init = 0.0
unit = "ms"
meaning = "absolute refractory time remaining"

[parameters.v_rest]
default = -70.0
unit = "mV"
meaning = "leak reversal potential"
range = [-100.0, 20.0]
[parameters.v_reset]
default = -55.0
unit = "mV"
meaning = "post-event reset voltage"
range = [-100.0, 20.0]
[parameters.v_threshold]
default = -50.0
unit = "mV"
meaning = "event threshold"
range = [-100.0, 50.0]
[parameters.tau_m]
default = 20.0
unit = "ms"
meaning = "pyramidal membrane time constant from C_m/g_m"
range = [0.000001, 1000000.0]
[parameters.tau_ref]
default = 2.0
unit = "ms"
meaning = "absolute refractory period"
range = [0.000001, 1000000.0]
[parameters.tau_ampa]
default = 2.0
unit = "ms"
meaning = "source AMPA decay constant retained for network adapters"
range = [0.000001, 1000000.0]
[parameters.tau_nmda_rise]
default = 2.0
unit = "ms"
meaning = "source NMDA rise constant retained for network adapters"
range = [0.000001, 1000000.0]
[parameters.tau_nmda_decay]
default = 100.0
unit = "ms"
meaning = "source NMDA decay constant retained for network adapters"
range = [0.000001, 1000000.0]
[parameters.tau_gaba]
default = 10.0
unit = "ms"
meaning = "source GABA decay constant retained for network adapters"
range = [0.000001, 1000000.0]
[parameters.g_ampa_ext]
default = 2.08
unit = "nS"
meaning = "external AMPA conductance per aggregate gate"
range = [0.0, 1000.0]
[parameters.g_ampa_rec]
default = 0.104
unit = "nS"
meaning = "recurrent AMPA conductance per aggregate gate"
range = [0.0, 1000.0]
[parameters.g_nmda]
default = 0.327
unit = "nS"
meaning = "recurrent NMDA conductance per aggregate gate"
range = [0.0, 1000.0]
[parameters.g_gaba]
default = 1.25
unit = "nS"
meaning = "GABA conductance per aggregate gate"
range = [0.0, 1000.0]
[parameters.v_ampa]
default = 0.0
unit = "mV"
meaning = "AMPA reversal potential"
range = [-100.0, 100.0]
[parameters.v_nmda]
default = 0.0
unit = "mV"
meaning = "NMDA reversal potential"
range = [-100.0, 100.0]
[parameters.v_gaba]
default = -70.0
unit = "mV"
meaning = "GABA reversal potential"
range = [-150.0, 50.0]
[parameters.C_m]
default = 0.5
unit = "nF"
meaning = "pyramidal membrane capacitance"
range = [0.000001, 1000.0]
[parameters.mg_conc]
default = 1.0
unit = "mM"
meaning = "extracellular magnesium concentration in the NMDA block"
range = [0.0, 100.0]

[integration]
dt = 0.1
method = "midpoint-rk2"

[dynamics]
membrane = "dV/dt=-(V-V_L)/tau_m+(I_AMPA_ext+I_AMPA_rec+I_NMDA+I_GABA)/C_m"
ampa = "I_AMPA=-g_AMPA*(V-V_AMPA)*s_AMPA"
nmda = "I_NMDA=-g_NMDA*(V-V_NMDA)*s_NMDA/(1+[Mg]/3.57*exp(-0.062*V))"
gaba = "I_GABA=-g_GABA*(V-V_GABA)*s_GABA"
event = "candidate>=V_threshold; then V=V_reset and ref_remaining=tau_ref"
scope = "Excitatory single-cell membrane specialization with four pre-aggregated non-negative gates; synaptic kinetics, Poisson drive, connectivity, and persistent network activity are excluded."

[backends.python]
status = "implemented"
parity = "exact"
[backends.rust]
status = "implemented"
parity = "ulp-bounded"
[backends.julia]
status = "implemented"
parity = "ulp-bounded"
[backends.go]
status = "implemented"
parity = "ulp-bounded"
[backends.mojo]
status = "implemented"
parity = "approximate"

[reproducibility]
reference_config = "{\"kind\":\"sampled_batch_v1\",\"v\":-70.0,\"v_rest\":-70.0,\"v_reset\":-55.0,\"v_threshold\":-50.0,\"tau_m\":20.0,\"tau_ref\":2.0,\"g_ampa_ext\":2.08,\"g_ampa_rec\":0.104,\"g_nmda\":0.327,\"g_gaba\":1.25,\"v_ampa\":0.0,\"v_nmda\":0.0,\"v_gaba\":-70.0,\"C_m\":0.5,\"mg_conc\":1.0,\"dt\":0.1,\"n_steps\":256,\"simulate_fields\":[\"i_ampa_ext\",\"s_ampa_rec\",\"s_nmda_rec\",\"s_gaba\"],\"inputs\":{\"i_ampa_ext\":{\"function\":\"sin\",\"offset\":0.053,\"amplitude\":0.018,\"angular_frequency\":0.071},\"s_ampa_rec\":{\"function\":\"cos\",\"offset\":0.17,\"amplitude\":0.05,\"angular_frequency\":0.053},\"s_nmda_rec\":{\"function\":\"sin\",\"offset\":0.12,\"amplitude\":0.04,\"angular_frequency\":0.037,\"phase\":0.2},\"s_gaba\":{\"function\":\"cos\",\"offset\":0.05,\"amplitude\":0.02,\"angular_frequency\":0.089}},\"trace_fields\":[\"voltages\",\"refractory\",\"events\"]}"
golden_trace_sha256 = "47b0a4d0a780581dfbfa75954cfb5dfaa4ee2845434765ffc37a7f47e8334dce"
golden_citation = "doi:10.1023/A:1011204814320; primary PDF sha256 dea3a8debf667ab1d195d7cc93150d0f3aca0d6b44a2f8f8869212a1fbf39038"

[documentation]
slug = "models/brunel_wang"
notes = "The tau_* channel constants document the retained source/network boundary but are not integrated by the single-cell object. BrunelNetwork remains a separate retained model."

[validation]
dynamics_faithful = true
metric = "trajectory"
operating_point = "256 varied four-gate steps with ten source-equation events plus configured 128-step five-runtime parity"
tolerance = "Rust, Julia, and Go <=2e-12; Mojo <=2e-10; events exact"
evidence = "tests/test_reference_brunel_wang.py; tests/test_brunel_wang_backends.py; tests/test_cosim_brunel_wang.py"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosim_brunel_wang.py::test_q1616_rtl_tracks_the_schema_oracle"
target_tier = "H1"
terminal_reason = "The hand Q16.16 single-cell datapath matches its integer oracle, preserves events at the enrolled trace, synthesizes in Yosys, and carries a depth-4 bounded safety job. Timing, PPA, device validation, and formal equivalence to binary64 remain open."
