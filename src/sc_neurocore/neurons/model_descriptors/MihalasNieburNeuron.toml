[metadata]
schema_version = 2
name = "Mihalas-Niebur generalised integrate-and-fire"
class_name = "MihalasNieburNeuron"
module = "mihalas_niebur"
display_name = "Mihalas-Niebur generalised integrate-and-fire neuron"
summary = "Four-state linear flow with an adaptive threshold, two spike-induced currents, and the published event map"
family = "Integrate-and-Fire"
category = "integrate-and-fire"
biophysical_detail = "point"
maturity = "validated"
intended_use = [
    "source-faithful fixed-grid simulation",
    "cross-runtime and fixed-point validation",
]
hardware_fit = [
    "bounded signed Q32.32 co-simulation",
]
behavior_tags = [
    "excitable",
    "rate-coded",
    "tonic",
]

[provenance]
authors = [
    "Mihalaş, Ş. & Niebur, E.",
]
year = 2009
doi = "10.1162/neco.2008.12-07-680"
paper_title = "A generalized linear integrate-and-fire neural model produces diverse spiking behaviors"
derivation_note = "Equations 2.1-2.2 with currents divided by capacitance and Table 1 rates converted from s^-1 to ms^-1; fixed-grid RK4 and sampled event detection are explicit numerical specialisations."

[state.v]
init = -0.07

[state.theta]
init = -0.05

[state.i1]
init = 0.0

[state.i2]
init = 0.0

[parameters.v_rest]
default = -0.07
unit = "V"
meaning = "leak reversal potential E_L"
range = [
    -1.0,
    1.0,
]

[parameters.v_reset]
default = -0.07
unit = "V"
meaning = "published event-reset voltage V_r"
range = [
    -1.0,
    1.0,
]

[parameters.theta_reset]
default = -0.06
unit = "V"
meaning = "published lower threshold reset Theta_r"
range = [
    -1.0,
    1.0,
]

[parameters.theta_inf]
default = -0.05
unit = "V"
meaning = "stationary threshold Theta_inf"
range = [
    -1.0,
    1.0,
]

[parameters.leak_rate]
default = 0.05
unit = "1/ms"
meaning = "capacitance-normalised leak rate G/C"
range = [
    1e-12,
    10.0,
]

[parameters.threshold_voltage_coupling]
default = 0.005
unit = "1/ms"
meaning = "voltage-to-threshold coupling a"
range = [
    -10.0,
    10.0,
]

[parameters.threshold_decay_rate]
default = 0.01
unit = "1/ms"
meaning = "threshold relaxation rate b"
range = [
    1e-12,
    10.0,
]

[parameters.current_decay_rate_1]
default = 0.2
unit = "1/ms"
meaning = "first spike-induced current decay rate k_1"
range = [
    1e-12,
    10.0,
]

[parameters.current_decay_rate_2]
default = 0.02
unit = "1/ms"
meaning = "second spike-induced current decay rate k_2"
range = [
    1e-12,
    10.0,
]

[parameters.current_retention_1]
default = 0.0
unit = "1"
meaning = "first event-map retention R_1"
range = [
    -100.0,
    100.0,
]

[parameters.current_retention_2]
default = 1.0
unit = "1"
meaning = "second event-map retention R_2"
range = [
    -100.0,
    100.0,
]

[parameters.current_jump_1]
default = 0.0
unit = "V/ms"
meaning = "capacitance-normalised first event-map jump A_1/C"
range = [
    -100.0,
    100.0,
]

[parameters.current_jump_2]
default = 0.0
unit = "V/ms"
meaning = "capacitance-normalised second event-map jump A_2/C"
range = [
    -100.0,
    100.0,
]

[integration]
dt = 0.1
method = "rk4"

[dynamics]
v = "I + i1 + i2 - leak_rate * (v - v_rest)"
theta = "threshold_voltage_coupling * (v - v_rest) - threshold_decay_rate * (theta - theta_inf)"
i1 = "-current_decay_rate_1 * i1"
i2 = "-current_decay_rate_2 * i2"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "exact"

[backends.julia]
status = "implemented"
parity = "exact"

[backends.go]
status = "implemented"
parity = "exact"

[backends.mojo]
status = "implemented"
parity = "ulp-bounded"

[reproducibility]
golden_trace_sha256 = "fa3871a113fc2b64d76f0fac8b547a34dbaf1bf054dcae7b65a4a42493e8d8d5"
reference_config = "src/sc_neurocore/neurons/reference_receipts/mihalas_niebur_2009.json"

[documentation]
slug = "models/mihalas_niebur"
notes = "The former candidate-proportional voltage reset is not equation 2.2 and remains count-neutral as SCScaledResetAdaptiveIFNeuron."

[validation]
dynamics_faithful = true
metric = "trajectory"
operating_point = "Table 1 common constants and panel M tonic-bursting parameters over 2000 source intervals"
tolerance = "binary64 state/event parity across Python, Rust, Julia and Go; Mojo ULP-bounded; Q32.32 complete event-vector equality and four-state error at most 1.3e-6"
evidence = "tests/test_model_mihalas_niebur.py; tests/test_mihalas_niebur_backends.py; tests/test_reference_mihalas_niebur.py; tests/test_cosim_mihalas_niebur.py"

[silicon]
compiles = true
cosim_validated = true
synthesised = true
cosim_evidence = "tests/test_cosim_mihalas_niebur.py"
synth_report = "hdl/reports/yosys_mihalas_niebur_q3232_2026-08-28.json"
target_device = "Xilinx 7-series (Yosys synth_xilinx)"
target_tier = "H2"
terminal_reason = "Bounded generated Q32.32 co-simulation, coarse synthesis, and formal port safety only; timing, PPA, board, device, and silicon evidence remain open."
