# SC-NeuroCore — Source/config provenance header

[metadata]
schema_version = 2
name = "AiharaMapNeuron"
class_name = "AiharaMapNeuron"
module = "aihara_map_neuron"
display_name = "Aihara chaotic neuron map"
summary = "Primary-equation Aihara reduced one-state chaotic neuron."
family = "Map-based"
category = "map-based"
biophysical_detail = "point"
maturity = "experimental"
intended_use = [
    "chaotic neural dynamics",
    "source-equation reference",
]
hardware_fit = [
    "fixed-point sigmoid-LUT co-simulation",
]
behavior_tags = [
    "excitable",
    "phasic",
    "rate-coded",
]

[provenance]
authors = [
    "Aihara, K.",
    "Takabe, T.",
    "Toyoda, M.",
]
year = 1990
doi = "10.1016/0375-9601(90)90136-C"

[state.y]
init = 0.1

[parameters.k]
default = 0.7
unit = "1"
meaning = "refractory-memory decay"
range = [
    0.0,
    1.0,
]

[parameters.alpha]
default = 1.0
unit = "1"
meaning = "refractory-output scale"
range = [
    1e-06,
    10.0,
]

[parameters.bias]
default = 0.3968
unit = "1"
meaning = "constant effective stimulus a"
range = [
    -10.0,
    10.0,
]

[parameters.epsilon]
default = 0.01
unit = "1"
meaning = "logistic steepness"
range = [
    1e-06,
    1.0,
]

[integration]
dt = 0.1
method = "euler"

[dynamics]
y = "k * y - alpha * sigmoid(y / epsilon) + bias + I"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "ulp-bounded"

[backends.julia]
status = "implemented"
parity = "ulp-bounded"

[backends.go]
status = "implemented"
parity = "ulp-bounded"

[backends.mojo]
status = "implemented"
parity = "ulp-bounded"

[reproducibility]
reference_config = "src/sc_neurocore/neurons/reference_trace_data/aihara_map_primary.json"
golden_trace_sha256 = "7eea51ca94f7c8089e55de353a223a5a5b49ac2bbae6b7d3d239ec0dc2abb2f2"

[documentation]
slug = "models/aihara_map"
notes = "Eq. 12 level events are part of the primary model; current is the effective reduced-map stimulus."

[validation]
dynamics_faithful = true
metric = "trajectory"
operating_point = "Figure 4 chaotic defaults and Figure 5 parameter anchor"
tolerance = "binary64 short horizon <=5e-11; Mojo 512-step chaotic envelope <=2e-4 with exact events; Q8.24 twelve-step state <=0.01 with exact events"
evidence = "tests/test_reference_aihara_map.py; tests/test_aihara_map_backends.py; tests/test_cosim_aihara_map.py"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosim_aihara_map.py::test_q824_shadows_source_events_and_state_for_twelve_steps"
target_tier = "H1"
terminal_reason = "Q8.24 preserves twelve source events and shadows y within 0.01; chaotic amplification forbids a false long-horizon trajectory-equivalence claim."
