[metadata]
schema_version = 2
name = "HillTononiNeuron"
class_name = "HillTononiNeuron"
module = "hill_tononi"
display_name = "Hill–Tononi cortical waking neuron"
summary = "Hill and Tononi 2005 hybrid cortical neuron with dynamic threshold and depolarisation-dependent potassium current."
family = "Conductance-based"
category = "conductance-based"
biophysical_detail = "point"
maturity = "validated"
intended_use = [
    "single-cell sleep/wake simulations",
    "cross-runtime recurrence validation",
]
hardware_fit = [
    "software reference",
    "transcendental RK4 requires an explicitly validated hardware approximation",
]
behavior_tags = [
    "adapting",
    "excitable",
    "rate-coded",
    "tonic",
]

[provenance]
authors = [
    "Hill, S. & Tononi, G.",
]
year = 2005
doi = "10.1152/jn.00915.2004"
paper_title = "Modeling sleep and wakefulness in the thalamocortical system"
url = "https://pubmed.ncbi.nlm.nih.gov/15537811/"
license_note = "Equations transcribed from the publication; maintained NEST ht_neuron used only to disambiguate printed parentheses."

