[parameters.d_influx_peak]
default = 0.025
unit = "ms^-1"
meaning = "peak voltage-dependent influx into the depolarisation measure"
range = [
    0.0,
    1.0,
]

[parameters.d_threshold]
default = -10.0
unit = "mV"
meaning = "half-activation voltage of depolarisation influx"
range = [
    -100.0,
    100.0,
]

[parameters.d_slope]
default = 5.0
unit = "mV"
meaning = "slope of depolarisation influx activation"
range = [
    0.1,
    50.0,
]

[parameters.d_eq]
default = 0.001
unit = "1"
