unit = "mV"
meaning = "dynamic spike threshold"

[state.d_k]
init = 0.001
unit = "1"
meaning = "depolarisation measure controlling I_DK"

[state.m_h]
init = 0.2871859013825026
unit = "1"
meaning = "I_h activation gate"

[state.m_t]
init = 0.1450215950687922
unit = "1"
meaning = "I_T activation gate"

[state.h_t]
init = 0.03732688734412946
unit = "1"
meaning = "I_T inactivation gate"

[state.spike_timer]
init = 0.0
unit = "ms"
meaning = "remaining source potassium-pulse interval"

