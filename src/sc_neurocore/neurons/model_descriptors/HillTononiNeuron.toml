range = [
    0.0,
    1.0,
]

[parameters.d_half]
default = 0.25
unit = "1"
meaning = "half-activation value of the depolarisation-dependent potassium current"
range = [
    1e-06,
    10.0,
]

[integration]
dt = 0.25
method = "rk4"

[dynamics]
v = "(I_NaL + I_KL + I_NaP + I_DK + I_h + I_T + I_ext)/tau_m + I_spike"
theta = "-(theta-theta_eq)/tau_theta"
d_k = "(tau_d*d_influx(v)+d_eq-d_k)/tau_d"
m_h = "(m_h_inf(v)-m_h)/tau_m_h(v)"
m_t = "(m_t_inf(v)-m_t)/tau_m_t(v)"
h_t = "(h_t_inf(v)-h_t)/tau_h_t(v)"

