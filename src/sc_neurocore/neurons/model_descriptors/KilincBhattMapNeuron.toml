# SC-NeuroCore — Source/config provenance header

[metadata]
schema_version = 2
name = "KilincBhattMapNeuron"
class_name = "KilincBhattMapNeuron"
module = "kilinc_bhatt_map_neuron"
display_name = ""
summary = "Experimental Nagumo-Sato/Aihara-derived sigmoid map with a dynamic threshold."
family = "Map-based"
category = "map-based"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "excitable",
    "phasic",
    "tonic",
]

[provenance]
authors = [
    "Aihara, K.",
    "Takabe, T.",
    "Toyoda, M.",
]
year = 1990
doi = "10.1016/0375-9601(90)90136-c"
paper_title = "Chaotic neural networks"
derivation_note = "The implemented two-state adaptive-threshold recurrence is an SC-NeuroCore experimental derivative. It is not publication-exact and is not attributable to a Kilinc-Bhatt 2023 paper."

[state.x]
init = 0.0

[state.theta]
init = 0.0

[parameters.k]
default = 1.5
unit = "1"
meaning = "sigmoid gain of the fast map variable"
range = [
    0.0,
    5.0,
]

[parameters.beta]
default = 0.95
unit = "1"
meaning = "slow-threshold decay (leak) factor"
range = [
    0.0,
    1.0,
]

[parameters.gamma]
default = 0.3
unit = "1"
meaning = "threshold increment per spike"
range = [
    0.0,
    2.0,
]

[parameters.theta_spike]
default = 0.8
unit = "1"
meaning = "baseline adaptive threshold"
range = [
    0.0,
    2.0,
]

[parameters.x_threshold]
default = 0.8
unit = "1"
meaning = "spike-detection threshold on the map variable"
range = [
    0.0,
    2.0,
]

[integration]
dt = 1.0
method = "map"

[dynamics]
x = "clamp(-x + k / (1 + exp(-4 * (x - theta))) + I, -5, 5)"
theta = "clamp(beta * theta + gamma * H(x - theta_spike), -5, 5)"
event = "x_next >= x_threshold and x < x_threshold"

[backends.python]
status = "implemented"
parity = "reference"

[backends.rust]
status = "implemented"
parity = "float64-2e-15"

[backends.go]
status = "implemented"
parity = "float64-2e-15"

[backends.julia]
status = "implemented"
parity = "float64-2e-15"

[reproducibility]
reference_config = "{\"n_steps\":1000,\"current\":0.6,\"parameters\":\"defaults\"}"
golden_trace_sha256 = "e979a6cff86be008d8cff1ffdc9f333007c7826a045cf811cb522f36fa021e0e"
event_count = 68
final_state = "{\"x\":0.4038531661502207,\"theta\":0.8877927528402929}"

[documentation]
slug = "models/kilinc_bhatt_map"
notes = "Experimental derivative of the Nagumo-Sato/Aihara sigmoid-map lineage; no Kilinc-Bhatt 2023 source was found. Mojo and silicon lanes are not implemented."

[validation]
dynamics_faithful = true
metric = "complete trajectory and upward-crossing event vector"
operating_point = "64 deterministic non-constant drives plus 1000 steps at I=0.6"
tolerance = "Python/Rust/Go/Julia complete state within 2e-15"
evidence = "tests/test_kilinc_bhatt_map_backends.py"

[silicon]
compiles = false
cosim_validated = false
terminal_reason = "No model-specific Mojo or RTL implementation and no synthesis evidence."
