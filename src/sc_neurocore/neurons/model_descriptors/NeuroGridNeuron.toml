[metadata]
schema_version = 2
name = "NeuroGridNeuron"
class_name = "NeuroGridNeuron"
module = "neurogrid"
display_name = ""
summary = "Boahen 2014 — Neurogrid subthreshold analog 2-compartment."
family = "Hardware / neuromorphic"
category = "hardware-neuromorphic"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "excitable",
    "irregular",
    "phasic",
    "rate-coded",
]

[provenance]
authors = [
    "Benjamin, B.V., Gao, P., McQuinn, E. et al.",
]
year = 2014
doi = "10.1109/JPROC.2014.2313565"

[state.v_s]
init = -65.0

[state.v_d]
init = -65.0

[parameters.tau_s]
default = 20.0
unit = "ms"
meaning = "somatic membrane time constant"
range = [
    1.0,
    100.0,
]

[parameters.tau_d]
default = 50.0
unit = "ms"
meaning = "dendritic membrane time constant"
range = [
    1.0,
    200.0,
]

[parameters.g_c]
default = 0.5
unit = "1"
meaning = "normalised soma-dendrite coupling conductance"
range = [
    0.0,
    10.0,
]

[parameters.delta_t]
default = 2.0
unit = "mV"
meaning = "slope factor of the exponential spike initiation"
range = [
    0.25,
    5.0,
]

[parameters.v_rest]
default = -65.0
unit = "mV"
meaning = "resting potential"
range = [
    -90.0,
    -40.0,
]

[parameters.v_threshold]
default = -50.0
unit = "mV"
meaning = "spike-initiation threshold"
range = [
    -60.0,
    -20.0,
]

[parameters.v_peak]
default = 20.0
unit = "mV"
meaning = "spike cutoff (peak) potential"
range = [
    0.0,
    40.0,
]

[parameters.v_reset]
default = -65.0
unit = "mV"
meaning = "reset potential"
range = [
    -90.0,
    -40.0,
]

[integration]
dt = 0.1
method = "euler"

[dynamics]

[backends.python]
status = "implemented"

