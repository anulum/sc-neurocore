[metadata]
schema_version = 2
name = "PersistentNaNeuron"
class_name = "PersistentNaNeuron"
module = "persistent_na_neuron"
display_name = ""
summary = "Persistent Na⁺ (INaP) neuron — WB base + non-inactivating Na⁺ current."
family = "Ion-channel"
category = "ion-channel"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "excitable",
    "irregular",
    "rate-coded",
    "tonic",
]

[provenance]
authors = [
    "Crill, W.E.",
]
year = 1996
doi = "10.1146/annurev.ph.58.030196.002025"
paper_title = "Persistent Sodium Current in Mammalian Central Neurons"
derivation_note = "The implemented recurrence is an SC-NeuroCore experimental composite: the Wang-Buzsaki sodium/potassium base plus a repository-specific INaP gate. Crill 1996 is a review and French et al. 1990 (10.1085/jgp.95.6.1139) establishes physiological INaP, but neither defines this exact parameterisation."

[state.v]
init = -65.0

[state.h]
init = 0.6

[state.n]
init = 0.32

[state.p]
init = 0.0

[parameters.g_na]
default = 35.0
unit = "mS/cm^2"
meaning = "maximal sodium conductance"
range = [
    0.0,
    200.0,
]

[parameters.g_nap]
default = 0.15
unit = "mS/cm^2"
meaning = "maximal persistent sodium conductance"
range = [
    0.0,
    20.0,
]

[parameters.g_k]
default = 9.0
unit = "mS/cm^2"
meaning = "maximal delayed-rectifier potassium conductance"
range = [
    0.0,
    100.0,
]

[parameters.g_l]
default = 0.3
unit = "mS/cm^2"
meaning = "leak conductance"
range = [
    0.0,
    5.0,
]

[parameters.e_na]
default = 55.0
unit = "mV"
meaning = "sodium reversal potential"
range = [
    30.0,
    70.0,
]

[parameters.e_k]
default = -90.0
unit = "mV"
meaning = "potassium reversal potential"
range = [
    -100.0,
    -70.0,
]

[parameters.e_l]
default = -65.0
unit = "mV"
meaning = "leak reversal potential"
range = [
    -80.0,
    -40.0,
]

[parameters.c_m]
default = 1.0
unit = "uF/cm^2"
meaning = "membrane capacitance"
range = [
    0.5,
    2.0,
]

[parameters.phi]
default = 5.0
unit = "1"
meaning = "temperature scaling factor of the gating kinetics"
range = [
    0.5,
    10.0,
]

[parameters.v_threshold]
default = -20.0
unit = "mV"
meaning = "voltage at which a spike is registered"
range = [
    -20.0,
    20.0,
]

[parameters.gain]
default = 1.0
unit = "1"
meaning = "gain applied to the injected input current"
range = [
    0.0,
    10.0,
]

[integration]
dt = 0.5
method = "euler"
sub_steps = 50

[dynamics]
alpha_m = "0.1 * (v + 35) / (1 - exp(-(v + 35) / 10))"
beta_m = "4 * exp(-(v + 60) / 18)"
m_inf = "alpha_m / (alpha_m + beta_m)"
dh_dt = "phi * (0.07 * exp(-(v + 58) / 20) * (1 - h) - h / (1 + exp(-(v + 28) / 10)))"
dn_dt = "phi * (0.01 * (v + 34) / (1 - exp(-(v + 34) / 10)) * (1 - n) - 0.125 * exp(-(v + 44) / 80) * n)"
dp_dt = "(1 / (1 + exp(-(v + 48) / 5)) - p) / (10 + 40 / (1 + ((v + 48) / 10)^2))"
dv_dt = "(-g_na * m_inf^3 * h * (v - e_na) - g_nap * p * (v - e_na) - g_k * n^4 * (v - e_k) - g_l * (v - e_l) + gain * I) / c_m"
event = "v_next >= v_threshold; reset v to -65 while preserving h, n, and p"

[backends.python]
status = "implemented"
parity = "reference"

[backends.rust]
status = "implemented"
parity = "float64-1e-12"

[backends.go]
status = "implemented"
parity = "float64-1e-12"

[backends.julia]
status = "implemented"
parity = "float64-1e-12"

[reproducibility]
reference_config = "{\"n_steps\":1000,\"current\":5.0,\"parameters\":\"defaults\"}"
golden_trace_sha256 = "006dbe26735718a9db0f6f0c8fa4b18fa7e883aaac4c744776607786b2ee8354"
