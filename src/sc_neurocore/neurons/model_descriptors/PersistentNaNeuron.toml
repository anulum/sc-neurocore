metric = "complete four-state trajectory and event vector"
operating_point = "64 deterministic non-constant drives plus 1000 steps at I=5"
tolerance = "Python/Rust/Go/Julia complete state within 1e-12"
evidence = "tests/test_persistent_na_neuron_backends.py"

[silicon]
