[documentation]
slug = "models/persistent_na_neuron"
notes = "Experimental WB+INaP composite. Crill 1996 is a biological review and French et al. 1990 is physiological evidence, not an exact recurrence source. Mojo and silicon lanes are not implemented."

[validation]
