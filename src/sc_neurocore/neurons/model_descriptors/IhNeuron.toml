[metadata]
schema_version = 2
name = "IhNeuron"
class_name = "IhNeuron"
module = "ih_neuron"
display_name = ""
summary = "Ih (HCN) neuron — WB base + hyperpolarisation-activated cation current."
family = "Ion-channel"
category = "ion-channel"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "excitable",
    "rate-coded",
    "tonic",
]

[provenance]
authors = [
    "Robinson, R.B. & Siegelbaum, S.A.",
]
year = 2003
doi = "10.1146/annurev.physiol.65.092101.142734"
paper_title = "Hyperpolarization-Activated Cation Currents: From Molecules to Physiological Function"
derivation_note = "The implemented recurrence is an SC-NeuroCore experimental composite: the Wang-Buzsaki sodium/potassium base plus a repository-specific HCN gate. The cited HCN reviews establish biological context but do not define this exact parameterisation."

[state.v]
init = -65.0

[state.h]
init = 0.6

[state.n]
init = 0.32

[state.r]
init = 0.1

[parameters.g_na]
default = 35.0
unit = "mS/cm^2"
meaning = "maximal sodium conductance"
range = [
    0.0,
    200.0,
]

[parameters.g_k]
default = 9.0
unit = "mS/cm^2"
meaning = "maximal delayed-rectifier potassium conductance"
range = [
    0.0,
    100.0,
]

[parameters.g_h]
default = 0.15
unit = "mS/cm^2"
meaning = "maximal hyperpolarisation-activated (Ih) conductance"
range = [
    0.0,
    5.0,
]

[parameters.g_l]
default = 0.2
unit = "mS/cm^2"
meaning = "leak conductance"
range = [
    0.0,
    5.0,
]

[parameters.e_na]
default = 55.0
unit = "mV"
meaning = "sodium reversal potential"
range = [
    30.0,
    70.0,
]

[parameters.e_k]
default = -90.0
unit = "mV"
meaning = "potassium reversal potential"
range = [
    -100.0,
    -70.0,
]

[parameters.e_h]
default = -40.0
unit = "mV"
meaning = "reversal potential of the hyperpolarisation-activated current"
range = [
    -50.0,
    0.0,
]

[parameters.e_l]
default = -65.0
unit = "mV"
meaning = "leak reversal potential"
range = [
    -80.0,
    -40.0,
]

[parameters.c_m]
default = 1.0
unit = "uF/cm^2"
meaning = "membrane capacitance"
range = [
    0.5,
    2.0,
]

[parameters.phi]
default = 5.0
unit = "1"
meaning = "temperature scaling factor of the gating kinetics"
range = [
    0.5,
    10.0,
]

[parameters.v_threshold]
default = -20.0
unit = "mV"
meaning = "voltage at which a spike is registered"
range = [
    -20.0,
    20.0,
]

[parameters.gain]
default = 1.0
unit = "1"
meaning = "gain applied to the injected input current"
range = [
    0.0,
    10.0,
]

[integration]
dt = 0.5
method = "euler"
sub_steps = 50

[dynamics]
alpha_m = "0.1 * (v + 35) / (1 - exp(-(v + 35) / 10))"
beta_m = "4 * exp(-(v + 60) / 18)"
m_inf = "alpha_m / (alpha_m + beta_m)"
dh_dt = "phi * (0.07 * exp(-(v + 58) / 20) * (1 - h) - h / (1 + exp(-(v + 28) / 10)))"
dn_dt = "phi * (0.01 * (v + 34) / (1 - exp(-(v + 34) / 10)) * (1 - n) - 0.125 * exp(-(v + 44) / 80) * n)"
dr_dt = "(1 / (1 + exp((v + 80) / 10)) - r) / (100 + 200 / (1 + exp((v + 70) / 10)))"
dv_dt = "(-g_na * m_inf^3 * h * (v - e_na) - g_k * n^4 * (v - e_k) - g_h * r * (v - e_h) - g_l * (v - e_l) + gain * I) / c_m"
event = "v_next >= v_threshold; reset v to -65 while preserving h, n, and r"

[backends.python]
status = "implemented"
parity = "reference"

[backends.rust]
status = "implemented"
parity = "float64-1e-12"

[backends.go]
status = "implemented"
parity = "float64-1e-12"

[backends.julia]
status = "implemented"
parity = "float64-1e-12"

[reproducibility]
