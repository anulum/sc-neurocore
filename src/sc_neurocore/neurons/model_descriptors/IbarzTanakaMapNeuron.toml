# SC-NeuroCore — Source/config provenance header

[metadata]
schema_version = 2
name = "Ibarz-Tanaka Rulkov Map"
class_name = "IbarzTanakaMapNeuron"
module = "ibarz_tanaka_map"
display_name = "Ibarz-Tanaka Rulkov Map"
summary = "Shilnikov-Rulkov four-branch fast/slow map in the parameter profile analysed by Ibarz et al. (2007), Eqs. 2-3."
family = "Map-based"
category = "map-based"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "adapting",
    "excitable",
    "irregular",
    "rate-coded",
    "tonic",
]

[provenance]
authors = [
    "Ibarz, B.",
    "Tanaka, G.",
    "Sanjuan, M.A.F.",
    "Aihara, K.",
]
year = 2007
doi = "10.1103/PhysRevE.75.041902"

[state.v]
init = -1.0

[state.u]
init = -0.1

[parameters.alpha]
default = 1.0
unit = "1"
meaning = "fast-map geometry parameter in Eq. 3"
range = [
    0.1,
    10.0,
]

[parameters.mu]
default = 0.001
unit = "1"
meaning = "positive slow-variable timescale in Eq. 2"
range = [
    1e-06,
    0.1,
]

[parameters.sigma]
default = 0.1
unit = "1"
meaning = "slow-nullcline offset in Eq. 2"
range = [
    -2.0,
    2.0,
]

[integration]
dt = 1.0
method = "map"

[dynamics]
v = "((-(alpha * alpha) / 4.0 - alpha + I + u) if v < (-1.0 - alpha / 2.0) else (alpha * v + (v + 1.0) * (v + 1.0) + I + u if v <= 0.0 else (1.0 + I + u if v < (1.0 + I + u) else -1.0)))"
u = "u - mu * (v + 1.0 - sigma)"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "exact"

[backends.julia]
status = "implemented"
parity = "exact"

[backends.go]
status = "implemented"
parity = "exact"

[backends.mojo]
status = "implemented"
parity = "ulp-bounded"

[reproducibility]
reference_config = "{\"n_steps\":1000,\"current\":0.2,\"backend\":\"python\",\"parameters\":\"defaults\"}"
golden_trace_sha256 = "68000d6955ffcaedffa3a851f70e8f118156312ab224638defb408ae0b3002ed"

[documentation]
slug = "models/ibarz_tanaka_map"
notes = "Compatibility name retained. Shilnikov and Rulkov introduced the recurrence (DOI 10.1016/j.physleta.2004.05.062); Ibarz et al. restated and analysed it with the maintained parameter profile. An event is execution of the fourth, fixed -1 reset branch."

[validation]
dynamics_faithful = true
metric = "trajectory"
operating_point = "Shilnikov-Rulkov map at I=-0.5 over 4 iterations and I=0.2 over 30 iterations"
tolerance = "complete independent binary64 state/event receipt; hand/TOML/JSON exact; Q16.16 all-branch event vectors exact with v error below 0.003 and u error below 0.0001"
evidence = "tests/test_reference_ibarz_tanaka_map.py; tests/test_cosim_ibarz_tanaka_map.py"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosim_ibarz_tanaka_map.py::test_q1616_source_trajectory_and_reset_events"
synthesised = true
synth_report = "hdl/reports/yosys_ibarz_tanaka_rulkov_map_q1616_2026-08-29.json"
target_device = "generic RTL (Yosys coarse synthesis)"
target_tier = "H2"
terminal_reason = "Q16.16 co-simulation, coarse synthesis, and bounded reset/event formal safety are complete; timing, PPA, board, device, physical silicon, and universal formal equivalence remain open."
