[metadata]
schema_version = 2
name = "Wilson-HR"
class_name = "WilsonHRNeuron"
module = "wilson_hr"
display_name = ""
summary = "Wilson 1999 polynomial cortical model."
family = "Bursting"
category = "bursting"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "excitable",
    "phasic",
]

[provenance]
authors = [
    "Wilson, H.R.",
]
year = 1999
doi = "10.1006/jtbi.1999.1002"

[state.v]
init = -0.7

[state.r]
init = 0.1

[parameters.tau_r]
default = 1.9
unit = "ms"
meaning = "recovery-variable time constant"
range = [
    0.1,
    20.0,
]

[parameters.v_peak]
default = 0.4
unit = "1"
meaning = "normalised voltage level at which a spike is registered"
range = [
    -1.0,
    2.0,
]

[integration]
dt = 0.05
method = "rk4"

[dynamics]
v = "-(17.81 + 47.71 * v + 32.63 * v * v) * (v - 0.55) - 26.0 * r * (v + 0.92) + I"
r = "(-r + 1.35 * v + 1.03) / tau_r"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "exact"

[backends.julia]
status = "implemented"
parity = "exact"

[backends.go]
status = "implemented"
parity = "exact"

[backends.mojo]
status = "implemented"
parity = "ulp-bounded"

[reproducibility]
reference_config = "{\"n_steps\":1000,\"current\":2.0,\"backend\":\"python\",\"parameters\":\"defaults\"}"
golden_trace_sha256 = "1ae3c36d9f71a6c62a060ca173126636d4ed5ed3a049651079cdf498bfde9177"

[documentation]
slug = "models/wilson_hr"
notes = ""

[validation]
dynamics_faithful = true
metric = "parity"
operating_point = "schema-DSL Wilson-HR two-state RK4 polynomial cortical model"
tolerance = "exact three-way spike-count parity at I=0.0, 2.0, and 10.0 over 5000 steps"
evidence = "tests/test_cosimulation.py::TestQ1616Precision::test_wilson_hr_q1616_parity"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosimulation.py::TestQ1616Precision::test_wilson_hr_q1616_parity"
target_tier = "H1"
terminal_reason = "Point-neuron schema→RTL path; higher silicon rungs need synthesis, timing, and equivalence programmes."
