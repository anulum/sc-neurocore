golden_trace_sha256 = "bc071ae0c0057bc23a5e4c99ee5bbee53d306f07cd154e01bafff32335a6e192"
golden_citation = "doi:10.1093/cercor/10.9.910; primary PDF sha256 4b259dfb67b14d65706a3188969eb652998f46ad39ef46d7c08ff97b1605dd26"

[documentation]
slug = "models/compte_wm"
notes = "The compatibility spike_in argument is the recurrent NMDA event only. The removed self-GABA behavior was not source-authored. Full network behavior is reserved for a separate SC-derived model."

[validation]
dynamics_faithful = true
metric = "complete state trajectory and sampled events"
operating_point = "1024 varied current/event steps with four source-equation events plus five-runtime parity"
tolerance = "Rust, Julia, and Go <=2e-12; Mojo <=2e-10; events exact"
evidence = "tests/test_reference_compte_wm.py; tests/test_compte_wm_backends.py; tests/test_cosim_compte_wm.py"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosim_compte_wm.py::test_q1616_rtl_preserves_enrolled_event_vector"
target_tier = "H1"
terminal_reason = "The bounded Q16.16 cell/channel datapath preserves the enrolled event vector and state envelopes, synthesizes in Yosys, and carries bounded safety only. Timing, PPA, device validation, and binary64 formal equivalence remain open."
