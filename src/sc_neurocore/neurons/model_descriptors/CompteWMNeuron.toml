# SC-NeuroCore — source-bounded Compte 2000 pyramidal-cell descriptor

[metadata]
schema_version = 2
name = "CompteWMNeuron"
class_name = "CompteWMNeuron"
module = "compte_wm"
display_name = "Compte working-memory pyramidal cell"
summary = "Pyramidal LIF cell with distinct incoming AMPA, NMDA, and GABAA events, coupled midpoint-RK2 channel kinetics, and source refractory behavior."
family = "Rate / mean-field"
category = "rate-mean-field"
biophysical_detail = "point"
maturity = "validated"
intended_use = ["single-cell Compte channel replay", "source-equation validation", "cross-runtime trajectory validation"]
hardware_fit = ["bounded one-cell Q16.16 co-simulation"]
behavior_tags = ["excitable", "spiking", "conductance-based"]

[provenance]
authors = ["Compte, A.", "Brunel, N.", "Goldman-Rakic, P.S.", "Wang, X.-J."]
year = 2000
doi = "10.1093/cercor/10.9.910"
paper_title = "Synaptic Mechanisms and Network Dynamics Underlying Spatial Working Memory in a Cortical Network Model"
url = "https://doi.org/10.1093/cercor/10.9.910"
derivation_note = "Excitatory pyramidal-cell parameters and incoming AMPA/NMDA/GABAA kinetics. Separate presynaptic event pathways precede one coupled midpoint-RK2 flow. Threshold timing is sampled rather than interpolated."

[state.v]
init = -70.0
unit = "mV"
meaning = "membrane voltage"
[state.s_ampa]
init = 0.0
unit = "1"
meaning = "external AMPA gate accumulator"
[state.s_nmda]
init = 0.0
unit = "1"
meaning = "recurrent NMDA open fraction"
[state.x_nmda]
init = 0.0
unit = "1"
meaning = "recurrent NMDA rise precursor"
[state.s_gaba]
init = 0.0
unit = "1"
meaning = "incoming GABAA gate accumulator"
[state.ref_remaining]
init = 0.0
unit = "ms"
meaning = "absolute refractory time remaining"

[parameters.g_l]
default = 0.025
unit = "uS"
meaning = "pyramidal leak conductance"
range = [0.0, 100.0]
[parameters.g_ampa]
default = 0.0031
unit = "uS"
meaning = "source control-set external pyramidal AMPA conductance"
range = [0.0, 10.0]
[parameters.g_nmda]
default = 0.000381
unit = "uS"
meaning = "source control-set recurrent pyramidal NMDA conductance"
range = [0.0, 10.0]
[parameters.g_gaba]
default = 0.001336
unit = "uS"
meaning = "source control-set interneuron-to-pyramidal GABAA conductance"
range = [0.0, 10.0]
[parameters.e_l]
default = -70.0
unit = "mV"
meaning = "leak reversal"
range = [-150.0, 100.0]
[parameters.e_exc]
default = 0.0
unit = "mV"
meaning = "AMPA and NMDA reversal"
range = [-150.0, 100.0]
[parameters.e_inh]
default = -70.0
unit = "mV"
meaning = "GABAA reversal"
range = [-150.0, 100.0]
[parameters.c_m]
default = 0.5
unit = "nF"
meaning = "pyramidal membrane capacitance"
range = [0.000001, 1000.0]
[parameters.mg]
default = 1.0
unit = "mM"
meaning = "extracellular magnesium concentration"
range = [0.0, 100.0]
[parameters.tau_ampa]
default = 2.0
unit = "ms"
meaning = "AMPA gate decay"
range = [0.000001, 1000000.0]
[parameters.tau_nmda]
default = 100.0
unit = "ms"
meaning = "NMDA open-fraction decay"
range = [0.000001, 1000000.0]
[parameters.tau_x]
default = 2.0
unit = "ms"
meaning = "NMDA rise-precursor decay"
range = [0.000001, 1000000.0]
[parameters.tau_gaba]
default = 10.0
unit = "ms"
meaning = "GABAA gate decay"
range = [0.000001, 1000000.0]
[parameters.alpha_nmda]
default = 0.5
unit = "1/ms"
meaning = "NMDA saturation rate"
range = [0.0, 1000.0]
[parameters.v_threshold]
default = -50.0
unit = "mV"
meaning = "sampled spike threshold"
range = [-150.0, 100.0]
[parameters.v_reset]
default = -60.0
unit = "mV"
meaning = "pyramidal reset voltage"
range = [-150.0, 100.0]
[parameters.tau_ref]
default = 2.0
unit = "ms"
meaning = "pyramidal absolute refractory interval"
range = [0.000001, 1000000.0]

[integration]
dt = 0.02
method = "midpoint-rk2"

[dynamics]
membrane = "C_m*dV/dt=-g_L*(V-E_L)-g_AMPA*s_AMPA*(V-E_exc)-g_NMDA*B(V)*s_NMDA*(V-E_exc)-g_GABA*s_GABA*(V-E_inh)+I"
mg_block = "B(V)=1/(1+[Mg2+]*exp(-0.062*V)/3.57)"
ampa = "ds_AMPA/dt=-s_AMPA/tau_AMPA; external presynaptic event adds 1"
nmda = "ds_NMDA/dt=-s_NMDA/tau_NMDA+alpha*x_NMDA*(1-s_NMDA); recurrent excitatory event adds 1 to x_NMDA"
nmda_precursor = "dx_NMDA/dt=-x_NMDA/tau_x"
gaba = "ds_GABA/dt=-s_GABA/tau_GABA; inhibitory presynaptic event adds 1"
event = "sampled candidate>=V_threshold; then V=V_reset and ref_remaining=tau_ref"
scope = "Single excitatory pyramidal cell and incoming channel kinetics. The full ring network is retained for a separately named SC-derived successor."

[backends.python]
status = "implemented"
parity = "exact"
[backends.rust]
status = "implemented"
parity = "ulp-bounded"
[backends.julia]
status = "implemented"
parity = "ulp-bounded"
[backends.go]
status = "implemented"
parity = "ulp-bounded"
[backends.mojo]
status = "implemented"
parity = "approximate"

[reproducibility]
reference_config = "{\"kind\":\"sampled_batch_v1\",\"steps\":1024,\"current\":\"1+0.2*sin(i*0.03)\",\"recurrent_nmda_event\":\"i%17==0\",\"external_ampa_event\":\"i%11==0\",\"inhibitory_gabaa_event\":\"i%23==0\",\"trace_fields\":[\"v\",\"s_ampa\",\"s_nmda\",\"x_nmda\",\"s_gaba\",\"ref_remaining\",\"event\"]}"
golden_trace_sha256 = "bc071ae0c0057bc23a5e4c99ee5bbee53d306f07cd154e01bafff32335a6e192"
golden_citation = "doi:10.1093/cercor/10.9.910; primary PDF sha256 4b259dfb67b14d65706a3188969eb652998f46ad39ef46d7c08ff97b1605dd26"

[documentation]
slug = "models/compte_wm"
notes = "The compatibility spike_in argument is the recurrent NMDA event only. The removed self-GABA behavior was not source-authored. Full network behavior is reserved for a separate SC-derived model."

[validation]
dynamics_faithful = true
metric = "complete state trajectory and sampled events"
operating_point = "1024 varied current/event steps with four source-equation events plus five-runtime parity"
tolerance = "Rust, Julia, and Go <=2e-12; Mojo <=2e-10; events exact"
evidence = "tests/test_reference_compte_wm.py; tests/test_compte_wm_backends.py; tests/test_cosim_compte_wm.py"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosim_compte_wm.py::test_q1616_rtl_preserves_enrolled_event_vector"
target_tier = "H1"
terminal_reason = "The bounded Q16.16 cell/channel datapath preserves the enrolled event vector and state envelopes, synthesizes in Yosys, and carries bounded safety only. Timing, PPA, device validation, and binary64 formal equivalence remain open."
