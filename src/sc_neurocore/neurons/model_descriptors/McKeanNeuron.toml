[metadata]
schema_version=2
name="McKeanNeuron"
class_name="McKeanNeuron"
module="mckean"
display_name="McKean space-clamped Heaviside system"
summary="Source-bound two-state discontinuous FitzHugh-Nagumo caricature."
family="Oscillator"
category="oscillator"
