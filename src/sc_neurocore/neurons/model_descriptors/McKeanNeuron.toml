derivation_note="Space-clamped equations (1.3)-(1.6); normalized parameters and explicit right-continuous H(0)=1 numerical specialization."
[state.v]
init=0.0
unit="1"
[state.w]
init=0.0
unit="1"
[parameters.a]
default=0.25
unit="1"
[parameters.lambda_]
default=1.0
unit="1"
[parameters.mu]
default=1.0
unit="1"
[parameters.b]
default=0.01
unit="1"
[integration]
