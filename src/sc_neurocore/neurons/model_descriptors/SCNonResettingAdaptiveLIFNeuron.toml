metric = "trajectory"
operating_point = "256-step historical compatibility receipt with 5 events plus five-runtime parity"
tolerance = "events exact; complete floating-point states within absolute 2e-12; Python receipt bit-identical"
evidence = "tests/test_reference_sc_non_resetting_adaptive_lif.py; tests/test_sc_non_resetting_adaptive_lif_backend_dispatch.py; tests/test_cosim_sc_non_resetting_adaptive_lif.py"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosim_sc_non_resetting_adaptive_lif.py::test_sc_project_q3232_matches_integer_oracle_and_events"
