[metadata]
schema_version = 2
name = "WilsonCowanUnit"
class_name = "WilsonCowanUnit"
module = "wilson_cowan"
display_name = "Wilson-Cowan E/I population rates"
summary = "Validated normalised two-population Wilson-Cowan reduction with a shifted sigmoid and fixed-step RK4 integration."
family = "Rate / mean-field"
category = "rate-mean-field"
biophysical_detail = "point"
maturity = "validated"
intended_use = [
    "deterministic excitatory/inhibitory population-rate experiments",
    "coupled mean-field dynamics and oscillation studies",
    "cross-runtime RK4 trajectory validation",
]
hardware_fit = [
    "software and floating-point accelerator reference",
    "generated Q32.32 shifted-sigmoid RK4 datapath with bounded E/I co-simulation",
]
behavior_tags = [
    "excitable",
    "tonic",
]

[provenance]
authors = [
    "Wilson, H.R. & Cowan, J.D.",
]
year = 1972
doi = "10.1016/S0006-3495(72)86068-5"
paper_title = "Excitatory and Inhibitory Interactions in Localized Populations of Model Neurons"
url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC1484078/"

[state.e]
init = 0.1
unit = "normalised excitatory population activity"
meaning = "continuous excitatory population rate in the normalised [-beta, 1] state envelope"

[state.i]
init = 0.05
unit = "normalised inhibitory population activity"
meaning = "continuous inhibitory population rate in the normalised [-beta, 1] state envelope"

[parameters.w_ee]
default = 10.0
unit = "1"
meaning = "recurrent excitatory-to-excitatory connection weight"
range = [
    0.0,
    30.0,
]

[parameters.w_ei]
default = 6.0
unit = "1"
meaning = "inhibitory-to-excitatory connection weight"
range = [
    0.0,
    30.0,
]

[parameters.w_ie]
default = 10.0
unit = "1"
meaning = "excitatory-to-inhibitory connection weight"
range = [
    0.0,
    30.0,
]

[parameters.w_ii]
default = 1.0
unit = "1"
meaning = "recurrent inhibitory-to-inhibitory connection weight"
range = [
    0.0,
    30.0,
]

[parameters.tau_e]
default = 1.0
unit = "model time"
meaning = "excitatory population time constant"
range = [
    0.001,
    100.0,
]

[parameters.tau_i]
default = 2.0
unit = "model time"
meaning = "inhibitory population time constant"
range = [
    0.001,
    100.0,
]

[parameters.a]
default = 1.2
unit = "1/input"
meaning = "positive steepness of the shifted sigmoid"
range = [
    0.1,
    10.0,
]

[parameters.theta]
default = 4.0
unit = "input"
meaning = "finite midpoint of the shifted sigmoid"
range = [
    -100.0,
    100.0,
]

[integration]
dt = 0.1
method = "rk4"

[dynamics]
e = "tau_e*dE/dt=-E+S(w_ee*E-w_ei*I+I_ext)"
i = "tau_i*dI/dt=-I+S(w_ie*E-w_ii*I)"
sigmoid = "logistic(a*(x-theta)) - logistic(-a*theta)"
transfer = "S(x)=logistic(a*(x-theta))-logistic(-a*theta), so S(0)=0"
scope = "normalised reduction of the coupled Wilson-Cowan family; availability/refractory factors and an independent inhibitory external drive are omitted"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "ulp-bounded"

[backends.julia]
status = "implemented"
parity = "ulp-bounded"

[backends.go]
status = "implemented"
parity = "ulp-bounded"

[backends.mojo]
status = "implemented"
parity = "approximate"

[reproducibility]
reference_config = "{\"e\":0.1,\"i\":0.05,\"w_ee\":10.0,\"w_ei\":6.0,\"w_ie\":10.0,\"w_ii\":1.0,\"tau_e\":1.0,\"tau_i\":2.0,\"a\":1.2,\"theta\":4.0,\"dt\":0.1,\"n_steps\":100000,\"current\":1.5}"
golden_trace_sha256 = "293a1307bc020d8cc222ff10d7256b1f2ecbf53d9c994e3f12b7b6187b20b275"
golden_citation = "doi:10.1016/S0006-3495(72)86068-5; normalised reduction scope declared"

[documentation]
slug = "models/wilson_cowan"
notes = "Wilson and Cowan 1972 derive coupled excitatory and inhibitory population equations with availability/refractory factors. The maintained normalised reduction explicitly omits those factors and a separate inhibitory external drive. E and I are continuous rates, not binary spikes."

[validation]
dynamics_faithful = true
metric = "trajectory"
operating_point = "E=0.1, I=0.05, default weights/time constants/sigmoid, dt=0.1, current=1.5, 100000 RK4 steps"
tolerance = "complete E/I traces and final rates agree within absolute 1e-9 for Rust/Julia/Go and 1e-8 for Mojo"
evidence = "tests/test_wilson_cowan_backends.py::test_complete_configured_contract_matches_python"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosim_wilson_cowan.py::test_q3232_rtl_preserves_bounded_ei_trajectory_and_silent_events"
target_tier = "H1"
terminal_reason = "Generated Q32.32 E/I trajectory co-simulation is enrolled; higher silicon rungs require formal, synthesis, timing, and device programmes."
