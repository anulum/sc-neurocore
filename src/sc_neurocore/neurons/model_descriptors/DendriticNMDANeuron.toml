[metadata]
schema_version = 2
name = "DendriticNMDANeuron"
class_name = "DendriticNMDANeuron"
module = "dendritic_nmda"
display_name = ""
summary = "Two-compartment neuron with NMDA Mg2+ block (Jahr & Stevens 1990)."
family = "Ion-channel"
category = "ion-channel"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = []

[provenance]
authors = [
    "Jahr, C. E.",
    "Stevens, C. F.",
]
year = 1990
doi = "10.1523/jneurosci.10-09-03178.1990"
paper_title = "Voltage dependence of NMDA-activated macroscopic conductances predicted by single-channel kinetics"

[state.theta]
init = -50.0

[state.v_soma]
init = -65.0

[state.v_dend]
init = -65.0

[parameters.g_nmda]
default = 1.5
unit = "1"
meaning = "NMDA synaptic conductance (relative)"
range = [
    0.0,
    5.0,
]

[parameters.e_nmda]
default = 0.0
unit = "mV"
meaning = "NMDA reversal potential"
range = [
    -10.0,
    10.0,
]

[parameters.mg_conc]
default = 1.0
unit = "mM"
meaning = "extracellular Mg2+ concentration"
range = [
    0.0,
    5.0,
]

[parameters.g_coupling]
default = 0.5
unit = "1"
meaning = "soma-dendrite coupling conductance (relative)"
range = [
    0.0,
    5.0,
]

[parameters.tau_soma]
default = 20.0
unit = "ms"
meaning = "somatic membrane time constant"
range = [
    1.0,
    100.0,
]

[parameters.tau_dend]
default = 50.0
unit = "ms"
meaning = "dendritic membrane time constant"
range = [
    1.0,
    200.0,
]

[integration]
dt = 0.1
method = "euler"

[dynamics]

[backends.python]
status = "implemented"

[reproducibility]

[documentation]
slug = "models/dendritic_nmda"
notes = ""

[[behaviour]]
name = "a soma current of 20 alone stays below threshold"
kind = "interval"
steps = 20000
observable = "spikes"
bounds = [
    0,
    0,
]

[behaviour.inputs]
i_soma = 20.0
glutamate = 0.0

[[behaviour]]
name = "glutamate alone stays below threshold"
kind = "interval"
steps = 20000
observable = "spikes"
bounds = [
    0,
    0,
]

[behaviour.inputs]
i_soma = 0.0
glutamate = 1.0

[[behaviour]]
name = "glutamate alone raises the dendrite to its balance point"
kind = "interval"
steps = 20000
observable = "state:v_dend"
bounds = [
    -60.0,
    -59.0,
]

[behaviour.inputs]
i_soma = 0.0
glutamate = 1.0

[[behaviour]]
name = "a soma current of 20 with glutamate fires"
kind = "interval"
steps = 20000
observable = "spikes"
bounds = [
    50,
    70,
]

[behaviour.inputs]
i_soma = 20.0
glutamate = 1.0

[[behaviour]]
name = "a soma current of 40 alone fires"
kind = "interval"
steps = 20000
observable = "spikes"
bounds = [
    180,
    200,
]

[behaviour.inputs]
i_soma = 40.0
glutamate = 0.0

[[behaviour]]
name = "a soma current of 40 with glutamate fires"
kind = "interval"
steps = 20000
observable = "spikes"
bounds = [
    200,
    220,
]

[behaviour.inputs]
i_soma = 40.0
glutamate = 1.0

[[behaviour]]
name = "glutamate adds spikes at a soma current of 40"
kind = "contrast"
steps = 20000
observable = "spikes"
margin = 10

[behaviour.inputs]
i_soma = 40.0
glutamate = 1.0

[behaviour.reference_inputs]
i_soma = 40.0
glutamate = 0.0

[[behaviour]]
name = "the lane anchor"
kind = "interval"
steps = 20000
observable = "spikes"
bounds = [
    266,
    266,
]

[behaviour.inputs]
i_soma = 50.0
glutamate = 0.5
