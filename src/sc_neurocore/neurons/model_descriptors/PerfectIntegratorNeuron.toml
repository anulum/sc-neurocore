# SC-NeuroCore — Source/config provenance header

[metadata]
schema_version = 2
name = "Perfect Integrator"
class_name = "PerfectIntegratorNeuron"
module = "perfect_integrator"
display_name = "Naud-Gerstner perfect integrator"
summary = "Source-aligned perfect integrator with strict threshold reset; the historical inclusive SC recurrence is preserved under an explicit count-neutral identity."
family = "Integrate-and-Fire"
category = "integrate-and-fire"
biophysical_detail = "point"
maturity = "experimental"
intended_use = [
    "source-equation reference",
    "strict-threshold integration experiments",
]
hardware_fit = [
    "fixed-point accumulator and reset core",
]
behavior_tags = [
    "excitable",
    "rate-coded",
    "tonic",
]

[provenance]
authors = [
    "Naud, R. and Gerstner, W.",
]
year = 2012
doi = "10.1007/978-94-007-3858-4_6"
paper_title = "The Performance (and Limits) of Simple Neuron Models: Generalizations of the Leaky Integrate-and-Fire Model"
source_scope = "Section 1.1: dV/dt=I(t)/C and reset only when V(t)>V_T."

[state.v]
init = 0.0

[parameters.c_m]
default = 1.0
unit = "1"
meaning = "normalised membrane capacitance"
range = [
    0.1,
    10.0,
]

[parameters.v_threshold]
default = 1.0
unit = "1"
meaning = "firing threshold (normalised)"
range = [
    0.0,
    10.0,
]

[parameters.v_reset]
default = 0.0
unit = "1"
meaning = "membrane potential reset to after a spike (normalised)"
range = [
    -5.0,
    5.0,
]

[integration]
dt = 0.1
method = "exact_piecewise_constant_integral"

[dynamics]
v = "v[n+1]=v[n]+I[n]*dt/c_m; reset when candidate>v_threshold"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "exact"

[backends.julia]
status = "implemented"
parity = "exact"

[backends.go]
status = "implemented"
parity = "exact"

[backends.mojo]
status = "implemented"
parity = "exact"

[reproducibility]
reference_config = "src/sc_neurocore/neurons/reference_receipts/perfect_integrator_naud_gerstner_2012.json"
golden_trace_sha256 = "eb9d22ec1882907c49cfbb11614c156569510490ed34b066d87e09a218803629"
golden_citation = "src/sc_neurocore/neurons/reference_receipts/perfect_integrator_naud_gerstner_2012.json"

[documentation]
slug = "models/perfect_integrator"
notes = "PerfectIntegratorNeuron.naud_gerstner_2012() is the source profile. PerfectIntegratorNeuron() and SCInclusivePerfectIntegratorNeuron preserve the historical inclusive SC boundary without attributing it to the source equation."

[validation]
dynamics_faithful = true
metric = "trajectory"
operating_point = "normalized source profile; exact equality sequence at I=5 for 1000 steps plus I=0/0.333/0.7/2/3/20 native cohort"
tolerance = "five native complete packets bit-exact; reference voltage/event digests exact; source Q8.8 event-exact at the strict equality boundary"
evidence = "tests/test_reference_perfect_integrator_source_receipt.py; tests/test_perfect_integrator_backend_parity.py; tests/test_cosim_perfect_integrator.py"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosim_perfect_integrator.py::TestTierBModelCosim::test_source_strict_boundary_matches_curated_q88_rtl"
synthesised = true
synth_report = "hdl/reports/yosys_perfect_integrator_naud_gerstner_2012_q88_2026-08-30.json"
target_device = "generic RTL (Yosys coarse synthesis)"
target_tier = "H2"
terminal_reason = "The source Q8.8 core preserves the strict equality boundary, synthesizes to 3,034 Yosys coarse cells, and passes depth-20 reset/event safety. Timing, PPA, target-device, board, physical-silicon, and universal fixed-point equivalence remain open."
