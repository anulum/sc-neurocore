[metadata]
schema_version=2
name="EnergyLIFNeuron"
class_name="EnergyLIFNeuron"
module="energy_lif"
display_name="Fardet-Levina energy-based LIF"
summary="Coupled voltage-energy eLIF using the authors' Brian RK4 profile."
family="Integrate-and-Fire"
category="integrate-and-fire"
biophysical_detail="point"
maturity="validated"
intended_use=["metabolic excitability studies","source recurrence replay"]
hardware_fit=["bounded fixed-point co-simulation"]
behavior_tags=["energy-gated","adapting","source-faithful"]
[provenance]
authors=["Fardet, T. & Levina, A."]
year=2020
doi="10.1371/journal.pcbi.1008503"
paper_title="Simple models including energy and spike constraints reproduce complex activity patterns and metabolic disruptions"
source_repository="https://github.com/Silmathoron/elif-madexp"
derivation_note="Pinned Brian example: coupled RK4 at 0.1 ms, strict voltage and energy spike gate."
[state.v]
init=-61.0
unit="mV"
meaning="membrane potential"
[state.epsilon]
init=0.32
unit="1"
meaning="available normalized energy"
[parameters.capacitance]
default=100.0
unit="pF"
[parameters.g_leak]
default=9.0
unit="nS"
[parameters.e_0]
default=-62.5
unit="mV"
[parameters.e_u]
default=-58.5
unit="mV"
[parameters.e_d]
default=-40.0
unit="mV"
[parameters.e_f]
default=-62.0
unit="mV"
[parameters.v_threshold]
default=-59.0
unit="mV"
[parameters.v_reset]
default=-62.0
unit="mV"
[parameters.alpha]
default=1.0
unit="1"
[parameters.epsilon_0]
default=0.5
unit="1"
[parameters.epsilon_c]
default=0.18
unit="1"
[parameters.delta]
default=0.01
unit="1"
[parameters.tau_e]
default=200.0
unit="ms"
[integration]
dt=0.1
method="rk4"
[dynamics]
e_leak="e_0 + (e_u - e_0) * (1 - epsilon / epsilon_0)"
dv_dt="(g_leak * (e_leak - v) + I) / capacitance"
depsilon_dt="((1 - epsilon / (alpha * epsilon_0))^3 - (v - e_f) / (e_d - e_f)) / tau_e"
spike_flag="1 if v_candidate > v_threshold and epsilon_candidate > epsilon_c else 0"
[backends.python]
status="implemented"
parity="exact"
[backends.rust]
status="implemented"
parity="ulp-bounded"
