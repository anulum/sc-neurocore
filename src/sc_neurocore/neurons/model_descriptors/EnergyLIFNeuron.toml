[metadata]
schema_version = 2
name = "EnergyLIFNeuron"
class_name = "EnergyLIFNeuron"
module = "energy_lif"
display_name = ""
summary = "Fardet & Levina 2020 — LIF with metabolic energy constraint."
family = "Integrate-and-Fire"
category = "integrate-and-fire"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = []

[provenance]
authors = [
    "Fardet, T. & Levina, A.",
]
year = 2020
doi = "10.1371/journal.pcbi.1008503"

[state.v]
init = -70.0

[state.epsilon]
init = 1.0

[parameters.v_rest]
default = -70.0
unit = "mV"
meaning = "resting / leak reversal potential"
range = [
    -90.0,
    -40.0,
]

[parameters.v_reset]
default = -70.0
unit = "mV"
meaning = "membrane potential reset to after a spike"
range = [
    -90.0,
    -40.0,
]

[parameters.v_threshold]
default = -50.0
unit = "mV"
meaning = "voltage at which a spike is registered"
range = [
    -60.0,
    -20.0,
]

[parameters.tau_m]
default = 10.0
unit = "ms"
meaning = "membrane time constant"
range = [
    1.0,
    100.0,
]

[parameters.tau_e]
default = 500.0
unit = "ms"
meaning = "recovery time constant of the metabolic energy variable"
range = [
    1.0,
    2000.0,
]

[parameters.alpha]
default = 0.1
unit = "1"
meaning = "normalised energy cost coupling per spike"
range = [
    0.0,
    2.0,
]

[parameters.epsilon_0]
default = 1.0
unit = "1"
meaning = "normalised resting (baseline) energy level"
range = [
    0.0,
    5.0,
]

[parameters.resistance]
default = 1.0
unit = "1"
meaning = "normalised membrane resistance (R=1 in the project's normalised-current convention)"
range = [
    0.0,
    100.0,
]

[integration]
dt = 1.0
method = "euler"

[dynamics]

[backends.python]
status = "implemented"

