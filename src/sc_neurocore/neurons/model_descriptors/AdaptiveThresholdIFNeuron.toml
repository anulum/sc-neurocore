[metadata]
schema_version = 2
name = "AdaptiveThresholdIFNeuron"
class_name = "AdaptiveThresholdIFNeuron"
module = "adaptive_threshold_if"
display_name = ""
summary = "Integrate-and-fire with dynamic threshold. Platkiewicz & Bhatt 2010."
family = "Integrate-and-Fire"
category = "integrate-and-fire"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "adapting",
    "excitable",
    "rate-coded",
    "tonic",
]

[provenance]
authors = [
    "Platkiewicz, J. & Brette, R.",
]
year = 2010
doi = "10.1371/journal.pcbi.1000850"

[state.v]
init = -65.0

[state.theta]
init = -50.0

[parameters.v_rest]
default = -65.0
unit = "mV"
meaning = "resting / leak reversal potential"
range = [
    -90.0,
    -40.0,
]

[parameters.v_reset]
default = -65.0
unit = "mV"
meaning = "membrane potential reset to after a spike"
range = [
    -90.0,
    -40.0,
]

[parameters.theta_rest]
default = -50.0
unit = "mV"
meaning = "baseline (resting) value of the adaptive threshold"
range = [
    -70.0,
    -30.0,
]

[parameters.delta_theta]
default = 5.0
unit = "mV"
meaning = "threshold increment added at each spike"
range = [
    0.0,
    20.0,
]

[parameters.tau_m]
default = 10.0
unit = "ms"
meaning = "membrane time constant"
range = [
    1.0,
    100.0,
]

[parameters.tau_theta]
default = 50.0
unit = "ms"
meaning = "threshold adaptation time constant"
range = [
    1.0,
    500.0,
]

[integration]
dt = 0.1
method = "euler"

[dynamics]

[backends.python]
status = "implemented"

