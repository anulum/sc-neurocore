[metadata]
schema_version = 2
name = "FitzHugh-Nagumo"
class_name = "FitzHughNagumoNeuron"
module = "fitzhugh_nagumo"
display_name = ""
summary = "2D qualitative spike model — cubic v-nullcline relaxation oscillator"
family = "Oscillator"
category = "oscillator"
biophysical_detail = "point"
maturity = "validated"
intended_use = [
    "two-state excitable-oscillator simulation",
    "cross-runtime and bounded fixed-point fidelity studies",
]
hardware_fit = [
    "bounded compiler-generated Q16.16 event-count accelerator",
]
behavior_tags = [
    "excitable",
    "phasic",
    "tonic",
]

[provenance]
authors = [
    "FitzHugh, R.",
]
year = 1961
doi = "10.1016/S0006-3495(61)86902-6"

[state.v]
init = -1.0

[state.w]
init = -0.5

[parameters.a]
default = 0.7
unit = "1"
meaning = "recovery-variable offset (w-nullcline intercept)"
range = [
    0.0,
    1.5,
]

[parameters.b]
default = 0.8
unit = "1"
meaning = "recovery coupling coefficient"
range = [
    0.0,
    1.5,
]

[parameters.epsilon]
default = 0.08
unit = "1"
meaning = "timescale separation; small values slow the recovery variable"
range = [
    0.001,
    0.5,
]

[parameters.v_threshold]
default = 1.0
unit = "1"
meaning = "level on v at which a spike is registered"
range = [
    0.0,
    2.0,
]

[integration]
dt = 0.1
method = "rk4"

[dynamics]
v = "v - v**3 / 3 - w + I"
w = "epsilon * (v + a - b * w)"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust_engine]
status = "implemented"
parity = "exact"

[backends.rust_safety]
status = "implemented"
parity = "exact"

[backends.julia]
status = "implemented"
parity = "exact"

[backends.go]
status = "implemented"
parity = "exact"

[backends.mojo]
status = "implemented"
parity = "ulp-bounded"

[reproducibility]
