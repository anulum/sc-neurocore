tolerance = "complete six-trace and four-final-state agreement within absolute 1e-12 for Rust, Julia, and Go and 1e-9 for Mojo"
evidence = "tests/test_wong_wang_backends.py::test_complete_configured_contract_matches_python"

[silicon]
