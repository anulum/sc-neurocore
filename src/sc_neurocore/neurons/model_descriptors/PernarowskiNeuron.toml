[metadata]
schema_version = 2
name = "Pernarowski"
class_name = "PernarowskiNeuron"
module = "pernarowski"
display_name = ""
summary = "Pernarowski 1994 pancreatic beta-cell burster."
family = "Bursting"
category = "bursting"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "excitable",
    "phasic",
    "tonic",
]

[provenance]
authors = [
    "Pernarowski, M.",
]
year = 1994
doi = "10.1137/S003613999223449X"

[state.v]
init = -1.0

[state.w]
init = 0.0

[state.z]
init = 0.0

[parameters.alpha]
default = 0.1
unit = "1"
meaning = "offset in the fast recovery (w) nullcline"
range = [
    -2.0,
    2.0,
]

[parameters.beta]
default = 0.5
unit = "1"
meaning = "coupling gain of the fast variable to the slow bursting variable"
range = [
    0.0,
    2.0,
]

[parameters.eps1]
default = 0.1
unit = "1"
meaning = "timescale of the fast recovery variable"
range = [
    0.001,
    1.0,
]

[parameters.eps2]
default = 0.001
unit = "1"
meaning = "timescale of the slow bursting variable; small values give slow bursting"
range = [
    0.0001,
    0.1,
]

[parameters.gamma]
default = 0.5
unit = "1"
meaning = "recovery coupling coefficient"
range = [
    0.0,
    2.0,
]

[parameters.v_threshold]
default = 0.5
unit = "1"
meaning = "level on v at which a spike is registered"
range = [
    -2.0,
    2.0,
]

[integration]
dt = 0.1
method = "rk4"

[dynamics]
v = "v - v * v * v / 3.0 - w - z + I"
w = "eps1 * (v - gamma * w + alpha)"
z = "eps2 * (beta * (v + 0.7) - z)"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "exact"

[backends.julia]
status = "implemented"
parity = "exact"

[backends.go]
status = "implemented"
parity = "exact"

[backends.mojo]
status = "implemented"
parity = "ulp-bounded"

[reproducibility]
reference_config = "{\"n_steps\":1000,\"current\":2.0,\"backend\":\"python\",\"parameters\":\"defaults\"}"
golden_trace_sha256 = "f29ed3c0db7738c8afb12355f6c2006caf03ae361f7be5ddb12aa37be137b9cc"

[documentation]
slug = "models/pernarowski"
notes = ""

[validation]
dynamics_faithful = true
metric = "parity"
operating_point = "schema-DSL Pernarowski three-state RK4 autonomous burster"
tolerance = "exact three-way spike-count parity at I=-0.1, 0.0, 0.1, and 0.2 over 5000 steps"
evidence = "tests/test_cosimulation.py::TestQ1616Precision::test_pernarowski_q1616_parity"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosimulation.py::TestQ1616Precision::test_pernarowski_q1616_parity"
target_tier = "H1"
terminal_reason = "Point-neuron schema→RTL path; higher silicon rungs need synth/timing/formal programmes."
