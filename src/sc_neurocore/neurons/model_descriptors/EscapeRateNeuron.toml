[metadata]
schema_version = 2
name = "Escape Rate"
class_name = "EscapeRateNeuron"
module = "escape_rate"
display_name = ""
summary = "Stochastic threshold neuron — spike probability via escape noise"
family = "Rate / mean-field"
category = "rate-mean-field"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "excitable",
    "irregular",
    "rate-coded",
    "tonic",
]

[provenance]
authors = [
    "Gerstner, W.",
]
year = 2000
doi = "10.1162/089976600300015899"

[state.v]
init = -70.0

[parameters.v_rest]
default = -70.0
unit = "mV"
meaning = "resting membrane potential"
range = [
    -90.0,
    -40.0,
]

[parameters.v_reset]
default = -70.0
unit = "mV"
meaning = "membrane potential reset to after a spike"
range = [
    -90.0,
    -40.0,
]

[parameters.v_threshold]
default = -50.0
unit = "mV"
meaning = "reference voltage of the soft escape threshold"
range = [
    -70.0,
    -20.0,
]

[parameters.tau_m]
default = 10.0
unit = "ms"
meaning = "membrane time constant"
range = [
    1.0,
    100.0,
]

[parameters.rho_0]
default = 0.001
unit = "1/ms"
meaning = "instantaneous escape (firing) rate at threshold"
range = [
    1e-05,
    1.0,
]

[parameters.delta_u]
default = 3.0
unit = "mV"
meaning = "voltage scale (sharpness) of the soft escape threshold"
range = [
    0.5,
    20.0,
]

[parameters.resistance]
default = 1.0
unit = "1"
meaning = "normalised membrane resistance mapping injected current to a voltage offset (R=1 in the project's normalised-current convention, see docs/validation/lif_fi_curve.md)"
range = [
    0.0,
    100.0,
]

[integration]
dt = 1.0
method = "euler"

[dynamics]
v = "(-(v - v_rest) + resistance * I) / tau_m"

[backends.python]
status = "implemented"

[reproducibility]

[documentation]
slug = "models/escape_rate"
notes = ""
