[metadata]
schema_version = 2
name = "Escape Rate"
class_name = "EscapeRateNeuron"
module = "escape_rate"
display_name = "Escape-rate integrate-and-fire"
summary = "Gerstner exponential escape-intensity point neuron with exact constant-current RC flow and a reproducible model-scoped LFSR16 threshold sampler."
family = "Integrate-and-Fire"
category = "integrate-and-fire"
biophysical_detail = "point"
maturity = "validated"
intended_use = [
    "stochastic threshold and renewal-process simulation",
    "seeded cross-runtime event-stream and distribution reference",
]
hardware_fit = [
    "registered fixed-point stochastic point-neuron RTL",
    "folded population datapath with caller-owned per-neuron RNG state",
]
behavior_tags = [
    "excitable",
    "irregular",
    "stochastic",
    "tonic",
]

[provenance]
authors = [
    "Gerstner, W.",
]
year = 2000
doi = "10.1162/089976600300015899"
paper_title = "Population Dynamics of Spiking Neurons: Fast Transients, Asynchronous States, and Locking"
url = "https://doi.org/10.1162/089976600300015899"

[state.v]
init = -70.0
unit = "mV"
meaning = "membrane voltage after the most recent complete finite step"

[state.rng_state]
init = 44257.0
unit = "integer"
meaning = "non-zero 16-bit state used by the next eight-advance Bernoulli sample"

[parameters.v_rest]
default = -70.0
unit = "mV"
meaning = "resting membrane potential and public reset destination"
range = [
    -120.0,
    80.0,
]

[parameters.v_reset]
default = -70.0
unit = "mV"
meaning = "membrane potential committed after an escape event"
range = [
    -120.0,
    80.0,
]

[parameters.v_threshold]
default = -50.0
unit = "mV"
meaning = "reference voltage in the exponential soft-threshold intensity"
range = [
    -120.0,
    80.0,
]

[parameters.tau_m]
default = 10.0
unit = "ms"
meaning = "positive passive-membrane time constant"
range = [
    1e-06,
    1000000.0,
]

[parameters.rho_0]
default = 0.001
unit = "1/ms"
meaning = "positive instantaneous escape intensity at v_threshold"
range = [
    1e-12,
    1000000.0,
]

[parameters.delta_u]
default = 3.0
unit = "mV"
meaning = "positive voltage scale controlling exponential threshold softness"
range = [
    1e-06,
    1000000.0,
]

[parameters.resistance]
default = 1.0
unit = "mV/current-unit"
meaning = "positive normalised resistance mapping injected current to steady-state voltage"
range = [
    1e-06,
    1000000.0,
]

[parameters.seed]
default = 44257.0
unit = "integer"
meaning = "replay seed; zero maps to 0xACE1 and explicit None requests fresh entropy in Python"
range = [
    0.0,
    65535.0,
]

[integration]
dt = 1.0
method = "exp_euler"

[dynamics]
v = "tau_m*dv/dt=-(v-v_rest)+resistance*I; exact constant-current RC flow is evaluated before the hazard"
rate = "rho(v)=rho_0*exp((v-v_threshold)/delta_u), with the exponent clipped to [-700,700] for finite arithmetic"
spike_probability = "p=1-exp(-rho(v_next)*dt), derived from Gerstner (2000) Eq. (2.14) under a piecewise-constant finite-step intensity"
rng_state = "advance the right-shift x^16+x^14+x^13+x^11+1 LFSR eight primitive states, then compare sample < floor(p*65535)+1"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "exact"

[backends.julia]
status = "implemented"
parity = "exact"

[backends.go]
status = "implemented"
parity = "exact"

[backends.mojo]
status = "implemented"
parity = "ulp-bounded"

[reproducibility]
reference_config = "{\"n_steps\":4096,\"current\":17.0,\"backend\":\"python\",\"parameters\":\"defaults\",\"seed\":44257}"
seed = 44257
golden_trace_sha256 = "497b790b6d5e7268a9a79c0036390a9376f4ea0bb0ec68b71ed129570f2b7a90"
golden_citation = "doi:10.1162/089976600300015899"

[documentation]
slug = "models/escape_rate"
notes = "Gerstner (2000), Eqs. (2.13)-(2.15), supplies the escape intensity, survival function, and firing-time density. The exact RC step, finite-step constant-hazard transform, 16-bit polynomial, eight-state decimation, comparator quantisation, and default seed are explicit SC-NeuroCore engineering choices. Eight is coprime with the 65,535-state period, retaining every non-zero state while suppressing raw adjacent-word correlation. This is a stochastic intensity model, not a diffusion-noise membrane model or a cryptographic RNG."

[validation]
dynamics_faithful = true
metric = "statistical"
operating_point = "Gerstner exponential intensity; complete 65,535-state p=1-exp(-0.25) cycle at seed 0xACE1; five-seed 4096-step corpus; configured 4096-step Python/Rust/Julia/Go/Mojo trace at I=17; registered Q24.24 RTL at the exact LUT-grid rho*dt=0.25 operating point"
tolerance = "full-period and seed-corpus event hashes/counts/RNG states exact; realised rate quantisation error below 1/65535; ISI mean within 0.001 step and CV within 0.01 of geometric targets; Rust/Julia/Go events and voltages exact; Mojo voltage <=2e-14; Q24.24 RTL event stream, count, threshold, voltage, and final RNG exact"
evidence = "tests/test_reference_escape_rate.py::test_full_period_features_match_independent_equations"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosim_escape_rate.py::test_seeded_full_period_event_stream_and_distribution_match_python"
target_tier = "H1"
terminal_reason = "The stochastic point-neuron recurrence has compile-clean registered and folded Q24.24 RTL, seeded full-period event co-simulation, and bounded catalogue formal safety; higher rungs require synthesis, timing, equivalence, and hardware programmes."
