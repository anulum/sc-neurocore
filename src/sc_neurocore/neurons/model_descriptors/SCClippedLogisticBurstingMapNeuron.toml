[state.y]
init = 0.0

[parameters.a]
default = 3.8
unit = "1"
meaning = "clipped-logistic fast-map coefficient"
range = [
    0.0,
    5.0,
]

[parameters.epsilon]
default = 0.01
unit = "1"
meaning = "slow-variable update coefficient"
range = [
    0.0001,
    0.5,
]

[parameters.sigma]
default = 0.5
unit = "1"
meaning = "slow-variable set point"
range = [
    -2.0,
    2.0,
]

[parameters.x_threshold]
