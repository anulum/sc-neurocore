[metadata]
schema_version = 2
name = "SCExponentialTwoCompartmentLIFNeuron"
class_name = "SCExponentialTwoCompartmentLIFNeuron"
module = "sc_exponential_tc_lif"
display_name = ""
summary = "SC exponential two-compartment LIF — preserved engine recurrence."
family = "Compartmental"
category = "compartmental"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "excitable",
    "rate-coded",
    "tonic",
]

[provenance]
authors = [
    "SC-NeuroCore project",
]
year = 2026
doi = ""
derivation_note = "Historical engine recurrence retained count-neutrally; it is not attributed to the Zhang et al. 2024 TC-LIF equations."

[state.v_s]
init = 0.0

[state.v_d]
init = 0.0

[parameters.v_rest]
default = 0.0
unit = "1"
meaning = "rest potential restored by reset"
range = [
    -100.0,
    100.0,
]

[parameters.v_reset]
default = 0.0
unit = "1"
meaning = "somatic hard-reset potential"
range = [
    -100.0,
    100.0,
]

[parameters.theta]
default = 1.0
unit = "1"
meaning = "somatic firing threshold"
range = [
    0.0,
    100.0,
]

[parameters.tau_s]
default = 2.0
unit = "steps"
meaning = "somatic decay time constant"
range = [
    0.1,
    1000.0,
]

[parameters.tau_d]
default = 20.0
unit = "steps"
meaning = "dendritic decay time constant"
range = [
    0.1,
    1000.0,
]

[parameters.kappa]
default = 0.5
unit = "1"
meaning = "wholesale coupling of the freshly decayed dendrite into the soma"
range = [
    0.0,
    10.0,
]

[parameters.dt]
default = 1.0
unit = "steps"
meaning = "discrete step size inside the decay factors"
range = [
    0.0,
    10.0,
]

[integration]
dt = 1.0
method = "map"

[dynamics]
v_d = "V_d[t] = exp(-dt/tau_d) * V_d[t-1] + I_dend[t]"
v_s = "V_s[t] = exp(-dt/tau_s) * V_s[t-1] + I_soma[t] + kappa * V_d[t]"
event = "spike when V_s >= theta; V_s -> v_reset (hard reset), V_d unchanged"
input = "two external currents: I_soma and I_dend"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "exact"

[reproducibility]
reference_config = "{\"n_steps\":1000,\"current\":0.5,\"parameters\":\"defaults\"}"
golden_trace_sha256 = "809e53ebe4150da04abc5a12b1b5a1abd12234cc2a3a5ff8fe5cd839b469a2fd"
event_count = 250
final_state = "{\"v_s\":0.0,\"v_d\":0.0}"

[documentation]
slug = "models/sc_exponential_tc_lif"
notes = "Count-neutral SC identity preserving the exponential-decay/hard-reset recurrence formerly published as the engine TwoCompartmentLIFNeuron; the production Rust engine keeps the recurrence verbatim as SCExponentialTwoCompartmentLIF with frozen anchors captured from the pre-2026-08-27 built engine. Structurally distinct from the Zhang et al. 2024 TC-LIF; no publication-exact claim. Go, Julia, Mojo, and silicon lanes are intentionally not implemented for this preserved identity."

[validation]
dynamics_faithful = true
metric = "trajectory"
operating_point = "frozen 10/50-step anchors plus 1000 steps at I_soma=0.5"
