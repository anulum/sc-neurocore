[metadata]
schema_version = 2
name = "AstrocyteLIFNeuron"
class_name = "AstrocyteLIFNeuron"
module = "astrocyte_lif"
display_name = ""
summary = "Astrocyte-LIF hybrid with tripartite synapse feedback."
family = "Glia / astrocyte"
category = "glia-astrocyte"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "excitable",
    "rate-coded",
    "tonic",
]

[provenance]
authors = [
    "Perea, G.",
    "Navarrete, M.",
    "Araque, A.",
]
year = 2009
doi = "10.1016/j.tins.2009.05.001"
paper_title = "Tripartite synapses: astrocytes process and control synaptic information"

[state.theta]
