meaning = "astrocytic calcium decay time constant"
range = [
    50.0,
    2000.0,
]

[parameters.e_l]
default = -65.0
unit = "mV"
meaning = "leak reversal potential"
range = [
    -80.0,
    -50.0,
]

[parameters.v_reset]
default = -65.0
unit = "mV"
meaning = "post-spike reset potential"
range = [
    -80.0,
    -55.0,
]

[parameters.ca_delta]
default = 0.1
unit = "uM"
