range = [
    0.0,
    2.0,
]

[parameters.ca_thresh]
default = 0.5
unit = "uM"
meaning = "calcium threshold for gliotransmitter release"
range = [
    0.0,
    5.0,
]

[parameters.g_glio]
default = 2.0
unit = "1"
meaning = "gliotransmission feedback conductance (relative)"
range = [
    0.0,
    10.0,
]

