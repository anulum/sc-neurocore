[metadata]
schema_version = 2
name = "NonResettingLIFNeuron"
class_name = "NonResettingLIFNeuron"
module = "non_resetting_lif"
display_name = ""
summary = "Adaptive multi-timescale threshold (aMAT) variant — non-resetting LIF."
family = "Integrate-and-Fire"
category = "integrate-and-fire"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = []

[provenance]
authors = [
    "Jolivet, R., Lewis, T.J. & Gerstner, W.",
]
year = 2004
doi = "10.1152/jn.00190.2004"

[state.v]
init = -65.0

[state.theta]
init = -50.0

[parameters.v_rest]
default = -65.0
unit = "mV"
meaning = "resting / leak reversal potential"
range = [
    -90.0,
    -40.0,
]

[parameters.theta_rest]
default = -50.0
unit = "mV"
meaning = "baseline (resting) value of the adaptive threshold"
range = [
    -60.0,
    -20.0,
]

[parameters.delta_theta]
default = 5.0
unit = "mV"
meaning = "threshold increment added at each spike"
range = [
    0.0,
    20.0,
]

[parameters.tau_m]
default = 10.0
unit = "ms"
meaning = "membrane time constant"
range = [
    1.0,
    100.0,
]

[parameters.tau_theta]
default = 50.0
unit = "ms"
meaning = "threshold adaptation time constant"
range = [
    1.0,
    500.0,
]

[parameters.r_m]
default = 1.0
unit = "1"
meaning = "normalised membrane resistance (R=1 in the project's normalised-current convention)"
range = [
    0.0,
    100.0,
]

[integration]
dt = 0.1
method = "euler"

