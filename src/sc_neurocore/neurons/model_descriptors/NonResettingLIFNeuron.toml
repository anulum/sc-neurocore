tolerance = "events exact; complete floating-point states within absolute 2e-12"
evidence = "tests/test_reference_non_resetting_lif.py; tests/test_non_resetting_lif_backend_dispatch.py; tests/test_cosim_non_resetting_lif.py"

[silicon]
