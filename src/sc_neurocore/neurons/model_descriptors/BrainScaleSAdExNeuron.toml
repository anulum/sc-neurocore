[metadata]
schema_version = 2
name = "BrainScaleSAdExNeuron"
class_name = "BrainScaleSAdExNeuron"
module = "brainscales_adex"
display_name = ""
summary = "BrainScaleS-2 — analog AdEx (1000x real-time). Schemmel 2010."
family = "Hardware / neuromorphic"
category = "hardware-neuromorphic"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "adapting",
    "excitable",
    "phasic",
    "rate-coded",
]

[provenance]
authors = [
    "Schemmel, J., Bruderle, D., Grubl, A. et al.",
]
year = 2010
doi = "10.1109/ISCAS.2010.5536970"

[state.v]
init = -65.0

[state.w]
init = 0.0

[parameters.v_rest]
default = -65.0
unit = "mV"
meaning = "resting / leak reversal potential"
range = [
    -90.0,
    -40.0,
]

[parameters.v_reset]
default = -68.0
unit = "mV"
meaning = "membrane potential reset to after a spike"
range = [
    -90.0,
    -40.0,
]

[parameters.v_threshold]
default = -50.0
unit = "mV"
meaning = "voltage cutoff at which a spike is registered"
range = [
    -60.0,
    -20.0,
]

[parameters.delta_t]
default = 2.0
unit = "mV"
meaning = "slope factor of the exponential spike initiation"
range = [
    0.25,
    5.0,
]

[parameters.v_rh]
default = -55.0
unit = "mV"
meaning = "rheobase threshold of the exponential term"
range = [
    -65.0,
    -40.0,
]

[parameters.tau]
default = 20.0
unit = "ms"
meaning = "membrane time constant (biological-time equivalent)"
range = [
    1.0,
    100.0,
]

[parameters.tau_w]
default = 100.0
unit = "ms"
meaning = "adaptation time constant (biological-time equivalent)"
range = [
    5.0,
    600.0,
]

[parameters.a]
default = 0.5
unit = "nS"
meaning = "subthreshold adaptation conductance"
range = [
    0.0,
    10.0,
]

[parameters.b]
default = 7.0
unit = "pA"
meaning = "spike-triggered adaptation current increment"
range = [
    0.0,
    200.0,
]

[parameters.hw_speedup]
default = 1000.0
unit = "1"
meaning = "hardware acceleration factor relative to biological time"
range = [
    1.0,
    100000.0,
]

[integration]
dt = 0.1
method = "euler"

[dynamics]

[backends.python]
status = "implemented"

[reproducibility]

[documentation]
slug = "models/brainscales_adex"
notes = ""
