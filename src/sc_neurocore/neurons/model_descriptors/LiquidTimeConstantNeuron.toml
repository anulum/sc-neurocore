[metadata]
schema_version = 2
name = "LiquidTimeConstantNeuron"
class_name = "LiquidTimeConstantNeuron"
module = "ltc"
display_name = ""
summary = "Hasani et al. 2021 — liquid time-constant neuron."
family = "AI-optimized"
category = "ai-optimized"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "excitable",
    "rate-coded",
    "tonic",
]

[provenance]
authors = [
    "Hasani, R., Lechner, M., Amini, A., Rus, D. & Grosu, R.",
]
year = 2021
doi = "10.1609/aaai.v35i9.16936"

[state.x]
init = 0.0

[parameters.tau_base]
default = 10.0
unit = "ms"
meaning = "baseline membrane time constant"
range = [
    1.0,
    200.0,
]

[parameters.w_tau]
default = -0.5
unit = "1"
meaning = "input weight modulating the liquid (input-dependent) time constant"
range = [
    -10.0,
    10.0,
]

[parameters.w_x]
default = 0.8
unit = "1"
meaning = "recurrent (self) weight on the membrane state"
range = [
    -10.0,
    10.0,
]

[parameters.w_in]
default = 1.0
unit = "1"
meaning = "input weight on the injected drive"
range = [
    -10.0,
    10.0,
]

[parameters.bias]
default = 0.0
unit = "1"
meaning = "constant bias term"
range = [
    -10.0,
    10.0,
]

[parameters.v_threshold]
default = 1.0
unit = "1"
meaning = "normalised firing threshold"
range = [
    0.0,
    10.0,
]

[integration]
dt = 1.0
method = "euler"

[dynamics]

