# SC-NeuroCore — Source/config provenance header

[metadata]
schema_version = 2
name = "Chialvo Map"
class_name = "ChialvoMapNeuron"
module = "chialvo_map"
display_name = "Chialvo two-dimensional map"
summary = "Source-faithful Chialvo (1995) discrete excitable map."
family = "Map-based"
category = "map-based"
biophysical_detail = "point"
maturity = "experimental"
intended_use = [
    "source-equation reference",
    "discrete excitable dynamics",
]
hardware_fit = [
    "fixed-point exponential-LUT co-simulation",
]
behavior_tags = [
    "excitable",
    "phasic",
    "tonic",
]

[provenance]
authors = [
    "Chialvo, D.R.",
]
year = 1995
doi = "10.1016/0960-0779(93)E0056-H"

[state.x]
init = 0.0

[state.y]
init = 0.0

[parameters.a]
default = 0.89
unit = "1"
meaning = "recovery-variable persistence coefficient"
range = [
    0.0,
    1.0,
]

[parameters.b]
default = 0.6
unit = "1"
meaning = "fast-to-recovery coupling coefficient"
range = [
    0.0,
    2.0,
]

[parameters.c]
default = 0.28
unit = "1"
meaning = "additive recovery-variable offset"
range = [
    -5.0,
    5.0,
]

[parameters.k]
default = 0.04
unit = "1"
meaning = "constant additive fast-variable bias"
range = [
    -1.0,
    1.0,
]

[parameters.x_threshold]
default = 1.0
unit = "1"
meaning = "maintained upward-crossing observation level; not a source parameter"
range = [
    0.0,
    5.0,
]

[integration]
dt = 1.0
method = "map"

[dynamics]
x = "x * x * exp(y - x) + k + I"
y = "a * y - b * x + c"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "ulp-bounded"

[backends.julia]
status = "implemented"
parity = "ulp-bounded"

[backends.go]
status = "implemented"
parity = "ulp-bounded"

[backends.mojo]
status = "implemented"
parity = "ulp-bounded"

[reproducibility]
reference_config = "{\"n_steps\":1000,\"current\":1.0,\"backend\":\"python\",\"parameters\":\"defaults\"}"
golden_trace_sha256 = "abd66ecaf834f6872c2af639df18df4abbc562ff666a1f741224b147c1da3900"
golden_trace_sha256_variants = [
    "e3fe85af7298f88f59be81d9d74a1ae6287387ffac31366ffcce89204c032725",
]

[documentation]
slug = "models/chialvo_map"
notes = "The DOI supplies the simultaneous recurrence. The x_threshold event is a maintained observation convention."

[validation]
dynamics_faithful = true
metric = "trajectory"
operating_point = "Chialvo map at I=-0.05,0,0.01,0.1,1.0 over 100 iterations"
tolerance = "hand/TOML/JSON exact; Q16.16 event counts exact; stable-point x/y errors below 0.055/0.093"
evidence = "tests/test_cosim_chialvo_map.py::test_q1616_event_class_and_stable_trajectory_envelope"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosim_chialvo_map.py::test_q1616_event_class_and_stable_trajectory_envelope"
target_tier = "H1"
terminal_reason = "Q16.16 exponential-LUT co-simulation preserves the enrolled event classes; higher tiers require synthesis and timing evidence."
