# SC-NeuroCore — Source/config provenance header

[metadata]
schema_version = 2
name = "Chialvo Map"
class_name = "ChialvoMapNeuron"
module = "chialvo_map"
display_name = "Chialvo two-dimensional map"
summary = "Source-faithful Chialvo (1995) discrete excitable map."
family = "Map-based"
category = "map-based"
biophysical_detail = "point"
maturity = "experimental"
intended_use = [
    "source-equation reference",
    "discrete excitable dynamics",
]
hardware_fit = [
    "fixed-point exponential-LUT co-simulation",
]
behavior_tags = [
    "excitable",
    "phasic",
    "tonic",
]

[provenance]
authors = [
    "Chialvo, D.R.",
]
year = 1995
doi = "10.1016/0960-0779(93)E0056-H"

[state.x]
init = 0.0

[state.y]
init = 0.0

[parameters.a]
default = 0.89
unit = "1"
meaning = "recovery-variable persistence coefficient"
range = [
    0.0,
    1.0,
]

[parameters.b]
default = 0.6
unit = "1"
meaning = "fast-to-recovery coupling coefficient"
range = [
    0.0,
    2.0,
]

[parameters.c]
default = 0.28
unit = "1"
meaning = "additive recovery-variable offset"
range = [
    -5.0,
    5.0,
]

[parameters.k]
default = 0.04
unit = "1"
meaning = "constant additive fast-variable bias"
range = [
    -1.0,
    1.0,
]

[parameters.x_threshold]
default = 1.0
unit = "1"
meaning = "maintained upward-crossing observation level; not a source parameter"
range = [
    0.0,
    5.0,
]

[integration]
dt = 1.0
method = "map"

[dynamics]
x = "x * x * exp(y - x) + k + I"
y = "a * y - b * x + c"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "ulp-bounded"

[backends.julia]
status = "implemented"
parity = "ulp-bounded"

[backends.go]
status = "implemented"
parity = "ulp-bounded"

[backends.mojo]
status = "implemented"
parity = "ulp-bounded"

[reproducibility]
reference_config = "src/sc_neurocore/neurons/reference_receipts/chialvo_1995.json"
golden_trace_sha256 = "ccd95d8035517d0684efbc35c60a1e0769954a77f54b77b3aecdf5d8d5352ff4"
golden_citation = "src/sc_neurocore/neurons/reference_receipts/chialvo_1995.json"

[documentation]
slug = "models/chialvo_map"
notes = "The DOI supplies the simultaneous recurrence. The x_threshold event is a maintained observation convention."

[validation]
dynamics_faithful = true
metric = "trajectory"
operating_point = "Chialvo map at I=-0.05,0,0.01,0.1,1.0 over 100 iterations"
tolerance = "independent binary64 complete state/event receipt; hand/TOML/JSON exact; Q16.16 event counts exact; stable-point x/y errors below 0.055/0.093"
evidence = "tests/test_reference_chialvo_map.py; tests/test_cosim_chialvo_map.py"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosim_chialvo_map.py::test_q1616_event_class_and_stable_trajectory_envelope"
synthesised = true
synth_report = "hdl/reports/yosys_chialvo_map_q1616_2026-08-30.json"
target_device = "generic RTL (Yosys coarse synthesis)"
target_tier = "H2"
terminal_reason = "Q16.16 co-simulation, coarse synthesis, and bounded reset/event formal safety are complete; timing, PPA, board, device, physical silicon, and universal formal equivalence remain open."
