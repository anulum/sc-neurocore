[metadata]
schema_version = 2
name = "SCNormalizedEnergyLIFNeuron"
class_name = "SCNormalizedEnergyLIFNeuron"
module = "sc_normalized_energy_lif"
display_name = "SC normalized energy-gated LIF"
summary = "Retained project exact-flow normalized energy recurrence."
family = "SC project models"
category = "integrate-and-fire"
biophysical_detail = "point"
maturity = "validated"
intended_use = [
    "historical project replay",
]
hardware_fit = [
    "bounded fixed-point co-simulation",
]
behavior_tags = [
    "project-defined",
    "energy-gated",
    "exact-flow",
]

[provenance]
authors = [
    "Anulum Fortis & Arcane Sapience",
]
year = 2026
doi = ""
derivation_note = "Exact recurrence formerly exposed as EnergyLIFNeuron; no external source attribution."

[state.v]
init = -70.0

[state.epsilon]
init = 1.0

[parameters.v_rest]
default = -70.0
unit = "mV"
meaning = "resting membrane potential"
range = [
    -200.0,
    100.0,
]

[parameters.v_reset]
default = -70.0
unit = "mV"
meaning = "post-spike reset voltage"
range = [
    -200.0,
    100.0,
]

[parameters.v_threshold]
default = -50.0
unit = "mV"
meaning = "firing voltage threshold"
range = [
    -200.0,
    100.0,
]

[parameters.tau_m]
default = 10.0
unit = "ms"
meaning = "membrane time constant"
range = [
    1e-12,
    1000000000.0,
]

[parameters.tau_e]
default = 500.0
unit = "ms"
meaning = "energy recovery time constant"
range = [
    1e-12,
    1000000000.0,
]

[parameters.alpha]
default = 0.1
unit = "1/ms"
meaning = "energy depletion coupling"
range = [
    0.0,
    1000000.0,
]

[parameters.epsilon_0]
default = 1.0
unit = "1"
meaning = "normalized energy capacity"
range = [
    0.0,
    1000000.0,
]

[parameters.resistance]
default = 1.0
unit = "mV/current"
meaning = "input resistance"
range = [
    1e-12,
    1000000000.0,
]

[integration]
dt = 1.0
method = "closed-form constant-current"

[dynamics]
epsilon = "epsilon_0 + (epsilon - epsilon_0) * exp(-dt / tau_e)"
spike_flag = "1 if v_candidate >= v_threshold and epsilon_candidate > 0.1 else 0"
identity_note = "Count-neutral SC compatibility identity"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "ulp-bounded"

[backends.julia]
status = "implemented"
parity = "ulp-bounded"

[backends.go]
status = "implemented"
parity = "ulp-bounded"

[backends.mojo]
status = "implemented"
parity = "ulp-bounded"

[reproducibility]
