# SC-NeuroCore — Source/config provenance header

[metadata]
schema_version = 2
name = "FitzHugh-Rinzel"
class_name = "FitzHughRinzelNeuron"
module = "fitzhugh_rinzel"
display_name = ""
summary = "FitzHugh-Rinzel three-state qualitative bursting model."
family = "Bursting"
category = "bursting"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "excitable",
    "phasic",
    "tonic",
]

[provenance]
authors = [
    "Rinzel, J.",
]
year = 1987
doi = "10.1007/978-3-642-93360-8_26"
paper_title = "A Formal Classification of Bursting Mechanisms in Excitable Systems"
derivation_note = "Equations (3.4)-(3.6) and the a/b/c/d/delta/mu defaults follow Rinzel's 1987 account of the unpublished 1976 FitzHugh-Rinzel model; fixed-step RK4 and upward v-threshold observation are repository specialisations."

[state.v]
init = -1.0
unit = "1"
meaning = "dimensionless fast membrane-potential analogue"

[state.w]
init = -0.5
unit = "1"
meaning = "dimensionless intermediate recovery state"

[state.y]
init = 0.0
unit = "1"
meaning = "dimensionless ultra-slow current-modulation state"

[parameters.a]
default = 0.7
unit = "1"
meaning = "offset in the fast recovery (w) nullcline"
range = [
    0.0,
    1.5,
]

[parameters.b]
default = 0.8
unit = "1"
meaning = "recovery-variable self-decay coefficient"
range = [
    0.0,
    1.5,
]

[parameters.c]
default = -0.775
unit = "1"
meaning = "offset in the super-slow (y) nullcline"
range = [
    -2.0,
    2.0,
]

[parameters.d]
default = 1.0
unit = "1"
meaning = "super-slow-variable self-decay coefficient"
range = [
    0.0,
    2.0,
]

[parameters.delta]
default = 0.08
unit = "1"
meaning = "timescale of the fast recovery variable"
range = [
    0.001,
    0.5,
]

[parameters.mu]
default = 0.0001
unit = "1"
meaning = "timescale of the super-slow variable; small values give slow bursting"
range = [
    1e-05,
    0.01,
]

[parameters.v_threshold]
default = 1.0
unit = "1"
meaning = "level on v at which a spike is registered"
range = [
    0.0,
    2.0,
]

[integration]
dt = 0.1
method = "rk4"

[dynamics]
v = "v - v * v * v / 3.0 - w + y + I"
w = "delta * (a + v - b * w)"
y = "mu * (c - v - d * y)"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "exact"

[backends.julia]
status = "implemented"
parity = "exact"

[backends.go]
status = "implemented"
parity = "exact"

[backends.mojo]
status = "implemented"
parity = "ulp-bounded"

[reproducibility]
reference_config = "{\"n_steps\":1000,\"current\":2.0,\"backend\":\"python\",\"parameters\":\"defaults\"}"
golden_trace_sha256 = "12eaadf8be17cd109ce4e0454972b7657b9f8bae0317c11ea0e23932d0b9380a"
golden_citation = "doi:10.1007/978-3-642-93360-8_26; equations (3.4)-(3.6), source parameter profile, and independent three-state RK4 feature receipt"

[documentation]
slug = "models/fitzhugh_rinzel"
notes = "The source supplies equations (3.4)-(3.6) and the canonical parameter profile. The v_threshold crossing is a maintained observation convention, and the oscillator has no reset."

[validation]
dynamics_faithful = true
metric = "parity"
operating_point = "schema-DSL FitzHugh-Rinzel three-state RK4 oscillator"
tolerance = "exact three-way spike-count parity for I=0.4 to I=0.6 over 3000 steps"
evidence = "tests/test_cosim_fitzhugh_rinzel_q1616_precision.py::TestQ1616Precision::test_fitzhugh_rinzel_q1616_parity"

[silicon]
compiles = true
cosim_validated = true
cosim_evidence = "tests/test_cosim_fitzhugh_rinzel_q1616_precision.py::TestQ1616Precision::test_fitzhugh_rinzel_q1616_parity"
synthesised = true
synth_report = "tests/test_cosim_fitzhugh_rinzel_q1616_precision.py::test_yosys_synthesises_committed_rtl"
target_tier = "H2"
terminal_reason = "Q16.16 RK4 co-simulation preserves the enrolled 7/8/8 upward-crossing counts at I=0.4/0.5/0.6, the committed RTL passes Yosys coarse synthesis, and the generated family carries depth-4 reset/output safety. Timing, PPA, device evidence, and physical silicon remain open."
