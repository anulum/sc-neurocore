[metadata]
schema_version = 2
name = "ChayKeizerMinimalNeuron"
class_name = "ChayKeizerMinimalNeuron"
module = "chay_keizer_minimal"
display_name = "Reduced Chay-Keizer pancreatic beta-cell"
summary = "Three-state reduction of the Chay-Keizer pancreatic beta-cell burster (membrane potential, potassium activation, cytosolic calcium): fast spikes from the V-n subsystem with calcium as the slow variable that paces square-wave bursts through a calcium-activated potassium conductance."
family = "Bursting"
category = "bursting"
biophysical_detail = "conductance"
maturity = "validated"
intended_use = [
    "education",
    "single-cell-dynamics",
]
hardware_fit = []
behavior_tags = [
    "excitable",
    "phasic",
    "rate-coded",
]

[provenance]
doi = "10.1016/j.mbs.2023.109085"
authors = [
    "Bertram, R.",
    "Marinelli, I.",
    "Fletcher, P.A.",
    "Satin, L.S.",
    "Sherman, A.S.",
]
year = 2023
paper_title = "Deconstructing the integrated oscillator model for pancreatic beta-cells"

[state.v]
init = -60.0
unit = "mV"
meaning = "membrane potential"

[state.n]
init = 0.0
unit = "1"
meaning = "delayed-rectifier potassium activation gate"

[state.c]
init = 0.1
unit = "uM"
meaning = "free cytosolic calcium concentration"

[parameters.g_ca]
default = 1000.0
unit = "pS"
meaning = "maximal calcium conductance"
range = [
    0.0,
    5000.0,
]

[parameters.g_k]
default = 2700.0
