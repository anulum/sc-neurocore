[parameters.k_f]
default = 0.7
unit = "1"
meaning = "fast-state gain"
range = [0.0, 10.0]
[parameters.k_s]
default = 0.95
unit = "1"
meaning = "slow-state retention"
range = [-10.0, 10.0]
[parameters.alpha]
default = 2.0
unit = "1"
