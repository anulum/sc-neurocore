[integration]
dt = 0.01
method = "rk4"

[dynamics]
v = "source conductance balance with QV/QZ population feedback"
w = "phi*(mK(V)-W)/tauK"
z = "b*(a_ni*Iext+a_ei*V*QV(V))"
output = "continuous V; no spike event or reset"

