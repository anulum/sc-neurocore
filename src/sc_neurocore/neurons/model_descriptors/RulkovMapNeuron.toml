[metadata]
schema_version = 2
name = "Rulkov Map"
class_name = "RulkovMapNeuron"
module = "rulkov_map"
display_name = ""
summary = "Discrete-time map neuron — fast/slow dynamics via 2D iteration"
family = "Map-based"
category = "map-based"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = [
    "adapting",
    "excitable",
    "rate-coded",
    "tonic",
]

[provenance]
authors = [
    "Rulkov, N.F.",
]
year = 2002
doi = "10.1103/PhysRevE.65.041922"

[state.x]
init = -1.0

[state.y]
init = -3.0

[parameters.alpha]
default = 4.0
unit = "1"
meaning = "fast-map nonlinearity control parameter"
range = [
    1.0,
    10.0,
]

[parameters.sigma]
default = -1.6
unit = "1"
meaning = "slow-map parameter setting the DC drive"
range = [
    -3.0,
    1.0,
]

[parameters.mu]
default = 0.001
unit = "1"
meaning = "slow-map timescale; small values slow the recovery variable"
range = [
    0.0001,
    0.05,
]

[parameters.x_threshold]
default = 0.0
unit = "1"
meaning = "level on x at which a spike is registered"
range = [
    -1.0,
    2.0,
]

[integration]
dt = 1.0
method = "map"

[dynamics]
x = "(alpha / (1.0 - x) + y + I) if x <= 0 else (alpha + y + I if x < alpha + y + I else -1.0)"
y = "y - mu * (x + 1.0) + mu * sigma"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "exact"

[backends.julia]
status = "implemented"
parity = "exact"

[backends.go]
status = "implemented"
parity = "exact"

[backends.mojo]
status = "implemented"
parity = "ulp-bounded"

[reproducibility]
reference_config = "{\"n_steps\":1000,\"current\":2.0,\"backend\":\"python\",\"parameters\":\"defaults\"}"
golden_trace_sha256 = "d79d2acc23996089ca0b4195544c211734b235f67ac09ef66acaa9ad9d9c7691"

[documentation]
slug = "models/rulkov_map"
notes = ""

[validation]
dynamics_faithful = true
metric = "trajectory"
operating_point = "schema-DSL Rulkov three-branch fast/slow map at I=1.5 over 30 iterations"
tolerance = "hand/TOML/JSON states exact; Q16.16 RTL spike vector exact and x/y absolute error below 0.001"
evidence = "tests/test_cosimulation.py::TestQ1616Precision::test_rulkov_map_q1616_short_window_trajectory"

[silicon]
compiles = true
cosim_validated = true
synthesised = true
cosim_evidence = "tests/test_cosimulation.py::TestQ1616Precision::test_rulkov_map_q1616_short_window_trajectory"
synth_report = "hdl/reports/yosys_rulkov_map_q1616_2026-07-11.json"
target_device = "Xilinx 7-series (Yosys synth_xilinx)"
target_tier = "H2"
terminal_reason = "Discrete bursting map; H2 is the documented terminal because long-window fixed-point trajectory identity is not a valid metric for sensitive map dynamics."
