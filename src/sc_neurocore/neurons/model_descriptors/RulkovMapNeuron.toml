[metadata]
schema_version = 2
name = "Rulkov Map"
class_name = "RulkovMapNeuron"
module = "rulkov_map"
display_name = ""
summary = "Discrete-time map neuron — fast/slow dynamics via 2D iteration"
family = "Map-based"
category = "map-based"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
