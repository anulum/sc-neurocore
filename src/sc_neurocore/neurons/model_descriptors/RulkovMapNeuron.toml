# SC-NeuroCore — Source/config provenance header

[metadata]
schema_version = 2
name = "Rulkov Map"
class_name = "RulkovMapNeuron"
module = "rulkov_map"
display_name = "Rulkov 2002 piecewise fast/slow map"
summary = "Three-branch discrete map with source reset-branch spike events."
family = "Map-based"
category = "map-based"
biophysical_detail = "point"
maturity = "validated"
intended_use = [
    "spiking and bursting map dynamics",
    "short-window chaotic-map reproducibility",
    "cross-runtime and fixed-point validation",
]
hardware_fit = [
    "bounded signed fixed-point map co-simulation",
]
behavior_tags = [
    "adapting",
    "excitable",
    "rate-coded",
    "tonic",
]

[provenance]
authors = [
    "Rulkov, N.F.",
]
year = 2002
doi = "10.1103/PhysRevE.65.041922"
paper_title = "Modeling of spiking-bursting neural behavior using two-dimensional map"
derivation_note = "Implements Rulkov 2002 equations (1)-(2). The scalar current is the paper's fast beta_n input channel; sigma is the static slow control. A source spike event is occupancy of the rightmost reset branch before the simultaneous update. The default state and sigma=-1.6 are a repository quiescent operating profile, not a claimed unique source-figure profile."

[state.x]
init = -1.0

[state.y]
init = -3.0

[parameters.alpha]
default = 4.0
unit = "1"
meaning = "fast-map nonlinearity control parameter"
range = [
    1.0,
    10.0,
]

[parameters.sigma]
default = -1.6
unit = "1"
meaning = "slow-map parameter setting the DC drive"
range = [
    -3.0,
    1.0,
]

[parameters.mu]
default = 0.001
unit = "1"
meaning = "slow-map timescale; small values slow the recovery variable"
range = [
    0.0001,
    0.05,
]

[integration]
dt = 1.0
method = "map"

[dynamics]
x = "(alpha / (1.0 - x) + y + I) if x <= 0 else (alpha + y + I if x < alpha + y + I else -1.0)"
y = "y - mu * (x + 1.0) + mu * sigma"

[backends.python]
status = "implemented"
parity = "exact"

[backends.rust]
status = "implemented"
parity = "exact"

[backends.julia]
status = "implemented"
parity = "exact"

[backends.go]
status = "implemented"
parity = "exact"

[backends.mojo]
status = "implemented"
parity = "ulp-bounded"

[reproducibility]
reference_config = "{\"n_steps\":512,\"drive_pattern\":[0.0,0.25,1.5,-0.1],\"parameters\":\"defaults\",\"row_encoding\":\"<ddB\"}"
golden_trace_sha256 = "83ffbbdf6fe825fd6cb1833078ed2aa3836ffbad876ca38af95780914a16c3db"
golden_citation = "src/sc_neurocore/neurons/reference_receipts/rulkov_2002.json"

[documentation]
slug = "models/rulkov_map"
notes = "The event is the source rightmost reset branch. The former configurable upward-x crossing remains separately available as count-neutral SCUpwardCrossingRulkovMapNeuron."

[validation]
dynamics_faithful = true
metric = "trajectory"
operating_point = "Rulkov 2002 three-branch map under bounded mixed and constant fast-input traces"
tolerance = "independent binary64 receipt and complete runtime traces exact or enrolled ULP bound; source reset-branch events exact; Q16.16 short-window event vector exact with bounded state error"
evidence = "tests/test_reference_rulkov_map.py; tests/test_rulkov_map_backends_bit_exact.py; tests/test_cosim_rulkov_map.py"

[silicon]
compiles = true
cosim_validated = true
synthesised = true
cosim_evidence = "tests/test_cosim_rulkov_map.py::TestQ1616Precision::test_rulkov_map_q1616_short_window_trajectory"
synth_report = "hdl/reports/yosys_rulkov_map_q1616_2026-08-28.json"
target_device = "Xilinx 7-series (Yosys synth_xilinx)"
target_tier = "H2"
terminal_reason = "Q16.16 short-window co-simulation, Yosys synthesis, and bounded formal safety cover the source map. H2 is terminal because long-window fixed-point trajectory identity is not a valid metric for sensitive map dynamics; timing, PPA, device, board, and silicon evidence remain open."
