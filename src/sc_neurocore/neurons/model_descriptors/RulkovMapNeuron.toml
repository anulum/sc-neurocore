[metadata]
schema_version = 2
name = "Rulkov Map"
class_name = "RulkovMapNeuron"
module = "rulkov_map"
display_name = ""
summary = "Discrete-time map neuron — fast/slow dynamics via 2D iteration"
family = "Map-based"
category = "map-based"
biophysical_detail = "point"
maturity = "experimental"
intended_use = []
hardware_fit = []
behavior_tags = []

[provenance]
authors = [
    "Rulkov, N.F.",
]
year = 2002
doi = "10.1103/PhysRevE.65.041922"

[state.x]
init = -1.0

[state.y]
init = -3.0

[parameters.alpha]
default = 4.0
unit = "1"
meaning = "fast-map nonlinearity control parameter"
range = [
    1.0,
    10.0,
]

[parameters.sigma]
default = -1.6
unit = "1"
meaning = "slow-map parameter setting the DC drive"
range = [
    -3.0,
    1.0,
]

[parameters.mu]
default = 0.001
unit = "1"
meaning = "slow-map timescale; small values slow the recovery variable"
range = [
    0.0001,
    0.05,
]

[parameters.x_threshold]
default = 0.0
unit = "1"
meaning = "level on x at which a spike is registered"
range = [
    -1.0,
    2.0,
]

[integration]
dt = 0.1
method = "euler"

[dynamics]
x = "alpha / (1.0 + x**2) + y + I"
y = "y - sigma * x - beta"

[backends.python]
status = "implemented"

[reproducibility]

[documentation]
slug = "models/rulkov_map"
notes = ""
