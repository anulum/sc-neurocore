[metadata]
schema_version=2
name="SCStochasticRateAdaptationNeuron"
author="SC-NeuroCore project"
year=2026
doi=""
description="Retained logistic rate adaptation with exponential-hazard sampling"
[state]
a=0.0
[parameters]
f_max=200.0
beta=0.1
i_half=5.0
tau_a=100.0
delta_a=0.5
dt=1.0
[integration]
dt=1.0
method="rk4"
substeps=1
[dynamics]
rate="f_max/(1+exp(-beta*(I-a-i_half)))"
a="-a/tau_a+delta_a*rate"
[threshold]
condition="uniform < 1-exp(-rate_bar*dt/1000)"
detection="stochastic"
[extensions]
source_equations="SC project recurrence"
identity_note="Count-neutral SC model; no Benda-Herz source attribution"
reset="a=0"
