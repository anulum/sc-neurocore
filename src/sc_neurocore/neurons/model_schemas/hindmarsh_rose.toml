[metadata]
schema_version = 1
name = "Hindmarsh-Rose"
author = "Hindmarsh, J.L. & Rose, R.M."
year = 1984
doi = "10.1098/rspb.1984.0024"
description = "3D chaotic bursting model with slow adaptation variable"

[state]
x = -1.6
y = -10.0
z = 2.0

[parameters]
b = 3.0
r = 0.001
s = 4.0
x_rest = -1.6

[integration]
dt = 0.1
method = "euler"

[dynamics]
x = "y - x**3 + b * x**2 - z + I"
y = "1 - 5 * x**2 - y"
z = "r * (s * (x - x_rest) - z)"

[threshold]
condition = "x > 1.0"
detection = "crossing"

[reset]
x = "x"
y = "y"
z = "z"

[extensions]
