# SC-NeuroCore — Preserved hard-reset exact-flow LIF compatibility schema

[metadata]
schema_version = 2
name = "SCLapicqueLIFNeuron"
author = "SC-NeuroCore"
year = 2026
description = "Count-neutral exact-flow hard-reset LIF formerly attributed directly to Lapicque 1907"

[state]
v = 0.0

[parameters]
v_rest = 0.0
v_reset = 0.0
v_threshold = 1.0
tau = 20.0
resistance = 1.0

[integration]
dt = 1.0
method = "exp_euler"

[dynamics]
v = "(-(v - v_rest) + resistance * I) / tau"

[threshold]
condition = "v >= v_threshold"
detection = "level"

[reset]
v = "v_reset"

[extensions]
family = "sc-compatibility-lif"
maintained_discretisation = "Exact constant-current RC flow via exponential Euler"
identity_note = "Later hard-reset repetitive LIF convention; not claimed as the complete 1907 source model"

[profile]
contract = "sc-neurocore.model-profile.v1"
time_unit = "ms"
exactness = "exact-linear-relaxation"
notes = "SC compatibility realisation: exponential Euler is the exact constant-current RC flow of this linear membrane; the hard reset and the repetitive recurrence are project conventions, not the 1907 source."

[profile.state]
v = "biological"

[profile.parameters]
v_rest = "source"
v_reset = "source"
v_threshold = "source"
tau = "source"
resistance = "source"

[profile.units]
v = "normalized voltage"
v_rest = "normalized voltage"
v_reset = "normalized voltage"
v_threshold = "normalized voltage"
tau = "ms"
resistance = "normalized resistance"
