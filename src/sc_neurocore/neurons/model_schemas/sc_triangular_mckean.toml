[metadata]
schema_version=2
name="SCTriangularMcKeanNeuron"
author="SC-NeuroCore project"
year=2026
doi=""
description="Retained SC three-branch piecewise-linear oscillator; not the source McKean Heaviside system"
[state]
v=0.0
w=0.0
[parameters]
a=0.25
epsilon=0.01
gamma=0.5
v_peak=0.8
dt=0.1
[integration]
dt=0.1
method="rk4"
substeps=1
[dynamics]
v="(-v if v < a/2 else (v-a if v < (1+a)/2 else 1-v)) - w + I"
w="epsilon * (v - gamma*w)"
[threshold]
condition="v >= v_peak"
detection="crossing"
[extensions]
family="SC project oscillator"
source_equations="SC project recurrence"
identity_note="Count-neutral SC modification retained separately from McKeanNeuron"
reset="none"
