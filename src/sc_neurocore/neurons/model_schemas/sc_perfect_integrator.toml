# SC-NeuroCore — Preserved inclusive perfect-integrator compatibility schema

[metadata]
schema_version = 2
name = "SCInclusivePerfectIntegratorNeuron"
author = "SC-NeuroCore"
year = 2026
description = "Count-neutral perfect integrator with the historical inclusive threshold"

[state]
v = 0.0

[parameters]
c_m = 1.0
v_threshold = 1.0
v_reset = 0.0
dt = 0.1

[integration]
dt = 0.1
method = "map"

[dynamics]
v = "v + I * dt / c_m"

[threshold]
condition = "v >= v_threshold"
detection = "level"

[reset]
v = "v_reset"

[extensions]
family = "sc-compatibility-integrate-and-fire"
maintained_discretisation = "Exact integral for piecewise-constant current samples"
identity_note = "Historical inclusive comparator; not attributed as the Naud-Gerstner source boundary"
