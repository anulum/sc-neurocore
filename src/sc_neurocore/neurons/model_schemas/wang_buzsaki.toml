[metadata]
schema_version = 1
name = "Wang-Buzsáki"
author = "Wang, X.-J. & Buzsáki, G."
year = 1996
doi = "10.1523/JNEUROSCI.16-20-06402.1996"
description = "Modified HH for hippocampal interneurons — fast-spiking GABAergic basket cells"

# State declared in Gauss-Seidel commit order (h, n before v): the membrane voltage
# is advanced last so it reads the freshly-updated gating variables within each
# sub-step, matching the WangBuzsakiNeuron hand model. Sodium activation m is
# instantaneous (m_inf), so it is not a state variable.
[state]
h = 0.8
n = 0.1
v = -65.0

[parameters]
C = 1.0
g_Na = 35.0
g_K = 9.0
g_L = 0.1
E_Na = 55.0
E_K = -90.0
E_L = -65.0
phi = 5.0
v_threshold = -20.0

# Sequential (Gauss-Seidel) forward Euler with 50 inner sub-steps of dt=0.01 per
# 0.5 ms macro step, mirroring the hand model's ``for _ in range(int(0.5/dt))`` loop
# and its update order (gates from the old voltage, then the voltage from the new gates).
[integration]
dt = 0.01
method = "gauss_seidel"
substeps = 50

# Wang-Buzsáki (1996) fast-spiking interneuron. Sodium activation is instantaneous:
# m_inf = alpha_m / (alpha_m + beta_m), with alpha_m = 0.1*(v+35)/(1-exp(-(v+35)/10))
# written in the numerically stable exprel form 1/exprel(-(v+35)/10) (removable
# singularity at v=-35), and beta_m = 4*exp(-(v+60)/18). The potassium activation rate
# alpha_n = 0.01*(v+34)/(1-exp(-(v+34)/10)) is likewise the exprel form 0.1/exprel(-(v+34)/10).
[dynamics]
h = "phi * (0.07 * exp(-(v + 58) / 20) * (1 - h) - 1 / (1 + exp(-(v + 28) / 10)) * h)"
n = "phi * (0.1 / exprel(-(v + 34) / 10) * (1 - n) - 0.125 * exp(-(v + 44) / 80) * n)"
v = "(-g_Na * ((1 / exprel(-(v + 35) / 10)) / (1 / exprel(-(v + 35) / 10) + 4 * exp(-(v + 60) / 18)))**3 * h * (v - E_Na) - g_K * n**4 * (v - E_K) - g_L * (v - E_L) + I) / C"

[threshold]
condition = "v >= v_threshold"
detection = "crossing"

[extensions]
cell_type = "fast-spiking interneuron"
brain_region = "hippocampus"
