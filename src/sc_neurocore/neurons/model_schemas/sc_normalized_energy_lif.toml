[metadata]
schema_version=2
name="SCNormalizedEnergyLIFNeuron"
author="Anulum Fortis & Arcane Sapience"
year=2026
doi=""
description="Retained normalized energy-gated exact-flow project recurrence"
[state]
v=-70.0
epsilon=1.0
spike_flag=0.0
[parameters]
v_rest=-70.0
v_reset=-70.0
v_threshold=-50.0
tau_m=10.0
tau_e=500.0
alpha=0.1
epsilon_0=1.0
resistance=1.0
dt=1.0
[integration]
dt=1.0
method="closed-form constant-current"
substeps=1
[dynamics]
epsilon="epsilon_0 + (epsilon - epsilon_0) * exp(-dt / tau_e)"
spike_flag="1 if v_candidate >= v_threshold and epsilon_candidate > 0.1 else 0"
[threshold]
condition="spike_flag >= 0.5"
detection="level"
[extensions]
family="sc-project"
source_equations="project recurrence frozen before Model 52"
identity_note="Count-neutral SC compatibility identity"
