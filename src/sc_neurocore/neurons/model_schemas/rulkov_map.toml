[metadata]
schema_version = 1
name = "Rulkov Map"
author = "Rulkov, N.F."
year = 2002
doi = "10.1103/PhysRevE.65.041922"
description = "Discrete-time map neuron — fast/slow dynamics via 2D iteration"

[state]
x = -1.0
y = -3.0

[parameters]
alpha = 4.0
sigma = 0.001
beta = 0.001

[integration]
dt = 1.0
method = "euler"

[dynamics]
# Discrete-time map (treated as difference equation):
x = "alpha / (1.0 + x**2) + y + I"
y = "y - sigma * x - beta"

[threshold]
condition = "x > 0.0"
detection = "level"

[extensions]
model_type = "map"
discrete_time = true
bursting = true
