# SC-NeuroCore — Source/config provenance header

[metadata]
schema_version = 1
name = "Rulkov Map"
author = "Rulkov, N.F."
year = 2002
doi = "10.1103/PhysRevE.65.041922"
description = "Discrete-time map neuron — piecewise fast/slow 2D iteration (spiking-bursting)"

[state]
x = -1.0
y = -3.0

[parameters]
alpha = 4.0
sigma = -1.6
mu = 0.001

[integration]
dt = 1.0
method = "map"

[dynamics]
# Rulkov (2002) two-dimensional map. The fast variable is a piecewise branch map
# (subthreshold rational, spike plateau, hard reset); the slow variable drifts.
# `method = "map"` iterates x_{n+1} = f(x_n, y_n) directly rather than integrating
# an ODE, so the recurrence matches the published map exactly.
x = "(alpha / (1.0 - x) + y + I) if x <= 0 else (alpha + y + I if x < alpha + y + I else -1.0)"
y = "y - mu * (x + 1.0) + mu * sigma"

[threshold]
condition = "x >= 0.0"
detection = "crossing"

[extensions]
model_type = "map"
discrete_time = true
bursting = true
silicon_cosim_note = "At I=1.5 over 30 iterations, the hand model and both schema formats have exact state and crossing agreement; Q16.16 RTL reproduces the 10-event crossing vector while both state variables stay within 0.001 absolute error. All three fast-map branches execute ten times. Long-window spike-count parity is not used for this map class."
