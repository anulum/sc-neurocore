# SC-NeuroCore — Source/config provenance header

[metadata]
schema_version = 1
name = "Rulkov Map"
author = "Rulkov, N.F."
year = 2002
doi = "10.1103/PhysRevE.65.041922"
description = "Rulkov 2002 three-branch fast/slow map with source reset-branch events"

[state]
x = -1.0
y = -3.0

[parameters]
alpha = 4.0
sigma = -1.6
mu = 0.001

[integration]
dt = 1.0
method = "map"

[dynamics]
# Rulkov (2002) two-dimensional map. The fast variable is a piecewise branch map
# (subthreshold rational, spike plateau, hard reset); the slow variable drifts.
# `method = "map"` iterates x_{n+1} = f(x_n, y_n) directly rather than integrating
# an ODE, so the recurrence matches the published map exactly.
x = "(alpha / (1.0 - x) + y + I) if x <= 0 else (alpha + y + I if x < alpha + y + I else -1.0)"
y = "y - mu * (x + 1.0) + mu * sigma"

[threshold]
condition = "0.0 < x_prev >= alpha + y_prev + I"
detection = "level"

[extensions]
model_type = "map"
discrete_time = true
bursting = true
input_contract = "I is the paper's fast beta_n channel; sigma is the static slow control."
event_contract = "An event marks the pre-update state occupying the rightmost reset branch, as defined by Rulkov 2002."
identity_note = "The former configurable upward-x crossing is retained separately as SCUpwardCrossingRulkovMapNeuron."
silicon_cosim_note = "Class-correct validation uses a bounded short-window trajectory and exact reset-branch event vector. Long-window event-count parity is not used as a chaotic-map equivalence claim."
