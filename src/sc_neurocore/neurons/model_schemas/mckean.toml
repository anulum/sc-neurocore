[metadata]
schema_version=2
name="McKeanNeuron"
author="McKean, H. P.; Tonnelier, A."
year=2002
doi="10.1137/S0036139901393500"
description="Source-bound space-clamped McKean Heaviside system"
[state]
v=0.0
w=0.0
[parameters]
a=0.25
lambda_=1.0
mu=1.0
b=0.01
dt=0.1
[integration]
dt=0.1
method="rk4"
substeps=1
[dynamics]
v="-lambda_*v + mu*(1.0 if v >= a else 0.0) - w + I"
w="b*v"
[threshold]
condition="v >= a"
detection="crossing"
[extensions]
family="piecewise-linear excitable system"
source_equations="Tonnelier 2002 equations (1.3)-(1.6), following McKean 1970"
identity_note="SCTriangularMcKeanNeuron retains the prior project recurrence"
reset="none"
heaviside_convention="H(0)=1"
