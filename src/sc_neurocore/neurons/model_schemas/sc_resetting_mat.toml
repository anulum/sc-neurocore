# SC-NeuroCore — project resetting-MAT schema

[metadata]
schema_version = 2
name = "SCResettingMATNeuron"
author = "SC-NeuroCore project"
year = 2026
doi = ""
description = "Historical SC candidate-first RK4 adaptive-threshold recurrence with voltage reset"

[state]
v = -70.0
theta1 = 0.0
theta2 = 0.0

[parameters]
v_rest = -70.0
v_reset = -70.0
v_threshold_base = -50.0
tau_m = 10.0
tau_1 = 10.0
tau_2 = 200.0
h1 = 5.0
h2 = 3.0
resistance = 1.0

[integration]
dt = 1.0
method = "rk4"
substeps = 1

[dynamics]
v = "(-(v - v_rest) + resistance * I) / tau_m"
theta1 = "-theta1 / tau_1"
theta2 = "-theta2 / tau_2"

[threshold]
condition = "v >= v_threshold_base + theta1 + theta2"
detection = "level"

[reset]
v = "v_reset"
theta1 = "theta1 + h1"
theta2 = "theta2 + h2"

[extensions]
family = "adaptive-threshold"
model_type = "sc_resetting_mat_rk4"
source_equation_note = "SC-NeuroCore project specification; no external paper attribution."
discretisation = "Candidate-first classical RK4 for voltage and both threshold states at dt=1 ms"
identity_note = "Preserves the historical SC-NeuroCore MATNeuron recurrence under an explicit project identity."
