# SC-NeuroCore — Source-bound Fourcaud-Trocmé ExpIF schema

[metadata]
schema_version = 1
name = "Exponential IF"
author = "Fourcaud-Trocmé, N. et al."
year = 2003
doi = "10.1523/JNEUROSCI.23-37-11628.2003"
description = "Deterministic EIF current balance from Equations 6 and 10 with the paper's finite +30 mV simulation cutoff"

[state]
v = -65.0

[parameters]
v_rest = -65.0
v_reset = -68.0
v_threshold = 30.0
v_rh = -59.9
delta_t = 3.48
tau = 10.0

[integration]
dt = 0.02
method = "rk4"

[dynamics]
v = "(-(min(v, v_threshold) - v_rest) + delta_t * exp((min(v, v_threshold) - v_rh) / delta_t) + I) / tau"

[threshold]
condition = "v >= v_threshold"
detection = "level"

[reset]
v = "v_reset"

[extensions]
spike_shape = "exponential divergence"
current_convention = "I is normalised by leak conductance"
finite_cutoff = "30 mV, following the source simulation protocol"
