# SC-NeuroCore — Source/config provenance header

[metadata]
schema_version = 1
name = "Theta"
author = "Ermentrout, G.B. & Kopell, N."
year = 1986
doi = "10.1137/0146017"
description = "Euler fixed-point representative of the Ermentrout-Kopell equation (2.5) Type-I phase normal form"

[state]
theta = 0.0

[parameters]

[integration]
dt = 0.01
method = "euler"

[dynamics]
theta = "(1 - cos(theta)) + (1 + cos(theta)) * I"

[threshold]
condition = "theta > 3.11"
detection = "crossing"

[reset]
theta = "theta - 6.2832"

[extensions]
topology = "circular"
source_parameter = "I is dimensionless a from equation (2.5), or a frozen equation (3.3) drive"
software_solver = "The production ThetaNeuron uses an exact held-drive flow; this schema explicitly remains Euler."
source_scope = "The full slow-oscillator-coupled bursting system is not claimed."
