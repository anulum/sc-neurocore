# SC-NeuroCore — historical resetting Wilson-HR project schema

[metadata]
schema_version = 1
name = "SC Resetting Wilson-HR"
author = "SC-NeuroCore"
year = 2026
description = "Historical unit-capacitance Wilson-HR polynomial recurrence with hard reset"

[state]
v = -0.7
r = 0.1

[parameters]
tau_r = 1.9
v_peak = 0.4

[integration]
dt = 0.05
method = "rk4"

[dynamics]
v = "-(17.81 + 47.71 * v + 32.63 * v * v) * (v - 0.55) - 26.0 * r * (v + 0.92) + I"
r = "(-r + 1.35 * v + 1.03) / tau_r"

[threshold]
condition = "v >= v_peak"
detection = "level"

[reset]
v = "-0.7"

[extensions]
model_type = "sc_resetting_wilson_hr"
identity_note = "Preserves the former SC-NeuroCore WilsonHRNeuron recurrence without attributing its unit capacitance or hard reset to Wilson 1999."
