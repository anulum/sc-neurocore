[metadata]
schema_version = 1
name = "Hodgkin-Huxley"
author = "Hodgkin, A.L. & Huxley, A.F."
year = 1952
doi = "10.1113/jphysiol.1952.sp004764"
description = "4D conductance-based model — Nobel Prize 1963 — the gold standard of biophysical neuron modelling"

[state]
v = -65.0
m = 0.05
h = 0.6
n = 0.32

[parameters]
C = 1.0
g_Na = 120.0
g_K = 36.0
g_L = 0.3
E_Na = 50.0
E_K = -77.0
E_L = -54.4

[integration]
dt = 0.01
method = "euler"

[dynamics]
v = "(-g_Na * m**3 * h * (v - E_Na) - g_K * n**4 * (v - E_K) - g_L * (v - E_L) + I) / C"
m = "1.0 / exprel(-(v + 40) / 10) * (1 - m) - 4 * exp(-(v + 65) / 18) * m"
h = "0.07 * exp(-(v + 65) / 20) * (1 - h) - 1 / (1 + exp(-(v + 35) / 10)) * h"
n = "0.1 / exprel(-(v + 55) / 10) * (1 - n) - 0.125 * exp(-(v + 65) / 80) * n"

[threshold]
condition = "v > 0"
detection = "crossing"

[reset]

[extensions]
ion_channels = ["Na", "K", "leak"]
