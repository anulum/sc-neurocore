# SC-NeuroCore — Mihalas-Niebur 2009 source schema

[metadata]
schema_version = 2
name = "MihalasNieburNeuron"
author = "Mihalaş, Ş.; Niebur, E."
year = 2009
doi = "10.1162/neco.2008.12-07-680"
description = "Equations 2.1-2.2 generalised integrate-and-fire neuron with two internal currents and an adaptive threshold"

[state]
v = -0.07
theta = -0.05
i1 = 0.0
i2 = 0.0

[parameters]
v_rest = -0.07
v_reset = -0.07
theta_reset = -0.06
theta_inf = -0.05
leak_rate = 0.05
threshold_voltage_coupling = 0.005
threshold_decay_rate = 0.01
current_decay_rate_1 = 0.2
current_decay_rate_2 = 0.02
current_retention_1 = 0.0
current_retention_2 = 1.0
current_jump_1 = 0.0
current_jump_2 = 0.0

[integration]
dt = 0.1
method = "rk4"

[dynamics]
v = "I + i1 + i2 - leak_rate * (v - v_rest)"
theta = "threshold_voltage_coupling * (v - v_rest) - threshold_decay_rate * (theta - theta_inf)"
i1 = "-current_decay_rate_1 * i1"
i2 = "-current_decay_rate_2 * i2"

[threshold]
condition = "v >= theta"
detection = "level"

[reset]
i1 = "current_retention_1 * i1 + current_jump_1"
i2 = "current_retention_2 * i2 + current_jump_2"
v = "v_reset"
theta = "max(theta_reset, theta)"

[extensions]
source_equations = "Mihalas and Niebur 2009 equations 2.1-2.2 and Table 1"
units_note = "Rates converted from per-second to per-millisecond; current-like states and input divided by capacitance."
implementation_note = "Fixed-grid RK4 with sampled threshold detection is the declared numerical specialisation."
reset_constraint = "theta_reset > v_reset, as required below equation 2.2"
identity_note = "The former scaled-voltage-reset recurrence is retained count-neutrally as SCScaledResetAdaptiveIFNeuron."
