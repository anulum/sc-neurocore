# SC-NeuroCore — Cargo fuzz package manifest

[package]
name = "sc-neurocore-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sc_neurocore_engine = { path = "../engine" }

[[bin]]
name = "ir_parser"
path = "fuzz_targets/ir_parser.rs"
test = false
doc = false

[[bin]]
name = "bitstream_ops"
path = "fuzz_targets/bitstream_ops.rs"
test = false
doc = false
