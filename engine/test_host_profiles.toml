# SC-NeuroCore — Reference host profiles for the engine's performance-test budgets

# A performance test's budget is margin * ratio * calibration (engine/src/neurons/host_budget.rs):
# - calibration: this host's time for a fixed reference workload, taken in the test's thread on its clock;
# - ratio: the test's work over the calibration, from the reference hosts below;
# - margin: the policy value below.
#
# How a ratio is set:
# 1. On each reference host, in each build (`cargo test` and `cargo test --release`, from engine/), run the test
#    with SCN_ENGINE_BUDGET_RECORD=<file> at least five times. Each run appends one line per budgeted test:
#    test, build, clock, elapsed ns, calibration before ns, calibration after ns, load average.
# 2. A run's ratio is elapsed / max(calibration before, calibration after), to four significant figures. The runs
#    go under [measurement.<host>.<build>].
# 3. The test's ratio for a build is the largest of the hosts' medians, rounded up to two significant figures.
# tests/test_engine_rust_performance_guards.py holds every ratio to that rule, every budgeted test to a ratio, and
# the margin to its policy value.
#
# One reference host is measured so far, ML350. All 34 ratios come from one session there; the session waited 90
# minutes for a quiet host and then recorded at a load of about 7.7, as other seats share it. The workstation
# follows as a second host at a quiet hour: it was too loaded when the ratios were recorded. A second host can only
# raise a ratio, never lower one.

schema_version = 1

# Policy, not a measurement: how far beyond its reference ratio a test may go before it fails. One value for every
# test; a test given another margin needs a written reason here and a test that holds it.
margin = 5.0

[reference_hosts.ml350]
cpu = "Intel(R) Xeon(R) CPU E5-2640 0 @ 2.50GHz"
logical_cpus = 24
kernel = "6.8.0-149-generic"
rustc = "rustc 1.98.1 (48a229cea 2026-09-01)"
measured_at = "2026-11-16T02:44:54Z"
load_average_before = "7.75 7.94 8.92"

