# SC-NeuroCore — Source/config provenance header

# Builds started in engine/ or below (benchmarks, fuzzing) compile for x86-64-v2.
# Cargo reads this file only for those builds. The wheel builds start in bridge/, whose
# configuration and the root one set no rustflags, so the published wheels are compiled
# for baseline x86-64. Override locally with RUSTFLAGS="-C target-cpu=native".
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.'cfg(target_arch = "aarch64")']
rustflags = []
