[package]
name = "sc_neurocore_engine"
version = "3.12.0"
edition = "2021"
authors = ["Miroslav Sotek <protoscience@anulum.li>"]
description = "High-performance SIMD backend for SC-NeuroCore stochastic neuromorphic computing"
license = "AGPL-3.0-or-later"
repository = "https://github.com/anulum/sc-neurocore"
homepage = "https://anulum.github.io/sc-neurocore/"
documentation = "https://anulum.github.io/sc-neurocore/rust-api/sc_neurocore_engine/"
readme = "../README.md"
keywords = ["neuromorphic", "stochastic-computing", "simd", "spiking-network", "fpga"]
categories = ["science", "simulation", "mathematics"]
exclude = [
    "tests/",
    ".github/",
    "*.pyc",
]

[package.metadata.maturin]
python-source = "../bridge"
module-name = "sc_neurocore_engine.sc_neurocore_engine"

[lib]
name = "sc_neurocore_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }
numpy = "0.28"
ndarray = "0.16"
rand = "0.10"
rand_chacha = "0.10"
rand_xoshiro = "0.8"
rayon = "1.10"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.4"

[build-dependencies]
pyo3-build-config = "0.28"

[[bench]]
name = "bitstream_bench"
harness = false

[[bench]]
name = "full_bench"
harness = false

[[bench]]
name = "scaling_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
