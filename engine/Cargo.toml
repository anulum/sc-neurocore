[package]
name = "sc_neurocore_engine"
version = "3.15.35"
edition = "2021"
authors = ["Miroslav Sotek <protoscience@anulum.li>"]
description = "High-performance SIMD backend for SC-NeuroCore stochastic neuromorphic computing"
license = "AGPL-3.0-or-later"
repository = "https://github.com/anulum/sc-neurocore"
homepage = "https://anulum.github.io/sc-neurocore/"
documentation = "https://anulum.github.io/sc-neurocore/rust-api/sc_neurocore_engine/"
readme = "../README.md"
keywords = ["neuromorphic", "stochastic-computing", "simd", "spiking-network", "fpga"]
categories = ["science", "simulation", "mathematics"]
# `examples/benchmark_context.rs` is a shared helper module included by the
# bench examples via `mod benchmark_context;`, not a runnable example. Declaring
# example targets explicitly stops Cargo auto-discovering the helper as a
# standalone example (which fails with E0601: no `main`).
autoexamples = false
exclude = [
    "tests/",
    ".github/",
    "*.pyc",
]

[package.metadata.maturin]
python-source = "../bridge"
module-name = "sc_neurocore_engine.sc_neurocore_engine"

[lib]
name = "sc_neurocore_engine"
crate-type = ["cdylib", "rlib"]

[features]
default = ["z3"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
# The Z3-backed safety-verification supervisor (engine/src/supervisor.rs). On by
# default for the Python wheel; disable with --no-default-features to skip the heavy
# bundled-Z3 C++ build for fast/instrumented (fuzz) builds that do not need it.
z3 = ["dep:z3"]

[dependencies]
crossbeam-channel = "0.5"
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
ndarray = "0.16"
nalgebra = "0.35"
rand = "0.10"
rand_chacha = "0.10"
rand_distr = "0.6"
rand_xoshiro = "0.8"
core_affinity = "0.8"
rayon = "1.10"
rustfft = "6.2"
wgpu = { version = "29", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1.21", features = ["derive"], optional = true }
z3 = { version = "0.20", features = ["bundled"], optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.4"

[build-dependencies]
pyo3-build-config = "0.29"

