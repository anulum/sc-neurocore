{% set version = "3.13.2" %}

package:
  name: sc-neurocore
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/s/sc-neurocore/sc_neurocore-{{ version }}.tar.gz
  sha256: PLACEHOLDER

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps
  entry_points:
    - sc-neurocore = sc_neurocore.cli:main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=61.0
  run:
    - python >=3.10
    - numpy >=1.22
    - scipy >=1.7

test:
  imports:
    - sc_neurocore
    - sc_neurocore.neurons
    - sc_neurocore.layers
    - sc_neurocore.nir_bridge
  commands:
    - sc-neurocore --help

about:
  home: https://github.com/anulum/sc-neurocore
  summary: "Stochastic Computing SNN framework: 122 neuron models, 125 analysis functions, FPGA RTL"
  license: AGPL-3.0-or-later
  license_file: LICENSE
  doc_url: https://anulum.github.io/sc-neurocore/
  dev_url: https://github.com/anulum/sc-neurocore

extra:
  recipe-maintainers:
    - miroslav-sotek
