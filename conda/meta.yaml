# SC-NeuroCore — Source/config provenance header

{% set version = "4.0.0" %}

package:
  name: sc-neurocore
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/s/sc-neurocore/sc_neurocore-{{ version }}.tar.gz
  sha256: PLACEHOLDER

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps
  entry_points:
    - sc-neurocore = sc_neurocore.cli:main

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools >=78.0
  run:
    - python >=3.11
    - numpy >=1.24
    - scipy >=1.10
    - defusedxml >=0.7.1
    - tomli-w >=1.0
    - typing-extensions >=4.0,<5

test:
  imports:
    - sc_neurocore
    - sc_neurocore.hdl.resources
    - sc_neurocore.neurons
    - sc_neurocore.layers
    - sc_neurocore.nir_bridge
  commands:
    - sc-neurocore --help
    - python -c "from sc_neurocore.hdl.resources import list_baseline_primitive_rtl; assert 'sc_bitstream_encoder.v' in list_baseline_primitive_rtl()"

about:
  home: https://github.com/anulum/sc-neurocore
  summary: "Stochastic computing spiking neural network framework with bit-true models and FPGA RTL"
  license: AGPL-3.0-or-later
  license_file: LICENSE
  doc_url: https://anulum.github.io/sc-neurocore/
  dev_url: https://github.com/anulum/sc-neurocore

extra:
  recipe-maintainers:
    - miroslav-sotek
