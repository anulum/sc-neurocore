site_name: SC-NeuroCore Documentation
site_description: "Stochastic Computing Framework for Neuromorphic Hardware Design - 158 lazy-loaded Python model classes, 182 Rust PyO3 model wrappers, bit-true FPGA co-simulation"
site_author: Miroslav Šotek
site_url: https://anulum.github.io/sc-neurocore/
repo_url: https://github.com/anulum/sc-neurocore
repo_name: sc-neurocore
exclude_docs: |
  internal/**

not_in_nav: |
  API_REFERENCE.md
  _generated/capability_snapshot.md
  RUST_FFI_INTEGRATION.md
  api/models/*.md
  api/autonomous_learning.md
  api/bridges/local_llm.md
  api/compiler_service.md
  api/model_zoo.md
  api/quantum_cognition.md
  api/rust-analysis-engine.md
  api/rust-benchmarks.md
  api/sc_inference.md
  api/scpn_datastream.md
  compiler/mixed_dense_kernel.md
  hardware/adc_to_spike_kernel.md
  guides/*.md
  benchmarks/ZENITH_BENCHMARKS.md
  benchmarks/ZENITH_BENCHMARKS_GPU.md
  architecture/AUTONOMOUS_LEARNING_ZENITH.md
  research/SC_NEUROCORE_FOUNDATIONAL_WHITEPAPER.md
  HARDWARE_BENCHMARK_REPORT.md
  SC_NEUROCORE_PERFORMANCE_INDEX.md
  source_papers/SOURCES.md
  source_papers/parameters/*.md

validation:
  anchors: ignore
  links:
    anchors: ignore
    unrecognized_links: ignore

theme:
  name: material
  logo: assets/anulum_logo.png
  favicon: assets/anulum_logo_company.jpg
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
    - navigation.tabs
    - navigation.indexes

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            members_order: source

