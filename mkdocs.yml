site_name: SC-NeuroCore Documentation
site_description: "Stochastic Computing Framework for Neuromorphic Hardware Design — 122 neuron models, Rust SIMD engine, bit-true FPGA co-simulation"
site_author: Miroslav Šotek
site_url: https://anulum.github.io/sc-neurocore/
repo_url: https://github.com/anulum/sc-neurocore
repo_name: sc-neurocore

theme:
  name: material
  logo: assets/anulum_logo.png
  favicon: assets/anulum_logo_company.jpg
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
    - navigation.tabs
    - navigation.indexes

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            members_order: source

