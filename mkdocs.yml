site_name: SC-NeuroCore Documentation
site_description: Universal Stochastic Computing Framework for Neuromorphic Hardware
repo_url: https://github.com/anulum/sc-neurocore
repo_name: sc-neurocore

theme:
  name: material
  palette:
    primary: indigo
    accent: cyan
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            members_order: source

nav:
  - Home: index.md
  - Learning Path: LEARNING_PATH.md
  - Competitive Landscape: COMPETITIVE_LANDSCAPE.md
  - Guides:
      - Getting Started: guides/getting-started.md
      - User Manual: guides/USER_MANUAL.md
