      - Performance Tuning: guides/PERFORMANCE_TUNING.md
      - Integration Guide: guides/INTEGRATION_GUIDE.md
      - Examples: guides/EXAMPLES.md
      - SC for Neuroscientists: guides/SC_FOR_NEUROSCIENTISTS.md
      - SC for Hardware Engineers: guides/SC_FOR_HARDWARE_ENGINEERS.md
