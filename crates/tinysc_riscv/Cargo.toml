# SC-NeuroCore — TinySC RISC-V Runtime

[package]
name = "tinysc_riscv"
version = "0.1.0"
edition = "2021"
authors = ["Miroslav Šotek <protoscience@anulum.li>"]
license = "AGPL-3.0-or-later"
description = "Bare-metal SC runtime for RISC-V MCUs (no_std)"

[features]
default = []
rvv = []
custom-popcount = []

[dependencies]

[lib]
name = "tinysc_riscv"
path = "src/lib.rs"
crate-type = ["rlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
