# SC-NeuroCore — Spike Stats Core (Rust)

[package]
name = "spike_stats_core"
version = "0.1.0"
edition = "2021"
authors = ["Miroslav Sotek <protoscience@anulum.li>"]
description = "SC-NeuroCore: High-performance spike train distance and correlation metrics"
license = "AGPL-3.0-or-later"

[lib]
name = "spike_stats_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["pyo3_bindings"]
pyo3_bindings = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
numpy = { version = "0.29", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "spike_stats_bench"
harness = false
