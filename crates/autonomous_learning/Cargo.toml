# SC-NeuroCore — Autonomous Learning

[package]
name = "autonomous_learning"
version = "0.2.0"
edition = "2021"
authors = ["Miroslav Sotek <protoscience@anulum.li>"]
description = "SC-NeuroCore: Multi-rule online plasticity engine with C-FFI"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rayon = "1.10"
# rand 0.10 removed the bundled `small_rng` feature; SmallRng's
# underlying algorithm (Xoshiro256PlusPlus) is now in `rand_xoshiro`.
rand = "0.10"
rand_xoshiro = "0.8"
wgpu = "29.0"
pollster = "0.3"
bytemuck = { version = "1.16", features = ["derive"] }
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "plasticity_bench"
harness = false
