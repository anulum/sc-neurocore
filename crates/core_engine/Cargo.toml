# SC-NeuroCore — Core Engine

[package]
name = "core_engine"
version = "0.2.0"
edition = "2021"
authors = ["Miroslav Sotek <protoscience@anulum.li>"]
description = "SC-NeuroCore: Core stochastic computing arithmetic with C-FFI"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = "0.10"
rand_chacha = "0.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "arithmetic_bench"
harness = false
