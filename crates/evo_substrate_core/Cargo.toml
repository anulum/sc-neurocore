# SC-NeuroCore — Evolutionary Substrate Core

[package]
name = "evo_substrate_core"
version = "0.1.0"
edition = "2021"
authors = ["Miroslav Sotek <protoscience@anulum.li>"]
description = "SC-NeuroCore: Hot-path kernels for evo_substrate (Rust FFI core)"
license = "AGPL-3.0-or-later"

[lib]
name = "evo_substrate_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["pyo3_bindings"]
pyo3_bindings = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
numpy = { version = "0.29", optional = true }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "evo_bench"
harness = false
