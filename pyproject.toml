[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-neurocore"
version = "2.1.0"
description = "Universal Stochastic Computing Framework spanning Software, Hardware, Physics, and Biology."
authors = [
  { name = "Miroslav Sotek", email = "fortisstudio@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.22",
  "scipy>=1.7",
  "numba>=0.56",
  "matplotlib>=3.5"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy", "black"]
gpu = ["cupy-cuda12x>=12.0"]
full = ["networkx", "onnx"]
# Tier: research — functional but experimental modules
research = ["networkx", "onnx", "torch>=2.0"]
# Tier: contrib — speculative / theoretical modules (exotic, meta, transcendent, etc.)
contrib = ["networkx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["sc_neurocore"]
omit = [
    "*/experiments/*",
    "*/drivers/*",
    "*/interfaces/ccw_bridge.py",
]

[tool.coverage.report]
fail_under = 50
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "raise NotImplementedError",
]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
ignore_missing_imports = true