[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-neurocore"
version = "3.8.1"
description = "Universal Stochastic Computing Framework spanning Software, Hardware, Physics, and Biology."
authors = [
  { name = "Miroslav Sotek", email = "protoscience@anulum.li" }
]
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
  "neuromorphic",
  "stochastic-computing",
  "fpga",
  "spiking-neural-networks",
  "hyper-dimensional-computing",
  "rust",
  "hardware-simulation",
  "petri-nets",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (Verilog/VHDL)",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.22",
  "scipy>=1.7",
  "numba>=0.56",
  "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://github.com/anulum/sc-neurocore"
Documentation = "https://anulum.github.io/sc-neurocore/"
Source = "https://github.com/anulum/sc-neurocore"
Issues = "https://github.com/anulum/sc-neurocore/issues"
Changelog = "https://github.com/anulum/sc-neurocore/blob/main/CHANGELOG.md"
Discussions = "https://github.com/anulum/sc-neurocore/discussions"

[project.scripts]
sc-neurocore = "sc_neurocore.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "mypy", "black==25.1.0", "ruff", "bandit", "pyyaml", "jax", "jaxlib", "qiskit", "pennylane", "qiskit-aer"]
gpu = ["cupy-cuda12x>=12.0"]
full = ["networkx", "onnx", "qiskit", "pennylane"]
research = ["networkx", "onnx", "torch>=2.0"]
jax = ["jax", "jaxlib"]
quantum = ["qiskit", "pennylane", "qiskit-aer"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
    "sc_neurocore.audio", "sc_neurocore.audio.*",
    "sc_neurocore.generative", "sc_neurocore.generative.*",
    "sc_neurocore.world_model", "sc_neurocore.world_model.*",
    "sc_neurocore.dashboard", "sc_neurocore.dashboard.*",
    "sc_neurocore.viz", "sc_neurocore.viz.*",
    "sc_neurocore.analysis", "sc_neurocore.analysis.*",
    "sc_neurocore.experiments", "sc_neurocore.experiments.*",
    "sc_neurocore.drivers", "sc_neurocore.drivers.*",
    "sc_neurocore.interfaces", "sc_neurocore.interfaces.*",
    "sc_neurocore.swarm", "sc_neurocore.swarm.*",
    "sc_neurocore.sleep", "sc_neurocore.sleep.*",
    "sc_neurocore.optics", "sc_neurocore.optics.*",
    "sc_neurocore.chaos", "sc_neurocore.chaos.*",
    "sc_neurocore.bio", "sc_neurocore.bio.*",
]

[tool.setuptools.package-data]
sc_neurocore = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["sc_neurocore"]
omit = [
    "*/experiments/*",
    "*/drivers/*",
    "*/interfaces/ccw_bridge.py",
    "*/audio/adaptive_engine.py",
    "*/audio/evs_engine.py",
    "*/sleep/report_generator.py",
    "*/sleep/sleep_optimizer.py",
    "*/swarm/*",
]

[tool.coverage.report]
fail_under = 98
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "raise NotImplementedError",
    "if HAS_MPI",
    "if HAS_CUPY",
    "if HAS_NUMBA",
    "if HAS_JAX",
    "if HAS_QISKIT",
    "if HAS_PENNYLANE",
    "except ImportError",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
  "E501",   # line too long (black handles formatting)
  "E402",   # module-level import not at top (test files use mid-file imports)
  "E741",   # ambiguous variable name (I is standard for current in physics)
  "I001",   # import sorting (not enforced yet, ~500 pre-existing violations)
  "UP006", "UP031", "UP035", "UP037", "UP045",  # typing modernization (needs __future__ annotations)
  "F841",   # unused variable (many in demo/experiment scripts)
  "SIM102", "SIM105", "SIM108",  # style simplifications
  "B007",   # unused loop control variable
  "B017", "B018", "B023", "B028", "B904", "B905",  # minor bugbear rules
]

[tool.bandit]
skips = ["B101", "B311", "B404", "B603", "B607"]
exclude_dirs = ["tests", "experiments", "research", "scripts"]

[tool.mypy]
strict = true
ignore_missing_imports = false
warn_unused_ignores = true
warn_return_any = true
[[tool.mypy.overrides]]
module = ['cupy.*', 'mpi4py.*', 'numba.*', 'matplotlib.*', 'scipy.*', 'networkx.*', 'onnx.*', 'torch.*', 'gym.*', 'flask.*', 'scpn_evo2_real_interface.*', 'scpn_opentrions_verify.*', 'scpn_cross_layer_integration_L1_L7.*', 'jax.*', 'qiskit.*', 'pennylane.*', 'qiskit_aer.*']
ignore_missing_imports = true
