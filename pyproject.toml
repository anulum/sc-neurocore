# SC-NeuroCore — SC Neurocore Project Config

[build-system]
requires = ["setuptools>=78.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-neurocore"
version = "3.15.34"
description = "Stochastic Computing SNN framework: NumPy + Rust SIMD + FPGA RTL."
authors = [
  { name = "Miroslav Sotek", email = "protoscience@anulum.li" }
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = [
  "neuromorphic",
  "stochastic-computing",
  "fpga",
  "spiking-neural-networks",
  "hyper-dimensional-computing",
  "rust",
  "hardware-simulation",
  "petri-nets",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "defusedxml>=0.7.1",
  "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/anulum/sc-neurocore"
Documentation = "https://anulum.github.io/sc-neurocore/"
Source = "https://github.com/anulum/sc-neurocore"
Issues = "https://github.com/anulum/sc-neurocore/issues"
Changelog = "https://github.com/anulum/sc-neurocore/blob/main/docs/CHANGELOG.md"
Discussions = "https://github.com/anulum/sc-neurocore/discussions"

[project.scripts]
sc-neurocore = "sc_neurocore.cli:main"

[project.optional-dependencies]
core = []
dev = ["pytest", "pytest-cov", "pytest-xdist", "hypothesis", "mypy", "ruff", "bandit", "pyyaml", "onnx", "pint>=0.23", "mojo>=0.26.2.0; platform_system != 'Windows'", "tomli; python_version < '3.11'"]
dev-full = ["sc-neurocore[dev]", "jax", "jaxlib", "qiskit", "pennylane", "qiskit-aer", "qiskit-ibm-runtime"]
accel = ["numba>=0.56"]
gpu = ["cupy-cuda12x>=12.0"]
hdl = ["pint>=0.23"]
license = ["httpx>=0.27"]
full = [
  "numba>=0.56",
  "matplotlib>=3.5",
  "networkx",
  "onnx",
  "torch>=2.0",
  "nir>=1.0",
  "fastapi>=0.100",
  "uvicorn[standard]>=0.20",
  "httpx>=0.27",
  "PyWavelets>=1.4",
  "zstandard>=0.22",
  "scikit-learn>=1.3",
  "pint>=0.23",
  "qiskit",
  "pennylane",
  "qiskit-aer",
  "qiskit-ibm-runtime",
]
research = ["matplotlib>=3.5", "networkx", "onnx", "torch>=2.0"]
chemistry = [
  "ase>=3.23",
  "basis-set-exchange>=0.10",
  "cclib>=1.8",
  "periodictable>=2.0",
]
training = ["torch>=2.0"]
jax = ["jax", "jaxlib"]
julia = ["juliacall>=0.9"]
quantum = ["qiskit", "pennylane", "qiskit-aer", "qiskit-ibm-runtime"]
quantum-cognition = ["sc-neurocore[quantum]"]  # Fisher-Posner experimental layer
nir = ["nir>=1.0"]
mpi = ["mpi4py>=3.0"]
lava = ["lava-nc; python_version < '3.11'"]
studio = ["fastapi>=0.100", "uvicorn[standard]>=0.20", "httpx>=0.27"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
compression = ["PyWavelets>=1.4", "zstandard>=0.22"]
optics = ["gdsfactory>=9.0"]
bioware = ["scikit-learn>=1.3"]
units = ["pint>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
    "sc_neurocore.audio", "sc_neurocore.audio.*",
    "sc_neurocore.generative", "sc_neurocore.generative.*",
    "sc_neurocore.world_model", "sc_neurocore.world_model.*",
    "sc_neurocore.dashboard", "sc_neurocore.dashboard.*",
    "sc_neurocore.viz", "sc_neurocore.viz.*",
    "sc_neurocore.analysis", "sc_neurocore.analysis.*",
    "sc_neurocore.experiments", "sc_neurocore.experiments.*",
    "sc_neurocore.drivers", "sc_neurocore.drivers.*",
    "sc_neurocore.interfaces", "sc_neurocore.interfaces.*",
    "sc_neurocore.swarm", "sc_neurocore.swarm.*",
    "sc_neurocore.sleep", "sc_neurocore.sleep.*",
    "sc_neurocore.optics", "sc_neurocore.optics.*",
    "sc_neurocore.chaos", "sc_neurocore.chaos.*",
    "sc_neurocore.bio", "sc_neurocore.bio.*",
    "sc_neurocore.robotics", "sc_neurocore.robotics.*",
    "sc_neurocore.physics", "sc_neurocore.physics.*",
]

[tool.setuptools.package-data]
sc_neurocore = [
  "py.typed",
  "model_zoo/weights/*.npz",
  "hardware/*.v",
  "hdl/primitives/*.v",
  "hdl_gen/safety/*.sv",
  "hdl_gen/openroad_flow/*.sh",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["sc_neurocore"]
omit = [
    # --- Requires external hardware/services ---
    "*/quantum/hardware_bridge.py",     # IBM Quantum hardware
    "*/quantum_cognition/bridge_adapter.py",  # Optional PennyLane
    "*/integrations/lava_bridge.py",    # Intel Loihi hardware
    "*/interfaces/ccw_bridge.py",       # CCW system bridge
    # --- Requires optional heavy deps (torch, JAX, nir) ---
    "*/training/*",                     # PyTorch training pipeline
    "*/conversion/*",                   # ANN-to-SNN (torch)
    "*/qat/torch_qat.py",              # PyTorch QAT (requires torch)
    "*/core/bipolar.py",               # SC bipolar primitives
    "*/adapters/neuroml.py",           # NeuroML 2 importer
    "*/adapters/sonata.py",            # SONATA HDF5 importer
    "*/nir_bridge/*",                   # NIR interop (nir package)
    "*/accel/jax_backend.py",           # JAX GPU backend
    "*/layers/jax_dense_layer.py",      # JAX dense layer
    "*/accel/julia/neurons/__init__.py",  # Optional Julia backend shim
    "*/accel/julia/solvers/__init__.py",  # Optional Julia backend shim
    "*/accel/go/rk4_neurons/__init__.py",  # Optional Go backend shim
    "*/accel/mojo/rk4_neurons/__init__.py",  # Optional Mojo backend shim
    # --- 116 neuron model files (each tested via model-agnostic step/reset) ---
    "*/neurons/models/*",
    # --- Network engine: coverage enforced since v3.14.0 ---
    # Previously omitted; now covered by test_network_monitors_stimulus,
    # test_topology_generators, test_cortical_column_dynamics,
    # test_fim_symmetry_dynamics, test_identity_lazarus.
    # Remaining omits: mpi_runner.py (requires mpi4py)
    "*/network/mpi_runner.py",
    # --- CLI (tested via subprocess in CI, not via pytest) ---
    "*/cli.py",
    "*/neurons/__main__.py",
    "*/neurons/dsl_cli.py",
    "*/quantum_cognition/__main__.py",
    # --- Hardware/IP packaging tooling ---
    "*/hdl_gen/ip_xact.py",
    # --- Research and extended source modules ---
    "*/experiments/*",
    "*/drivers/*",
    "*/quantum_cognition/fs_watcher.py",  # filesystem daemon, integration-tested outside unit CI
    "*/quantum_cognition/tests/*",        # package-local tests are not source modules
    "*/audio/adaptive_engine.py",
    "*/audio/evs_engine.py",
    "*/sleep/report_generator.py",
    "*/sleep/sleep_optimizer.py",
    "*/viz/plots.py",
    # --- Studio web UI (requires fastapi, tested separately) ---
    "*/studio/*",
]

[tool.coverage.report]
fail_under = 96  # Ratcheted after closing the first coverage slice; target remains 100.
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "raise NotImplementedError",
    "raise SCEncodingError",
    "raise ValueError\\(f\"Unsupported",
    "if HAS_MPI",
    "if HAS_CUPY",
    "if HAS_NUMBA",
    "if HAS_JAX",
    "if HAS_QISKIT",
    "if HAS_PENNYLANE",
    "if HAS_TORCH",
    "if HAS_LAVA",
    "except ImportError",
    "if TYPE_CHECKING",
    "^\\s*\\.\\.\\.\\s*$",
    "import jax",
    "HAS_JAX = True",
    "raise ValueError\\(f\"Unknown",
    "return \\[\\]$",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["scripts", "research", "experiments", "examples", "cosim", "bridge", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
  "E501",   # line too long (ruff format handles formatting)
  "E402",   # module-level import not at top (test files use mid-file imports)
  "E741",   # ambiguous variable name (I is standard for current in physics)
  "I001",   # import sorting (not enforced yet, ~500 pre-existing violations)
  "UP006", "UP007", "UP015", "UP031", "UP035", "UP037", "UP045",  # typing modernization + open() mode arg
  "F841",   # unused variable (many in demo/experiment scripts)
  "SIM102", "SIM105", "SIM108",  # style simplifications
  "B007",   # unused loop control variable
  "B017", "B018", "B023", "B028", "B904", "B905",  # minor bugbear rules
]
# NumPy-convention docstrings (BROADCAST_2026-06-17). `D` is not yet in the global
# `select` because the legacy tree still carries ~4.6k D violations; instead the
# scoped public-docstring gate (tests/test_public_docstring_policy.py) enforces
# `ruff check --select D` against docs/docstring_policy.toml, and that file list grows
# package-by-package until `D` can be promoted to the global select.
[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.bandit]
skips = ["B101", "B307", "B311", "B404", "B603", "B607"]
exclude_dirs = [
    "tests",
    "experiments",
    "research",
    "scripts",
    "src/sc_neurocore/accel/mojo/.pixi",
]

[tool.mypy]
strict = true
ignore_missing_imports = false
exclude = [
    "src/sc_neurocore/quantum_cognition/tests/",
]

# External untyped third-party dependencies — no upstream stubs available.
[[tool.mypy.overrides]]
module = ['cupy.*', 'cupyx.*', 'mpi4py.*', 'numba.*', 'matplotlib.*', 'scipy.*', 'sklearn.*', 'networkx.*', 'onnx.*', 'torch.*', 'torchvision.*', 'gym.*', 'flask.*', 'scpn_evo2_real_interface.*', 'scpn_opentrions_verify.*', 'scpn_cross_layer_integration_L1_L7.*', 'jax.*', 'qiskit.*', 'pennylane.*', 'qiskit_aer.*', 'qiskit_ibm_runtime.*', 'psutil.*', 'watchdog.*', 'pytest.*', 'llm.*', 'fastapi.*', 'uvicorn.*', 'starlette.*', 'pydantic.*', 'httpx.*', 'nir.*', 'h5py.*', 'orjson.*', 'sc_neurocore_engine.*', 'tonic.*', 'lava.*', 'wandb.*', 'yaml.*', 'serial.*', 'usb.*', 'zstandard.*', 'pywt.*', 'juliacall.*', 'gdsfactory.*', 'meep.*', 'gdstk.*', 'dimod.*', 'dwave.*', 'nupack.*']
ignore_missing_imports = true

# Strict-typing burn-down ledger — TODO(gh-strict-mypy): docs/internal/MASTER_TODO_2026-04-20.md §1.4.
# Each package below still carries type-arg / no-any-return / unused-ignore debt under
# full `strict = true`. Entries are deleted package-by-package as the debt is cleared; the
# destination is an empty ledger (the whole tree fully strict). Do NOT add packages here to
# silence new code — newly written or modified code must be strict-clean from the first commit.
[[tool.mypy.overrides]]
module = [
  'sc_neurocore.accel.*', 'sc_neurocore.adapters.*', 'sc_neurocore.analog_bridge.*', 'sc_neurocore.analysis.*',
  'sc_neurocore.arcane_zenith', 'sc_neurocore.audio.*', 'sc_neurocore.augmentation.*', 'sc_neurocore.autofit.*',
  'sc_neurocore.bci_studio.*', 'sc_neurocore.benchmarks.*', 'sc_neurocore.bio.*', 'sc_neurocore.bioware.*',
  'sc_neurocore.bridges.*', 'sc_neurocore.chaos.*', 'sc_neurocore.chip_compiler.*', 'sc_neurocore.chiplet.*',
  'sc_neurocore.comm.*', 'sc_neurocore.compiler.*', 'sc_neurocore.compression.*', 'sc_neurocore.continual.*',
  'sc_neurocore.control.*', 'sc_neurocore.conversion.*', 'sc_neurocore.core.*', 'sc_neurocore.datasets.*',
  'sc_neurocore.debug.*', 'sc_neurocore.digital_twin.*', 'sc_neurocore.distillation.*', 'sc_neurocore.doctor.*',
  'sc_neurocore.drivers.*', 'sc_neurocore.edge.*', 'sc_neurocore.energy_accounting.*',
  'sc_neurocore.ensembles.*', 'sc_neurocore.evo_substrate.*', 'sc_neurocore.experimental.*', 'sc_neurocore.experiments.*',
  'sc_neurocore.explain.*', 'sc_neurocore.explainability.*', 'sc_neurocore.export.*', 'sc_neurocore.fault_injection.*',
  'sc_neurocore.few_shot.*', 'sc_neurocore.fusion.*', 'sc_neurocore.generative.*',
  'sc_neurocore.graphs.*', 'sc_neurocore.hdc.*', 'sc_neurocore.hdl_gen.*', 'sc_neurocore.homeostasis.*',
  'sc_neurocore.hypervisor.*', 'sc_neurocore.identity.*', 'sc_neurocore.integrations.*', 'sc_neurocore.interfaces.*',
  'sc_neurocore.learning.*', 'sc_neurocore.memristor.*',
  'sc_neurocore.meta_plasticity.*', 'sc_neurocore.model_zoo.*', 'sc_neurocore.nas.*', 'sc_neurocore._native.*',
  'sc_neurocore.network.*', 'sc_neurocore.neurons.*', 'sc_neurocore.neuro_symbolic.*', 'sc_neurocore.nir_bridge.*',
  'sc_neurocore.optics.*', 'sc_neurocore.optimizer.*', 'sc_neurocore.physics.*', 'sc_neurocore.pipeline.*',
  'sc_neurocore.privacy.*', 'sc_neurocore.profiling.*', 'sc_neurocore.qat.*', 'sc_neurocore.quantum.*',
  'sc_neurocore.quantum_cognition.*', 'sc_neurocore.reservoir.*', 'sc_neurocore.residual.*', 'sc_neurocore.resilience.*',
  'sc_neurocore.safety_cert.*', 'sc_neurocore.scpn.*', 'sc_neurocore.security.*', 'sc_neurocore.sensors.*',
  'sc_neurocore.sleep.*', 'sc_neurocore.snn_optimizer.*', 'sc_neurocore.sources.*',
  'sc_neurocore.spatial.*', 'sc_neurocore.spike_gnn.*',
  'sc_neurocore.spike_ode.*', 'sc_neurocore.spintronic.*', 'sc_neurocore.stochastic_doctor.*', 'sc_neurocore.studio.*',
  'sc_neurocore.swarm.*', 'sc_neurocore.symbolic.*', 'sc_neurocore.temporal_hierarchy.*',
  'sc_neurocore.topology.*', 'sc_neurocore.training.*', 'sc_neurocore.transfer.*', 'sc_neurocore.transformers.*',
  'sc_neurocore.utils.*', 'sc_neurocore.verification.*', 'sc_neurocore.viz.*', 'sc_neurocore.world_model.*',
]
disallow_any_generics = false
warn_return_any = false
warn_unused_ignores = false

# Hard external-binding modules (torch / jax / Rust FFI) — additionally relax untyped
# call/decorator/subclassing checks on top of the burn-down ledger above.
# TODO(gh-strict-mypy): docs/internal/MASTER_TODO_2026-04-20.md §1.4.
[[tool.mypy.overrides]]
module = ['sc_neurocore.training.*', 'sc_neurocore.qat.*', 'sc_neurocore.conversion.*', 'sc_neurocore.accel.jax_backend', 'sc_neurocore.accel.jit_kernels', 'sc_neurocore.nas.*', 'sc_neurocore._native.*', 'sc_neurocore.quantum_cognition.fs_watcher']
disallow_subclassing_any = false
disallow_untyped_decorators = false
disallow_untyped_calls = false
