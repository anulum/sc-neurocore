[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-neurocore"
version = "0.1.0"
description = "Stochastic neuron models for stochastic computing and neuromorphic experiments."
authors = [
  { name = "Miroslav Sotek", email = "fortisstudio@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.22",
]

[project.optional-dependencies]
dev = ["pytest", "mypy", "black"]
