# SC-NeuroCore — SC Neurocore Project Config

[build-system]
requires = ["setuptools>=78.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-neurocore"
version = "4.2.0"
description = "Stochastic Computing SNN framework: NumPy + Rust SIMD + FPGA RTL."
authors = [
  { name = "Miroslav Šotek", email = "protoscience@anulum.li" }
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = [
  "neuromorphic",
  "stochastic-computing",
  "fpga",
  "spiking-neural-networks",
  "hyper-dimensional-computing",
  "rust",
  "hardware-simulation",
  "petri-nets",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "defusedxml>=0.7.1",
  "tomli-w>=1.0",
  "typing-extensions>=4.0,<5",
]

[project.urls]
Homepage = "https://github.com/anulum/sc-neurocore"
Documentation = "https://anulum.github.io/sc-neurocore/"
Source = "https://github.com/anulum/sc-neurocore"
Issues = "https://github.com/anulum/sc-neurocore/issues"
Changelog = "https://github.com/anulum/sc-neurocore/blob/main/docs/CHANGELOG.md"
Discussions = "https://github.com/anulum/sc-neurocore/discussions"

[project.scripts]
sc-neurocore = "sc_neurocore.cli:main"
sc-neurocore-if-benchmark = "sc_neurocore.conversion.if_benchmark_cli:main"

[project.gui-scripts]
snn-studio = "sc_neurocore.studio.desktop.__main__:main"

[project.entry-points."sc_neurocore.adapters"]
neuroml = "sc_neurocore.adapters.importers:NeuroMLImporter"
sonata = "sc_neurocore.adapters.importers:SONATAImporter"
spikeinterface = "sc_neurocore.adapters.importers:SpikeInterfaceImporter"
holonomic_dna_storage = "sc_neurocore.adapters.holonomic.dna_storage:DNAEncoder"
holonomic_grn = "sc_neurocore.adapters.holonomic.grn:GeneticRegulatoryLayer"
holonomic_neuromodulation = "sc_neurocore.adapters.holonomic.neuromodulation:NeuromodulatorSystem"

# Model simulators, resolved by sc_neurocore.core.backends.resolve_simulator so that a model
# never imports its executor. Reinstall the package after changing this group.
[project.entry-points."sc_neurocore.simulators"]
alpha = "sc_neurocore.accel.alpha:simulate_alpha"

[project.optional-dependencies]
minimal = []
core = []
hdc-reference = ["torch-hd==5.8.4"]
# The editable CI install also installs a Mojo executable; keep its version
# identical to accel/mojo/pixi.toml and the locked CI inputs. Mypy and Ruff are
# pinned to the versions of requirements/lint.in, which the scanner manifest
# and the typing runner's own version check name.
dev = ["pytest", "pytest-cov", "pytest-xdist", "filelock", "hypothesis", "mypy==2.4.1", "ruff==0.17.5", "bandit", "pyyaml", "onnx", "pint>=0.23", "sympy>=1.12", "mojo==1.0.0; platform_system != 'Windows'", "tomli-w>=1.0"]
dev-full = ["sc-neurocore[dev]", "jax", "jaxlib", "qiskit", "pennylane", "qiskit-aer", "qiskit-ibm-runtime"]
accel = ["numba>=0.56"]
gpu = ["cupy-cuda12x>=12.0"]
hdl = ["pint>=0.23"]
symbolic = ["sympy>=1.12"]  # exponential-Euler symbolic Jacobian (method="exp_euler")
license = ["httpx>=0.27"]
full = [
  "numba>=0.56",
  "matplotlib>=3.5",
  "networkx",
  "onnx",
  "torch>=2.0",
  # nir 1.0.8 made Flatten.input_type mandatory. The bridge supplies it explicitly;
  # keep the upper bound fail-closed until the next NIR schema line is validated.
  "nir>=1.0,<1.0.9",
  "fastapi>=0.100",
  "uvicorn[standard]>=0.20",
  "httpx>=0.27",
  "httpx2>=2.5,<3",
  "PyWavelets>=1.4",
  "zstandard>=0.22",
  "scikit-learn>=1.3",
  "pint>=0.23",
  "sympy>=1.12",
  "qiskit",
  "pennylane",
  "qiskit-aer",
  "qiskit-ibm-runtime",
]
research = ["matplotlib>=3.5", "networkx", "onnx", "torch>=2.0"]
chemistry = [
  "ase>=3.23",
  "basis-set-exchange>=0.10",
  "cclib>=1.8",
  "periodictable>=2.0",
]
training = ["torch>=2.0"]
jax = ["jax", "jaxlib"]
julia = ["juliacall>=0.9"]
annealing = ["dwave-neal", "dimod"]
quantum = ["qiskit", "pennylane", "qiskit-aer", "qiskit-ibm-runtime"]
quantum-cognition = ["sc-neurocore[quantum]"]  # Fisher-Posner experimental layer
nir = ["nir>=1.0,<1.0.9"]  # nir 1.0.8 makes Flatten.input_type mandatory; supplied by nir_bridge.export
interop-snntorch = ["nir==1.0.8", "snntorch==1.0.0", "nirtorch==2.6", "torch>=2.0"]
# Sinabs 3.1.3 requires nir<=1.0.4; NIRTorch 2.0.3+ requires nir>=1.0.6.
# Keep this legacy reference profile separate from interop-snntorch.
interop-sinabs = ["nir==1.0.4", "sinabs==3.1.3", "nirtorch==2.0.2", "torch>=2.0"]
neuroml = ["libNeuroML>=0.6.7,<0.7"]  # write and schema-validate NeuroML 2 documents
sonata = ["libsonata>=0.2.2,<0.3"]  # read SONATA circuits through the reference library
mpi = ["mpi4py>=3.0"]
studio = ["fastapi>=0.100", "uvicorn[standard]>=0.20", "httpx>=0.27", "httpx2>=2.5,<3", "nir>=1.0,<1.0.9", "pint>=0.23", "sympy>=1.12"]  # nir: the canvas exports and imports NIR files; pint and sympy: candidate units and equation diffs
desktop = ["PySide6-WebEngine==6.12.0.140"]
federation = ["scpn-studio-platform>=0.11.3,<0.12"]  # Hub federation vertical (sc_neurocore.federation)
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "sphinx>=8,<10",
  "furo>=2024.8.6",
]
compression = ["PyWavelets>=1.4", "zstandard>=0.22"]
optics = ["gdsfactory>=9.0"]
bioware = ["scikit-learn>=1.3"]
units = ["pint>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
    "sc_neurocore.audio", "sc_neurocore.audio.*",
    "sc_neurocore.generative", "sc_neurocore.generative.*",
    "sc_neurocore.world_model", "sc_neurocore.world_model.*",
    "sc_neurocore.dashboard", "sc_neurocore.dashboard.*",
    "sc_neurocore.viz", "sc_neurocore.viz.*",
