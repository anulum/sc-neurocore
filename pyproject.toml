[tool.coverage.report]
fail_under = 100  # Exact retained aggregate: 65,373/65,373 statements at tip 2e6118ba5.
# Report the repository source tree only. Distribution acceptance tests import an
# extracted wheel copy of the package from a temporary directory. Subprocess
# measurement records those copies by package name; they are not repository source
# and no longer exist when the full-suite union is reported.
include = ["src/sc_neurocore/*"]
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "raise NotImplementedError",
    "raise SCEncodingError",
    "raise ValueError\\(f\"Unsupported",
    "if HAS_MPI",
    "if HAS_CUPY",
    "if HAS_NUMBA",
    "if HAS_JAX",
    "if HAS_QISKIT",
    "if HAS_PENNYLANE",
    "if HAS_TORCH",
    "if HAS_LAVA",
    "except ImportError",
    "if TYPE_CHECKING",
    "^\\s*\\.\\.\\.\\s*$",
    "import jax",
    "HAS_JAX = True",
    "raise ValueError\\(f\"Unknown",
    "return \\[\\]$",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["scripts", "research", "experiments", "examples", "cosim", "bridge", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
  "E501",   # line too long (ruff format handles formatting)
  "E402",   # module-level import not at top (test files use mid-file imports)
  "E741",   # ambiguous variable name (I is standard for current in physics)
  "I001",   # import sorting (not enforced yet, ~500 pre-existing violations)
  "UP006", "UP007", "UP015", "UP031", "UP035", "UP037", "UP045",  # typing modernization + open() mode arg
  "F841",   # unused variable (many in demo/experiment scripts)
  "SIM102", "SIM105", "SIM108",  # style simplifications
  "B007",   # unused loop control variable
  "B017", "B018", "B023", "B028", "B904", "B905",  # minor bugbear rules
]

# NumPy-convention docstrings (BROADCAST_2026-06-17). `D` is not yet in the global
# `select` because the legacy tree still carries ~4.6k D violations; instead the
# scoped public-docstring gate (tests/test_public_docstring_policy.py) enforces
# `ruff check --select D` against docs/docstring_policy.toml, and that file list grows
# package-by-package until `D` can be promoted to the global select.
[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.bandit]
skips = ["B101", "B307", "B311", "B404", "B603", "B607"]
exclude_dirs = [
    "tests",
    "experiments",
    "research",
    "scripts",
    "src/sc_neurocore/accel/go/.venv",
    "src/sc_neurocore/accel/mojo/.pixi",
]

[tool.mypy]
strict = true
ignore_missing_imports = false

# External untyped third-party dependencies — no upstream stubs available.
[[tool.mypy.overrides]]
module = ['cupy.*', 'cupyx.*', 'mpi4py.*', 'numba.*', 'matplotlib.*', 'scipy.*', 'sklearn.*', 'networkx.*', 'onnx.*', 'torch.*', 'torchvision.*', 'gym.*', 'flask.*', 'scpn_evo2_real_interface.*', 'scpn_opentrions_verify.*', 'scpn_cross_layer_integration_L1_L7.*', 'jax.*', 'qiskit.*', 'pennylane.*', 'qiskit_aer.*', 'qiskit_ibm_runtime.*', 'psutil.*', 'watchdog.*', 'pytest.*', 'llm.*', 'fastapi.*', 'uvicorn.*', 'starlette.*', 'pydantic.*', 'httpx.*', 'nir.*', 'h5py.*', 'orjson.*', 'sc_neurocore_engine.*', 'tonic.*', 'lava.*', 'wandb.*', 'yaml.*', 'serial.*', 'usb.*', 'zstandard.*', 'pywt.*', 'juliacall.*', 'gdsfactory.*', 'meep.*', 'gdstk.*', 'dimod.*', 'dwave.*', 'nupack.*', 'sympy.*', 'neuroml.*', 'libsonata.*', 'snntorch.*', 'spikingjelly.*']
ignore_missing_imports = true

# Strict-typing burn-down ledger — COMPLETE (2026-06-21). Package-wide
# `mypy --strict src/sc_neurocore/` is green with an EMPTY ledger: every package that
# once carried type-arg / no-any-return / unused-ignore debt has been cleared (the last
# was `sc_neurocore.bci_studio`). No general per-module strictness relaxations remain.
# Newly written or modified code must be strict-clean from the first commit; do NOT
# reintroduce a burn-down override to silence new code.
# History: docs/internal/archive/todos/2026-07-26/MASTER_TODO_2026-04-20.md §1.4.

# Hard external-binding modules (torch / jax / Rust FFI) — relax untyped
# call/decorator/subclassing checks only, since these bindings have no upstream type stubs.
# Exception rationale: the archived §1.4 closeout documents the missing upstream stubs.
[[tool.mypy.overrides]]
# torch subclasses: without torch (the CI lint job installs none) the base is Any.
module = ['sc_neurocore.training.*', 'sc_neurocore.qat.*', 'sc_neurocore.conversion.*', 'sc_neurocore.studio.event_training_data', 'sc_neurocore.accel.jax_backend', 'sc_neurocore.accel.jit_kernels', 'sc_neurocore.nas.*', 'sc_neurocore._native.*', 'sc_neurocore.quantum_cognition.fs_watcher']
disallow_subclassing_any = false
disallow_untyped_decorators = false
disallow_untyped_calls = false

# Optional federation SDK: scpn-studio-platform ships py.typed but its StrEnum
# members resolve to `str` under pinned mypy, and the SDK is absent from the CI
# base dev-lock. Treat it as untyped so sc_neurocore.federation stays strict-clean
# with or without the optional extra installed.
[[tool.mypy.overrides]]
module = "scpn_studio_platform.*"
ignore_missing_imports = true
follow_imports = "skip"
