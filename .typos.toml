# SC-NeuroCore — Source/config provenance header

[files]
extend-exclude = [
    "Cargo.lock",
    "*.rpt",
    "vivado_project/",
    "sc_shd_pynq/",
    "sc-neurocore/",
    "site/",
    "*.xpr",
    "*.xdc",
    "docs/api/models/",
    "docs/internal/",
    "docs/tutorials/",
    "docs/guides/",
    "docs/research/",
    "docs/reports/",
    "docs/benchmarks/",
    "notebooks/",
    "studio/",
    # Auto-generated Rust stubs whose `// ...` docs are Python pseudocode
    # truncated at ~80 cols mid-word (cannot be spell-checked without
    # regenerating the stubs).
    "src/sc_neurocore/accel/rust/safety/",
]

[default.extend-words]
# Author names in references
Yau = "Yau"       # King-Wai Yau (retinal physiologist)
Tung = "Tung"     # Henry C. Tung (Rauch-Tung-Striebel smoother, 1965)
# Neuroscience terms
anf = "anf"       # Auditory Nerve Fibre (variable name)
Shal = "Shal"     # Kv4.x (Shal/Shaker) K+ channel gene family
VOR = "VOR"       # Vestibulo-Ocular Reflex
# Code identifiers
systemc = "systemc"  # SystemC (hardware description language)
lik = "lik"       # abbreviation for "likelihood" (log_lik, lik_out, etc.)
aci = "aci"       # variable name: AdaptiveCheckpointInterval instance
bve = "bve"       # einsum index label
ment = "ment"     # suffix fragment in the content-indexer stemmer
ful = "ful"       # suffix fragment in the content-indexer stemmer
# Hardware / reliability acronyms
DED = "DED"       # Double-Error-Detection (SEC-DED ECC)
ane = "ane"       # Apple Neural Engine profile identifier
VALU = "VALU"     # AMD vector ALU block naming
useed = "useed"   # Posit arithmetic useed term: 2^(2^es)
evn = "evn"       # ECP5 EVN board identifier
hace = "hace"     # Verilog hex literal 16'hACE1 (EscapeRate LFSR RNG seed), tokenised as "hace"
# Scientific journal abbreviations
Reson = "Reson"   # Journal abbreviation, e.g. J. Magn. Reson.
sur = "sur"       # French bibliography title word
Dorp = "Dorp"     # Author name: van Dorp
Collet = "Collet" # Author name: Pierre Collet
# Cargo.lock / third-party crate descriptions
THS = "THS"          # abbreviation in rand crate docs
