# SC-NeuroCore — Source/config provenance header

#
# MkDocs intentionally does not place every Markdown file in the public nav.
# This policy classifies public Markdown files that are allowed to exist outside
# `mkdocs.yml` navigation. `tests/test_docs_navigation_policy.py` enforces both
# classification and expected counts so new unlisted docs require an explicit
# navigation decision.

[[classification]]
name = "generated-root-api-reference"
rationale = "Large generated package reference linked from the curated API index rather than placed directly in nav."
patterns = ["API_REFERENCE.md"]
expected_count = 1

[[classification]]
name = "generated-capability-snapshot"
rationale = "Generated Markdown fragment consumed by README and release surfaces, not a standalone navigation page."
patterns = ["_generated/capability_snapshot.md"]
expected_count = 1

[[classification]]
name = "rust-ffi-integration-note"
rationale = "Supplemental Rust FFI integration note linked from developer-facing API and architecture material."
patterns = ["RUST_FFI_INTEGRATION.md"]
expected_count = 1

[[classification]]
name = "model-reference-pages"
rationale = "Generated per-model API pages; the navigable entry point is the curated model catalogue."
patterns = ["api/models/*.md"]
expected_count = 174

[[classification]]
name = "supplemental-api-references"
rationale = "Specialized API references linked from guides, tutorials, or the curated API index."
patterns = [
  "api/autonomous_learning.md",
  "api/bridges/local_llm.md",
  "api/compiler_service.md",
  "api/model_zoo.md",
  "api/quantum_cognition.md",
  "api/rust-analysis-engine.md",
  "api/rust-benchmarks.md",
  "api/sc_inference.md",
  "api/scpn_datastream.md",
]
expected_count = 9

[[classification]]
name = "supplemental-kernel-references"
rationale = "Specialized per-kernel reference pages (compiler and hardware) linked from the kernel and HDL documentation rather than placed directly in nav."
patterns = [
  "compiler/mixed_dense_kernel.md",
  "hardware/adc_to_spike_kernel.md",
]
expected_count = 2

[[classification]]
name = "supplemental-guides"
rationale = "Specialized operational and reference guides linked from higher-level manuals or retained as direct references."
patterns = ["guides/*.md"]
expected_count = 38

[[classification]]
name = "supplemental-benchmark-references"
rationale = "Long-form benchmark references linked from benchmark and validation material."
patterns = [
  "benchmarks/ZENITH_BENCHMARKS.md",
  "benchmarks/ZENITH_BENCHMARKS_GPU.md",
]
expected_count = 2

[[classification]]
name = "supplemental-architecture-reference"
rationale = "Long-form architecture reference linked from architecture documentation."
patterns = ["architecture/AUTONOMOUS_LEARNING_ZENITH.md"]
expected_count = 1

[[classification]]
name = "research-whitepaper"
rationale = "Foundational research whitepaper kept outside task-oriented navigation."
patterns = ["research/SC_NEUROCORE_FOUNDATIONAL_WHITEPAPER.md"]
expected_count = 1

[[classification]]
name = "top-level-performance-references"
rationale = "Top-level hardware-benchmark and performance-index references linked from benchmark and validation material rather than placed directly in nav."
patterns = [
  "HARDWARE_BENCHMARK_REPORT.md",
  "SC_NEUROCORE_PERFORMANCE_INDEX.md",
]
expected_count = 2

[[classification]]
name = "source-paper-provenance"
rationale = "Source-paper index and our transcribed parameter notes — reference provenance for model parameters, kept outside task-oriented navigation."
patterns = [
  "source_papers/SOURCES.md",
  "source_papers/parameters/chay_keizer_1983.md",
  "source_papers/parameters/chay_keizer_minimal_2023.md",
]
expected_count = 3
