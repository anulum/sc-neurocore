<!-- SC-NeuroCore — Programme architecture map -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:x="adobe:ns:meta/" xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/" width="1600" height="1480" viewBox="0 0 1600 1480" role="img" aria-labelledby="title desc">
<title id="title">General circuit-design platform</title><desc id="desc">All sixteen planned circuit destinations: thirteen platform destinations and three specialist destinations. CORE owns neutral design contracts, TECHNOLOGY owns qualified process and model profiles, FLOW dispatches admitted operations. Domain and physical views retain separate semantics. LAB, manufacturing and automation are optional integrations; every destination is module-first.</desc>
