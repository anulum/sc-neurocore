<rect width="1600" height="1480" fill="#f5f8fc" />
<text x="56" y="66" class="title">General circuit-design platform</text>
<text x="56" y="103" class="sub">16 adopted destinations · module-first implementation · explicit tool, technology and evidence contracts</text>
<rect x="56" y="132" width="210" height="38" rx="14" class="exists" />
<text x="71" y="157" class="small">Existing software</text>
<rect x="290" y="132" width="225" height="38" rx="14" class="architecture" />
<text x="305" y="157" class="small">Architecture stage</text>
<rect x="539" y="132" width="300" height="38" rx="14" class="planned" />
<text x="554" y="157" class="small">Planned implementation</text>
<text x="56" y="219" class="heading">Shared foundation</text>
<rect x="56" y="240" width="480" height="145" rx="14" class="planned" />
<text x="74" y="273" class="name">CIRCUIT-CORE</text>
<text x="74" y="307" class="small">Neutral views, hierarchy, ports and units</text>
<text x="74" y="332" class="small">Correspondence and operation contracts</text>
<rect x="560" y="240" width="480" height="145" rx="14" class="planned" />
<text x="578" y="273" class="name">CIRCUIT-TECHNOLOGY</text>
<text x="578" y="307" class="small">PDKs, devices, libraries and process profiles</text>
<text x="578" y="332" class="small">Applicability and tool compatibility</text>
<rect x="1064" y="240" width="480" height="145" rx="14" class="planned" />
<text x="1082" y="273" class="name">CIRCUIT-FLOW</text>
<text x="1082" y="307" class="small">Sole circuit-workflow dispatch</text>
<text x="1082" y="332" class="small">Artefacts, resources and recovery</text>
<text x="56" y="419" class="small">Operations consume shared design and technology contracts; FLOW dispatches admitted providers.</text>
<rect x="56" y="448" width="480" height="145" rx="14" class="planned" />
<text x="74" y="481" class="name">CIRCUIT-DIGITAL</text>
<text x="74" y="515" class="small">Digital simulation, formal and synthesis</text>
<text x="74" y="540" class="small">Timing and testability intent</text>
<rect x="560" y="448" width="480" height="145" rx="14" class="planned" />
<text x="578" y="481" class="name">CIRCUIT-ANALOG</text>
<text x="578" y="515" class="small">Schematics, device models and simulation</text>
<text x="578" y="540" class="small">Sizing and analogue layout constraints</text>
<rect x="1064" y="448" width="480" height="145" rx="14" class="planned" />
<text x="1082" y="481" class="name">CIRCUIT-MIXED-SIGNAL</text>
<text x="1082" y="515" class="small">Continuous/discrete boundary models</text>
<text x="1082" y="540" class="small">Coupling and co-simulation</text>
<rect x="56" y="621" width="480" height="145" rx="14" class="planned" />
<text x="74" y="654" class="name">CIRCUIT-PHYSICAL</text>
<text x="74" y="688" class="small">Layout, extraction and physical checks</text>
<text x="74" y="713" class="small">Target-specific implementation views</text>
<rect x="560" y="621" width="480" height="145" rx="14" class="planned" />
<text x="578" y="654" class="name">CIRCUIT-ASSEMBLY</text>
<text x="578" y="688" class="small">Die, package, interposer and board</text>
<text x="578" y="713" class="small">Chiplets, fixtures and interfaces</text>
<rect x="1064" y="621" width="480" height="145" rx="14" class="planned" />
<text x="1082" y="654" class="name">CIRCUIT-ACCEPTANCE</text>
<text x="1082" y="688" class="small">Requirements, comparison and coverage</text>
<text x="1082" y="713" class="small">Scoped acceptance across evidence</text>
<rect x="56" y="794" width="354" height="145" rx="14" class="planned" />
<text x="74" y="827" class="name">CIRCUIT-LAB</text>
<text x="74" y="861" class="small">Bring-up and instruments</text>
<text x="74" y="886" class="small">Traceable characterisation</text>
<rect x="434" y="794" width="354" height="145" rx="14" class="planned" />
<text x="452" y="827" class="name">CIRCUIT-WORKBENCH</text>
<text x="452" y="861" class="small">General design and review UI</text>
<text x="452" y="886" class="small">The same headless operations</text>
<rect x="812" y="794" width="354" height="145" rx="14" class="planned" />
<text x="830" y="827" class="name">CIRCUIT-MANUFACTURING</text>
<text x="830" y="861" class="small">Routes, recipes and genealogy</text>
<text x="830" y="886" class="small">Work orders and supplier handoff</text>
<rect x="1190" y="794" width="354" height="145" rx="14" class="planned" />
<text x="1208" y="827" class="name">CIRCUIT-AUTOMATION</text>
<text x="1208" y="861" class="small">Equipment capabilities</text>
<text x="1208" y="886" class="small">Qualified local-provider adapters</text>
<text x="56" y="992" class="heading">3 specialist destinations — separate extraction depends on actual consumers and maintainers</text>
<rect x="56" y="1020" width="480" height="145" rx="14" class="planned" />
<text x="74" y="1053" class="name">CIRCUIT-FIELDS</text>
<text x="74" y="1087" class="small">Electromagnetic and coupled-field models</text>
<text x="74" y="1112" class="small">Geometry, meshes and boundary conditions</text>
<rect x="560" y="1020" width="480" height="145" rx="14" class="planned" />
<text x="578" y="1053" class="name">CIRCUIT-PHOTONICS</text>
<text x="578" y="1087" class="small">Optical circuits and optoelectronic coupling</text>
<text x="578" y="1112" class="small">Modes, wavelength, polarisation and loss</text>
<rect x="1064" y="1020" width="480" height="145" rx="14" class="planned" />
<text x="1082" y="1053" class="name">CIRCUIT-DEVICES</text>
<text x="1082" y="1087" class="small">Device physics, TCAD and compact models</text>
<text x="1082" y="1112" class="small">Process-specific model extraction</text>
<rect x="56" y="1211" width="1488" height="154" rx="14" class="architecture" />
<text x="78" y="1247" class="heading">Integration boundary</text>
<text x="78" y="1284" class="body">SC-NC-COMPILER and SC-NC-HARDWARE may consume supported operations through optional adapters.</text>
<text x="78" y="1320" class="small">The general platform has no production dependency on SC-NeuroCore or an SNN runtime.</text>
<text x="56" y="1410" class="small">Every material, process and physical domain keeps its own model, applicability and acceptance semantics.</text>
<text x="56" y="1442" class="small">Grouping is architectural navigation, not a package-dependency graph or an extraction order.</text>
</svg>
