<!-- SC-NeuroCore — Group schematic -->

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1870" viewBox="0 0 1600 1870" role="img" aria-labelledby="title desc">
<title id="title">SC Neuromorphic Computing Systems — group and repository map</title>
<desc id="desc">SC-NeuroCore continues as the development workbench. LOOP-TIMING-WITNESS is an architecture-stage timing instrument. Thirteen SC-NC repositories are planned extraction destinations. Twenty-five supporting tools are grouped by function; Evidence Manifest Toolkit has an architecture-stage scaffold and the other tools are planned. Lines show organizational grouping, not runtime dependencies.</desc>
