<text x="78" y="1117" class="heading">Optional laboratory and production integration</text>
<text x="78" y="1156" class="name">CIRCUIT-MANUFACTURING</text>
<text x="78" y="1188" class="body">Routes, recipes, materials and supplier handoff.</text>
<text x="78" y="1225" class="small">Existing manufacturing authority retains control.</text>
<text x="826" y="1156" class="name">CIRCUIT-AUTOMATION</text>
<text x="826" y="1188" class="body">Equipment capabilities and local-provider adapters.</text>
<text x="826" y="1225" class="small">Timing, interlocks and protection stay local.</text>
<text x="78" y="1270" class="small">Planned integration; no fabrication capability or machine-control authority is implied.</text>
<text x="56" y="1351" class="small">Lines show responsibilities and intended integration, not package dependencies or extraction order.</text>
<text x="56" y="1383" class="small">Naming a destination does not announce a package, completed extraction, tapeout or release date.</text>
