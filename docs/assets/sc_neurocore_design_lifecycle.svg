<text x="76" y="476" class="small">CIRCUIT-CORE / CIRCUIT-TECHNOLOGY</text>
<rect x="580" y="338" width="440" height="184" rx="14" class="planned" />
<text x="600" y="373" class="name">Simulation and models</text>
<text x="600" y="406" class="tag">DOCUMENTED ARCHITECTURE · DELIVERY PLANNED</text>
<text x="600" y="448" class="small">Digital, analogue and mixed-signal</text>
<text x="600" y="476" class="small">Domain-specific error and coupling laws</text>
