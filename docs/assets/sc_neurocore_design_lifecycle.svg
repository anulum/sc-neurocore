<text x="78" y="247" class="body">General circuit operations are planned; assembly, manufacturing and laboratory integrations are optional.</text>
<text x="56" y="314" class="small">Measured feedback creates a new attributed design revision</text>
<rect x="56" y="338" width="440" height="184" rx="14" class="planned" />
