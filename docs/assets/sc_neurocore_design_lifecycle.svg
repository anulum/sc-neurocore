<rect x="56" y="927" width="1488" height="135" rx="14" class="exists" />
<text x="78" y="965" class="heading">Existing application: SC-NeuroCore</text>
<text x="78" y="1003" class="body">Bounded SNN modelling, compilation and experimental Studio workflows exist in the current workbench.</text>
<text x="78" y="1035" class="small">They do not establish generic circuit-platform, manufacturer acceptance or measured-device qualification.</text>
<text x="56" y="1101" class="small">CIRCUIT-FLOW dispatches admitted operations. Local controllers retain timing, arbitration, interlocks and protection.</text>
<text x="56" y="1130" class="small">Arrows show a lifecycle, not package dependencies or extraction order; intermediate views can enter where supported.</text>
