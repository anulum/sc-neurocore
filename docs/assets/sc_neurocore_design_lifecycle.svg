<text x="1124" y="735" class="tag">DOCUMENTED ARCHITECTURE · DELIVERY PLANNED</text>
<text x="1124" y="777" class="small">Layout, extraction, timing and checks</text>
<text x="1124" y="805" class="small">CIRCUIT-PHYSICAL / CIRCUIT-ACCEPTANCE</text>
<rect x="580" y="667" width="440" height="184" rx="14" class="planned" />
