# Scoped public-docstring policy. This is intentionally incremental: files are
# added when their public surface has been audited, documented, and made safe to
# enforce. `tests/test_public_docstring_policy.py` prevents regressions inside
# the maintained scope without pretending the whole legacy tree is clean.

