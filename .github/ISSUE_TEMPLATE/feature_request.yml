# SPDX-License-Identifier: AGPL-3.0-or-later
name: Feature Request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should SC-NeuroCore do that it doesn't today?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this useful? What problem does it solve?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Python core (src/sc_neurocore)
        - Rust engine (engine/)
        - Verilog HDL (hdl/)
        - Bridge (bridge/)
        - New SIMD kernel
        - New HDC metric
        - Documentation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds or alternative approaches you've tried.
