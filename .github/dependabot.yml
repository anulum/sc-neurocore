version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, python]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /engine
    schedule:
      interval: weekly
    labels: [dependencies, rust]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci(deps)"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
