# SC-NeuroCore — Recurring audit cadence

name: Audit Cadence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: read

concurrency:
  group: audit-cadence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-inventory:
    name: Test Inventory Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: "src:."
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.3"
          cache-dependency-path: src/sc_neurocore/accel/go/go.mod

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.73.0
          manifest-path: src/sc_neurocore/accel/mojo/pixi.toml

      - name: Expose mojo without shadowing the CI Python
        run: |
          sudo tee /usr/local/bin/mojo >/dev/null <<SH
          #!/usr/bin/env bash
          exec pixi run --manifest-path "$GITHUB_WORKSPACE/src/sc_neurocore/accel/mojo/pixi.toml" mojo "\$@"
          SH
          sudo chmod +x /usr/local/bin/mojo
          mojo --version

      - name: Install package
        run: python tools/ci_install_dev.py

      - name: Build collection-gating native backends
        shell: bash
        run: |
          set -euo pipefail
          for model in rk4_neurons wilson_cowan; do
            ( cd "src/sc_neurocore/accel/go/${model}" \
                && go build -buildmode=c-shared -o "lib${model}.so" "${model}.go" )
            ( cd "src/sc_neurocore/accel/mojo/${model}" \
                && mojo build --emit shared-lib --target-cpu x86-64-v3 \
                  -o "lib${model}.so" "${model}.mojo" )
          done

      - name: Collect pytest inventory
        run: |
          python -m pytest tests/ --collect-only -q | tee audit-collect-only.txt

      - name: Build inventory audit
        run: |
          python tools/test_inventory_audit.py \
            --repo . \
            --collect-output audit-collect-only.txt \
            --output audit-inventory.json

      - name: Upload audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audit-cadence-test-inventory
          path: |
            audit-collect-only.txt
            audit-inventory.json
          retention-days: 30
