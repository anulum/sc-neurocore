# SC-NeuroCore — Blocking committed dependency audits

name: Dependency Lock Audit

permissions:
  contents: read

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    name: Audit locked dependencies (${{ matrix.ecosystem }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ecosystem: [python, rust, npm, go, julia, pixi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements/security-scanners.txt
      - name: Install hashlocked audit dependencies
        run: python -m pip install --require-hashes -r requirements/security-scanners.txt
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # 1.98.1
        if: matrix.ecosystem == 'rust'
        with:
          toolchain: "1.98.1"
      - name: Install pinned Rust advisory scanner
        if: matrix.ecosystem == 'rust'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        if: matrix.ecosystem == 'npm'
        with:
          node-version: "26.9.0"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.ecosystem == 'go'
        with:
          go-version: "1.27.1"
          cache: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        if: matrix.ecosystem == 'pixi'
        with:
          pixi-version: v0.81.0
          run-install: false
      - name: Audit every committed lock in this ecosystem
        env:
          AUDIT_ECOSYSTEM: ${{ matrix.ecosystem }}
          GOTOOLCHAIN: local
          PIXI_CACHE_DIR: ${{ runner.temp }}/pixi-audit-cache
        run: |
          python -m tools.security_scan.locked_dependency_audit \
            --ecosystem "$AUDIT_ECOSYSTEM" \
            --output-dir "$RUNNER_TEMP/dependency-audit/$AUDIT_ECOSYSTEM"
      - name: Preserve audit evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-audit-${{ matrix.ecosystem }}
          path: ${{ runner.temp }}/dependency-audit/${{ matrix.ecosystem }}
          if-no-files-found: error

  dependency-lock-audit:
    name: dependency-lock-audit
    runs-on: ubuntu-latest
    needs: [audit]
    if: always()
    steps:
      - name: Require all ecosystem audits to succeed
        env:
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: test "$AUDIT_RESULT" = success
