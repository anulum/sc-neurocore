# SC-NeuroCore — v3 Wheels

name: SC-NeuroCore v3 Wheels

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build-wheels:
    name: Build wheel (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install maturin
        run: pip install --require-hashes -r requirements/maturin.txt

      - name: Configure macOS static Z3 C++ parser
        if: runner.os == 'macOS'
        run: |
          echo "CXXFLAGS=-fdelayed-template-parsing" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=13.3" >> "$GITHUB_ENV"

      - name: Remove tracked Windows bridge binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item bridge/sc_neurocore_engine/sc_neurocore_engine.cp312-win_amd64.pyd -ErrorAction SilentlyContinue

      - name: Build wheel
        run: |
          cd bridge
          maturin build --release --out ../dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl

  build-linux-arm:
    name: Build wheel (linux-arm64, ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install maturin + cross-compile deps
        run: |
          pip install --require-hashes -r requirements/maturin.txt
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build ARM64 wheel
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cd bridge
          # Target the exact matrix interpreter rather than --find-interpreter:
          # the latter also discovers the runner's free-threaded pythonX.Yt, which
          # PyO3 0.29 rejects for CPython < 3.14 (free-threaded unsupported).
          maturin build --release --target aarch64-unknown-linux-gnu \
            --interpreter python${{ matrix.python-version }} --out ../dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheel-linux-arm64-py${{ matrix.python-version }}
          path: dist/*.whl

  test-wheels:
    name: Test wheel (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: build-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: windows-latest
            python-version: "3.14"  # NumPy MINGW-W64 crash — upstream issue
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/

      - name: Install wheel and numpy
        shell: bash
        run: |
          pip install dist/*.whl
          pip install --require-hashes -r requirements/wheels-test.txt

      - name: Smoke test
        run: python -c "import sc_neurocore_engine; print(sc_neurocore_engine.__version__); print(sc_neurocore_engine.simd_tier())"

      - name: HDC self-test
        run: python -c "from sc_neurocore_engine import HDCVector; a=HDCVector(10000,seed=1); b=HDCVector(10000,seed=2); r=(a*b)*b; assert r.similarity(a)>0.99; print('HDC OK')"

      - name: PetriNet self-test
        run: python -c "import numpy as np; from sc_neurocore_engine import PetriNetEngine; e=PetriNetEngine({'w_in':np.array([[.9,0,0],[0,0,.9],[0,.9,0]]),'w_out':np.array([[0,0,.9],[0,.9,0],[.9,0,0]]),'thresholds':np.array([.3,.3,.3]),'marking':np.array([1.,0.,0.])},length=2048,seed=42); e.step(seed=100); assert e.step_count==1; print('PetriNet OK')"
