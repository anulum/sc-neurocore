# SC-NeuroCore — Pre-commit

name: Pre-commit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      # The Rust documentation hook builds the engine twice, current and original;
      # one shared target directory lets the second build reuse the dependencies.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/pre-commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # 1.98.1
        with:
          toolchain: "1.98.1"

      - name: Install pre-commit and runtime dependencies for local hooks
        run: |
          python -m pip install --require-hashes \
            -r requirements/pre-commit.txt \
            -r requirements/runtime.txt

      - name: Run all hooks
        run: pre-commit run --show-diff-on-failure --color=always --all-files
