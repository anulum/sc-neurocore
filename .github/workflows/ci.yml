# SC-NeuroCore — CI

name: SC-NeuroCore CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "dependabot/**"
    # Path filter kept for direct-to-branch pushes to save CI minutes on
    # docs-only or asset-only commits. Pull requests are NOT filtered
    # (see below) so the required status checks in branch protection
    # always report a concrete SUCCESS / FAILURE.
    paths:
      - ".github/workflows/**"
      - "bridge/**"
      - "crates/**"
      - "engine/**"
      - "src/**"
      - "studio/frontend/**"
      - "tests/**"
      - "tools/**"
      - "docs/_generated/**"
      - "docs/internal/capability_manifest_adoption.md"
      - "hdl/**"
      - "Cargo.toml"
      - "README.md"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "requirements/**"
  # Pull requests run CI unconditionally. Branch protection requires
  # these status checks (`lint`, `frontend`, `test (3.10-3.14)`,
  # `test-training`, `spdx-guard`, `pre-commit`, `build`) to report SUCCESS before
  # merge — a path filter here would leave frontend-only / deps-only
  # PRs with eternally "pending" contexts and permanently unmergeable.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: |
          pip install --require-hashes \
            -r requirements/lint.txt \
            -r requirements/runtime.txt \
            -r requirements/hub.txt \
            -r requirements/hdl.txt

      - name: Capability manifest drift
        run: python tools/capability_manifest.py --check

      - name: Engine crate-root monolith guard
        run: python tools/engine_monolith_guard.py --check

      - name: API reference drift
        run: python scripts/generate_docs.py --check

      - name: GitHub App token format compatibility
        run: python tools/check_github_app_token_compat.py

      - name: ruff check
        run: ruff check src/ tests/ tools/capability_manifest.py

      - name: ruff format
        run: ruff format --check src/ tests/ tools/capability_manifest.py

      - name: bandit
        run: bandit -r src/sc_neurocore/ -c pyproject.toml -q

      - name: mypy
        run: mypy --strict src/sc_neurocore/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: studio/frontend
        run: npm ci

      - name: Vitest
        working-directory: studio/frontend
        run: npm test -- --run

      - name: TypeScript and Vite build
        working-directory: studio/frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: studio/frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright browser tests
        working-directory: studio/frontend
        run: npm run test:e2e

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: engine

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Go toolchain for the c-shared accel backends (test_*_backends.py build
      # lib*.so on demand via `go build -buildmode=c-shared`). Pin reused from
      # release.yml / security-scanners.yml. TIER 0: real backend builds, not skips.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.24"

      # Mojo toolchain via pixi (accel/mojo/pixi.toml, public MAX conda channel)
      # so test_*_backends.py `mojo build --emit shared-lib` builds succeed.
      # activate-environment puts the pixi env `mojo` on PATH. TIER 0, not skips.
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          manifest-path: src/sc_neurocore/accel/mojo/pixi.toml
          activate-environment: true

      - name: Install HDL simulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cvc5 git iverilog make verilator yosys
          python -m pip install --require-hashes -r requirements/sby.txt
          curl -fsSL https://github.com/YosysHQ/sby/archive/0cb15210a857e4d20030484b37a6b9b6386bd01d.tar.gz -o /tmp/sby.tar.gz
          mkdir -p /tmp/sby
          tar -xzf /tmp/sby.tar.gz -C /tmp/sby --strip-components=1
          sudo make -C /tmp/sby install PREFIX=/usr/local
          sby --version

      - name: Verify HDL simulator versions
        run: python tools/check_icarus_verilog.py --minimum-major 12

      - name: Install package
        run: python tools/ci_install_dev.py

      - name: Build autonomous_learning cdylib
        shell: bash
        run: |
          cargo build --release --manifest-path crates/autonomous_learning/Cargo.toml
          cp crates/autonomous_learning/target/release/libautonomous_learning.so \
             src/sc_neurocore/_native/libautonomous_learning.so

      - name: Test + coverage
        shell: bash
        run: |
          if [[ "${{ matrix.python-version }}" == "3.12" ]]; then
            pytest -n auto --dist loadfile tests/ -q \
              --cov=sc_neurocore \
              --cov-report=term-missing \
              --cov-report=html:htmlcov \
              --cov-fail-under=98 \
              --junitxml=test-results.xml
          else
            # Full behavioral compatibility matrix, without repeating
            # coverage instrumentation on every Python interpreter.
            pytest -n auto --dist loadfile tests/ -q --junitxml=test-results.xml
          fi

      - name: NIR graph exact coverage
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          COVERAGE_FILE=.coverage-nir-graph python -m coverage run \
            --rcfile=/dev/null --branch \
            --include='src/sc_neurocore/nir_bridge/neuron_graph*.py' \
            -m pytest tests/test_nir_bridge -q
          COVERAGE_FILE=.coverage-nir-graph python -m coverage report \
            --rcfile=/dev/null \
            --include='src/sc_neurocore/nir_bridge/neuron_graph*.py' \
            --fail-under=100 --show-missing

      - name: Bioware exact coverage
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          COVERAGE_FILE=.coverage-bioware python -m coverage run \
            --rcfile=/dev/null --branch \
            --include='src/sc_neurocore/bioware/*.py' \
            -m pytest tests/test_bioware -q
          COVERAGE_FILE=.coverage-bioware python -m coverage report \
            --rcfile=/dev/null \
            --include='src/sc_neurocore/bioware/*.py' \
            --fail-under=100 --show-missing

      - name: Autonomous-learning bridge exact coverage
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          COVERAGE_FILE=.coverage-learning python -m coverage run \
            --rcfile=/dev/null --branch \
            --include='src/sc_neurocore/_native/learning*.py' \
            -m pytest tests/test_native/test_learning_bridge_*.py -q
          COVERAGE_FILE=.coverage-learning python -m coverage report \
            --rcfile=/dev/null \
            --include='src/sc_neurocore/_native/learning*.py' \
            --fail-under=100 --show-missing

      - name: Hierarchical partitioner exact coverage
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          COVERAGE_FILE=.coverage-hierarchical-partitioner python -m coverage run \
            --rcfile=/dev/null --branch \
            --include='src/sc_neurocore/chiplet/hierarchical*.py' \
            -m pytest tests/test_chiplet/test_hierarchical_partitioner_*.py -q
          COVERAGE_FILE=.coverage-hierarchical-partitioner python -m coverage report \
            --rcfile=/dev/null \
            --include='src/sc_neurocore/chiplet/hierarchical*.py' \
            --fail-under=100 --show-missing

      - name: Studio policy exact coverage
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          COVERAGE_FILE=.coverage-studio-policy python -m coverage run \
            --rcfile=/dev/null --branch \
            --include='src/sc_neurocore/studio/platform/policy*.py' \
            -m pytest tests/test_studio_policy_*.py -q
          COVERAGE_FILE=.coverage-studio-policy python -m coverage report \
            --rcfile=/dev/null \
            --include='src/sc_neurocore/studio/platform/policy*.py' \
            --fail-under=100 --show-missing

      - name: Studio jobs exact coverage
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          COVERAGE_FILE=.coverage-studio-jobs python -m coverage run \
            --rcfile=/dev/null --branch \
            --include='src/sc_neurocore/studio/platform/jobs*.py' \
            -m pytest tests/test_studio_jobs*.py -q
          COVERAGE_FILE=.coverage-studio-jobs python -m coverage report \
            --rcfile=/dev/null \
            --include='src/sc_neurocore/studio/platform/jobs*.py' \
            --fail-under=100 --show-missing

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: htmlcov/

  test-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: crates/autonomous_learning

      - name: Install with training extras
        run: python tools/ci_install_dev.py

      - name: Build autonomous_learning cdylib
        run: |
          cargo build --release --manifest-path crates/autonomous_learning/Cargo.toml
          cp crates/autonomous_learning/target/release/libautonomous_learning.so \
             src/sc_neurocore/_native/libautonomous_learning.so

      - name: Run training tests
        run: pytest tests/test_torch_training.py -v

  test-optics-extra:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "src:."
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Editable install (local package, no deps)
        run: python tools/ci_install_editable_only.py

      - name: Install hash-pinned optics dependencies
        run: python -m pip install --require-hashes -r requirements/ci-optics.txt

      - name: Run optics tests with gdsfactory
        run: python -m pytest tests/test_optics -q -rs

  test-optional-extras:
    name: Test optional extra (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: annealing
            requirements: requirements/ci-annealing.txt
            apt_packages: ""
            test_selector: tests/test_bridges/test_quantum_annealing_neal_parity.py
          - name: onnx-protobuf
            requirements: requirements/ci-dev.txt
            apt_packages: ""
            test_selector: tests/test_export/test_onnx_exporter.py
          - name: mpi
            requirements: requirements/ci-mpi.txt
            apt_packages: "libopenmpi-dev openmpi-bin"
            test_selector: tests/test_mpi_runner_real.py
    env:
      PYTHONPATH: "src:."
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system packages
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.apt_packages }}

      - name: Editable install (local package, no deps)
        run: python tools/ci_install_editable_only.py

      - name: Install hash-pinned optional-profile dependencies
        run: python -m pip install --require-hashes -r "${{ matrix.requirements }}"

      - name: Run optional selector
        run: python -m pytest ${{ matrix.test_selector }} -q -rs

  spdx-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check SPDX headers
        run: python tools/spdx_header_audit.py --check

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, spdx-guard]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: engine

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - run: pip install --require-hashes -r requirements/build.txt -r requirements/maturin.txt

      - run: python -m build

      - name: Build engine wheel
        run: |
          cd bridge
          maturin build --release --out ../dist/

      - name: Smoke test
        run: |
          pip install dist/*.whl
          python -c "import sc_neurocore, sc_neurocore_engine; assert sc_neurocore.__version__ == sc_neurocore_engine.__version__; print(sc_neurocore.__version__)"
