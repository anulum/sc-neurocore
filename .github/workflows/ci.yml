name: SC-NeuroCore CI

permissions: {}

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "hdl/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "hdl/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: pip install black==25.1.0 ruff bandit

      - name: black
        run: black --check src/ tests/

      - name: ruff
        run: ruff check src/ tests/

      - name: bandit
        run: bandit -r src/sc_neurocore/ -c pyproject.toml -q

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Test + coverage
        run: |
          pytest tests/ -v \
            --cov=sc_neurocore \
            --cov-report=term \
            --cov-report=html:htmlcov \
            --cov-fail-under=100 \
            --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: coverage-report
          path: htmlcov/

  spdx-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check SPDX headers
        run: |
          MISSING=$(find src tests engine/src engine/tests engine/benches hdl bridge \
            -type f \( -name "*.py" -o -name "*.rs" -o -name "*.v" \) \
            ! -path "*/__pycache__/*" \
            -exec grep -rL "SPDX-License-Identifier" {} +) || true
          if [ -n "$MISSING" ]; then
            echo "::error::Files missing SPDX header:"
            echo "$MISSING"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, spdx-guard]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - run: pip install build

      - run: python -m build

      - name: Smoke test
        run: |
          pip install dist/*.whl
          python -c "import sc_neurocore; print(sc_neurocore.__version__)"
