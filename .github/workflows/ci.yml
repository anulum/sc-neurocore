  test-timings:
    runs-on: ubuntu-24.04
    needs: [test]
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pytest-timing-baseline
          path: ${{ runner.temp }}/pytest-timings
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: test-results-py3.12-shard*
          path: ${{ runner.temp }}/pytest-reports
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"
      - name: Install the hash-locked runtime requirements, including defusedxml
        run: python -m pip install --require-hashes -r requirements/runtime.txt
      - name: Retain actual module durations, including observed failed batches
        shell: bash
        run: |
          python tools/pytest_shards.py record --reports="$RUNNER_TEMP/pytest-reports" \
            --previous="$RUNNER_TEMP/pytest-timings/pytest-durations.json" \
            --output="$RUNNER_TEMP/pytest-timings/pytest-durations.json"
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/pytest-timings/pytest-durations.json
          key: ${{ github.repository }}-pytest-timings-v1-${{ github.run_id }}-${{ github.run_attempt }}

  coverage-union:
    # Carries the required check name: the instrumented suite is sharded, but
    # the 100 % gate applies once, to the union of every shard and the native
    # Windows refusal leg.
    name: test (3.12)
    runs-on: ubuntu-latest
    needs: [test, shd-non-linux-refusal]
    # A skipped job would report success to branch protection, so this job
    # runs after failed legs too and requires every test shard to pass.
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    steps:
      - name: Require successful test shards and native Windows refusal
        env:
          TEST_RESULT: ${{ needs.test.result }}
          WINDOWS_RESULT: ${{ needs.shd-non-linux-refusal.result }}
        shell: bash
        run: test "$TEST_RESULT" = success && test "$WINDOWS_RESULT" = success

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"

      - name: Install the locked coverage tool
        shell: bash
        run: |
          set -euo pipefail
          # Reuse the exact hash-locked pin of the instrumented legs.
          python - "$RUNNER_TEMP/coverage-requirements.txt" <<'PY'
          import re
          import sys
          from pathlib import Path

          lines = Path("requirements/ci-dev.txt").read_text(encoding="utf-8").splitlines()
          start = next(i for i, line in enumerate(lines) if re.match(r"coverage==\S+ \\$", line))
          block = [lines[start]]
          for line in lines[start + 1 :]:
              if not line.strip().startswith("--hash="):
                  break
              block.append(line)
          Path(sys.argv[1]).write_text("\n".join(block).rstrip(" \\") + "\n", encoding="utf-8")
          PY
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/coverage-requirements.txt"

      - name: Retrieve every coverage shard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: coverage-data-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/coverage-shards

      - name: Retrieve actual Windows refusal coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: shd-non-linux-coverage
          path: ${{ runner.temp }}/shd-platform-coverage

      - name: Coverage union gate
        env:
          SCN_EXTRA_COVERAGE_DIR: ${{ runner.temp }}/shd-platform-coverage
        shell: bash
        run: |
          bash tools/run_full_cov.sh --combine-from="$RUNNER_TEMP/coverage-shards" \
            --expect-shards="$SCN_CI_SHARD_COUNT" --html --cov-fail-under=100

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          flags: python
          name: sc-neurocore-python-3.12
          disable_search: true
          # Do not fail the union if the Codecov token/app is missing;
          # local and CI coverage gates above remain authoritative.
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  compatibility-union:
    # Preserve branch-protection names after sharding each interpreter.
    name: test (${{ matrix.python-minor }})
    runs-on: ubuntu-latest
    needs: [test]
    if: ${{ !cancelled() }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-minor: ["3.11", "3.13", "3.14"]
    steps:
      - name: Require every test shard to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
        shell: bash
        run: test "$TEST_RESULT" = success

  test-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"
          cache: pip

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.98.1
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/autonomous_learning
          # Repo- and lockfile-bound cache key (see the engine workspace note).
          key: ${{ github.repository }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install with training extras
        run: python tools/ci_install_dev.py

      - name: Build autonomous_learning cdylib
        run: |
          cargo build --release --manifest-path crates/autonomous_learning/Cargo.toml
          cp crates/autonomous_learning/target/release/libautonomous_learning.so \
             src/sc_neurocore/_native/libautonomous_learning.so

      - name: Run training tests
        run: pytest tests/test_torch_training_*.py -v

  test-optics-extra:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "src:."
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"
          cache: pip

      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.11.9"
          show-versioninfo: "never"

      - name: Verify the optics Julia runtime
        run: test "$(julia --startup-file=no -e 'print(VERSION)')" = "1.11.9"

      - name: Editable install (local package, no deps)
        run: python tools/ci_install_editable_only.py

      - name: Install hash-pinned optics dependencies
        run: python -m pip install --require-hashes -r requirements/ci-optics.txt

      # Report-only ISA audit of the installed native wheels: surface any wheel that emits
      # AVX-512 without a runtime cpuid guard (a "runner lottery" SIGILL waiting to happen)
      # at pin time rather than in a red matrix. Never fails the job (no --strict).
      - name: Scan optics wheels for unguarded AVX-512 (report-only)
        run: |
          python tools/scan_wheel_isa.py \
            --root "$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"

      # PYTHONFAULTHANDLER dumps the C-level frame if a native wheel raises SIGILL
      # (exit 132) on a runner whose CPU traps an instruction its cpuid advertised, so the
      # faulting library is captured in the log instead of a silent hard crash. Permanent
      # job hygiene — it rides every future matrix, not just this investigation.
      - name: Run optics tests with gdsfactory
        env:
          PYTHONFAULTHANDLER: "1"
        run: python -m pytest tests/test_optics -q -rs

  test-optional-extras:
    name: Test optional extra (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: annealing
            requirements: requirements/ci-annealing.txt
            apt_packages: ""
            test_selector: tests/test_bridges/test_quantum_annealing_neal_parity.py
          - name: onnx-protobuf
            requirements: requirements/ci-dev.txt
            apt_packages: ""
            test_selector: tests/test_export/test_onnx_exporter_protobuf_graph.py
          - name: mpi
            requirements: requirements/ci-mpi.txt
            apt_packages: "libopenmpi-dev openmpi-bin"
            test_selector: tests/test_mpi_runner_real.py
    env:
      PYTHONPATH: "src:."
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"
          cache: pip

      - name: Install system packages
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.apt_packages }}

      - name: Editable install (local package, no deps)
        run: python tools/ci_install_editable_only.py

      - name: Install hash-pinned optional-profile dependencies
        run: python -m pip install --require-hashes -r "${{ matrix.requirements }}"

      - name: Run optional selector
        run: python -m pytest ${{ matrix.test_selector }} -q -rs

  test-hdc-reference:
    uses: ./.github/workflows/hdc-reference.yml

  spdx-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check SPDX headers
        run: python tools/spdx_header_audit.py --check

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, coverage-union, test-hdc-reference, spdx-guard, rust-documentation]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.98.1
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine
          # Repo- and lockfile-bound cache key so a poisoned cross-repo cache
          # cannot be restored into this workspace (Swatinem/rust-cache already
          # scopes by lockfile; github.repository makes the binding explicit).
          key: ${{ github.repository }}-${{ hashFiles('**/Cargo.lock') }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"

      - run: pip install --require-hashes -r requirements/build.txt -r requirements/maturin.txt

      - run: python -m build

      - name: Build engine wheel
        run: |
          cd bridge
          maturin build --release --out ../dist/

      - name: Smoke test
        run: |
          pip install dist/*.whl
          python -c "import sc_neurocore, sc_neurocore_engine; assert sc_neurocore.__version__ == sc_neurocore_engine.__version__; print(sc_neurocore.__version__)"
