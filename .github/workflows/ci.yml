name: SC-NeuroCore CI

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "hdl/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "hdl/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint (black)
        run: black --check src/ tests/

      - name: Test + coverage
        run: pytest tests/ -v --cov=sc_neurocore --cov-report=term --cov-fail-under=98

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install build

      - run: python -m build

      - name: Smoke test
        run: |
          pip install dist/*.whl
          python -c "import sc_neurocore; print(sc_neurocore.__version__)"
