# SC-NeuroCore — CI

name: SC-NeuroCore CI

permissions: {}

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "dependabot/**"
    paths:
      - ".github/workflows/**"
      - "bridge/**"
      - "engine/**"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "hdl/**"
      - "pyproject.toml"
      - "requirements/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "bridge/**"
      - "engine/**"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "hdl/**"
      - "pyproject.toml"
      - "requirements/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: |
          pip install --require-hashes -r requirements/lint.txt
          pip install "numpy==2.2.6" "scipy==1.17.1" "fastapi==0.135.3" "pydantic==2.12.5" "uvicorn==0.43.0" "starlette==1.0.0" "types-PyYAML==6.0.12.20250915"

      - name: ruff check
        run: ruff check src/ tests/

      - name: ruff format
        run: ruff format --check src/ tests/

      - name: bandit
        run: bandit -r src/sc_neurocore/ -c pyproject.toml -q

      - name: mypy
        run: mypy src/sc_neurocore/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: engine

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python tools/ci_install_dev.py

      - name: Test + coverage
        run: |
          pytest tests/ -v \
            --cov=sc_neurocore \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-fail-under=99 \
            --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: coverage-report
          path: htmlcov/

  test-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install with training extras
        run: pip install -e ".[dev,training]"

      - name: Run training tests
        run: pytest tests/test_torch_training.py -v

  spdx-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check SPDX headers
        run: |
          MISSING=$(find src tests engine/src engine/tests engine/benches hdl bridge \
            -type f \( -name "*.py" -o -name "*.rs" -o -name "*.v" \) \
            ! -path "*/__pycache__/*" \
            -exec grep -rL "SPDX-License-Identifier" {} +) || true
          if [ -n "$MISSING" ]; then
            echo "::error::Files missing SPDX header:"
            echo "$MISSING"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, spdx-guard]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: engine

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - run: pip install --require-hashes -r requirements/build.txt -r requirements/maturin.txt

      - run: python -m build

      - name: Build engine wheel
        run: |
          cd bridge
          maturin build --release --out ../dist/

      - name: Smoke test
        run: |
          pip install dist/*.whl
          python -c "import sc_neurocore, sc_neurocore_engine; assert sc_neurocore.__version__ == sc_neurocore_engine.__version__; print(sc_neurocore.__version__)"
