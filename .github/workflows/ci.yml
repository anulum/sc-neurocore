# SC-NeuroCore — CI

name: SC-NeuroCore CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "dependabot/**"
    # Path filter kept for direct-to-branch pushes to save CI minutes on
    # docs-only or asset-only commits. Pull requests are NOT filtered
    # (see below) so the required status checks in branch protection
    # always report a concrete SUCCESS / FAILURE.
    paths:
      - ".github/workflows/**"
      - "bridge/**"
      - "crates/**"
      - "engine/**"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "docs/_generated/**"
      - "docs/internal/capability_manifest_adoption.md"
      - "hdl/**"
      - "Cargo.toml"
      - "README.md"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "requirements/**"
  # Pull requests run CI unconditionally. Branch protection requires
  # these status checks (`lint`, `test (3.10-3.14)`, `test-training`,
  # `spdx-guard`, `pre-commit`, `build`) to report SUCCESS before
  # merge — a path filter here would leave frontend-only / deps-only
  # PRs with eternally "pending" contexts and permanently unmergeable.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: |
          pip install --require-hashes -r requirements/lint.txt
          pip install "numpy==2.2.6" "scipy==1.17.1" "fastapi==0.135.3" "pydantic==2.12.5" "uvicorn==0.43.0" "starlette==1.0.0" "types-PyYAML==6.0.12.20250915" "pint==0.23"

      - name: Capability manifest drift
        run: python tools/capability_manifest.py --check

      - name: GitHub App token format compatibility
        run: python tools/check_github_app_token_compat.py

      - name: ruff check
        run: ruff check src/ tests/ tools/capability_manifest.py

      - name: ruff format
        run: ruff format --check src/ tests/ tools/capability_manifest.py

      - name: bandit
        run: bandit -r src/sc_neurocore/ -c pyproject.toml -q

      - name: mypy
        run: mypy src/sc_neurocore/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: engine

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install HDL simulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cvc5 git iverilog make verilator yosys
          python -m pip install "click==8.3.1"
          curl -fsSL https://github.com/YosysHQ/sby/archive/0cb15210a857e4d20030484b37a6b9b6386bd01d.tar.gz -o /tmp/sby.tar.gz
          mkdir -p /tmp/sby
          tar -xzf /tmp/sby.tar.gz -C /tmp/sby --strip-components=1
          sudo make -C /tmp/sby install PREFIX=/usr/local
          sby --version

      - name: Install package
        run: python tools/ci_install_dev.py

      - name: Build autonomous_learning cdylib
        shell: bash
        run: |
          cargo build --release --manifest-path crates/autonomous_learning/Cargo.toml
          cp crates/autonomous_learning/target/release/libautonomous_learning.so \
             src/sc_neurocore/_native/libautonomous_learning.so

      - name: Test + coverage
        shell: bash
        run: |
          if [[ "${{ matrix.python-version }}" == "3.12" ]]; then
            pytest -n auto --dist loadfile tests/ -q \
              --cov=sc_neurocore \
              --cov-report=term-missing \
              --cov-report=html:htmlcov \
              --cov-fail-under=96 \
              --junitxml=test-results.xml
          else
            # Full behavioral compatibility matrix, without repeating
            # coverage instrumentation on every Python interpreter.
            pytest -n auto --dist loadfile tests/ -q --junitxml=test-results.xml
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: htmlcov/

  test-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: crates/autonomous_learning

      - name: Install with training extras
        run: pip install -e ".[dev,training]"

      - name: Build autonomous_learning cdylib
        run: |
          cargo build --release --manifest-path crates/autonomous_learning/Cargo.toml
          cp crates/autonomous_learning/target/release/libautonomous_learning.so \
             src/sc_neurocore/_native/libautonomous_learning.so

      - name: Run training tests
        run: pytest tests/test_torch_training.py -v

  spdx-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Check SPDX headers
        run: |
          MISSING=$(find src tests engine/src engine/tests engine/benches hdl bridge \
            -type f \( -name "*.py" -o -name "*.rs" -o -name "*.v" \) \
            ! -path "*/__pycache__/*" \
            ! -path "src/sc_neurocore/accel/mojo/.pixi/*" \
            ! -path "src/sc_neurocore/hdl_gen/openroad_flow/build/*" \
            -exec grep -rL "SPDX-License-Identifier" {} +) || true
          if [ -n "$MISSING" ]; then
            echo "::error::Files missing SPDX header:"
            echo "$MISSING"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, spdx-guard]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: engine

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - run: pip install --require-hashes -r requirements/build.txt -r requirements/maturin.txt

      - run: python -m build

      - name: Build engine wheel
        run: |
          cd bridge
          maturin build --release --out ../dist/

      - name: Smoke test
        run: |
          pip install dist/*.whl
          python -c "import sc_neurocore, sc_neurocore_engine; assert sc_neurocore.__version__ == sc_neurocore_engine.__version__; print(sc_neurocore.__version__)"
