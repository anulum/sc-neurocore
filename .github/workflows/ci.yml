# SC-NeuroCore — CI

name: SC-NeuroCore CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    # No push.paths filter (run-always). A restrictive path filter previously
    # let benchmark-, asset- or config-only commits skip the test gate entirely:
    # a false-green masking hole where a bench-evidence-only fix could not
    # satisfy its own completed-green by push alone and needed a manual
    # workflow_dispatch to exercise the matrix. Running the full CI on every
    # push to a non-dependabot branch is the honest default. Dependabot branches
    # are excluded here; their PRs still run CI via pull_request below.
    branches-ignore:
      - "dependabot/**"
  # Pull requests run CI unconditionally so the branch-protection required
  # status checks (`lint`, `test (3.11-3.14)`, `spdx-guard`, `pre-commit`)
  # always report a concrete SUCCESS / FAILURE and never sit "pending".
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCN_CI_SHARD_COUNT: "8"
  CARGO_HTTP_MULTIPLEXING: "false"
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  # Hosted CI builds the engine, so the engine-binding import gate must never
  # skip here: a missing/broken engine is a hard red, not a wall of skips
  # (tests/engine_requirement.py).
  SC_NEUROCORE_REQUIRE_ENGINE: "1"
  # Hosted CI installs and warms juliacall, so the Julia-lane import gate must
  # never skip here either (tests/julia_requirement.py).
  SC_NEUROCORE_REQUIRE_JULIA: "1"
  # Hosted CI builds every Go and Mojo shared library, so the built-lane gate
  # must never skip here: an unbuilt lane is a hard red rather than a skip
  # (tests/native_lane_requirement.py).
  SC_NEUROCORE_REQUIRE_GO: "1"
  SC_NEUROCORE_REQUIRE_MOJO: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"
          cache: pip

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Install tools
        run: |
          pip install --require-hashes \
            -r requirements/lint.txt \
            -r requirements/runtime.txt \
            -r requirements/hub.txt \
            -r requirements/hdl.txt \
            -r requirements/studio-desktop-linux-x86_64.txt

      - name: Documentation policy scope
        run: python -m tools.docstring_policy_guard

      - name: Go documentation producer
        run: |
          go vet tools/godoc_coverage/main.go
          test -z "$(gofmt -l tools/godoc_coverage/main.go)"
          python -m tools.go_doc_ratchet

      - name: Go documentation adapter types and documentation
        env:
          MYPYPATH: src:bridge:.
        run: |
          # This job installs no test framework, so the contract tests are
          # type-checked in the native documentation job, where it is installed.
          adapters=(
            tools/go_doc_measurement.py tools/go_doc_findings.py
            tools/go_doc_history.py tools/go_doc_ratchet.py tools/documentation_debt.py
          )
          files=(
            "${adapters[@]}"
            tests/test_tools/test_go_doc_measurement_native.py
            tests/test_tools/test_go_doc_history_native.py
            tests/test_tools/test_godoc_coverage_native.py tests/test_tools_go_doc_ratchet.py
          )
          python -m mypy --strict --explicit-package-bases "${adapters[@]}"
          ruff check "${files[@]}"
          ruff check --isolated --config 'lint.pydocstyle.convention = "numpy"' --select D,E902 --ignore-noqa --no-cache "${files[@]}"
          ruff format --check "${files[@]}"

      - name: Capability manifest drift
        run: python tools/capability_manifest.py --check

      - name: Historical benchmark evidence
        run: python tools/benchmark_evidence_gate.py --output "$RUNNER_TEMP/benchmark-evidence-gate.json"

      - name: Engine monolith no-growth guard
        run: python tools/engine_monolith_guard.py --check

      - name: API reference drift
        run: python scripts/generate_docs.py --check

      - name: GitHub App token format compatibility
        run: python tools/check_github_app_token_compat.py

      - name: ruff check
        run: ruff check src/ tests/ benchmarks/ tools/capability_manifest.py

      - name: ruff format
        run: ruff format --check src/ tests/ benchmarks/ tools/capability_manifest.py

      - name: bandit
        run: bandit -r src/sc_neurocore/ -c pyproject.toml -q

      - name: mypy
        run: mypy --strict src/sc_neurocore/

  rust-documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/rust-documentation
      MYPYPATH: src:bridge:.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.98.1
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"
      - name: Install locked native-adapter test and lint dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci-dev.txt -r requirements/lint.txt
      - name: Cache the Rust documentation build target
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target/rust-documentation
          key: ${{ runner.os }}-${{ github.repository }}-rustdoc-1.98.1-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('engine/src/**', 'tools/rustdoc_symbols/src/**') }}
          restore-keys: ${{ runner.os }}-${{ github.repository }}-rustdoc-1.98.1-${{ hashFiles('**/Cargo.lock') }}-
      - name: Rust syntax producer strict gates
        run: |
          cargo fmt --check --manifest-path tools/rustdoc_symbols/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path tools/rustdoc_symbols/Cargo.toml -- -D warnings
          cargo build --locked --manifest-path tools/rustdoc_symbols/Cargo.toml
      - name: Rust documentation adapter types and documentation
        run: |
          files=(
            tools/rust_doc_ratchet.py tools/rust_doc_measurement.py
            tools/rust_doc_symbols.py tools/rust_doc_history.py tools/documentation_debt.py
            tests/test_tools/test_rustdoc_symbols_native.py
            tests/test_tools/test_rust_doc_measurement_native.py
            tests/test_tools/test_rust_doc_history_native.py
            tests/test_tools/test_rust_doc_ratchet_native.py
          )
          python -m mypy --strict --explicit-package-bases "${files[@]}"
          ruff check "${files[@]}"
          ruff check --isolated --config 'lint.pydocstyle.convention = "numpy"' --select D,E902 --ignore-noqa --no-cache "${files[@]}"
          ruff format --check "${files[@]}"
      - name: Go documentation contract test types
        run: |
          python -m mypy --strict --explicit-package-bases \
            tests/test_tools/test_go_doc_measurement_native.py \
            tests/test_tools/test_go_doc_history_native.py \
            tests/test_tools/test_godoc_coverage_native.py tests/test_tools_go_doc_ratchet.py
      - name: Real native Rust documentation contracts
        run: |
          python -m pytest -q \
            tests/test_tools/test_rustdoc_symbols_native.py \
            tests/test_tools/test_rust_doc_measurement_native.py \
            tests/test_tools/test_rust_doc_history_native.py \
            tests/test_tools/test_rust_doc_ratchet_native.py
      - name: Original engine Rust documentation debt
        run: python -m tools.rust_doc_ratchet

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json

      - name: Install verified npm
        uses: ./.github/actions/setup-npm

      - name: Install frontend dependencies
        working-directory: studio/frontend
        run: npm ci

      - name: Vitest
        working-directory: studio/frontend
        run: npm test

      - name: Hardware catalogue interface exact coverage
        working-directory: studio/frontend
        run: >-
          npm exec -- vitest run src/components/HardwareCatalogue.test.tsx
          src/components/HardwareCatalogueDialog.test.tsx
          src/workbenchKeyboard.test.ts
          src/api/hardwareApi.test.ts --coverage
          --coverage.include=src/components/HardwareCatalogue.tsx
          --coverage.include=src/components/HardwareCatalogueDialog.tsx
          --coverage.include=src/workbenchKeyboard.ts
          --coverage.include=src/api/hardwareApi.ts
          --coverage.thresholds.perFile=true
          --coverage.thresholds.lines=100 --coverage.thresholds.branches=100
          --coverage.thresholds.functions=100 --coverage.thresholds.statements=100

      - name: TypeScript and Vite build
        working-directory: studio/frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: studio/frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright browser tests
        working-directory: studio/frontend
        run: npm run test:e2e

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"
          cache: pip

      - name: Install live Studio backend dependencies
        run: |
          python -m pip install --require-hashes -r requirements/runtime.txt -r requirements/hub.txt
          python tools/ci_install_editable_only.py

      # These configurations own real backend servers and use the built bundle.
      # An editable backend verifies source integration, not wheel installation.
      - name: Playwright live replay export
        working-directory: studio/frontend
        run: npx playwright test --config playwright.export.config.ts

      - name: Playwright live network canvas
        working-directory: studio/frontend
        run: npx playwright test --config playwright.graph.config.ts

  shd-non-linux-refusal:
    name: SHD native Windows refusal
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src;bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"  # newest 3.12 release with a Windows build (3.12 is security-only)
      - name: Install hashlocked test dependencies
        run: python -m pip install --require-hashes -r requirements/ci-dev.txt
      - name: Exercise actual non-Linux reader refusal
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/shd-platform-coverage"
          export COVERAGE_FILE="$RUNNER_TEMP/shd-platform-coverage/.coverage.windows"
          python -m coverage run -m pytest --no-cov -q tests/test_accel_shd_platform.py
          python -m coverage combine --keep "$RUNNER_TEMP/shd-platform-coverage"
      - name: Preserve native platform coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: shd-non-linux-coverage
          path: ${{ runner.temp }}/shd-platform-coverage
          include-hidden-files: true
          if-no-files-found: error

  test-timing-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/pytest-timings/pytest-durations.json
          key: ${{ github.repository }}-pytest-timings-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ github.repository }}-pytest-timings-v1-
      - name: Initialize a cold timing baseline
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/pytest-timings/pytest-durations.json" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          path.parent.mkdir(parents=True, exist_ok=True)
          if not path.exists():
              path.write_text('{"schema":1,"durations":{}}\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pytest-timing-baseline
          path: ${{ runner.temp }}/pytest-timings/pytest-durations.json
          if-no-files-found: error
          retention-days: 7

  test-engine-wheels:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11.18", "3.12.16", "3.13.18", "3.14.10"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Restore an exact-source engine wheel
        id: engine-wheel
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/engine-wheel
          key: ubuntu24-x64-engine-v1-release-z3default-cmake3.5-py${{ matrix.python-version }}-rust1.98.1-${{ hashFiles('engine/src/**', 'engine/Cargo.*', 'engine/rust-toolchain.toml', 'engine/vendor/**', 'engine/.cargo/**', 'bridge/**/*.py', 'bridge/pyproject.toml', 'bridge/.cargo/**', 'bridge/vendor/**', 'bridge/rayon_source_patch.toml', '.cargo/**', 'rust-toolchain.*', 'Cargo.toml', 'Cargo.lock', 'requirements/maturin.txt') }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.98.1
        if: steps.engine-wheel.outputs.cache-hit != 'true'
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.engine-wheel.outputs.cache-hit != 'true'
        with:
          workspaces: engine
          key: ${{ github.repository }}-test-wheel-py${{ matrix.python-version }}
      - name: Build the current engine once per Python ABI
        if: steps.engine-wheel.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m pip install --require-hashes -r requirements/maturin.txt
          cd bridge
          maturin build --release --locked --out "$RUNNER_TEMP/engine-wheel"
      - name: Save the exact-source engine wheel
        if: steps.engine-wheel.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/engine-wheel
          key: ${{ steps.engine-wheel.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-engine-wheel-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/engine-wheel/sc_neurocore_engine-*.whl
          if-no-files-found: error
          retention-days: 7

  test:
    # Coverage shards are not required checks themselves; the union job
    # `coverage-union` carries the required `test (3.12)` name and the gate.
    name: test (${{ matrix.python-minor }}${{ matrix.coverage && ' coverage' || '' }} shard ${{ matrix.shard-index }}/8)
    runs-on: ubuntu-24.04
    needs: [shd-non-linux-refusal, test-engine-wheels, test-timing-baseline]
    # Partition files before batching: neighboring compiler/backend modules no
    # longer occupy one indivisible 384-file batch on a single hosted runner.
    timeout-minutes: ${{ matrix.coverage && 300 || 240 }}
    strategy:
      fail-fast: false
      matrix:
        python-minor: ["3.11", "3.12", "3.13", "3.14"]
        shard-index: [1, 2, 3, 4, 5, 6, 7, 8]
        # Exact interpreter patch pins shrink the setup-python mutable-manifest
        # surface (actions/python-versions is fetched at runtime with no
        # per-artifact digest — accepted + tracked residual, see
        # docs/internal/ci_supply_chain_residuals.md). `python-minor` keeps the
        # branch-protection-required job names `test (3.11)`..`test (3.14)`
        # stable across patch bumps through the aggregate jobs below. Every
        # interpreter runs the complete suite across eight shards. `primary`
        # selects native desktop/browser admission, not the other exact gates.
        include:
          - python-minor: "3.11"
            python-version: "3.11.18"
          - python-minor: "3.12"
            python-version: "3.12.16"
            coverage: true
          - python-minor: "3.13"
            python-version: "3.13.18"
          - python-minor: "3.14"
            python-version: "3.14.10"
          - python-minor: "3.12"
            shard-index: 1
            primary: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.98.1
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine
          # Repo- and lockfile-bound cache key so a poisoned cross-repo cache
          # cannot be restored into this workspace (Swatinem/rust-cache already
          # scopes by lockfile; github.repository makes the binding explicit).
          key: ${{ github.repository }}-${{ hashFiles('**/Cargo.lock') }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The Julia native-parity tests run each program on 1.11 and on the
      # current release (tests/julia_runtimes.py). They found both only through
      # Juliaup (`julia +1.11`), which hosted runners lack, so every one failed
      # here. The release is installed first so that 1.11.9 below stays first on
      # PATH for juliacall; the tests reach 1.13 through the variable only.
      - id: julia-release
        uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13"
          show-versioninfo: "never"

      # juliacall 0.9.x currently constrains Julia to 1.10.3-1.11. GitHub's
      # hosted image also exposes Julia 1.12, which juliapkg rejects before
      # attempting an uncontrolled fallback download. Install the exact
      # compatible runtime once and put it first on PATH for every matrix leg.
      - id: julia-1-11
        uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.11.9"
          show-versioninfo: "never"

      - name: Pin the Julia runtimes of the native-parity tests
        shell: bash
        run: |
          set -euo pipefail
          release="${{ steps.julia-release.outputs.julia-bindir }}/julia"
          lts="${{ steps.julia-1-11.outputs.julia-bindir }}/julia"
          test -x "$release" && test -x "$lts"
          case "$("$release" --startup-file=no -e 'print(VERSION)')" in 1.13.*) ;; *) exit 1 ;; esac
          test "$("$lts" --startup-file=no -e 'print(VERSION)')" = "1.11.9"
          {
            echo "SC_NEUROCORE_TEST_JULIA_1_11=$lts"
            echo "SC_NEUROCORE_TEST_JULIA_1_13=$release"
            echo "SC_NEUROCORE_TEST_JULIA_RELEASE=$release"
          } >> "$GITHUB_ENV"

      # Go toolchain for the c-shared accel backends. Must match accel/go/go.mod's
      # `go 1.27.3` (and release.yml / security-scanners.yml). A mismatched
      # version makes `go build` reject the module under GOTOOLCHAIN=local.
      # The builder also sets GOTOOLCHAIN=auto. TIER 0: real builds.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            src/sc_neurocore/accel/go/go.mod
            src/sc_neurocore/accel/go/services/hil_debugger/go.sum

      # Mojo toolchain via pixi (accel/mojo/pixi.toml, public MAX conda channel)
      # so test_*_backends.py `mojo build --emit shared-lib` builds succeed.
      # NOT activate-environment: that prepends the pixi env's Python to PATH and
      # shadows the CI setup-python, breaking every later `python`/`pip` step.
      # Instead expose only `mojo` via a wrapper that delegates to `pixi run`,
      # keeping the CI Python primary even after the editable pip install.
      # TIER 0: real Mojo builds, not skips.
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          # Pin the pixi executable to an exact release (the default `latest`
          # downloads/executes a moving target). Residual: the pinned release is
          # still fetched from the official prefix-dev endpoint without a
          # per-artifact digest — accepted + tracked (ci_supply_chain_residuals).
          pixi-version: v0.83.0
          manifest-path: src/sc_neurocore/accel/mojo/pixi.toml

      - name: Expose mojo without shadowing the CI Python
        run: |
          mkdir -p "$RUNNER_TEMP/sc-neurocore-mojo-bin"
          cat > "$RUNNER_TEMP/sc-neurocore-mojo-bin/mojo" <<SH
          #!/usr/bin/env bash
          exec pixi run --manifest-path "$GITHUB_WORKSPACE/src/sc_neurocore/accel/mojo/pixi.toml" mojo "\$@"
          SH
          chmod +x "$RUNNER_TEMP/sc-neurocore-mojo-bin/mojo"
          echo "$RUNNER_TEMP/sc-neurocore-mojo-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/sc-neurocore-mojo-bin/mojo" --version

      - name: Install HDL simulator
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # libhdf5-dev: the SHD readers link HDF5 (Go via `pkg-config hdf5`
          # under -tags=hdf5, Mojo by loading libhdf5_serial.so).
          sudo apt-get install -y -qq cvc5 git iverilog make verilator yosys z3 libhdf5-dev pkg-config
          python -m pip install --require-hashes -r requirements/sby.txt
          # Build SBY from a PINNED SOURCE COMMIT, not an unverified release
          # archive. The GitHub-generated tarball carried no upstream
          # checksum/signature and no tag points at the exact commit, so a
          # curl|tar|make of it was an unverified fetch-execute. Instead git
          # fetches exactly this commit object and we assert HEAD == the pin:
          # the installed source is content-addressed by the git object model and
          # the step fails closed (set -e + explicit test) on any mismatch.
          SBY_COMMIT=0cb15210a857e4d20030484b37a6b9b6386bd01d
          git init -q /tmp/sby
          git -C /tmp/sby remote add origin https://github.com/YosysHQ/sby
          for _ in 1 2 3; do
            git -C /tmp/sby fetch -q --depth 1 origin "$SBY_COMMIT" && break
            sleep 2
          done
          git -C /tmp/sby checkout -q --detach "$SBY_COMMIT"
          test "$(git -C /tmp/sby rev-parse HEAD)" = "$SBY_COMMIT"
          sudo make -C /tmp/sby install PREFIX=/usr/local
          sby --version

      - name: Verify HDL simulator versions
        run: python tools/check_icarus_verilog.py --minimum-major 12

      - name: Verify SHD AXI input commits against Python golden vectors
        if: matrix.primary
        run: |
          bash hdl/test_shd_axi.sh "$RUNNER_TEMP/shd-axi"
          export TMPDIR="$RUNNER_TEMP/shd-axi"
          python tools/cosim_axonal_delay_verilog.py
          python tools/cosim_vmin_lif_verilog.py
          python tools/cosim_dense_int8_verilog.py

      # The documentation-debt contracts measure TypeScript with the frontend's
      # own locked ESLint; they refuse to run without that installation.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json

      - name: Install verified npm
        uses: ./.github/actions/setup-npm

      - name: Install the frontend's locked lint tools
        working-directory: studio/frontend
        run: npm ci

      - name: Build Studio UI for desktop backend admission
        working-directory: studio/frontend
        run: npm run build

      - name: Retrieve this run's ABI-matching engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: test-engine-wheel-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/engine-wheel

      - name: Retrieve this run's shared timing baseline
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pytest-timing-baseline
          path: ${{ runner.temp }}/pytest-timings

      - name: Install package
        env:
          SC_NEUROCORE_CI_ENGINE_WHEEL_DIR: ${{ runner.temp }}/engine-wheel
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements/ci-torch-cpu.txt
          python tools/ci_install_dev.py
          python -c "import torch; assert torch.__version__ == '2.14.1+cpu'; assert torch.version.cuda is None"

      # All coverage shards install it, so each batch runs in the same
      # environment as it did in the former single instrumented leg.
      - name: Install native Studio desktop dependencies
        if: matrix.coverage
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth openbox wmctrl xdotool curl xdg-utils \
            libegl1 libgl1 libnss3 libasound2t64 libxcb-cursor0 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libdbus-1-3 fonts-dejavu-core
          python -m pip install --require-hashes --only-binary :all: \
            -r requirements/studio-desktop-linux-x86_64.txt

      - name: Build autonomous_learning cdylib
        shell: bash
        run: |
          cargo build --release --manifest-path crates/autonomous_learning/Cargo.toml
          cp crates/autonomous_learning/target/release/libautonomous_learning.so \
             src/sc_neurocore/_native/libautonomous_learning.so

      - name: Build core-engine C FFI
        shell: bash
        run: |
          cargo build --release --manifest-path crates/core_engine/Cargo.toml
          cp crates/core_engine/target/release/libcore_engine.so \
             src/sc_neurocore/_native/libcore_engine.so

      # Compile each neuron's Go c-shared and Mojo shared library into the path
      # its ctypes loader opens (beside the source). These lib*.so are gitignored
      # build artefacts, so without this step every compiled-backend and
      # benchmark test fails with "lib<name>.so is not built". Invoke the
      # pinned pixi wrapper by path: the dev install also provides a Python
      # `mojo` executable, so PATH lookup can select a different toolchain.
      # TIER 0: real backend builds, not skips.
      # --require lists the strict backends whose absence is a hard RuntimeError
      # (not a graceful skip), so a missing toolchain fails CI loudly.
      - name: Build accelerator backends (Go + Mojo)
        shell: bash
        run: |
          MOJO_BIN="$RUNNER_TEMP/sc-neurocore-mojo-bin/mojo"
          test -x "$MOJO_BIN"
          "$MOJO_BIN" --version
          REQUIRED=theta,dpi_neuron,quadratic_if,perfect_integrator,lapicque,expif,adex,sigmoid_rate,mcculloch_pitts,iqif,coba_lif,poisson,escape_rate,lgssm,ermentrout_kopell_pop,ermentrout_kopell_map,izhikevich2007,resonate_and_fire,adaptive_threshold_if,alpha,aihara_map,sc_chaotic_map,nagumo_sato_map,sc_adaptive_threshold_map,mat,sc_resetting_mat,benda_herz,sc_stochastic_rate_adaptation,rulkov_map,sc_upward_crossing_rulkov_map
          python tools/build_accel_backends.py --language go --require "$REQUIRED"
          python tools/build_accel_backends.py --language mojo --require "$REQUIRED" --mojo-command "$MOJO_BIN"

          # Self-contained backends live in accel/<lang>/<model>/ and locate their
          # library with a Path(__file__).resolve().parent / "lib<model>.so" loader.
          # build_accel_backends.py recognises _ACCEL_ROOT-anchored loaders and direct
          # ctypes.CDLL(Path(__file__).with_name(...)) calls, but not this path-variable
          # idiom. Retain the audited explicit set because several members require it;
          # wilson_cowan, wong_wang and jansen_rit have compiled-backend parity/bench
          # tests that must execute against both toolchains. partition
          # is built too: without libpartition.so the chiplet Go/Mojo KL-refine load
          # paths never execute and the 3.12 "Chiplet hierarchical partitioner exact
          # coverage" step (--fail-under=100 on chiplet/hierarchical*.py) drops to 94%.
          # Extending discovery to the whole self-contained convention (also dcls_tent,
          # mixed_dense and adc_to_spike) is tracked separately: it needs per-backend
          # test verification before those additional builds are turned on. rk4_neurons
          # is mandatory because its Go/Mojo parity modules otherwise skip at collection.
          for model in wilson_cowan wong_wang jansen_rit amari_field brunel_wang compte_wm non_resetting_lif sc_non_resetting_adaptive_lif sigma_delta sc_sigma_delta_accumulator partition rk4_neurons; do
            ( cd "src/sc_neurocore/accel/go/${model}" \
                && go build -buildmode=c-shared -o "lib${model}.so" . )
            # --target-cpu x86-64-v3 keeps this explicit build within the same portable ISA
            # baseline as tools/build_accel_backends.py, so it cannot emit AVX-512 that SIGILLs
            # on a runner without AVX-512F. The drift gate below enforces this on every library.
            ( cd "src/sc_neurocore/accel/mojo/${model}" \
                && "$MOJO_BIN" build --emit shared-lib --target-cpu x86-64-v3 -o "lib${model}.so" "${model}.mojo" )
          done
          for model in energy_lif sc_normalized_energy_lif mckean; do
            ( cd "src/sc_neurocore/accel/go/${model}" \
                && go build -buildmode=c-shared -o "lib${model}.so" "${model}.go" )
            "$MOJO_BIN" build -I "$GITHUB_WORKSPACE/src/sc_neurocore/accel/mojo/kernels" \
              --emit shared-lib --target-cpu x86-64-v3 \
              -o "src/sc_neurocore/accel/mojo/${model}/lib${model}.so" \
              "src/sc_neurocore/accel/mojo/${model}/${model}_abi.mojo"
          done
          ( cd src/sc_neurocore/accel/go/neurons/mckean \
              && go build -buildmode=c-shared \
                -o libsc_triangular_mckean.so mckean.go )
          "$MOJO_BIN" build --emit shared-lib --target-cpu x86-64-v3 \
            -o src/sc_neurocore/accel/mojo/neurons/libsc_triangular_mckean.so \
            src/sc_neurocore/accel/mojo/neurons/sc_triangular_mckean.mojo
          ( cd src/sc_neurocore/accel/go/neurons/wilson_hr \
              && go build -buildmode=c-shared -o libwilsonhr.so wilson_hr.go )
          "$MOJO_BIN" build --emit shared-lib --target-cpu x86-64-v3 \
            -o src/sc_neurocore/accel/mojo/neurons/libwilsonhr.so \
            src/sc_neurocore/accel/mojo/neurons/wilson_hr.mojo
          ( cd src/sc_neurocore/accel/go/neurons/cazelles_map \
              && go build -buildmode=c-shared -o libcazelles.so cazelles_map.go )
          "$MOJO_BIN" build --emit shared-lib --target-cpu x86-64-v3 \
            -o src/sc_neurocore/accel/mojo/neurons/libcazelles.so \
            src/sc_neurocore/accel/mojo/neurons/cazelles_map.mojo
          ( cd src/sc_neurocore/accel/go/neurons/sc_resetting_wilson_hr \
              && go build -buildmode=c-shared \
                -o libsc_resetting_wilson_hr.so sc_resetting_wilson_hr.go )
          "$MOJO_BIN" build --emit shared-lib --target-cpu x86-64-v3 \
            -o src/sc_neurocore/accel/mojo/neurons/libsc_resetting_wilson_hr.so \
            src/sc_neurocore/accel/mojo/neurons/sc_resetting_wilson_hr.mojo
          ( cd src/sc_neurocore/accel/mojo/sc_compte_wm_network \
              && "$MOJO_BIN" build --emit shared-lib --target-cpu x86-64-v3 \
                -o libsc_compte_wm_network.so sc_compte_wm_network.mojo )

          # Analysis and network parity suites are part of the aggregate coverage
          # authority. Build their real C-ABI lanes so those suites exercise native
          # dispatch instead of silently collecting as optional skips.
          for model in gamma_oscillation phi dimensionality gpfa sorting_quality topology; do
            ( cd "src/sc_neurocore/accel/go/${model}" \
                && go build -buildmode=c-shared -o "lib${model}.so" "${model}.go" )
          done
          for kernel in gamma_oscillation dimensionality gpfa sorting_quality; do
            "$MOJO_BIN" build --emit shared-lib --target-cpu x86-64-v3 \
              -o "src/sc_neurocore/accel/mojo/kernels/lib${kernel}.so" \
              "src/sc_neurocore/accel/mojo/kernels/${kernel}.mojo"
          done
          "$MOJO_BIN" build --emit shared-lib --target-cpu x86-64-v3 \
            -o src/sc_neurocore/accel/mojo/kernels/libphi.so \
            src/sc_neurocore/accel/mojo/kernels/phi_estimation.mojo
          "$MOJO_BIN" build --emit shared-lib --target-cpu x86-64-v3 \
            -o src/sc_neurocore/accel/mojo/math/libtopology.so \
            src/sc_neurocore/accel/mojo/math/topology.mojo

      - name: Enforce Mojo ISA baseline (no AVX-512 drift)
        shell: bash
        run: python tools/check_mojo_isa_baseline.py

      # Bootstrap juliacall's Julia ONCE before the batched pytest
      # run. On first import juliacall's juliapkg installs + precompiles Julia
      # into the shared ~/.julia depot. Warming it here keeps every fresh batch
      # on the ready depot rather than repeating the install and precompile.
      - name: Verify and warm up juliacall (Julia depot)
        shell: bash
        run: |
          set -euo pipefail
          test "$(julia --startup-file=no -e 'print(VERSION)')" = "1.11.9"
          python tools/studio_event_runtime_environment.py --github-env "$GITHUB_ENV"
          JULIA_DEPOT_PATH="$GITHUB_WORKSPACE/.venv/julia_depot" \
            julia --startup-file=no \
              --project=src/sc_neurocore/accel/julia/sc_compte_wm_network \
              -e 'using Pkg; Pkg.instantiate()'

      # The native-safety crate tests build with `cargo build --offline
      # --locked`; fetch their locked dependencies once so offline means
      # "no network during the test", not "nothing to build with".
      - name: Fetch the native safety crates' locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          for manifest in src/sc_neurocore/accel/rust/safety/*_native/Cargo.toml; do
            cargo fetch --locked --manifest-path "$manifest"
          done

      - name: Engine ABI proof tool exact branch coverage
        if: matrix.primary
        shell: bash
        env:
          COVERAGE_RCFILE: ${{ runner.temp }}/engine-abi-coverage.ini
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          configuration = Path(os.environ["COVERAGE_RCFILE"])
          configuration.write_text(
              "[run]\nbranch = True\nparallel = True\npatch = subprocess\n"
              f"data_file = {configuration.parent / '.coverage-engine-abi'}\n"
              "include =\n    */tools/engine_abi_inventory.py\n"
              "    */tools/engine_abi_contracts.py\n"
              "[report]\nfail_under = 100\nshow_missing = True\nexclude_lines =\n"
          )
          PY
          python -m coverage run -m pytest --no-cov -q \
            tests/test_tools/test_engine_abi_inventory.py \
            tests/test_tools/test_engine_abi_contracts.py \
            tests/test_tools/test_engine_abi_inventory_capture_admission.py
          python -m coverage combine --keep "${{ runner.temp }}"
          python -m coverage report --show-missing

      - name: Native Studio application and exact coverage
        if: matrix.primary
        shell: bash
        env:
          COVERAGE_FILE: ${{ runner.temp }}/studio-native/.coverage
          COVERAGE_RCFILE: ${{ github.workspace }}/studio/desktop/coverage.ini
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          QT_QPA_PLATFORM: xcb
          MYPYPATH: src:bridge:.
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          files=(
            src/sc_neurocore/studio/desktop/{__main__,window,webview}.py
            studio/desktop/tests/{conftest,native_dialog_controller,test_entry}.py
            studio/desktop/tests/test_{window,webview,downloads,window_downloads,window_cleanup,window_configuration}.py
          )
          ruff check "${files[@]}"
          ruff check --isolated --config 'lint.pydocstyle.convention = "numpy"' --select D,E902 --ignore-noqa --no-cache "${files[@]}"
          ruff format --check "${files[@]}"
          mypy --strict --explicit-package-bases "${files[@]}"
          namespace="$RUNNER_TEMP/studio-native"
          mkdir -p "$namespace"/{home,tmp,config,data,state,cache,runtime}
          chmod 700 "$namespace/runtime"
          export HOME="$namespace/home" TMPDIR="$namespace/tmp"
          export XDG_CONFIG_HOME="$namespace/config" XDG_DATA_HOME="$namespace/data"
          export XDG_STATE_HOME="$namespace/state" XDG_CACHE_HOME="$namespace/cache"
          export XDG_RUNTIME_DIR="$namespace/runtime"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$namespace/runtime/private-bus"
          # Start Qt once outside pytest, whose capture loses the message of a Qt abort,
          # so a missing platform library or plugin is named in the log before the suite runs.
          xcb_plugin="$(python -c 'import pathlib, PySide6; print(pathlib.Path(PySide6.__file__).parent / "Qt/plugins/platforms/libqxcb.so")')"
          ldd "$xcb_plugin" | grep 'not found' || true
          QT_DEBUG_PLUGINS=1 xvfb-run -a --server-args='-screen 0 1600x1100x24' python -c \
            'import sc_neurocore.studio.desktop.runtime; from PySide6.QtWidgets import QApplication; print("Qt platform:", QApplication([]).platformName())'
          xvfb-run -a --server-args='-screen 0 1600x1100x24' \
            python -m coverage run -m pytest -q \
            studio/desktop/tests/test_window.py studio/desktop/tests/test_webview.py \
            studio/desktop/tests/test_downloads.py studio/desktop/tests/test_window_downloads.py \
            studio/desktop/tests/test_window_cleanup.py studio/desktop/tests/test_window_configuration.py \
            studio/desktop/tests/test_entry.py --basetemp="$namespace/pytest"
          python -m coverage combine --keep "$namespace"
          python -m coverage report --show-missing

      - name: Preserve native Studio diagnostics
        if: always() && matrix.primary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: studio-native-diagnostics
          path: |
            ${{ runner.temp }}/studio-native/.coverage*
            ${{ runner.temp }}/studio-native/pytest/**/*.log
            ${{ runner.temp }}/studio-native/pytest/**/*.json
          include-hidden-files: true
          retention-days: 7

      - name: Native equation compiler frontend coverage
        if: matrix.primary
        working-directory: studio/frontend
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          namespace="$RUNNER_TEMP/studio-equation-coverage"
          mkdir -p "$namespace"/{tmp,config,data,state,cache}
          export TMPDIR="$namespace/tmp"
          export XDG_CONFIG_HOME="$namespace/config" XDG_DATA_HOME="$namespace/data"
          export XDG_STATE_HOME="$namespace/state" XDG_CACHE_HOME="$namespace/cache"
          export SC_NEUROCORE_STUDIO_COMPILER_COVERAGE_DIR="$namespace/reports"
          npm run test:compiler-coverage

      - name: Native equation compiler browser workflow
        if: matrix.primary
        working-directory: studio/frontend
        shell: bash
        env:
          SC_NEUROCORE_STUDIO_LIVE_API_PORT: "24020"
          SC_NEUROCORE_STUDIO_LIVE_UI_PORT: "24021"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          namespace="$RUNNER_TEMP/studio-equation-browser"
          mkdir -p "$namespace"/{tmp,config,data,state,cache}
          export TMPDIR="$namespace/tmp"
          export XDG_CONFIG_HOME="$namespace/config" XDG_DATA_HOME="$namespace/data"
          export XDG_STATE_HOME="$namespace/state" XDG_CACHE_HOME="$namespace/cache"
          export SC_NEUROCORE_STUDIO_LIVE_JOB_ROOT="$namespace/jobs"
          export SC_NEUROCORE_STUDIO_LIVE_AUDIT_LOG_PATH="$namespace/audit.jsonl"
          export SC_NEUROCORE_STUDIO_PROJECT_ROOT="$namespace/projects"
          npx playwright install --with-deps chromium
          npx playwright test --config playwright.live.config.ts equation-ir-live.spec.ts \
            hardware-catalogue-live.spec.ts \
            --output="$namespace/playwright"

      - name: Preserve equation compiler browser diagnostics
        if: always() && matrix.primary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: studio-equation-browser-diagnostics
          path: |
            ${{ runner.temp }}/studio-equation-browser
            ${{ runner.temp }}/studio-equation-coverage
          include-hidden-files: true
          retention-days: 7

      - name: Install pinned Conda audit scanners
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          bash tools/install_conda_audit_scanners.sh "$RUNNER_TEMP/conda-audit-bin"
          echo "$RUNNER_TEMP/conda-audit-bin" >> "$GITHUB_PATH"

      - name: Test + coverage
        env:
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/grype-audit-db
        shell: bash
        run: |
          if [[ "${{ matrix.coverage }}" == "true" ]]; then
            # One shard of the instrumented suite; `coverage-union` gates the union.
            bash tools/run_full_cov.sh --batch-size=384 --shard="${{ matrix.shard-index }}/$SCN_CI_SHARD_COUNT" \
              --timings="$RUNNER_TEMP/pytest-timings/pytest-durations.json"
          else
            # Full behavioral compatibility matrix, without repeating
            # coverage instrumentation on every Python interpreter.
            bash tools/run_full_cov.sh --batch-size=384 --no-cov --shard="${{ matrix.shard-index }}/$SCN_CI_SHARD_COUNT" \
              --timings="$RUNNER_TEMP/pytest-timings/pytest-durations.json"
          fi

      - name: NIR graph exact coverage
        if: matrix.primary
        shell: bash
        run: |
          COVERAGE_FILE=.coverage-nir-graph python -m coverage run \
            --rcfile=/dev/null --branch \
            --include='src/sc_neurocore/nir_bridge/neuron_graph*.py' \
            -m pytest tests/test_nir_bridge -q
          COVERAGE_FILE=.coverage-nir-graph python -m coverage report \
            --rcfile=/dev/null \
            --include='src/sc_neurocore/nir_bridge/neuron_graph*.py' \
            --fail-under=100 --show-missing

      - name: Bioware exact coverage
        if: matrix.primary
        shell: bash
        run: |
          COVERAGE_FILE=.coverage-bioware python -m coverage run \
            --rcfile=/dev/null --branch \
            --include='src/sc_neurocore/bioware/*.py' \
            -m pytest tests/test_bioware -q
          COVERAGE_FILE=.coverage-bioware python -m coverage report \
            --rcfile=/dev/null \
            --include='src/sc_neurocore/bioware/*.py' \
            --fail-under=100 --show-missing

      - name: Autonomous-learning bridge exact coverage
        if: matrix.coverage && matrix.shard-index == 3
        shell: bash
        run: |
          COVERAGE_FILE=.coverage-learning python -m coverage run \
            --rcfile=/dev/null --branch \
            --include='src/sc_neurocore/_native/learning*.py' \
            -m pytest tests/test_native/test_learning_bridge_*.py -q
          COVERAGE_FILE=.coverage-learning python -m coverage report \
            --rcfile=/dev/null \
            --include='src/sc_neurocore/_native/learning*.py' \
            --fail-under=100 --show-missing

      - name: Hierarchical partitioner exact coverage
        if: matrix.coverage && matrix.shard-index == 3
        shell: bash
        run: |
          COVERAGE_FILE=.coverage-hierarchical-partitioner python -m coverage run \
            --rcfile=/dev/null --branch \
            --include='src/sc_neurocore/chiplet/hierarchical*.py' \
            -m pytest tests/test_chiplet/test_hierarchical_partitioner_*.py -q
          COVERAGE_FILE=.coverage-hierarchical-partitioner python -m coverage report \
            --rcfile=/dev/null \
            --include='src/sc_neurocore/chiplet/hierarchical*.py' \
            --fail-under=100 --show-missing

      - name: Studio distribution build coverage
        # Build copies in source and unpacked sdist map to the same owned hook.
        if: matrix.coverage && matrix.shard-index == 2
        shell: bash
        run: |
          STUDIO_BUILD_COVERAGE_FILE="$PWD/.coverage-studio-build" python -m pytest tests/test_studio_distribution.py -q
          COVERAGE_FILE=.coverage-studio-build python -m coverage combine --rcfile=tests/studio_distribution.coveragerc
          COVERAGE_FILE=.coverage-studio-build python -m coverage report --rcfile=tests/studio_distribution.coveragerc

      - name: Studio replay exact statement coverage
        # Studio is excluded from aggregate coverage; replay has its own statement gate.
        if: matrix.coverage && matrix.shard-index == 2
        shell: bash
        run: |
          COVERAGE_FILE=.coverage-studio-replay python -m coverage run \
            --rcfile=/dev/null \
            --include='src/sc_neurocore/studio/replay_pack.py' \
            -m pytest tests/test_studio_replay_pack.py -q
          COVERAGE_FILE=.coverage-studio-replay python -m coverage report \
            --rcfile=/dev/null \
            --include='src/sc_neurocore/studio/replay_pack.py' \
            --fail-under=100 --show-missing

      - name: Hardware catalogue exact coverage
        if: matrix.coverage && matrix.shard-index == 2
        env:
          COVERAGE_FILE: .coverage-studio-hardware-catalogue
        run: |
          python -m pytest tests/test_studio_hardware_catalogue.py \
            tests/test_studio_synthesis_target_profiles.py \
            tests/test_studio_hardware_catalogue_routes.py -q \
            --cov --cov-config=tests/studio_hardware_catalogue.coveragerc \
            --cov-report=term-missing --cov-fail-under=100

      - name: Studio policy exact coverage
        if: matrix.coverage && matrix.shard-index == 2
        shell: bash
        run: |
          COVERAGE_FILE=.coverage-studio-policy python -m coverage run \
            --rcfile=/dev/null --branch \
            --include='src/sc_neurocore/studio/platform/policy*.py' \
            -m pytest tests/test_studio_policy_*.py -q
          COVERAGE_FILE=.coverage-studio-policy python -m coverage report \
            --rcfile=/dev/null \
            --include='src/sc_neurocore/studio/platform/policy*.py' \
            --fail-under=100 --show-missing

      - name: Studio jobs exact coverage
        if: matrix.coverage && matrix.shard-index == 2
        shell: bash
        run: |
          COVERAGE_FILE=.coverage-studio-jobs python -m pytest \
            tests/test_studio_jobs*.py \
            tests/test_studio_training_config_storage.py \
            tests/test_studio_event_manifest_corruption.py \
            tests/test_studio_storage_worker_grant_process.py \
            tests/test_studio_worker_limits.py -q \
            --cov --cov-config=tests/studio_jobs.coveragerc \
            --cov-branch --cov-report=term-missing

      - name: Studio evidence input limits exact coverage
        if: matrix.coverage && matrix.shard-index == 2
        shell: bash
        run: |
