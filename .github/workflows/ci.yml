# SC-NeuroCore — CI

name: SC-NeuroCore CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    # No push.paths filter (run-always). A restrictive path filter previously
    # let benchmark-, asset- or config-only commits skip the test gate entirely:
    # a false-green masking hole where a bench-evidence-only fix could not
    # satisfy its own completed-green by push alone and needed a manual
    # workflow_dispatch to exercise the matrix. Running the full CI on every
    # push to a non-dependabot branch is the honest default. Dependabot branches
    # are excluded here; their PRs still run CI via pull_request below.
    branches-ignore:
      - "dependabot/**"
  # Pull requests run CI unconditionally so the branch-protection required
  # status checks (`lint`, `test (3.10-3.14)`, `spdx-guard`, `pre-commit`)
  # always report a concrete SUCCESS / FAILURE and never sit "pending".
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
          cache: pip

      - name: Install tools
        run: |
          pip install --require-hashes \
            -r requirements/lint.txt \
            -r requirements/runtime.txt \
            -r requirements/hub.txt \
            -r requirements/hdl.txt

      - name: Capability manifest drift
        run: python tools/capability_manifest.py --check

      - name: Engine monolith no-growth guard
        run: python tools/engine_monolith_guard.py --check

      - name: API reference drift
        run: python scripts/generate_docs.py --check

      - name: GitHub App token format compatibility
        run: python tools/check_github_app_token_compat.py

      - name: ruff check
        run: ruff check src/ tests/ benchmarks/ tools/capability_manifest.py

      - name: ruff format
        run: ruff format --check src/ tests/ benchmarks/ tools/capability_manifest.py

      - name: bandit
        run: bandit -r src/sc_neurocore/ -c pyproject.toml -q

      - name: mypy
        run: mypy --strict src/sc_neurocore/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: studio/frontend
        run: npm ci

      - name: Vitest
        working-directory: studio/frontend
        run: npm test -- --run

      - name: TypeScript and Vite build
        working-directory: studio/frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: studio/frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright browser tests
        working-directory: studio/frontend
        run: npm run test:e2e

  test:
    name: test (${{ matrix.python-minor }})
    runs-on: ubuntu-latest
    # Fail-fast backstop for a hung leg. The 3.12 leg alone runs the full suite
    # under --cov (the coverage tracer roughly doubles wall-clock: ~82 min vs
    # ~50-66 min for the uninstrumented legs), so the cap is generous. Its job is
    # to kill a genuine deadlock at the cap instead of letting it burn the shared
    # runner for the 6h GitHub default — a hung job is worse than a clean red.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # Exact interpreter patch pins shrink the setup-python mutable-manifest
        # surface (actions/python-versions is fetched at runtime with no
        # per-artifact digest — accepted + tracked residual, see
        # docs/internal/ci_supply_chain_residuals.md). `python-minor` keeps the
        # branch-protection-required job names `test (3.10)`..`test (3.14)`
        # stable across patch bumps (via the job `name:` above); `primary` flags
        # the single leg that runs coverage + the exact-coverage gates.
        include:
          - python-minor: "3.10"
            python-version: "3.10.20"
          - python-minor: "3.11"
            python-version: "3.11.15"
          - python-minor: "3.12"
            python-version: "3.12.13"
            primary: true
          - python-minor: "3.13"
            python-version: "3.13.14"
          - python-minor: "3.14"
            python-version: "3.14.6"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # 1.97.1
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: engine
          # Repo- and lockfile-bound cache key so a poisoned cross-repo cache
          # cannot be restored into this workspace (Swatinem/rust-cache already
          # scopes by lockfile; github.repository makes the binding explicit).
          key: ${{ github.repository }}-${{ hashFiles('**/Cargo.lock') }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # juliacall 0.9.x currently constrains Julia to 1.10.3-1.11. GitHub's
      # hosted image also exposes Julia 1.12, which juliapkg rejects before
      # attempting an uncontrolled fallback download. Install the exact
      # compatible runtime once and put it first on PATH for every matrix leg.
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.11.9"
          show-versioninfo: "never"

      # Go toolchain for the c-shared accel backends. Must match accel/go/go.mod's
      # `go 1.26.3` (and release.yml / security-scanners.yml) — an older pin left
      # `go build` rejecting the module under GOTOOLCHAIN=local. The builder also
      # sets GOTOOLCHAIN=auto as a belt-and-suspenders fallback. TIER 0: real builds.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.3"
          cache-dependency-path: |
            src/sc_neurocore/accel/go/go.mod
            src/sc_neurocore/accel/go/services/hil_debugger/go.sum

      # Mojo toolchain via pixi (accel/mojo/pixi.toml, public MAX conda channel)
      # so test_*_backends.py `mojo build --emit shared-lib` builds succeed.
      # NOT activate-environment: that prepends the pixi env's Python to PATH and
      # shadows the CI setup-python, breaking every later `python`/`pip` step.
      # Instead expose only `mojo` via a wrapper that delegates to `pixi run`,
      # keeping the CI Python primary. TIER 0: real Mojo builds, not skips.
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          # Pin the pixi executable to an exact release (the default `latest`
          # downloads/executes a moving target). Residual: the pinned release is
          # still fetched from the official prefix-dev endpoint without a
          # per-artifact digest — accepted + tracked (ci_supply_chain_residuals).
          pixi-version: v0.73.0
          manifest-path: src/sc_neurocore/accel/mojo/pixi.toml

      - name: Expose mojo without shadowing the CI Python
        run: |
          sudo tee /usr/local/bin/mojo >/dev/null <<SH
          #!/usr/bin/env bash
          exec pixi run --manifest-path "$GITHUB_WORKSPACE/src/sc_neurocore/accel/mojo/pixi.toml" mojo "\$@"
          SH
          sudo chmod +x /usr/local/bin/mojo
          mojo --version

      - name: Install HDL simulator
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cvc5 git iverilog make verilator yosys
          python -m pip install --require-hashes -r requirements/sby.txt
          # Build SBY from a PINNED SOURCE COMMIT, not an unverified release
          # archive. The GitHub-generated tarball carried no upstream
          # checksum/signature and no tag points at the exact commit, so a
          # curl|tar|make of it was an unverified fetch-execute. Instead git
          # fetches exactly this commit object and we assert HEAD == the pin:
          # the installed source is content-addressed by the git object model and
          # the step fails closed (set -e + explicit test) on any mismatch.
          SBY_COMMIT=0cb15210a857e4d20030484b37a6b9b6386bd01d
          git init -q /tmp/sby
          git -C /tmp/sby remote add origin https://github.com/YosysHQ/sby
          for _ in 1 2 3; do
            git -C /tmp/sby fetch -q --depth 1 origin "$SBY_COMMIT" && break
            sleep 2
          done
          git -C /tmp/sby checkout -q --detach "$SBY_COMMIT"
          test "$(git -C /tmp/sby rev-parse HEAD)" = "$SBY_COMMIT"
          sudo make -C /tmp/sby install PREFIX=/usr/local
          sby --version

      - name: Verify HDL simulator versions
        run: python tools/check_icarus_verilog.py --minimum-major 12

      - name: Install package
        run: python tools/ci_install_dev.py

      - name: Build autonomous_learning cdylib
        shell: bash
        run: |
          cargo build --release --manifest-path crates/autonomous_learning/Cargo.toml
          cp crates/autonomous_learning/target/release/libautonomous_learning.so \
             src/sc_neurocore/_native/libautonomous_learning.so

      # Compile each neuron's Go c-shared and Mojo shared library into the path
      # its ctypes loader opens (beside the source). These lib*.so are gitignored
      # build artefacts, so without this step every compiled-backend and
      # benchmark test fails with "lib<name>.so is not built". `mojo` resolves to
      # the pixi wrapper installed above. TIER 0: real backend builds, not skips.
      # --require lists the strict backends whose absence is a hard RuntimeError
      # (not a graceful skip), so a missing toolchain fails CI loudly.
      - name: Build accelerator backends (Go + Mojo)
        shell: bash
        run: |
          REQUIRED=theta,dpi_neuron,quadratic_if,perfect_integrator,lapicque,expif,adex,sigmoid_rate,mcculloch_pitts,iqif,coba_lif,poisson,escape_rate,lgssm,ermentrout_kopell_pop,resonate_and_fire,adaptive_threshold_if,alpha,aihara_map,sc_chaotic_map,nagumo_sato_map,sc_adaptive_threshold_map,mat,sc_resetting_mat
          python tools/build_accel_backends.py --language go --require "$REQUIRED"
          python tools/build_accel_backends.py --language mojo --require "$REQUIRED"

          # Self-contained backends live in accel/<lang>/<model>/ and locate their
          # library with a Path(__file__).resolve().parent / "lib<model>.so" loader.
          # build_accel_backends.py discovery recognises only the _ACCEL_ROOT-anchored
          # loader idiom, so it does not yet find these; wilson_cowan, wong_wang and
          # jansen_rit have failing compiled-backend parity/bench tests, so build them
          # explicitly (both toolchains, per the recipes in their loaders). partition
          # is built too: without libpartition.so the chiplet Go/Mojo KL-refine load
          # paths never execute and the 3.12 "Chiplet hierarchical partitioner exact
          # coverage" step (--fail-under=100 on chiplet/hierarchical*.py) drops to 94%.
          # Extending discovery to the whole self-contained convention (also dcls_tent,
          # mixed_dense and adc_to_spike) is tracked separately: it needs per-backend
          # test verification before those additional builds are turned on. rk4_neurons
          # is mandatory because its Go/Mojo parity modules otherwise skip at collection.
          for model in wilson_cowan wong_wang jansen_rit amari_field brunel_wang compte_wm non_resetting_lif sc_non_resetting_adaptive_lif sigma_delta sc_sigma_delta_accumulator partition rk4_neurons; do
            ( cd "src/sc_neurocore/accel/go/${model}" \
                && go build -buildmode=c-shared -o "lib${model}.so" "${model}.go" )
            # --target-cpu x86-64-v3 keeps this explicit build within the same portable ISA
            # baseline as tools/build_accel_backends.py, so it cannot emit AVX-512 that SIGILLs
            # on a runner without AVX-512F. The drift gate below enforces this on every library.
            ( cd "src/sc_neurocore/accel/mojo/${model}" \
                && mojo build --emit shared-lib --target-cpu x86-64-v3 -o "lib${model}.so" "${model}.mojo" )
          done
          for model in energy_lif sc_normalized_energy_lif mckean; do
            ( cd "src/sc_neurocore/accel/go/${model}" \
                && go build -buildmode=c-shared -o "lib${model}.so" "${model}.go" )
            mojo build -I "$GITHUB_WORKSPACE/src/sc_neurocore/accel/mojo/kernels" \
              --emit shared-lib --target-cpu x86-64-v3 \
              -o "src/sc_neurocore/accel/mojo/${model}/lib${model}.so" \
              "src/sc_neurocore/accel/mojo/${model}/${model}_abi.mojo"
          done
          ( cd src/sc_neurocore/accel/go/neurons/mckean \
              && go build -buildmode=c-shared \
                -o libsc_triangular_mckean.so mckean.go )
          mojo build --emit shared-lib --target-cpu x86-64-v3 \
            -o src/sc_neurocore/accel/mojo/neurons/libsc_triangular_mckean.so \
            src/sc_neurocore/accel/mojo/neurons/sc_triangular_mckean.mojo

      - name: Enforce Mojo ISA baseline (no AVX-512 drift)
        shell: bash
        run: python tools/check_mojo_isa_baseline.py

      # Bootstrap juliacall's Julia ONCE, serially, before the parallel pytest
      # run. On first import juliacall's juliapkg installs + precompiles Julia
      # into the shared ~/.julia depot; under `pytest -n auto` several xdist
      # workers hit that lazily at once, race on the depot and OOM ("node down").
      # Warming it here means the workers reuse the ready depot.
      - name: Verify and warm up juliacall (Julia depot)
        shell: bash
        run: |
          set -euo pipefail
          test "$(julia --startup-file=no -e 'print(VERSION)')" = "1.11.9"
          python -c "import juliacall; juliacall.Main.seval('1+1')"

      - name: Test + coverage
        shell: bash
        run: |
          if [[ "${{ matrix.primary }}" == "true" ]]; then
            pytest -n auto --dist loadfile tests/ -q \
              --cov=sc_neurocore \
              --cov-report=term-missing \
              --cov-report=html:htmlcov \
              --cov-report=xml:coverage.xml \
              --cov-fail-under=100 \
              --junitxml=test-results.xml
          else
            # Full behavioral compatibility matrix, without repeating
            # coverage instrumentation on every Python interpreter.
            pytest -n auto --dist loadfile tests/ -q --junitxml=test-results.xml
          fi

      - name: NIR graph exact coverage
        if: matrix.primary
        shell: bash
        run: |
          COVERAGE_FILE=.coverage-nir-graph python -m coverage run \
            --rcfile=/dev/null --branch \
            --include='src/sc_neurocore/nir_bridge/neuron_graph*.py' \
            -m pytest tests/test_nir_bridge -q
          COVERAGE_FILE=.coverage-nir-graph python -m coverage report \
            --rcfile=/dev/null \
            --include='src/sc_neurocore/nir_bridge/neuron_graph*.py' \
            --fail-under=100 --show-missing

      - name: Bioware exact coverage
        if: matrix.primary
        shell: bash
        run: |
          COVERAGE_FILE=.coverage-bioware python -m coverage run \
            --rcfile=/dev/null --branch \
            --include='src/sc_neurocore/bioware/*.py' \
            -m pytest tests/test_bioware -q
          COVERAGE_FILE=.coverage-bioware python -m coverage report \
            --rcfile=/dev/null \
            --include='src/sc_neurocore/bioware/*.py' \
            --fail-under=100 --show-missing

      - name: Autonomous-learning bridge exact coverage
        if: matrix.primary
        shell: bash
        run: |
          COVERAGE_FILE=.coverage-learning python -m coverage run \
            --rcfile=/dev/null --branch \
            --include='src/sc_neurocore/_native/learning*.py' \
            -m pytest tests/test_native/test_learning_bridge_*.py -q
          COVERAGE_FILE=.coverage-learning python -m coverage report \
            --rcfile=/dev/null \
            --include='src/sc_neurocore/_native/learning*.py' \
            --fail-under=100 --show-missing

      - name: Hierarchical partitioner exact coverage
        if: matrix.primary
        shell: bash
        run: |
          COVERAGE_FILE=.coverage-hierarchical-partitioner python -m coverage run \
            --rcfile=/dev/null --branch \
            --include='src/sc_neurocore/chiplet/hierarchical*.py' \
            -m pytest tests/test_chiplet/test_hierarchical_partitioner_*.py -q
          COVERAGE_FILE=.coverage-hierarchical-partitioner python -m coverage report \
            --rcfile=/dev/null \
            --include='src/sc_neurocore/chiplet/hierarchical*.py' \
            --fail-under=100 --show-missing

      - name: Studio policy exact coverage
        if: matrix.primary
        shell: bash
        run: |
          COVERAGE_FILE=.coverage-studio-policy python -m coverage run \
            --rcfile=/dev/null --branch \
            --include='src/sc_neurocore/studio/platform/policy*.py' \
            -m pytest tests/test_studio_policy_*.py -q
          COVERAGE_FILE=.coverage-studio-policy python -m coverage report \
            --rcfile=/dev/null \
            --include='src/sc_neurocore/studio/platform/policy*.py' \
            --fail-under=100 --show-missing

      - name: Studio jobs exact coverage
        if: matrix.primary
        shell: bash
        run: |
          COVERAGE_FILE=.coverage-studio-jobs python -m coverage run \
            --rcfile=/dev/null --branch \
            --include='src/sc_neurocore/studio/platform/jobs*.py' \
            -m pytest tests/test_studio_jobs*.py -q
          COVERAGE_FILE=.coverage-studio-jobs python -m coverage report \
            --rcfile=/dev/null \
            --include='src/sc_neurocore/studio/platform/jobs*.py' \
            --fail-under=100 --show-missing

      - name: Nagumo-Sato and SC adaptive-map exact coverage and backend parity
        if: matrix.primary
        shell: bash
        run: |
          COVERAGE_FILE=.coverage-nagumo-sc-map python -m coverage run \
            --rcfile=/dev/null --branch \
            --include='src/sc_neurocore/neurons/models/nagumo_sato_map_neuron.py,src/sc_neurocore/neurons/models/sc_adaptive_threshold_map_neuron.py' \
            -m pytest tests/test_model_nagumo_sato_map_neuron.py \
              tests/test_reference_nagumo_sato_map.py \
              tests/test_nagumo_sato_map_backends.py \
              tests/test_model_sc_adaptive_threshold_map_neuron.py \
              tests/test_sc_adaptive_threshold_map_backends.py \
              tests/test_model_kilinc_bhatt_map_neuron.py \
              tests/test_kilinc_bhatt_map_backends.py -q
          COVERAGE_FILE=.coverage-nagumo-sc-map python -m coverage report \
            --rcfile=/dev/null \
            --include='src/sc_neurocore/neurons/models/nagumo_sato_map_neuron.py,src/sc_neurocore/neurons/models/sc_adaptive_threshold_map_neuron.py' \
            --fail-under=100 --show-missing

      - name: Ih exact coverage and backend parity
        if: matrix.primary
        shell: bash
        run: |
          COVERAGE_FILE=.coverage-ih python -m coverage run \
            --rcfile=/dev/null --branch \
            --include='src/sc_neurocore/neurons/models/ih_neuron.py' \
            -m pytest tests/test_model_ih_neuron.py \
              tests/test_ih_neuron_backends.py -q
          COVERAGE_FILE=.coverage-ih python -m coverage report \
            --rcfile=/dev/null \
            --include='src/sc_neurocore/neurons/models/ih_neuron.py' \
            --fail-under=100 --show-missing

      - name: PersistentNa exact coverage and backend parity
        if: matrix.primary
        shell: bash
        run: |
          COVERAGE_FILE=.coverage-persistent-na python -m coverage run \
            --rcfile=/dev/null --branch \
            --include='src/sc_neurocore/neurons/models/persistent_na_neuron.py' \
            -m pytest tests/test_model_persistent_na_neuron.py \
              tests/test_persistent_na_neuron_backends.py -q
          COVERAGE_FILE=.coverage-persistent-na python -m coverage report \
            --rcfile=/dev/null \
            --include='src/sc_neurocore/neurons/models/persistent_na_neuron.py' \
            --fail-under=100 --show-missing

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-py${{ matrix.python-minor }}
          path: test-results.xml

      - name: Upload coverage report
        if: matrix.primary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.primary
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          flags: python
          name: sc-neurocore-python-${{ matrix.python-minor }}
          disable_search: true
          # Do not fail the primary leg if the Codecov token/app is missing;
          # local and CI coverage gates above remain authoritative.
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
          cache: pip

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # 1.97.1
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: crates/autonomous_learning
          # Repo- and lockfile-bound cache key (see the engine workspace note).
          key: ${{ github.repository }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install with training extras
        run: python tools/ci_install_dev.py

      - name: Build autonomous_learning cdylib
        run: |
          cargo build --release --manifest-path crates/autonomous_learning/Cargo.toml
          cp crates/autonomous_learning/target/release/libautonomous_learning.so \
             src/sc_neurocore/_native/libautonomous_learning.so

      - name: Run training tests
        run: pytest tests/test_torch_training_*.py -v

  test-optics-extra:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "src:."
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
          cache: pip

      - name: Editable install (local package, no deps)
        run: python tools/ci_install_editable_only.py

      - name: Install hash-pinned optics dependencies
        run: python -m pip install --require-hashes -r requirements/ci-optics.txt

      # Report-only ISA audit of the installed native wheels: surface any wheel that emits
      # AVX-512 without a runtime cpuid guard (a "runner lottery" SIGILL waiting to happen)
      # at pin time rather than in a red matrix. Never fails the job (no --strict).
      - name: Scan optics wheels for unguarded AVX-512 (report-only)
        run: |
          python tools/scan_wheel_isa.py \
            --root "$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"

      # PYTHONFAULTHANDLER dumps the C-level frame if a native wheel raises SIGILL
      # (exit 132) on a runner whose CPU traps an instruction its cpuid advertised, so the
      # faulting library is captured in the log instead of a silent hard crash. Permanent
      # job hygiene — it rides every future matrix, not just this investigation.
      - name: Run optics tests with gdsfactory
        env:
          PYTHONFAULTHANDLER: "1"
        run: python -m pytest tests/test_optics -q -rs

  test-optional-extras:
    name: Test optional extra (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: annealing
            requirements: requirements/ci-annealing.txt
            apt_packages: ""
            test_selector: tests/test_bridges/test_quantum_annealing_neal_parity.py
          - name: onnx-protobuf
            requirements: requirements/ci-dev.txt
            apt_packages: ""
            test_selector: tests/test_export/test_onnx_exporter_protobuf_graph.py
          - name: mpi
            requirements: requirements/ci-mpi.txt
            apt_packages: "libopenmpi-dev openmpi-bin"
            test_selector: tests/test_mpi_runner_real.py
    env:
      PYTHONPATH: "src:."
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
          cache: pip

      - name: Install system packages
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.apt_packages }}

      - name: Editable install (local package, no deps)
        run: python tools/ci_install_editable_only.py

      - name: Install hash-pinned optional-profile dependencies
        run: python -m pip install --require-hashes -r "${{ matrix.requirements }}"

      - name: Run optional selector
        run: python -m pytest ${{ matrix.test_selector }} -q -rs

  spdx-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check SPDX headers
        run: python tools/spdx_header_audit.py --check

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, spdx-guard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # 1.97.1
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: engine
          # Repo- and lockfile-bound cache key so a poisoned cross-repo cache
          # cannot be restored into this workspace (Swatinem/rust-cache already
          # scopes by lockfile; github.repository makes the binding explicit).
          key: ${{ github.repository }}-${{ hashFiles('**/Cargo.lock') }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - run: pip install --require-hashes -r requirements/build.txt -r requirements/maturin.txt

      - run: python -m build

      - name: Build engine wheel
        run: |
          cd bridge
          maturin build --release --out ../dist/

      - name: Smoke test
        run: |
          pip install dist/*.whl
          python -c "import sc_neurocore, sc_neurocore_engine; assert sc_neurocore.__version__ == sc_neurocore_engine.__version__; print(sc_neurocore.__version__)"
