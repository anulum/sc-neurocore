# SC-NeuroCore — v3 Engine

name: SC-NeuroCore v3 Engine

permissions: {}

on:
  workflow_dispatch:
  push:
    paths:
      - "engine/**"
      - "bridge/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/v3-engine.yml"
  pull_request:
    paths:
      - "engine/**"
      - "bridge/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/v3-engine.yml"

concurrency:
  group: v3-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: engine
          cache-bin: false

      - name: Rust format check
        run: cargo fmt --manifest-path engine/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path engine/Cargo.toml -- -D warnings

      - name: Engine builds without optional Z3 (feature-gate guard)
        run: cargo check --manifest-path engine/Cargo.toml --no-default-features

      - name: Install cargo-audit
        run: cargo install cargo-audit@0.22.1

      - name: Cargo audit
        run: |
          cargo generate-lockfile
          cargo audit

      - name: Install cargo-deny
        run: cargo install cargo-deny@0.19.0

      - name: Cargo deny
        run: cargo deny --manifest-path engine/Cargo.toml check licenses advisories

  test-engine:
    name: Test Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: engine
          cache-bin: false

      - name: Configure macOS static Z3 C++ parser
        if: runner.os == 'macOS'
        run: |
          echo "CXXFLAGS=-fdelayed-template-parsing" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=13.3" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: bash
        run: |
          python tools/ci_install_engine_deps.py

      - name: Build autonomous_learning cdylib
        shell: bash
        run: |
          cargo build --release --manifest-path crates/autonomous_learning/Cargo.toml
          case "${{ runner.os }}" in
            Linux)   src=crates/autonomous_learning/target/release/libautonomous_learning.so;    dst=src/sc_neurocore/_native/libautonomous_learning.so ;;
            macOS)   src=crates/autonomous_learning/target/release/libautonomous_learning.dylib; dst=src/sc_neurocore/_native/libautonomous_learning.dylib ;;
            Windows) src=crates/autonomous_learning/target/release/autonomous_learning.dll;      dst=src/sc_neurocore/_native/autonomous_learning.dll ;;
          esac
          cp "$src" "$dst"

      - name: Remove tracked Windows bridge binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item bridge/sc_neurocore_engine/sc_neurocore_engine.cp312-win_amd64.pyd -ErrorAction SilentlyContinue

      - name: Run engine unit tests on Linux
        if: runner.os == 'Linux'
        run: cargo test --manifest-path engine/Cargo.toml --jobs 1

      - name: Run engine unit tests on Windows
        if: runner.os == 'Windows'
        run: cargo test --manifest-path engine/Cargo.toml

      - name: Run v3 integration tests
        run: >
          pytest
          tests/test_jax_backend.py
          tests/test_jax_layer.py
          tests/test_quantum_bridge.py
          tests/test_mlir_emitter.py
          tests/test_holonomic_adapter_stack_contract_compiler_pipeline.py
          tests/test_holonomic_adapter_stack_contract_l1_l2_adapters.py
          tests/test_holonomic_adapter_stack_contract_l3_l7_adapters.py
          tests/test_holonomic_adapter_stack_contract_l8_l12_and_support.py
          tests/test_holonomic_adapter_stack_contract_l13_l16_adapters.py
          tests/test_holonomic_adapter_stack_contract_user_profile_and_meta.py
          tests/test_scpn_l1_basic.py
          tests/test_scpn_l1_quantum_contracts.py
          tests/test_scpn_l2_neurochemical_contracts.py
          tests/test_scpn_l3_genomic_contracts.py
          tests/test_scpn_l4_cellular_contracts.py
          tests/test_scpn_l5_organismal_contracts.py
          tests/test_scpn_l6_ecological_contracts.py
          tests/test_scpn_l7_symbolic_contracts.py
          tests/test_scpn_l8_phase_field.py
          tests/test_scpn_l9_holographic_contracts.py
          tests/test_scpn_l10_boundary.py
          tests/test_scpn_l11_morphic.py
          tests/test_scpn_l12_quantum_info.py
          -v
