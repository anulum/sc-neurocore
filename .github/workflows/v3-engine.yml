name: SC-NeuroCore v3 Engine

permissions: {}

on:
  workflow_dispatch:
  push:
    paths:
      - "engine/**"
      - "bridge/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/v3-engine.yml"
  pull_request:
    paths:
      - "engine/**"
      - "bridge/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/v3-engine.yml"

concurrency:
  group: v3-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: engine

      - name: Rust format check
        run: cargo fmt --manifest-path engine/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path engine/Cargo.toml -- -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit@0.22.1

      - name: Cargo audit
        run: |
          cargo generate-lockfile
          cargo audit

      - name: Install cargo-deny
        run: cargo install cargo-deny@0.19.0

      - name: Cargo deny
        run: cargo deny --manifest-path engine/Cargo.toml check licenses advisories

  test-engine:
    name: Test Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: engine

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements/maturin.txt
          pip install -e ".[dev-full]"

      - name: Build engine bridge
        shell: bash
        run: |
          cd bridge
          maturin build --release --out ../dist/
          pip install ../dist/*.whl

      - name: Run engine unit tests
        if: runner.os != 'macOS'
        run: cargo test --manifest-path engine/Cargo.toml

      - name: Run v3 integration tests
        run: pytest tests/test_jax_backend.py tests/test_jax_layer.py tests/test_quantum_bridge.py tests/test_mlir_emitter.py tests/test_holonomic_adapters_l1_l16.py -v
