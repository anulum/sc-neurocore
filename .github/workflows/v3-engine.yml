name: SC-NeuroCore v3 Engine

permissions: {}

on:
  push:
    paths:
      - "engine/**"
      - "bridge/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/v3-engine.yml"
  pull_request:
    paths:
      - "engine/**"
      - "bridge/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/v3-engine.yml"

jobs:
  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Rust format check
        run: cargo fmt --manifest-path engine/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path engine/Cargo.toml -- -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Cargo audit
        run: |
          cargo generate-lockfile
          cargo audit

  test-engine:
    name: Test Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest numpy jax jaxlib qiskit pennylane qiskit-aer

      - name: Build engine bridge
        shell: bash
        run: |
          cd bridge
          maturin build --release --out ../dist/
          pip install ../dist/*.whl

      - name: Run engine unit tests
        run: cargo test --manifest-path engine/Cargo.toml

      - name: Run v3 integration tests
        run: pytest tests/test_jax_backend.py tests/test_jax_layer.py tests/test_quantum_bridge.py tests/test_mlir_emitter.py tests/test_phase15_coverage.py -v
