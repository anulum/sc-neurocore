# SC-NeuroCore — Publish to PyPI & crates.io

name: Publish to PyPI & crates.io

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish built artifacts to registries"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-python-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements/build.txt
      - run: python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-dist
          path: dist/sc_neurocore-*

  publish-python-pypi:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true'
    needs: [build-python-dist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  build-engine-wheels:
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install maturin
        run: pip install --require-hashes -r requirements/maturin.txt
      - name: Configure macOS static Z3 C++ parser
        if: runner.os == 'macOS'
        run: |
          echo "CXXFLAGS=-fdelayed-template-parsing" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=13.3" >> "$GITHUB_ENV"
      - name: Remove tracked Windows bridge binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item bridge/sc_neurocore_engine/sc_neurocore_engine.cp312-win_amd64.pyd -ErrorAction SilentlyContinue
      - name: Build engine wheel
        run: |
          cd bridge
          maturin build --release --out ../dist-engine/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: engine-wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist-engine/*.whl

  build-engine-linux-arm:
    runs-on: ubuntu-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install maturin + cross-compile deps
        run: |
          pip install --require-hashes -r requirements/maturin.txt
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Build ARM64 engine wheel
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cd bridge
          maturin build --release --target aarch64-unknown-linux-gnu \
            --interpreter python${{ matrix.python-version }} --out ../dist-engine/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: engine-wheel-linux-arm64-py${{ matrix.python-version }}
          path: dist-engine/*.whl

  smoke-engine-wheels:
    needs: [build-engine-wheels, build-engine-linux-arm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: engine-wheel-ubuntu-latest-py3.12
          merge-multiple: true
          path: dist-engine/
      - name: Install and smoke test engine wheel
        run: |
          python - <<'PY'
          from pathlib import Path

          wheels = sorted(Path("dist-engine").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one engine wheel, found {len(wheels)}")
          PY
          python -m pip install dist-engine/*.whl
          python -c "import sc_neurocore_engine; print(sc_neurocore_engine.__version__); print(sc_neurocore_engine.simd_tier())"

  publish-engine-pypi:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true'
    needs: [smoke-engine-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: engine-wheel-*
          merge-multiple: true
          path: dist-engine/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist-engine/
          password: ${{ secrets.PYPI_ENGINE_TOKEN }}
          skip-existing: true

  publish-crate:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true'
    needs: [publish-python-pypi]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - name: Publish to crates.io
        run: |
          CRATE_NAME="$(sed -n 's/^name = "\(.*\)"/\1/p' engine/Cargo.toml | head -n 1)"
          CRATE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' engine/Cargo.toml | head -n 1)"
          if [ -z "$CRATE_NAME" ] || [ -z "$CRATE_VERSION" ]; then
            echo "failed to read crate name/version from engine/Cargo.toml" >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.publish }}" != "true" ]; then
            cargo publish --manifest-path engine/Cargo.toml --dry-run
            exit 0
          fi

          CRATE_STATUS_PATH="$(mktemp)"
          HTTP_STATUS="$(curl -sS -o "$CRATE_STATUS_PATH" -w "%{http_code}" "https://crates.io/api/v1/crates/${CRATE_NAME}/${CRATE_VERSION}")"
          case "$HTTP_STATUS" in
            "200")
              echo "${CRATE_NAME} ${CRATE_VERSION} already exists on crates.io; skipping publish."
              exit 0
              ;;
            "404")
              ;;
            *)
              cat "$CRATE_STATUS_PATH" >&2
              echo "failed to query crates.io for ${CRATE_NAME} ${CRATE_VERSION}: HTTP ${HTTP_STATUS}" >&2
              exit 1
              ;;
          esac

          cargo publish --manifest-path engine/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES }}
