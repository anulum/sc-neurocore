# SC-NeuroCore — Publish to PyPI & crates.io

name: Publish to PyPI & crates.io

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish built artifacts to registries"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-python-dist:
    needs: [build-engine-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json

      - name: Install verified npm
        uses: ./.github/actions/setup-npm
      - name: Build the Studio UI the wheel carries
        working-directory: studio/frontend
        run: |
          npm ci
          npm run build
      - run: pip install --require-hashes -r requirements/build.txt
      - run: python -m build
        env:
          SC_NEUROCORE_STUDIO_UI: required
      - name: Download the matching native wheel for Studio acceptance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: engine-wheel-ubuntu-latest-py3.12
          path: dist-engine/
      - name: Accept the installed Studio the wheel provides
        run: |
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/pip" install --require-hashes \
            -r requirements/runtime.txt -r requirements/hub.txt
          "$RUNNER_TEMP/installed/bin/pip" install --no-deps dist/sc_neurocore-*.whl
          "$RUNNER_TEMP/installed/bin/pip" install --no-deps dist-engine/*.whl
          "$RUNNER_TEMP/installed/bin/python" -I -c \
            'from sc_neurocore_engine.ir import ScGraphBuilder; graph = ScGraphBuilder("installed"); graph.output("value", graph.input("drive", "i16")); assert not graph.build().verify()'
          python tools/studio_installed_acceptance.py --python "$RUNNER_TEMP/installed/bin/python"
      - name: Replay through the installed Studio in a real browser
        id: installed_browser
        working-directory: studio/frontend
        env:
          SC_NEUROCORE_STUDIO_INSTALLED_PYTHON: ${{ runner.temp }}/installed/bin/python
          SC_NEUROCORE_STUDIO_INSTALLED_TEST_ROOT: ${{ runner.temp }}/installed-studio-browser
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --config playwright.installed.config.ts
      - name: Preserve installed browser replay evidence
        if: always() && steps.installed_browser.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installed-studio-browser
          path: ${{ runner.temp }}/installed-studio-browser/playwright
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-dist
          path: dist/sc_neurocore-*

  publish-python-pypi:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true'
    needs: [build-python-dist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  build-engine-wheels:
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install maturin
        run: pip install --require-hashes -r requirements/maturin.txt
      - name: Configure macOS static Z3 C++ parser
        if: runner.os == 'macOS'
        run: |
          echo "CXXFLAGS=-fdelayed-template-parsing" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=13.3" >> "$GITHUB_ENV"
      - name: Build engine wheel
        run: |
          cd bridge
          maturin build --release --locked --out ../dist-engine/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: engine-wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist-engine/*.whl

  build-engine-linux-arm:
    runs-on: ubuntu-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install maturin + cross-compile deps
        run: |
          pip install --require-hashes -r requirements/maturin.txt
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Build ARM64 engine wheel
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cd bridge
          maturin build --release --locked --target aarch64-unknown-linux-gnu \
            --interpreter python${{ matrix.python-version }} --out ../dist-engine/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: engine-wheel-linux-arm64-py${{ matrix.python-version }}
          path: dist-engine/*.whl

  smoke-engine-wheels:
    needs: [build-engine-wheels, build-engine-linux-arm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: engine-wheel-ubuntu-latest-py3.12
          merge-multiple: true
          path: dist-engine/
      - name: Install and smoke test engine wheel
        run: |
          python - <<'PY'
          from pathlib import Path

          wheels = sorted(Path("dist-engine").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one engine wheel, found {len(wheels)}")
          PY
          python -m pip install dist-engine/*.whl
          python -c "import sc_neurocore_engine; print(sc_neurocore_engine.__version__); print(sc_neurocore_engine.simd_tier())"

  publish-engine-pypi:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true'
    needs: [smoke-engine-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: engine-wheel-*
          merge-multiple: true
          path: dist-engine/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist-engine/
          password: ${{ secrets.PYPI_ENGINE_TOKEN }}
          skip-existing: true

  # A manual run without publishing still proves the crate: the full verify-build that
  # `cargo publish` performs, without uploading. The publish job itself is skipped then.
  dry-run-crate:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'true'
    runs-on: ubuntu-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Verify the crate as crates.io would build it
        run: cargo publish --manifest-path engine/Cargo.toml --dry-run --locked

  publish-crate:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true'
    needs: [publish-python-pypi]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Publish to crates.io
        run: |
          CRATE_NAME="$(sed -n 's/^name = "\(.*\)"/\1/p' engine/Cargo.toml | head -n 1)"
          CRATE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' engine/Cargo.toml | head -n 1)"
          if [ -z "$CRATE_NAME" ] || [ -z "$CRATE_VERSION" ]; then
            echo "failed to read crate name/version from engine/Cargo.toml" >&2
            exit 1
          fi

          CRATE_STATUS_PATH="$(mktemp)"
          HTTP_STATUS="$(curl -sS -o "$CRATE_STATUS_PATH" -w "%{http_code}" "https://crates.io/api/v1/crates/${CRATE_NAME}/${CRATE_VERSION}")"
          case "$HTTP_STATUS" in
            "200")
              echo "${CRATE_NAME} ${CRATE_VERSION} already exists on crates.io; skipping publish."
              exit 0
              ;;
            "404")
              ;;
            *)
              cat "$CRATE_STATUS_PATH" >&2
              echo "failed to query crates.io for ${CRATE_NAME} ${CRATE_VERSION}: HTTP ${HTTP_STATUS}" >&2
              exit 1
              ;;
          esac

          cargo publish --manifest-path engine/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES }}
