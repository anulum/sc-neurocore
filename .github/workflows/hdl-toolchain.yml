# SC-NeuroCore — Shared stable synthesis and formal toolchain

name: Stable HDL toolchain

on:
  workflow_call:
    inputs:
      rebuild_sdk:
        description: >-
          Build the SDK from its pinned sources instead of restoring the
          published archive. Only a deliberate SDK update sets this; that
          update publishes the new archive and records the formal receipts
          again with its solver binaries.
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The one SDK archive whose solver binaries the committed formal receipts
  # bind. A source build on another runner image produced a different Yices
  # binary, so every run restores these exact bytes; release
  # hdl-sdk-yosys070-yices270-524357fd also carries the corresponding sources.
  SCN_HDL_SDK_URL: https://github.com/anulum/sc-neurocore/releases/download/hdl-sdk-yosys070-yices270-524357fd/scn-hdl.tar.gz
  SCN_HDL_SDK_SHA256: 49a65847681b69ae5a42f2801562d464f7d9d52af6c87e7744c180a6a70668c3
  SCN_HDL_SDK_YICES_SHA256: 524357fd625311f9a43affded6ea4250c19783f07b2119d82d57ebb25c75d50e
  SCN_HDL_SDK_Z3_SHA256: c05be002097e2f2106efeeac03e58032e3f5cca10104f95d7a0ddc0bd3f907cb

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"
      - name: Install the locked SBY Python dependency
        run: python -m pip install --require-hashes -r requirements/sby.txt
      - name: Install the build and runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf bison binutils cmake flex g++-13 gcc-13 git \
            libc6-dev libedit-dev libffi-dev libfl-dev libgmock-dev libgtest-dev \
            libreadline-dev libreadline8t64 libtcl8.6 make pkg-config tcl-dev zlib1g-dev
      - name: Restore the published SDK archive
        if: ${{ !inputs.rebuild_sdk }}
        id: published
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scn-hdl-published
          key: scn-hdl-sdk-${{ env.SCN_HDL_SDK_SHA256 }}
      - name: Download the published SDK archive
        if: ${{ !inputs.rebuild_sdk && steps.published.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scn-hdl-published"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            "$SCN_HDL_SDK_URL" -o "$RUNNER_TEMP/scn-hdl-published/scn-hdl.tar.gz"
      - name: Unpack the published SDK archive after checking its pinned hash
        if: ${{ !inputs.rebuild_sdk }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/scn-hdl-published/scn-hdl.tar.gz"
          echo "$SCN_HDL_SDK_SHA256  $archive" | sha256sum --check
          # Only plain files and folders, all under scn-hdl/, and no '..' part.
          tar -tzf "$archive" | awk '$0 !~ /^scn-hdl(\/|$)/ || $0 ~ /(^|\/)\.\.(\/|$)/ { print; bad = 1 } END { exit bad }'
          tar -tvzf "$archive" | awk 'substr($1, 1, 1) !~ /^[-d]$/ { print; bad = 1 } END { exit bad }'
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$SCN_HDL_SDK_YICES_SHA256  $RUNNER_TEMP/scn-hdl/bin/yices-smt2" | sha256sum --check
          echo "$SCN_HDL_SDK_Z3_SHA256  $RUNNER_TEMP/scn-hdl/bin/z3" | sha256sum --check
      - name: Identify the actual compiler and build dependencies
        if: ${{ inputs.rebuild_sdk }}
        id: build-environment
        shell: bash
        run: |
          set -euo pipefail
          dpkg-query -W -f='${binary:Package}=${Version}\n' \
            autoconf bison binutils cmake flex g++-13 gcc-13 libc6-dev libedit-dev libffi-dev \
            libfl-dev libgmock-dev libgtest-dev libreadline-dev libreadline8t64 \
            libtcl8.6 make pkg-config tcl-dev zlib1g-dev \
            > "$RUNNER_TEMP/scn-hdl-build-environment.txt"
          cat "$RUNNER_TEMP/scn-hdl-build-environment.txt"
          printf 'digest=%s\n' \
            "$(sha256sum "$RUNNER_TEMP/scn-hdl-build-environment.txt" | cut -d ' ' -f 1)" \
            >> "$GITHUB_OUTPUT"
      - name: Restore the source-pinned HDL tools
        if: ${{ inputs.rebuild_sdk }}
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scn-hdl
          key: ubuntu24-x64-hdl-yosys070-sby070-z34812-3b15884d-yices270-generic-v1-sv2v0013-${{ steps.build-environment.outputs.digest }}-${{ hashFiles('.github/workflows/hdl-toolchain.yml', 'tools/build_yices.sh', 'tools/check_yices_isa.sh', 'requirements/sby.txt') }}
      - name: Build the verified stable sources once
        if: ${{ inputs.rebuild_sdk && steps.tools.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/scn-hdl-source"
          build_root="$RUNNER_TEMP/scn-hdl-build"
          tool_prefix="$RUNNER_TEMP/scn-hdl"
          mkdir -p "$source_root/yosys"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            https://github.com/YosysHQ/yosys/releases/download/v0.70/yosys.tar.gz \
            -o "$source_root/yosys.tar.gz"
          echo "c6bd8b83aad633f6786fc861fe8f5dbc74c37bfae77f7bd0220e6f00f15f1d55  $source_root/yosys.tar.gz" \
            | sha256sum --check --status
          tar -xzf "$source_root/yosys.tar.gz" -C "$source_root/yosys"
          test "$(cat "$source_root/yosys/.gitcommit")" = 0c11ea098be065e585a90a06e7b7da49936cf231
          /usr/bin/cmake -S "$source_root/yosys" -B "$build_root" \
            -DCMAKE_BUILD_TYPE=Release -DYOSYS_USE_BUNDLED_LIBS=ON \
            -DCMAKE_C_COMPILER=/usr/bin/gcc-13 -DCMAKE_CXX_COMPILER=/usr/bin/g++-13 \
            -DCMAKE_INSTALL_PREFIX="$tool_prefix" \
            -DPython3_EXECUTABLE="$(command -v python)"
          /usr/bin/cmake --build "$build_root" --parallel "$(nproc)"
          /usr/bin/ctest --test-dir "$build_root/tests/unit" --output-on-failure \
            --no-tests=error --parallel "$(nproc)"
          /usr/bin/cmake --install "$build_root" --strip
          git init -q "$source_root/sby"
          git -C "$source_root/sby" remote add origin https://github.com/YosysHQ/sby
          for _ in 1 2 3; do
            git -C "$source_root/sby" fetch -q --depth 1 origin \
              refs/tags/v0.70:refs/tags/v0.70 && break
            sleep 2
          done
          test "$(git -C "$source_root/sby" rev-parse refs/tags/v0.70)" = 25affa40dc0bfe613f4c88be2d17ac5de6657f2f
          git -C "$source_root/sby" checkout -q --detach b1a1e98cba941ec8433f8dc27f416cd7bb7f14be
          test "$(git -C "$source_root/sby" rev-parse HEAD)" = b1a1e98cba941ec8433f8dc27f416cd7bb7f14be
          make -C "$source_root/sby" install PREFIX="$tool_prefix"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            https://archive.ubuntu.com/ubuntu/pool/universe/z/z3/z3_4.8.12-3.1build1_amd64.deb \
            -o "$source_root/z3.deb"
          echo "3b15884d5f77563b2941f5c679ce9c3d252d098340094f46b891bc57603e3793  $source_root/z3.deb" \
            | sha256sum --check --status
          dpkg-deb --extract "$source_root/z3.deb" "$source_root/z3"
          install -m 755 "$source_root/z3/usr/bin/z3" "$tool_prefix/bin/z3"
          mkdir -p "$tool_prefix/share/licenses/z3"
          cp "$source_root/z3/usr/share/doc/z3/copyright" "$tool_prefix/share/licenses/z3/"
          bash tools/build_yices.sh "$tool_prefix" "$source_root"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            https://github.com/zachjs/sv2v/releases/download/v0.0.13/sv2v-Linux.zip \
            -o "$source_root/sv2v.zip"
          echo "552799a1d76cd177b9b4cc63a3e77823a3d2a6eb4ec006569288abeff28e1ff8  $source_root/sv2v.zip" \
            | sha256sum --check --status
          unzip -q "$source_root/sv2v.zip" -d "$source_root/sv2v"
          install -m 755 "$source_root/sv2v/sv2v-Linux/sv2v" "$tool_prefix/bin/sv2v"
          mkdir -p "$tool_prefix/share/licenses/sv2v"
          cp "$source_root/sv2v/sv2v-Linux/LICENSE" "$source_root/sv2v/sv2v-Linux/NOTICE" \
            "$tool_prefix/share/licenses/sv2v/"
      - name: Retain upstream and bundled dependency notices
        if: ${{ inputs.rebuild_sdk && steps.tools.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          for component in yosys sby; do
            notices="$RUNNER_TEMP/scn-hdl/share/licenses/$component"
            mkdir -p "$notices"
            (
              cd "$RUNNER_TEMP/scn-hdl-source/$component"
              find . -type f \( -iname '*copying*' -o -iname '*license*' -o -iname '*copyright*' \) -print0 \
                | tar --null --files-from=- -cf -
            ) | tar -C "$notices" -xf -
          done
      - name: Verify the toolchain for this run
        shell: bash
        run: |
          set -euo pipefail
          tool_prefix="$RUNNER_TEMP/scn-hdl"
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' libc6)" ge 2.38
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' libstdc++6)" ge 13.1
          test -s "$tool_prefix/share/licenses/yosys/COPYING"
          test -s "$tool_prefix/share/licenses/sby/COPYING"
          test -s "$tool_prefix/share/licenses/z3/copyright"
          test -s "$tool_prefix/share/licenses/yices/README"
          test -s "$tool_prefix/share/licenses/yices/LICENSE"
          test -s "$tool_prefix/share/licenses/gmp/copyright"
          test -s "$tool_prefix/share/licenses/gperf/copyright"
          (cd "$tool_prefix" && sha256sum --check share/yices-build/SHA256SUMS)
          test "$(sed -n 's/^Yices recipe SHA256 //p' "$tool_prefix/share/yices-build/PROVENANCE.txt")" \
            = "$(sha256sum tools/build_yices.sh | cut -d ' ' -f 1)"
          test "$(sed -n 's/^Yices ISA checker SHA256 //p' "$tool_prefix/share/yices-build/PROVENANCE.txt")" \
            = "$(sha256sum tools/check_yices_isa.sh | cut -d ' ' -f 1)"
          grep -Eq '^Yices own-object ISA scan PASS: [1-9][0-9]* objects;' \
            "$tool_prefix/share/yices-build/isa-scan.txt"
          timeout 5 "$tool_prefix/bin/yices-smt2" --incremental \
            < "$tool_prefix/share/yices-build/smoke.smt2" > "$RUNNER_TEMP/yices-smoke.out"
          test "$(cat "$RUNNER_TEMP/yices-smoke.out")" = "$(printf 'sat\nunsat')"
          test -s "$tool_prefix/share/licenses/sv2v/LICENSE"
          test -s "$tool_prefix/share/licenses/sv2v/NOTICE"
          version="$("$tool_prefix/bin/yosys" -V)"
          # The official release archive lacks Git distance metadata; its
          # reported +post source tree is identical to the v0.70 tag tree.
          case "$version" in
            "Yosys 0.70+post (git sha1 0c11ea098be065e585a90a06e7b7da49936cf231,"*) ;;
            *) printf '%s\n' "$version" >&2; exit 1 ;;
          esac
          test "$("$tool_prefix/bin/sby" --version)" = "SBY v0.70"
          echo "c05be002097e2f2106efeeac03e58032e3f5cca10104f95d7a0ddc0bd3f907cb  $tool_prefix/bin/z3" \
            | sha256sum --check --status
          test "$("$tool_prefix/bin/z3" --version)" = "Z3 version 4.8.12 - 64 bit"
          test "$("$tool_prefix/bin/yices-smt2" --version | head -1)" = "Yices 2.7.0"
          test "$("$tool_prefix/bin/sv2v" --numeric-version)" = "0.0.13"
      - name: Record the provenance of a source build and package it
        if: ${{ inputs.rebuild_sdk }}
        shell: bash
        run: |
          set -euo pipefail
          tool_prefix="$RUNNER_TEMP/scn-hdl"
          version="$("$tool_prefix/bin/yosys" -V)"
          {
            printf '%s\n' "$version"
            "$tool_prefix/bin/sby" --version
            "$tool_prefix/bin/z3" --version
            "$tool_prefix/bin/yices-smt2" --version
            "$tool_prefix/bin/sv2v" --version
            printf '%s\n' 'Yosys asset SHA256 c6bd8b83aad633f6786fc861fe8f5dbc74c37bfae77f7bd0220e6f00f15f1d55'
            printf '%s\n' 'SBY source b1a1e98cba941ec8433f8dc27f416cd7bb7f14be'
            printf '%s\n' 'Z3 package Ubuntu noble universe 4.8.12-3.1build1 amd64'
            printf '%s\n' 'Z3 runtime libc6 >= 2.38; libgcc-s1 >= 3.4; libstdc++6 >= 13.1'
            printf '%s\n' 'Z3 Ubuntu archive signature F6ECB3762474EDA9D21B7022871920D1991BC93C'
            printf '%s\n' 'Z3 Ubuntu noble InRelease SHA256 cdb2f31d809f589719a53c6ad15f255b27569c4059542ada282aaa21b8e164b0'
            printf '%s\n' 'Z3 Ubuntu noble universe Packages.xz SHA256 ba9057fa1b91438cc8a1d26808d00c85389fe101d0c1496254df97236405599a'
            printf '%s\n' 'Z3 asset SHA256 3b15884d5f77563b2941f5c679ce9c3d252d098340094f46b891bc57603e3793'
            printf '%s\n' 'Z3 asset SHA512 2be0041846ef17c141ff96a3aad8958e7c6e36a06af93a0c902833818edda0c766c920c4938f539caaab953d4db78b3f4d1f2e8cca5cffa91232e76c4a806e21'
            printf '%s\n' 'Z3 binary SHA256 c05be002097e2f2106efeeac03e58032e3f5cca10104f95d7a0ddc0bd3f907cb'
            cat "$tool_prefix/share/yices-build/PROVENANCE.txt"
            cat "$RUNNER_TEMP/scn-hdl-build-environment.txt"
            printf '%s\n' 'sv2v provenance: pinned GitHub release-asset SHA256 only; no signed archive-index chain'
            printf '%s\n' 'sv2v asset SHA256 552799a1d76cd177b9b4cc63a3e77823a3d2a6eb4ec006569288abeff28e1ff8'
          } > "$tool_prefix/PROVENANCE.txt"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/scn-hdl.tar.gz" scn-hdl
          cd "$RUNNER_TEMP"
          sha256sum scn-hdl.tar.gz > scn-hdl.tar.gz.sha256
      - name: Hand on the published SDK archive unchanged
        if: ${{ !inputs.rebuild_sdk }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/scn-hdl-published/scn-hdl.tar.gz" "$RUNNER_TEMP/scn-hdl.tar.gz"
          cd "$RUNNER_TEMP"
          sha256sum scn-hdl.tar.gz > scn-hdl.tar.gz.sha256
          test "$(cut -d ' ' -f 1 scn-hdl.tar.gz.sha256)" = "$SCN_HDL_SDK_SHA256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stable-hdl-sdk
          path: |
            ${{ runner.temp }}/scn-hdl.tar.gz
            ${{ runner.temp }}/scn-hdl.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
