# SC-NeuroCore — MLIR / CIRCT round-trip validation

name: MLIR CIRCT Validation

permissions: {}

on:
  workflow_dispatch:
  push:
    paths:
      - "src/sc_neurocore/compiler/mlir_emitter.py"
      - "src/sc_neurocore/compiler/pipeline.py"
      - "tests/test_mlir_circt_roundtrip.py"
      - "tests/test_mlir_emitter.py"
      - "tests/test_compiler_pipeline_contracts.py"
      - "engine/src/ir/**"
      - "engine/tests/test_ir_streaming*.rs"
      - "engine/tests/test_ir_scalar*.rs"
      - "engine/tests/test_ir_type_geometry.rs"
      - "engine/tests/common/ir_stream.rs"
      - "engine/tests/common/ir_rtl.rs"
      - "engine/Cargo.toml"
      - "Cargo.lock"
      - "tools/check_ir_circt.py"
      - "tests/test_tools/test_check_ir_circt.py"
      - ".github/workflows/mlir-circt.yml"
  pull_request:
    paths:
      - "src/sc_neurocore/compiler/mlir_emitter.py"
      - "src/sc_neurocore/compiler/pipeline.py"
      - "tests/test_mlir_circt_roundtrip.py"
      - "tests/test_mlir_emitter.py"
      - "tests/test_compiler_pipeline_contracts.py"
      - "engine/src/ir/**"
      - "engine/tests/test_ir_streaming*.rs"
      - "engine/tests/test_ir_scalar*.rs"
      - "engine/tests/test_ir_type_geometry.rs"
      - "engine/tests/common/ir_stream.rs"
      - "engine/tests/common/ir_rtl.rs"
      - "engine/Cargo.toml"
      - "Cargo.lock"
      - "tools/check_ir_circt.py"
      - "tests/test_tools/test_check_ir_circt.py"
      - ".github/workflows/mlir-circt.yml"

concurrency:
  group: mlir-circt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  circt-roundtrip:
    # Skip on release-tag pushes; the round-trip belongs to source changes.
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # 1.98.1
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: engine
          cache-bin: false

      - name: Install RTL simulator
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Install CIRCT (circt-opt)
        run: |
          url="https://github.com/llvm/circt/releases/download/firtool-1.152.0/circt-full-shared-linux-x64.tar.gz"
          curl -fsSL -o /tmp/circt.tar.gz "$url"
          echo "767cd4347462e7c2f1df2f6937443f74470437e58c18fd4363956e9b639d41fa  /tmp/circt.tar.gz" \
            | sha256sum -c -
          mkdir -p "$HOME/circt"
          tar -xzf /tmp/circt.tar.gz -C "$HOME/circt"
          echo "$HOME/circt/firtool-1.152.0/bin" >> "$GITHUB_PATH"

      - name: Verify circt-opt
        run: circt-opt --version

      - name: Install package
        run: python tools/ci_install_dev.py

      - name: Run MLIR CIRCT round-trip tests
        run: |
          pytest tests/test_mlir_circt_roundtrip.py \
                 tests/test_mlir_emitter.py \
                 tests/test_compiler_pipeline_contracts.py -q

      - name: Run native IR numerical reference tests
        env:
          SCN_IR_CIRCT_RECEIPT_DIR: ${{ runner.temp }}/native-ir-circt
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          CMAKE_BUILD_PARALLEL_LEVEL: "1"
        run: >
          cargo test --locked --manifest-path engine/Cargo.toml --jobs 1
          --test test_ir_streaming --test test_ir_streaming_words
          --test test_ir_streaming_admission
          --test test_ir_scalar_words --test test_ir_scalar_admission
          --test test_ir_scalar_text --test test_ir_type_geometry -- --test-threads=1

      - name: Lower and simulate every native CIRCT reference circuit
        run: python tools/check_ir_circt.py "${{ runner.temp }}/native-ir-circt"

      - name: Check numerical gate refusal regressions
        run: python -m pytest tests/test_tools/test_check_ir_circt.py -q
