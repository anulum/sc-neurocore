# SC-NeuroCore — MLIR / CIRCT round-trip validation

name: MLIR CIRCT Validation

permissions: {}

on:
  workflow_dispatch:
  push:
    paths:
      - "src/sc_neurocore/compiler/**"
      - "src/sc_neurocore/neurons/equation*.py"
      - "bridge/sc_neurocore_engine/ir.py"
      - "bridge/sc_neurocore_engine/_ir_native.py"
      - "tests/test_equation_ir_compiler.py"
      - "tests/test_native_equation*.py"
      - "tests/test_ir_source.py"
      - "tests/test_ir_word_delay.py"
      - "engine/tests/test_ir_source.rs"
      - "engine/tests/test_ir_word_delay*.rs"
      - "tests/test_mlir_circt_roundtrip.py"
      - "tests/test_mlir_emitter.py"
      - "tests/test_compiler_pipeline_contracts.py"
      - "engine/src/ir/**"
      - "engine/tests/test_ir_streaming*.rs"
      - "engine/tests/test_ir_scalar*.rs"
      - "engine/tests/test_ir_state*.rs"
      - "engine/tests/test_ir_type_geometry.rs"
      - "engine/tests/test_ir_runtime_check.rs"
      - "engine/tests/test_ir_identifiers.rs"
      - "tests/test_ir_runtime_check.py"
      - "tests/test_ir_identifiers.py"
      - "engine/tests/common/ir_stream.rs"
      - "engine/tests/common/ir_rtl.rs"
      - "engine/Cargo.toml"
      - "Cargo.lock"
      - "tools/check_ir_circt.py"
      - "tests/test_tools/test_check_ir_circt.py"
      - ".github/workflows/mlir-circt.yml"
  pull_request:
    paths:
      - "src/sc_neurocore/compiler/**"
      - "src/sc_neurocore/neurons/equation*.py"
      - "bridge/sc_neurocore_engine/ir.py"
      - "bridge/sc_neurocore_engine/_ir_native.py"
      - "tests/test_equation_ir_compiler.py"
      - "tests/test_native_equation*.py"
      - "tests/test_ir_source.py"
      - "tests/test_ir_word_delay.py"
      - "engine/tests/test_ir_source.rs"
      - "engine/tests/test_ir_word_delay*.rs"
      - "tests/test_mlir_circt_roundtrip.py"
      - "tests/test_mlir_emitter.py"
      - "tests/test_compiler_pipeline_contracts.py"
      - "engine/src/ir/**"
      - "engine/tests/test_ir_streaming*.rs"
      - "engine/tests/test_ir_scalar*.rs"
      - "engine/tests/test_ir_state*.rs"
      - "engine/tests/test_ir_type_geometry.rs"
      - "engine/tests/test_ir_runtime_check.rs"
      - "engine/tests/test_ir_identifiers.rs"
      - "tests/test_ir_runtime_check.py"
      - "tests/test_ir_identifiers.py"
      - "engine/tests/common/ir_stream.rs"
      - "engine/tests/common/ir_rtl.rs"
      - "engine/Cargo.toml"
      - "Cargo.lock"
      - "tools/check_ir_circt.py"
      - "tests/test_tools/test_check_ir_circt.py"
      - ".github/workflows/mlir-circt.yml"

concurrency:
  group: mlir-circt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  circt-roundtrip:
    # Skip on release-tag pushes; the round-trip belongs to source changes.
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.98.1
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine
          cache-bin: false

      - name: Install RTL simulator
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Install CIRCT (circt-opt)
        run: |
          url="https://github.com/llvm/circt/releases/download/firtool-1.162.0/circt-full-shared-linux-x64.tar.gz"
          curl -fsSL -o /tmp/circt.tar.gz "$url"
          echo "6be43434f1fe1ed2f4438e820e3cd636fac551df7090d90db258f0ba223d1de9  /tmp/circt.tar.gz" \
            | sha256sum -c -
          mkdir -p "$HOME/circt"
          tar -xzf /tmp/circt.tar.gz -C "$HOME/circt"
          echo "$HOME/circt/firtool-1.162.0/bin" >> "$GITHUB_PATH"

      - name: Verify circt-opt
        run: circt-opt --version

      - name: Install package
        run: python tools/ci_install_dev.py

      - name: Run MLIR CIRCT round-trip tests
        run: |
          pytest tests/test_mlir_circt_roundtrip.py \
                 tests/test_mlir_emitter.py \
                 tests/test_compiler_pipeline_contracts.py -q

      - name: Run native IR numerical reference tests
        env:
          SCN_IR_CIRCT_RECEIPT_DIR: ${{ runner.temp }}/native-ir-circt
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          CMAKE_BUILD_PARALLEL_LEVEL: "1"
        run: >
          cargo test --locked --manifest-path engine/Cargo.toml --jobs 1
          --test test_ir_streaming --test test_ir_streaming_words
          --test test_ir_streaming_admission
          --test test_ir_scalar_words --test test_ir_scalar_admission
          --test test_ir_scalar_text --test test_ir_type_geometry
          --test test_ir_runtime_check --test test_ir_identifiers
          --test test_ir_source --test test_ir_word_delay --test test_ir_word_delay_admission
          --test test_ir_state --test test_ir_state_text --test test_ir_state_runtime
          -- --test-threads=1

      - name: Lower and simulate every native CIRCT reference circuit
        run: python tools/check_ir_circt.py "${{ runner.temp }}/native-ir-circt"

      - name: Run native runtime check API and RTL tests
        env:
          SC_NEUROCORE_REQUIRE_ENGINE: "1"
          SCN_IR_CIRCT_RECEIPT_DIR: ${{ runner.temp }}/native-runtime-check-circt
        run: >
          python -m pytest tests/test_ir_runtime_check.py tests/test_ir_identifiers.py -q

      - name: Lower and simulate native runtime check circuits
        run: python tools/check_ir_circt.py "${{ runner.temp }}/native-runtime-check-circt"

      - name: Run public equation IR compilation and source replay
        env:
          SC_NEUROCORE_REQUIRE_ENGINE: "1"
          SCN_IR_CIRCT_RECEIPT_DIR: ${{ runner.temp }}/public-equation-ir-circt
        run: >
          python -m pytest tests/test_native_equation.py
          tests/test_native_equation_commits.py tests/test_equation_ir_compiler.py
          tests/test_native_equation_source.py tests/test_native_equation_discrete_functions.py
          tests/test_native_equation_hypot.py tests/test_native_equation_rsqrt.py
          tests/test_native_equation_powers.py -q

      - name: Lower and simulate public equation IR circuits
        run: python tools/check_ir_circt.py "${{ runner.temp }}/public-equation-ir-circt"

      - name: Check numerical gate refusal regressions
        run: python -m pytest tests/test_tools/test_check_ir_circt.py -q
