# SC-NeuroCore — Release

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to backfill, for example v3.16.0"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ inputs.tag }}"
          else
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.3"

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # nightly
        with:
          toolchain: nightly

      - name: Install release security sweep tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          python -m pip install --require-hashes -r requirements/security-scanners.txt
          # semgrep-overrides.txt deliberately replaces two vulnerable upstream
          # constraints; the lock contains the complete dependency set. Keep
          # Semgrep isolated because its exceptiongroup~=1.2 constraint is
          # incompatible with the fuzz lock's exceptiongroup==1.3.1.
          SEMGREP_VENV="${RUNNER_TEMP}/sc-neurocore-semgrep"
          python -m venv "$SEMGREP_VENV"
          . "$SEMGREP_VENV/bin/activate"
          python -m pip install --no-deps --require-hashes -r requirements/semgrep.txt
          deactivate
          echo "$SEMGREP_VENV/bin" >> "$GITHUB_PATH"
          python -m pip install --require-hashes -r requirements/fuzz.txt
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.8
          go install github.com/anchore/syft/cmd/syft@v1.20.0
          go install github.com/zricethezav/gitleaks/v8@v8.20.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          cargo install cargo-audit --version 0.22.1 --locked
          cargo install cargo-deny --version 0.19.6 --locked
          cargo install cargo-fuzz --version 0.13.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build sdist
        run: |
          pip install --require-hashes -r requirements/release.txt
          python -m build

      - name: Generate SBOM
        run: cyclonedx-py environment -o sbom.json --output-format json

      - name: Generate release security packet
        run: |
          mkdir -p security/ci-security-packet
          python tools/security_scan/release_security_sweep.py \
            --output-dir security/ci-security-packet \
            --include-fuzz \
            --fuzz-max-total-time 300

      - name: Upload release security packet artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-security-packet
          path: security/ci-security-packet
          retention-days: 30

      - name: Extract changelog for this tag
        id: changelog
        run: |
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          awk -v version="${VERSION}" '
            $0 ~ "^## \\[?" version "\\]" { in_section = 1; print; next }
            in_section && $0 ~ "^## \\[[0-9]" { exit }
            in_section { print }
          ' docs/CHANGELOG.md > /tmp/release_notes.md
          test -s /tmp/release_notes.md
          echo "notes_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: ${{ steps.changelog.outputs.notes_file }}
          generate_release_notes: false
          files: |
            dist/sc_neurocore-*
            sbom.json
            security/ci-security-packet/release_security_artifact_index.json
            security/ci-security-packet/security/release_security_sweep_summary.json
