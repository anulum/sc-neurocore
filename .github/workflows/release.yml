# SC-NeuroCore — Release

name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          pip install --require-hashes -r requirements/release.txt
          python -m build

      - name: Generate SBOM
        run: cyclonedx-py environment -o sbom.json --output-format json

      - name: Generate release security packet
        run: |
          mkdir -p security/ci-security-packet
          python tools/security_scan/ci_security_packet.py \
            --output-dir security/ci-security-packet \
            --fail-on-missing-required

      - name: Extract changelog for this tag
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          awk -v version="${VERSION}" '
            $0 ~ "^## \\[?" version "\\]" { in_section = 1; print; next }
            in_section && $0 ~ "^## \\[[0-9]" { exit }
            in_section { print }
          ' docs/CHANGELOG.md > /tmp/release_notes.md
          test -s /tmp/release_notes.md
          echo "notes_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2
        with:
          body_path: ${{ steps.changelog.outputs.notes_file }}
          generate_release_notes: false
          files: |
            dist/sc_neurocore-*
            sbom.json
            security/ci-security-packet/release_security_artifact_index.json
