# SC-NeuroCore — Release

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to backfill, for example v3.16.0"
        required: true
        type: string
      publish:
        description: "Publish or update the GitHub Release after validation"
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A manual validation stays on the selected branch. Only an explicit
          # publish backfill checks out the historical release tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && inputs.tag || github.ref }}

      - name: Resolve release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ inputs.tag }}"
          else
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # nightly
        with:
          toolchain: nightly

      - name: Install release security sweep tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          python -m pip install --require-hashes -r requirements/security-scanners.txt
          # semgrep-overrides.txt deliberately replaces two vulnerable upstream
          # constraints; the lock contains the complete dependency set. Keep
          # Semgrep isolated because its exceptiongroup~=1.2 constraint is
          # incompatible with the fuzz lock's exceptiongroup==1.3.1.
          SEMGREP_VENV="${RUNNER_TEMP}/sc-neurocore-semgrep"
          python -m venv "$SEMGREP_VENV"
          . "$SEMGREP_VENV/bin/activate"
          python -m pip install --no-deps --require-hashes -r requirements/semgrep.txt
          deactivate
          echo "$SEMGREP_VENV/bin" >> "$GITHUB_PATH"
          # The fuzz subset imports the package, so the runtime lock is installed with it.
          python -m pip install --require-hashes -r requirements/fuzz.txt -r requirements/runtime.txt
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.8
          go install github.com/anchore/syft/cmd/syft@v1.20.0
          go install github.com/zricethezav/gitleaks/v8@v8.20.1
          go install github.com/aquasecurity/trivy/cmd/trivy@v0.58.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          cargo install cargo-audit --version 0.22.1 --locked
          cargo install cargo-deny --version 0.19.6 --locked
          cargo install cargo-fuzz --version 0.13.2 --locked
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json

      - name: Install verified npm
        uses: ./.github/actions/setup-npm
      - name: Build the Studio UI the wheel carries
        working-directory: studio/frontend
        run: |
          npm ci
          npm run build

      - name: Build sdist
        env:
          SC_NEUROCORE_STUDIO_UI: required
        run: |
          pip install --require-hashes -r requirements/release.txt
          python -m build

      - name: Accept the installed Studio the wheel provides
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          python -m pip install --require-hashes -r requirements/maturin.txt
          (cd bridge && maturin build --release --locked --out "$RUNNER_TEMP/studio-native-wheel")
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/pip" install --require-hashes \
            -r requirements/runtime.txt -r requirements/hub.txt
          "$RUNNER_TEMP/installed/bin/pip" install --no-deps dist/sc_neurocore-*.whl
          "$RUNNER_TEMP/installed/bin/pip" install --no-deps "$RUNNER_TEMP/studio-native-wheel/"*.whl
          "$RUNNER_TEMP/installed/bin/python" -I -c \
            'from sc_neurocore_engine.ir import ScGraphBuilder; graph = ScGraphBuilder("installed"); graph.output("value", graph.input("drive", "i16")); assert not graph.build().verify()'
          python tools/studio_installed_acceptance.py --python "$RUNNER_TEMP/installed/bin/python"

      - name: Replay through the installed Studio in a real browser
        id: installed_browser
        working-directory: studio/frontend
        env:
          SC_NEUROCORE_STUDIO_INSTALLED_PYTHON: ${{ runner.temp }}/installed/bin/python
          SC_NEUROCORE_STUDIO_INSTALLED_TEST_ROOT: ${{ runner.temp }}/installed-studio-browser
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --config playwright.installed.config.ts

      - name: Preserve installed browser replay evidence
        if: always() && steps.installed_browser.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installed-studio-browser
          path: ${{ runner.temp }}/installed-studio-browser/playwright
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      # The SBOMs describe what users install: the clean environment the release wheels were
      # accepted in, and the Rust dependency graph locked for the engine.
      - name: Generate SBOM
        run: |
          cyclonedx-py environment "$RUNNER_TEMP/installed/bin/python" -o sbom.json --output-format json
          syft scan file:Cargo.lock -o cyclonedx-json=sbom-engine-rust.json

      - name: Generate release security packet
        run: |
          mkdir -p security/ci-security-packet
          "${pythonLocation}/bin/python" tools/security_scan/release_security_sweep.py \
            --output-dir security/ci-security-packet \
            --include-fuzz \
            --fuzz-max-total-time 300

      - name: Upload release security packet artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-security-packet
          path: security/ci-security-packet
          retention-days: 30

      # GitHub refuses release bodies over 125,000 characters. The body is the curated notes of this
      # version plus the SHA-256 of every attached file; the full history stays in the CHANGELOG.
      # This step owns the one list of attachments: it hashes exactly the files the release step
      # attaches, and refuses a missing or empty attachment.
      - name: Release notes for this tag
        id: changelog
        run: |
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          NOTES="docs/development/RELEASE_NOTES_v${VERSION}.md"
          test -s "$NOTES" || { echo "missing curated release notes: $NOTES" >&2; exit 1; }
          shopt -s nullglob
          dist=(dist/sc_neurocore-*)
          test "${#dist[@]}" -gt 0 || { echo "no package distributions to attach" >&2; exit 1; }
          attachments=(
            "${dist[@]}"
            sbom.json
            sbom-engine-rust.json
            security/ci-security-packet/release_security_artifact_index.json
            security/ci-security-packet/security/release_security_sweep_summary.json
          )
          for f in "${attachments[@]}"; do
            test -s "$f" || { echo "missing release attachment: $f" >&2; exit 1; }
          done
          {
            cat "$NOTES"
            echo
            echo "| File | SHA-256 |"
            echo "|---|---|"
            for f in "${attachments[@]}"; do
              echo "| \`$(basename "$f")\` | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
          } > /tmp/release_notes.md
          size="$(wc -c < /tmp/release_notes.md)"
          test "$size" -le 125000 || { echo "release body is $size bytes; GitHub allows 125000 characters" >&2; exit 1; }
          echo "notes_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"
          {
            echo "files<<RELEASE_ATTACHMENTS"
            printf '%s\n' "${attachments[@]}"
            echo "RELEASE_ATTACHMENTS"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: ${{ steps.changelog.outputs.notes_file }}
          generate_release_notes: false
          files: ${{ steps.changelog.outputs.files }}
