# SC-NeuroCore — daily PyPI download snapshot recorded to the metrics branch
name: PyPI Download Metrics

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metrics-branch-writer
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Snapshot downloads onto the metrics branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          package="$(python tools/pypi_downloads.py --print-package)"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$remote" metrics >/dev/null 2>&1; then
            git clone --depth 1 --branch metrics "$remote" metrics-branch
          else
            git clone --depth 1 "$remote" metrics-branch
            git -C metrics-branch switch --orphan metrics
            git -C metrics-branch rm -rf . >/dev/null 2>&1 || true
          fi
          python tools/pypi_downloads.py \
            --package "$package" \
            --csv "metrics-branch/downloads/${package}.csv"
          cd metrics-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "downloads/${package}.csv"
          if git diff --cached --quiet; then
            echo "No download changes to record."
            exit 0
          fi
          git commit -m "metrics: pypi download snapshot for ${package}"
          git push origin metrics
