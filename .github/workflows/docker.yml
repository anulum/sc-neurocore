# SC-NeuroCore — Docker Image

name: Docker Image

on:
  workflow_dispatch:
    inputs:
      alias_from:
        description: "Existing GHCR tag to alias without rebuilding, for release repair workflows."
        required: false
        type: string
      alias_to:
        description: "New GHCR tag to create from alias_from."
        required: false
        type: string
      image_tag:
        description: "Optional GHCR tag to build and scan from the current workflow revision."
        required: false
        type: string
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  alias-image:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.alias_from != '' && inputs.alias_to != '' }}
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate alias tags
        shell: bash
        env:
          ALIAS_FROM: ${{ inputs.alias_from }}
          ALIAS_TO: ${{ inputs.alias_to }}
        run: |
          tag_pattern='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
          [[ "${ALIAS_FROM}" =~ ${tag_pattern} ]]
          [[ "${ALIAS_TO}" =~ ${tag_pattern} ]]

      - name: Create OCI tag alias
        shell: bash
        env:
          ALIAS_FROM: ${{ inputs.alias_from }}
          ALIAS_TO: ${{ inputs.alias_to }}
        run: |
          source_ref="${REGISTRY}/${IMAGE_NAME}:${ALIAS_FROM}"
          target_ref="${REGISTRY}/${IMAGE_NAME}:${ALIAS_TO}"
          docker buildx imagetools create -t "${target_ref}" "${source_ref}"
          docker buildx imagetools inspect "${target_ref}"

  build-push:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.alias_from == '' || inputs.alias_to == '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write
      # Signing the pushed image's build provenance through Sigstore.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` follows the newest final release tag; a dispatched image_tag never moves it.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Nothing reaches the registry before the vulnerability gate: build into the local
      # daemon, scan that image, and push only after the scan passed.
      - name: Build the image locally
        id: build_local
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trivy fail on CRITICAL/HIGH
        shell: bash
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          test -n "${IMAGE_REF}"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image \
            --scanners vuln \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            "${IMAGE_REF}"

      - name: Trivy SARIF report
        if: always() && steps.build_local.outcome == 'success'
        shell: bash
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}:/work" \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image \
            --scanners vuln \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            --format sarif \
            --output /work/trivy-results.sarif \
            "${IMAGE_REF}"

      # Push the image Trivy scanned, not a rebuild: every tag must name the scanned image
      # in the local daemon before any tag is pushed from there.
      - name: Push the scanned image
        shell: bash
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          scanned="$(docker image inspect --format '{{.Id}}' "${IMAGE_REF}")"
          test -n "${scanned}"
          mapfile -t tags < <(printf '%s\n' "${TAGS}" | sed '/^$/d')
          test "${#tags[@]}" -gt 0
          for tag in "${tags[@]}"; do
            test "$(docker image inspect --format '{{.Id}}' "${tag}")" = "${scanned}"
          done
          for tag in "${tags[@]}"; do
            docker push "${tag}"
          done

      - name: Wait for GHCR image availability
        shell: bash
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          test -n "${IMAGE_REF}"
          for _ in {1..12}; do
            if docker pull "${IMAGE_REF}"; then
              exit 0
            fi
            sleep 10
          done
          docker pull "${IMAGE_REF}"

      # The digest the registry reported for the pushed image, as pulled back above.
      - name: Resolve the pushed image digest
        id: digest
        shell: bash
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          REPOSITORY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          reference="$(docker image inspect --format '{{join .RepoDigests "\n"}}' "${IMAGE_REF}" | grep "^${REPOSITORY}@" | head -n 1)"
          digest="${reference#*@}"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # The image gets a signed SLSA build provenance attestation in the registry, verifiable
      # with `gh attestation verify oci://ghcr.io/anulum/sc-neurocore:<tag> -R anulum/sc-neurocore`.
      - name: Attest the pushed image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
