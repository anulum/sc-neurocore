# SC-NeuroCore — Docker Image

name: Docker Image

on:
  workflow_dispatch:
    inputs:
      alias_from:
        description: "Existing GHCR tag to alias without rebuilding, for release repair workflows."
        required: false
        type: string
      alias_to:
        description: "New GHCR tag to create from alias_from."
        required: false
        type: string
      image_tag:
        description: "Optional GHCR tag to build and scan from the current workflow revision."
        required: false
        type: string
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  alias-image:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.alias_from != '' && inputs.alias_to != '' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate alias tags
        shell: bash
        env:
          ALIAS_FROM: ${{ inputs.alias_from }}
          ALIAS_TO: ${{ inputs.alias_to }}
        run: |
          tag_pattern='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
          [[ "${ALIAS_FROM}" =~ ${tag_pattern} ]]
          [[ "${ALIAS_TO}" =~ ${tag_pattern} ]]

      - name: Create OCI tag alias
        shell: bash
        env:
          ALIAS_FROM: ${{ inputs.alias_from }}
          ALIAS_TO: ${{ inputs.alias_to }}
        run: |
          source_ref="${REGISTRY}/${IMAGE_NAME}:${ALIAS_FROM}"
          target_ref="${REGISTRY}/${IMAGE_NAME}:${ALIAS_TO}"
          docker buildx imagetools create -t "${target_ref}" "${source_ref}"
          docker buildx imagetools inspect "${target_ref}"

  build-push:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.alias_from == '' || inputs.alias_to == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Select scanned image tag
        id: scan-image
        shell: bash
        run: |
          first_tag="$(cat <<'EOF' | head -n 1
          ${{ steps.meta.outputs.tags }}
          EOF
          )"
          test -n "${first_tag}"
          echo "image=${first_tag}" >> "${GITHUB_OUTPUT}"

      - name: Trivy fail on CRITICAL/HIGH
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: ${{ steps.scan-image.outputs.image }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Trivy SARIF report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        if: always()
        with:
          image-ref: ${{ steps.scan-image.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
