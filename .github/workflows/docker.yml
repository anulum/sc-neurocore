# SC-NeuroCore — Docker Image

name: Docker Image

on:
  workflow_dispatch:
    inputs:
      alias_from:
        description: "Existing GHCR tag to alias without rebuilding, for release repair workflows."
        required: false
        type: string
      alias_to:
        description: "New GHCR tag to create from alias_from."
        required: false
        type: string
      image_tag:
        description: "Optional GHCR tag to build and scan from the current workflow revision."
        required: false
        type: string
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  alias-image:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.alias_from != '' && inputs.alias_to != '' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate alias tags
        shell: bash
        env:
          ALIAS_FROM: ${{ inputs.alias_from }}
          ALIAS_TO: ${{ inputs.alias_to }}
        run: |
          tag_pattern='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
          [[ "${ALIAS_FROM}" =~ ${tag_pattern} ]]
          [[ "${ALIAS_TO}" =~ ${tag_pattern} ]]

      - name: Create OCI tag alias
        shell: bash
        env:
          ALIAS_FROM: ${{ inputs.alias_from }}
          ALIAS_TO: ${{ inputs.alias_to }}
        run: |
          source_ref="${REGISTRY}/${IMAGE_NAME}:${ALIAS_FROM}"
          target_ref="${REGISTRY}/${IMAGE_NAME}:${ALIAS_TO}"
          docker buildx imagetools create -t "${target_ref}" "${source_ref}"
          docker buildx imagetools inspect "${target_ref}"

  build-push:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.alias_from == '' || inputs.alias_to == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        id: build_push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Wait for GHCR image availability
        shell: bash
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          test -n "${IMAGE_REF}"
          for attempt in {1..12}; do
            if docker pull "${IMAGE_REF}"; then
              exit 0
            fi
            sleep 10
          done
          docker pull "${IMAGE_REF}"

      - name: Trivy fail on CRITICAL/HIGH
        shell: bash
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.70.0 image \
            --scanners vuln \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            "${IMAGE_REF}"

      - name: Trivy SARIF report
        if: always() && steps.build_push.outcome == 'success'
        shell: bash
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}:/work" \
            aquasec/trivy:0.70.0 image \
            --scanners vuln \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            --format sarif \
            --output /work/trivy-results.sarif \
            "${IMAGE_REF}"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
