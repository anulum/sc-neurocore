name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "engine/src/**"
      - "engine/Cargo.toml"
      - "src/sc_neurocore/**"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # --- MkDocs (Python documentation) ---
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MkDocs and package
        run: |
          pip install mkdocs mkdocs-material "mkdocstrings[python]"
          pip install -e ".[dev]"

      - name: Build MkDocs site
        run: mkdocs build --site-dir _site

      # --- Rustdoc (Rust engine API) ---
      - uses: dtolnay/rust-toolchain@nightly

      - name: Build Rustdoc
        run: cargo +nightly doc --manifest-path engine/Cargo.toml --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "--enable-index-page -Zunstable-options"

      - name: Merge Rustdoc into MkDocs site
        run: |
          mkdir -p _site/rust-api
          cp -r engine/target/doc/* _site/rust-api/
          echo "" > _site/.nojekyll

      # --- Upload combined site ---
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
