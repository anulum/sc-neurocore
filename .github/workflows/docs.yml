name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "engine/src/**"
      - "engine/Cargo.toml"
      - "src/sc_neurocore/**"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # --- MkDocs (Python documentation) ---
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MkDocs and package
        run: |
          pip install mkdocs mkdocs-material "mkdocstrings[python]"
          pip install -e ".[dev]"

      - name: Build MkDocs site
        run: mkdocs build --site-dir _site

      # --- Rustdoc (Rust engine API) ---
      - uses: dtolnay/rust-toolchain@nightly

      - name: Build and merge Rustdoc
        run: |
          # Build rustdoc (workspace target dir is at repo root)
          cargo +nightly doc --manifest-path engine/Cargo.toml --no-deps --document-private-items || true
          # Find the doc output (could be target/doc or engine/target/doc)
          DOC_DIR=""
          if [ -d "target/doc/sc_neurocore_engine" ]; then
            DOC_DIR="target/doc"
          elif [ -d "engine/target/doc/sc_neurocore_engine" ]; then
            DOC_DIR="engine/target/doc"
          fi
          if [ -n "$DOC_DIR" ]; then
            mkdir -p _site/rust-api
            cp -r "$DOC_DIR"/* _site/rust-api/
            echo "Rustdoc merged from $DOC_DIR"
          else
            echo "WARNING: Rustdoc not found, deploying MkDocs only"
          fi
          echo "" > _site/.nojekyll
        env:
          RUSTDOCFLAGS: "--enable-index-page -Zunstable-options"

      # --- Upload combined site ---
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
