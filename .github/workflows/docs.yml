# SC-NeuroCore — Deploy Documentation to GitHub Pages

name: Deploy Documentation to GitHub Pages

permissions: {}

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "engine/src/**"
      - "engine/Cargo.toml"
      - "src/sc_neurocore/**"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --- MkDocs (Python documentation) ---
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MkDocs and package
        run: |
          pip install --require-hashes -r requirements/docs.txt
          python tools/ci_install_dev.py

      - name: Build MkDocs site
        run: mkdocs build --site-dir _site

      # --- Rustdoc (Rust engine API) ---
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # nightly

      - name: Build and merge Rustdoc
        run: |
          # Rustdoc is best-effort: the MkDocs site is the primary deliverable, so a
          # nightly-rustdoc build/copy hiccup (e.g. a partial doc tree from an OOM-killed
          # run) must degrade to "MkDocs only", never fail the docs deploy. On a healthy
          # run the full Rustdoc still merges.
          cargo +nightly doc --manifest-path engine/Cargo.toml --no-deps --document-private-items || true
          # Find the doc output (could be target/doc or engine/target/doc)
          DOC_DIR=""
          if [ -d "target/doc/sc_neurocore_engine" ]; then
            DOC_DIR="target/doc"
          elif [ -d "engine/target/doc/sc_neurocore_engine" ]; then
            DOC_DIR="engine/target/doc"
          fi
          if [ -n "$DOC_DIR" ]; then
            mkdir -p _site/rust-api
            if cp -r "$DOC_DIR"/. _site/rust-api/ 2>/dev/null; then
              echo "Rustdoc merged from $DOC_DIR"
            else
              rm -rf _site/rust-api
              echo "WARNING: Rustdoc copy failed (partial tree), deploying MkDocs only"
            fi
          else
            echo "WARNING: Rustdoc not found, deploying MkDocs only"
          fi
          echo "" > _site/.nojekyll
        env:
          RUSTDOCFLAGS: "--enable-index-page -Zunstable-options"

      # --- Upload combined site ---
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
