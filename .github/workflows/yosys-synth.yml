# SC-NeuroCore — Yosys FPGA Synthesis

name: Yosys FPGA Synthesis

permissions: {}

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yosys-synth.yml"
      - ".github/workflows/hdl-toolchain.yml"
      - "hdl/**"
      - "tools/yosys_synth.*"
  pull_request:
    paths:
      - ".github/workflows/yosys-synth.yml"
      - ".github/workflows/hdl-toolchain.yml"
      - "hdl/**"

concurrency:
  group: yosys-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hdl-toolchain:
    if: github.event_name != 'push' || github.ref_type != 'tag'
    permissions:
      contents: read
    uses: ./.github/workflows/hdl-toolchain.yml

  synthesize:
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    needs: [hdl-toolchain]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: stable-hdl-sdk
          path: ${{ runner.temp }}/hdl-download

      - name: Install the verified synthesis toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreadline8t64 libtcl8.6
          cd "$RUNNER_TEMP/hdl-download"
          sha256sum --check --status scn-hdl.tar.gz.sha256
          tar -xzf scn-hdl.tar.gz -C "$RUNNER_TEMP"
          cat "$RUNNER_TEMP/scn-hdl/PROVENANCE.txt"
          echo "$RUNNER_TEMP/scn-hdl/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/scn-hdl/bin/yosys" -V

      - name: Install sv2v
        run: |
          SV2V_VERSION="v0.0.13"
          SV2V_SHA256="552799a1d76cd177b9b4cc63a3e77823a3d2a6eb4ec006569288abeff28e1ff8"
          SV2V_URL="https://github.com/zachjs/sv2v/releases/download/${SV2V_VERSION}/sv2v-Linux.zip"
          curl --proto '=https' --tlsv1.2 -fsSL "$SV2V_URL" -o /tmp/sv2v.zip
          echo "${SV2V_SHA256}  /tmp/sv2v.zip" | sha256sum -c -
          unzip -o /tmp/sv2v.zip -d /tmp/sv2v
          sudo install /tmp/sv2v/sv2v-Linux/sv2v /usr/local/bin/sv2v
          sv2v --version

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"

      - name: Run synthesis (Xilinx 7-series target)
        run: python tools/yosys_synth.py --json benchmarks/results/yosys_synth.json --markdown --allow-skips

      - name: Upload synthesis results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: yosys-synth-results
          path: benchmarks/results/yosys_synth.json
