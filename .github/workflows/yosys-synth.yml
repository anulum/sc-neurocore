# SC-NeuroCore — Yosys FPGA Synthesis

name: Yosys FPGA Synthesis

permissions: {}

on:
  workflow_dispatch:
    inputs:
      run_all_formal:
        description: "Also run and time every tracked SymbiYosys job under hdl/formal"
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/yosys-synth.yml"
      - ".github/workflows/hdl-toolchain.yml"
      - "hdl/**"
      - "tools/yosys_synth.*"
      - "tools/formal*.py"
      - "tests/test_tools/test_formal*.py"
  pull_request:
    paths:
      - ".github/workflows/yosys-synth.yml"
      - ".github/workflows/hdl-toolchain.yml"
      - "hdl/**"
      - "tools/formal*.py"
      - "tests/test_tools/test_formal*.py"

concurrency:
  # A manual run has its own group, so a push cannot cancel a long formal run.
  group: yosys-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  hdl-toolchain:
    if: github.event_name != 'push' || github.ref_type != 'tag'
    permissions:
      contents: read
    uses: ./.github/workflows/hdl-toolchain.yml

  synthesize:
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    needs: [hdl-toolchain]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: stable-hdl-sdk
          path: ${{ runner.temp }}/hdl-download

      - name: Install the verified synthesis toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreadline8t64 libtcl8.6
          cd "$RUNNER_TEMP/hdl-download"
          sha256sum --check --status scn-hdl.tar.gz.sha256
          tar -xzf scn-hdl.tar.gz -C "$RUNNER_TEMP"
          cat "$RUNNER_TEMP/scn-hdl/PROVENANCE.txt"
          echo "$RUNNER_TEMP/scn-hdl/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/scn-hdl/bin/yosys" -V

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"

      - name: Run synthesis (Xilinx 7-series target)
        run: python tools/yosys_synth.py --json benchmarks/results/yosys_synth.json --markdown --allow-skips

      - name: Upload synthesis results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: yosys-synth-results
          path: benchmarks/results/yosys_synth.json

  formal-all:
    if: github.event_name == 'workflow_dispatch' && inputs.run_all_formal
    runs-on: ubuntu-24.04
    needs: [hdl-toolchain]
    timeout-minutes: 330
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: stable-hdl-sdk
          path: ${{ runner.temp }}/hdl-download

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"

      - name: Install the verified formal toolchain and solvers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cvc5=1.1.2-1build1 time libreadline8t64 libtcl8.6
          python -m pip install --require-hashes -r requirements/sby.txt
          cd "$RUNNER_TEMP/hdl-download"
          sha256sum --check --status scn-hdl.tar.gz.sha256
          tar -xzf scn-hdl.tar.gz -C "$RUNNER_TEMP"
          cat "$RUNNER_TEMP/scn-hdl/PROVENANCE.txt"
          echo "$RUNNER_TEMP/scn-hdl/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/scn-hdl/bin/yosys" -V
          "$RUNNER_TEMP/scn-hdl/bin/sby" --version
          test "$("$RUNNER_TEMP/scn-hdl/bin/yices-smt2" --version | head -1)" = "Yices 2.7.0"
          test "$("$RUNNER_TEMP/scn-hdl/bin/sv2v" --numeric-version)" = "0.0.13"
          "$RUNNER_TEMP/scn-hdl/bin/z3" --version
          cvc5 --version | head -1
          "$RUNNER_TEMP/scn-hdl/bin/yices-smt2" --version

      - name: Run and time this shard's SymbiYosys jobs
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: "6"
          JOB_TIMEOUT_SECONDS: "1800"
          SHARD_BUDGET_SECONDS: "19200"
          # A job that outgrows the runner's memory must fail alone: without a
          # cap the kernel kills the runner and the shard loses every row.
          JOB_MEMORY_LIMIT: "12G"
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/formal-timing"
          mkdir -p "$out/logs"
          table="$out/formal_timing_shard_${SHARD}.tsv"
          printf 'job\tstatus\twall_seconds\tmax_rss_kib\tlocation\tnative_status\tcgroup_peak_bytes\n' > "$table"
          git ls-files -- 'hdl/formal/*.sby' | sort \
            | awk -v n="$SHARDS" -v i="$SHARD" '(NR - 1) % n == i' > "$out/jobs.txt"
          echo "Shard ${SHARD}/${SHARDS}: $(wc -l < "$out/jobs.txt") jobs"
          refuse_job() {
            printf '%s\tERROR\tNA\tNA\t%s\tNA\tNA\n' "$job" "$1" | tee -a "$table"
          }
          index=0
          while IFS= read -r job; do
            index=$((index + 1))
            name="$(echo "$job" | tr '/' '_')"
            log="$out/logs/${name}.log"
            timing="$out/logs/${name}.time"
            unit="formal-${SHARD}-${index}"
            if ! (
              test "$(command -v z3)" = "$RUNNER_TEMP/scn-hdl/bin/z3" &&
              echo "c05be002097e2f2106efeeac03e58032e3f5cca10104f95d7a0ddc0bd3f907cb  $RUNNER_TEMP/scn-hdl/bin/z3" \
                | sha256sum --check --status &&
              test "$(z3 --version)" = "Z3 version 4.8.12 - 64 bit"
            ) > "$log" 2>&1; then
              refuse_job 'toolchain, refused'
              continue
            fi
            attestation="$out/logs/${name}.attestation.json"
            # External evidence stays visibly attested; missing or stale evidence
            # fails this row rather than replaying an exhausted hosted job.
            if ! python -m tools.formal_external_evidence "$job" \
              --provenance "$RUNNER_TEMP/scn-hdl/PROVENANCE.txt" \
              > "$attestation" 2> "$log"; then
              refuse_job 'external, refused'
              continue
            fi
            if ! location="$(python -c \
              'import json,sys; print(json.load(open(sys.argv[1]))["location"])' \
              "$attestation" 2>> "$log")"; then
              refuse_job 'external, refused'
              continue
            fi
            if [ "$location" != hosted ]; then
              if [ "$location" != 'ML350, attested' ]; then
                refuse_job 'external, refused'
                continue
              fi
              if ! attested_data="$(python -c \
                'import json,sys; r=json.load(open(sys.argv[1])); print(r["wall_seconds"]); print(r["peak_memory_bytes"]); print(r["native_status"])' \
                "$attestation" 2>> "$log")"; then
                refuse_job 'external, refused'
                continue
              fi
              mapfile -t attested <<< "$attested_data"
              if [ "${#attested[@]}" -ne 3 ]; then
                refuse_job 'external, refused'
                continue
              fi
              case "${attested[2]}" in
                PASS) status=ATTESTED ;;
                UNPROVEN-RESOURCE) status=UNPROVEN-RESOURCE ;;
                *) refuse_job 'external, refused'; continue ;;
              esac
              cat "$attestation" >> "$log"
              printf '%s\t%s\t%s\tNA\t%s\t%s\t%s\n' \
                "$job" "$status" "${attested[0]}" "$location" "${attested[2]}" "${attested[1]}" | tee -a "$table"
              continue
            fi
            # Existing jobs use both job-relative and checkout-relative sources.
            # Let the pinned SBY parser identify them; never rewrite their inputs.
            if ! resolved="$(python tools/formal_job_inputs.py "$job" 2> "$log")"; then
              printf '%s\t%s\t%s\t%s\thosted\tERROR\tNA\n' "$job" ERROR NA NA | tee -a "$table"
              continue
            fi
            mapfile -t invocation <<< "$resolved"
            if [ "${#invocation[@]}" -ne 2 ]; then
              refuse_job hosted
              continue
            fi
            # Start a job only if its full timeout still fits in the job budget.
            if [ $((SECONDS + JOB_TIMEOUT_SECONDS)) -gt "$SHARD_BUDGET_SECONDS" ]; then
              printf '%s\t%s\t%s\t%s\thosted\tNOT_RUN\tNA\n' "$job" NOT_RUN NA NA | tee -a "$table"
              continue
            fi
            started="$(date '+%Y-%m-%d %H:%M:%S')"
            set +e
            qualification="$out/logs/${name}.qualification.json"
            timeout --kill-after=30 "$JOB_TIMEOUT_SECONDS" \
              sudo systemd-run --scope --quiet --unit="$unit" \
                -p MemoryMax="$JOB_MEMORY_LIMIT" -p MemorySwapMax=0 -p OOMPolicy=continue \
                --uid="$(id -u)" --gid="$(id -g)" \
                /usr/bin/env PATH="$PATH" HOME="$HOME" \
                /usr/bin/time -f '%e %M' -o "$timing" \
                python -m tools.formal_qualified_run "$job" \
                  --repository "$GITHUB_WORKSPACE" \
                  --work-root "$RUNNER_TEMP/sby-work/${name%.sby}" \
                  --report "$qualification" >> "$log" 2>&1
            rc=$?
            set -e
            # A SIGKILL from timeout does not reach the scope's processes.
            sudo systemctl stop "${unit}.scope" > /dev/null 2>&1 || true
            oom=no
            if sudo journalctl -q --no-pager --since "$started" -u "${unit}.scope" 2>/dev/null | grep -qi 'oom'; then
              oom=yes
            fi
            sudo systemctl reset-failed "${unit}.scope" > /dev/null 2>&1 || true
            native_status=UNKNOWN
            qualified_status=ERROR
            nonvacuity_status=NOT_RUN
            if qualified_data="$(python -c \
              'import json,sys; r=json.load(open(sys.argv[1])); print(r["status"]); print(r["primary_status"]); print(r["nonvacuity_status"])' \
              "$qualification" 2>> "$log")"; then
              mapfile -t qualified <<< "$qualified_data"
              if [ "${#qualified[@]}" -eq 3 ]; then
                qualified_status="${qualified[0]}"
                native_status="${qualified[1]}"
                nonvacuity_status="${qualified[2]}"
              fi
            fi
            if [ "$oom" = yes ]; then
              status=MEMORY
            elif [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              status=TIMEOUT
            elif [ "$rc" -eq 0 ] && [ "$qualified_status" = PASS ] \
              && [ "$native_status" = PASS ] && [ "$nonvacuity_status" = NONVACUOUS ]; then
              status=PASS
            elif [ "$native_status" = FAIL ]; then
              status=FAIL
            else
              status=ERROR
            fi
            wall=NA
            rss=NA
            if [ -s "$timing" ]; then
              read -r wall rss < <(tail -1 "$timing") || true
            fi
            printf '%s\t%s\t%s\t%s\thosted\t%s\tNA\n' "$job" "$status" "$wall" "$rss" "$native_status" | tee -a "$table"
            rm -rf "$RUNNER_TEMP/sby-work/${name%.sby}"
          done < "$out/jobs.txt"
          {
            echo "### SymbiYosys timing, shard ${SHARD}"
            echo
            proofs="$(awk -F'\t' 'NR > 1 && ($2 == "PASS" || $2 == "ATTESTED") && $6 == "PASS" {n++} END {print n+0}' "$table")"
            unproven="$(awk -F'\t' 'NR > 1 && $2 == "UNPROVEN-RESOURCE" {n++} END {print n+0}' "$table")"
            echo "Native proofs: ${proofs}. **UNPROVEN-RESOURCE: ${unproven}.** These rows are resource-incomplete, independently reviewed, and are not proofs."
            echo
            echo 'Full formal qualification is not claimed while any formal row lacks qualifying evidence. Each accepted resource-incomplete row requires its explicit reviewed index, non-vacuity audit and release-note scope.'
            echo
            echo '| Job | Status | Wall s | Max RSS KiB | Location | Native status | Cgroup peak B |'
            echo '|---|---|---:|---:|---|---|---:|'
            tail -n +2 "$table" | sort -t$'\t' -k3,3 -g -r \
              | awk -F'\t' '{printf "| %s | %s | %s | %s | %s | %s | %s |\n", $1, $2, $3, $4, $5, $6, $7}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the shard timing table and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: formal-timing-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/formal-timing

      - name: Fail when any SymbiYosys row lacks qualifying evidence
        shell: bash
        run: |
          set -euo pipefail
          table="$RUNNER_TEMP/formal-timing/formal_timing_shard_${{ matrix.shard }}.tsv"
          bad="$(tail -n +2 "$table" | awk -F'\t' '!($2 == "PASS" && $5 == "hosted" && $6 == "PASS") && !($2 == "ATTESTED" && $5 == "ML350, attested" && $6 == "PASS") && !($2 == "UNPROVEN-RESOURCE" && $5 == "ML350, attested" && $6 == "UNPROVEN-RESOURCE")' | wc -l)"
          echo "Unqualified jobs in this shard: ${bad}"
          test "$bad" -eq 0
