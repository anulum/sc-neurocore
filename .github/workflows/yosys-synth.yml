# SC-NeuroCore — Yosys FPGA Synthesis

name: Yosys FPGA Synthesis

permissions: {}

on:
  workflow_dispatch:
  push:
    paths:
      - "hdl/**"
      - "tools/yosys_synth.*"
  pull_request:
    paths:
      - "hdl/**"

concurrency:
  group: yosys-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthesize:
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Yosys
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq yosys

      - name: Install sv2v
        run: |
          SV2V_URL=$(curl -fsSL https://api.github.com/repos/zachjs/sv2v/releases/latest \
            | jq -r '.assets[] | select(.name == "sv2v-Linux.zip") | .browser_download_url')
          curl -fsSL "$SV2V_URL" -o /tmp/sv2v.zip
          unzip -o /tmp/sv2v.zip -d /tmp/sv2v
          sudo install /tmp/sv2v/sv2v-Linux/sv2v /usr/local/bin/sv2v
          sv2v --version

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Run synthesis (Xilinx 7-series target)
        run: python tools/yosys_synth.py --json benchmarks/results/yosys_synth.json --markdown --allow-skips

      - name: Upload synthesis results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yosys-synth-results
          path: benchmarks/results/yosys_synth.json
