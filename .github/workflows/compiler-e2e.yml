# SC-NeuroCore — compiler / HDL end-to-end validation

name: Compiler HDL E2E

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/sc_neurocore/compiler/**"
      - "src/sc_neurocore/hdl_gen/**"
      - "tests/e2e/**"
      - ".github/workflows/compiler-e2e.yml"

concurrency:
  group: compiler-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python tools/ci_install_dev.py

      - name: Run compiler HDL e2e tests
        run: python -m pytest tests/e2e/ -m e2e -q
