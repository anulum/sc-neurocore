# SC-NeuroCore — compiler / HDL end-to-end validation

name: Compiler HDL E2E

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/sc_neurocore/compiler/**"
      - "src/sc_neurocore/hdl_gen/**"
      - "tests/e2e/**"
      - ".github/workflows/compiler-e2e.yml"

concurrency:
  group: compiler-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements/ci-torch-cpu.txt
          python tools/ci_install_dev.py
          python -c "import torch; assert torch.__version__ == '2.14.1+cpu'; assert torch.version.cuda is None"

      - name: Run compiler HDL e2e tests
        run: python -m pytest tests/e2e/ -m e2e -q
