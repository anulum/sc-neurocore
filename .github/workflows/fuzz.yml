name: SC-NeuroCore Fuzz

# Fuzzing is scheduled (and manually dispatchable), not per-PR: the instrumented build
# is non-trivial even with Z3 skipped, so it is not a merge gate.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds to fuzz each target"
        default: "300"

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz IR parser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned action
        with:
          toolchain: nightly-2026-11-13

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine/fuzz

      - name: Install cargo-fuzz
        # 0.13.1 --locked pinned rustix 0.36.5, which no longer compiles on current
        # nightly ("cannot find attribute rustc_layout_scalar_valid_range_end"). Use
        # the latest cargo-fuzz and let cargo resolve a nightly-compatible dep tree.
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      # The fuzz crate depends on the engine with default-features = false, so the
      # bundled-Z3 build is skipped (ir::parser::parse needs neither Z3 nor NumPy/pyo3,
      # which is dead-stripped from the target). fuzz/Cargo.lock is committed so NumPy
      # and ndarray resolve to the engine's versions (a fresh resolve splits ndarray and
      # breaks into_pyarray).
      - name: Fuzz the IR parser, printer round-trip, bitstream and sparse matrix
        working-directory: engine
        # engine/rust-toolchain.toml pins the stable channel, which would otherwise
        # override the nightly installed above; cargo-fuzz needs nightly for the
        # -Z sanitizer flags, so select it explicitly with `+nightly`.
        # The dispatch input reaches the script through env and must be whole seconds.
        env:
          MAX_TOTAL_TIME: ${{ github.event.inputs.max_total_time || '300' }}
        # Every target runs even when an earlier one finds a crash; the step fails at the end
        # and names each crashing target, and the reproducers are uploaded below.
        run: |
          [[ "${MAX_TOTAL_TIME}" =~ ^[0-9]+$ ]]
          failed=()
          for target in parse_ir roundtrip_ir bitstream csr_matrix; do
            echo "::group::fuzz $target"
            if ! cargo +nightly-2026-11-13 fuzz run "$target" -- \
              -max_total_time="${MAX_TOTAL_TIME}" \
              -max_len=8192; then
              failed+=("$target")
              echo "::error::fuzz target $target found a crash"
            fi
            echo "::endgroup::"
          done
          if (( ${#failed[@]} )); then
            echo "::error::crashing fuzz targets: ${failed[*]}"
            exit 1
          fi

      - name: Report crash reproducers
        if: failure()
        working-directory: engine
        run: |
          echo "::error::Fuzzing found a crash — reproducers under engine/fuzz/artifacts/"
          ls -R fuzz/artifacts/ || true

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-crash-reproducers
          path: engine/fuzz/artifacts/
          if-no-files-found: warn
