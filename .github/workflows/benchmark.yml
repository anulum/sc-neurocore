# SC-NeuroCore — Performance Benchmarks

name: Performance Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * *"
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "src/sc_neurocore/**"
      - "benchmarks/**"
      - ".github/workflows/benchmark.yml"
  pull_request:
    branches: [main]
    paths:
      - "engine/**"
      - "src/sc_neurocore/**"
      - "benchmarks/**"
      - ".github/workflows/benchmark.yml"

permissions: {}

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    concurrency:
      group: metrics-branch-writer
      cancel-in-progress: false
    permissions:
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: engine

      - name: Build benchmarks
        working-directory: engine
        run: cargo bench --bench bitstream_bench --bench full_bench --no-run

      - name: Run Criterion benchmarks
        working-directory: engine
        run: |
          cargo bench --bench bitstream_bench --bench full_bench \
            | python ../.github/criterion_to_bencher.py \
            | tee ../benchmark_output.txt
          echo "--- benchmark_output.txt ---"
          cat ../benchmark_output.txt

      - name: Clean build artifacts before branch switch
        run: git checkout -- .

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1
        if: github.ref == 'refs/heads/main'
        with:
          name: Rust Criterion Benchmark
          tool: cargo
          output-file-path: benchmark_output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: metrics
          benchmark-data-dir-path: benchmarks/criterion
          alert-threshold: "500%"
          comment-on-alert: true
          fail-on-alert: true
          alert-comment-cc-users: "@anulum-maintainers"

  python-benchmark:
    name: Python Benchmark Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package
        run: python tools/ci_install_dev.py

      - name: Run Python benchmarks (quick)
        run: python benchmarks/benchmark_suite.py --json --markdown

      - name: Run packed-bit NumPy LUT baseline
        run: |
          python benchmarks/bench_bitstream_numpy_lut.py \
            --output benchmarks/results/ci_bitstream_numpy_lut.json

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-benchmark-results
          path: benchmarks/results/
          retention-days: 90

  perf-gated-pytest:
    name: Perf-Gated Pytest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: "src:."
      SC_NEUROCORE_PERF: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package
        run: python tools/ci_install_dev.py

      - name: Run perf-gated pytest selector
        run: |
          python -m pytest \
            tests/test_export/test_onnx_exporter_performance.py \
            tests/test_learning/test_lifelong.py \
            tests/test_learning/test_federated.py \
            tests/test_transformers/test_block.py \
            tests/test_layers/test_recurrent.py \
            tests/test_layers/test_vectorized_layer_packed_forward.py \
            tests/layers/test_sc_conv_layer_configuration.py \
            tests/test_layers/test_sc_dense_layer_performance.py \
            tests/test_layers/test_memristive.py \
            tests/test_layers/test_sc_learning_layer.py \
            tests/layers/test_fusion_performance.py \
            tests/test_hdc/test_base.py \
            tests/accel/test_vector_ops_validation_performance.py \
            tests/test_solvers/test_ising.py \
            tests/test_optics/test_photonic_layer.py \
            tests/test_quantum/test_hybrid.py \
            tests/interfaces/test_dvs_input_performance.py \
            tests/sources/test_bitstream_current_source_performance.py \
            tests/hdl_gen/test_verilog_generator_io_perf.py \
            tests/test_hdl_gen/test_spice_generator.py \
            tests/test_bio/test_dna_storage.py \
            tests/test_bio/test_grn.py \
            tests/test_graphs/test_gnn.py
