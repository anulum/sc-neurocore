# SC-NeuroCore — Performance Benchmarks

name: Performance Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "src/sc_neurocore/**"
      - "benchmarks/**"
      - ".github/workflows/benchmark.yml"
  pull_request:
    branches: [main]
    paths:
      - "engine/**"
      - "src/sc_neurocore/**"
      - "benchmarks/**"
      - ".github/workflows/benchmark.yml"

permissions: {}

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
    permissions:
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: engine

      - name: Build benchmarks
        working-directory: engine
        run: cargo bench --bench bitstream_bench --bench full_bench --no-run

      - name: Run Criterion benchmarks
        working-directory: engine
        run: |
          cargo bench --bench bitstream_bench --bench full_bench \
            | python ../.github/criterion_to_bencher.py \
            | tee ../benchmark_output.txt
          echo "--- benchmark_output.txt ---"
          cat ../benchmark_output.txt

      - name: Clean build artifacts before branch switch
        run: git checkout -- .

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1
        if: github.ref == 'refs/heads/main'
        with:
          name: Rust Criterion Benchmark
          tool: cargo
          output-file-path: benchmark_output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "500%"
          comment-on-alert: true
          fail-on-alert: true
          alert-comment-cc-users: "@anulum-maintainers"

  python-benchmark:
    name: Python Benchmark Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install package
        run: python tools/ci_install_dev.py

      - name: Run Python benchmarks (quick)
        run: python benchmarks/benchmark_suite.py --json --markdown

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-benchmark-results
          path: benchmarks/results/
          retention-days: 90
