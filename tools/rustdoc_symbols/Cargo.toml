# SC-NeuroCore — native Rust declaration identity parser

[package]
name = "sc_neurocore_rustdoc_symbols"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
quote = "=1.0.47"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
syn = { version = "=2.0.119", features = ["full"] }
