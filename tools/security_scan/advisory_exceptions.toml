# SC-NeuroCore — Advisory exceptions re-verified by the lock audit on every run

# One table per advisory and locked package version. The audit accepts a finding
# only while the machine check of its reason holds (tools/security_scan/
# advisory_exceptions.py): "no_fixed_version_in_channel" fails when the channel
# the lock installs from publishes a newer version or a newer build of the
# locked version; "component_not_in_package" fails when the locked
# artefact ships a file matching one of the declared paths. A table that matches
# no finding fails the audit, so nothing here outlives its finding.
#
# A package the scanner cannot audit has one table without an advisory.
# "vendor_records_reviewed" fails when the vendor channel no longer lists the
# locked file with the lock digest, when the vulnerability records bound to the
# vendor's product identifiers differ from the reviewed list in name or in
# products, or when one of them names a package of the lock as its product.
# The vendor identifiers of a channel are fixed in the audit code, not here.

# MIT Kerberos: the two NegoEx parsing defects are fixed upstream in 1.22.3,
# which the channel does not publish yet.

[[exception]]
ecosystem = "pixi"
lock = "src/sc_neurocore/accel/mojo/pixi.lock"
package = "krb5"
version = "1.22.2"
advisory = "CVE-2026-40355"
reason = "no_fixed_version_in_channel"
recorded = "2026-10-12"
source = "https://www.cve.org/CVERecord?id=CVE-2026-40355"

[[exception]]
ecosystem = "pixi"
lock = "src/sc_neurocore/accel/mojo/pixi.lock"
