# SC-NeuroCore — Exact installed vendor-fix advisory evidence

# CVE-2026-103995 (Low): CPython fixed http.client Content-Length and chunk-size validation only on
# its main branch (gh-150751); no 3.15 release carries it and conda-forge publishes nothing newer
# than python 3.15.2. The record lapses on its review date, once Grype stops reporting the finding,
# or as soon as the channel lists a newer final release.

[[exception]]
lock = "src/sc_neurocore/accel/mojo/pixi.lock"
package = "python"
version = "3.15.2"
advisory = "CVE-2026-103995"
artifact_sha256 = "dd6fdef748df5636029673a834ca3632ce44c86d71e4986d70bcdb2ae5607a25"
reason = "vendor_fix_unreleased"
fixed_version = "3.16.0"
proof_path = "lib/python3.15/http/client.py"
proof_sha256 = "f4506633b5fe4fe06add63d9e32ab5e6e7cda84ec1df365da7faa5c1315fdbc5"
source = "https://raw.githubusercontent.com/python/cpython/5e58eaad7c58df58dfa8ea549c87996e01dd1077/Lib/http/client.py"
review_by = "2026-11-20"
rationale = "The vendor fix is unreleased for Python 3.15. The Mojo build environment never parses untrusted HTTP responses; the installed http/client.py must equal the immutable CPython 3.15.2 release file and conda-forge must list no newer final release."

# CVE-2026-116566 (Medium): CPython rejects null bytes in socket.getaddrinfo() host and port only
# from gh-160898, a change to Modules/socketmodule.c; no 3.15 release carries it and conda-forge
# publishes nothing newer than python 3.15.2. Lib/socket.py, the module's Python front end, proves
# that the installed release is the unmodified 3.15.2 file. The record lapses on its review date,
# once Grype stops reporting the finding, or as soon as the channel lists a newer final release.

[[exception]]
lock = "src/sc_neurocore/accel/mojo/pixi.lock"
package = "python"
version = "3.15.2"
advisory = "CVE-2026-116566"
artifact_sha256 = "dd6fdef748df5636029673a834ca3632ce44c86d71e4986d70bcdb2ae5607a25"
reason = "vendor_fix_unreleased"
fixed_version = "3.16.0"
proof_path = "lib/python3.15/socket.py"
proof_sha256 = "463dc951122dff8a378862e32461d020a457ef4d80697b3396adca80c87f9e79"
source = "https://raw.githubusercontent.com/python/cpython/5e58eaad7c58df58dfa8ea549c87996e01dd1077/Lib/socket.py"
review_by = "2026-11-20"
rationale = "The vendor fix is unreleased for Python 3.15. The Mojo environment only runs the repository's Mojo kernels and resolves no host name or port taken from untrusted input; the installed socket.py must equal the immutable CPython 3.15.2 release file and conda-forge must list no newer final release."
