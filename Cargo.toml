[workspace]
members = ["engine"]
exclude = [
    "fuzz",
    "crates/tinysc_riscv",
    "crates/core_engine",
    "crates/autonomous_learning",
    "crates/neuro_symbolic",
    "crates/stochastic_doctor_core",
    "crates/spike_stats_core",
    "crates/evo_substrate_core",
    "src/sc_neurocore/accel/rust",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
