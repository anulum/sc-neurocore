# SC-NeuroCore — Rust workspace manifest

[workspace]
members = ["engine"]
exclude = [
    "fuzz",
    "crates/tinysc_riscv",
    "crates/core_engine",
    "crates/autonomous_learning",
    "crates/neuro_symbolic",
    "crates/stochastic_doctor_core",
    "crates/spike_stats_core",
    "crates/evo_substrate_core",
    "src/sc_neurocore/accel/rust",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwind, so that a panic in the engine reaches Python as an exception and the interpreter
# survives; with "abort" it ended the process. Integer overflow still wraps in this profile
# (no overflow-checks), as docs/api/rust-engine.md states.
panic = "unwind"
